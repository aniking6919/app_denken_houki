<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <title>冷凍三種 保安管理 過去問演習</title>
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: -apple-system, "Helvetica Neue", sans-serif;
      background: #f0f2f5;
      margin: 0;
      padding: 12px;
      color: #222;
      font-size: 15px;
    }
    h1 { margin: 0 0 12px; font-size: 17px; font-weight: bold; }
    h2 { margin: 0 0 10px; font-size: 15px; }

    .panel {
      background: #fff;
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 12px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.1);
    }

    /* フィルター */
    .filter-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 8px; }
    .filter-row label { font-size: 13px; color: #555; white-space: nowrap; }
    select {
      font-size: 14px;
      padding: 6px 8px;
      border: 1px solid #ccc;
      border-radius: 8px;
      background: #fff;
      -webkit-appearance: none;
      appearance: none;
      flex: 1;
      min-width: 120px;
    }

    /* スタートボタン */
    .btn-start {
      display: block;
      width: 100%;
      padding: 13px;
      font-size: 16px;
      font-weight: bold;
      background: #0071e3;
      color: #fff;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      margin-top: 8px;
      -webkit-appearance: none;
    }
    .btn-start:active { background: #0059b3; }

    /* 統計グリッド */
    .stats { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
    .stat-box {
      background: #f7f8fa;
      border: 1px solid #e0e0e0;
      border-radius: 10px;
      padding: 10px 12px;
    }
    .stat-box b { font-size: 12px; color: #666; display: block; margin-bottom: 4px; }
    .stat-box .val { font-size: 20px; font-weight: bold; color: #111; }

    /* ローディング */
    #loadingMsg {
      text-align: center;
      padding: 16px 0;
      color: #555;
      font-size: 14px;
    }
    #progressBar {
      width: 100%;
      height: 6px;
      background: #e0e0e0;
      border-radius: 3px;
      margin-top: 8px;
      overflow: hidden;
      display: none;
    }
    #progressFill {
      height: 100%;
      background: #0071e3;
      border-radius: 3px;
      width: 0%;
      transition: width 0.2s;
    }

    /* 問題メタ情報 */
    .question-meta {
      font-size: 12px;
      color: #888;
      margin-bottom: 8px;
    }

    /* 問題文 */
    .question-text {
      white-space: pre-wrap;
      line-height: 1.7;
      margin-bottom: 14px;
      font-size: 15px;
    }

    /* 選択肢ボタン */
    .option-btn {
      display: block;
      width: 100%;
      text-align: left;
      padding: 12px 14px;
      margin-bottom: 9px;
      border: 1.5px solid #d0d0d0;
      border-radius: 10px;
      background: #fff;
      cursor: pointer;
      font-size: 14px;
      line-height: 1.5;
      -webkit-appearance: none;
      appearance: none;
      color: #111;
      /* iOSタップ遅延を排除 */
      touch-action: manipulation;
    }
    .option-btn:active { background: #f0f0f0; }
    .option-btn.correct { background: #d4f7d4 !important; border-color: #28a745 !important; }
    .option-btn.wrong   { background: #ffd6d6 !important; border-color: #dc3545 !important; }
    .option-btn:disabled { cursor: default; opacity: 0.85; }

    /* 解説 */
    .answer-info {
      margin-top: 12px;
      padding: 12px;
      border-radius: 10px;
      background: #f7f9fc;
      border: 1px solid #d8e3ef;
      font-size: 14px;
      line-height: 1.6;
    }

    /* 次へボタン */
    .btn-next {
      display: block;
      width: 100%;
      padding: 13px;
      font-size: 15px;
      font-weight: bold;
      background: #34c759;
      color: #fff;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      margin-top: 12px;
      -webkit-appearance: none;
      touch-action: manipulation;
    }
    .btn-next:active { background: #28a745; }

    /* 分野別成績テーブル */
    .history-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }
    .history-table th,
    .history-table td {
      border: 1px solid #ddd;
      padding: 7px 8px;
      text-align: left;
    }
    .history-table th { background: #f0f2f5; font-weight: bold; }
    .history-table tr:nth-child(even) td { background: #fafafa; }

    /* localStorage警告バナー */
    #storageBanner {
      display: none;
      background: #fff3cd;
      border: 1px solid #ffc107;
      border-radius: 8px;
      padding: 10px 12px;
      margin-bottom: 10px;
      font-size: 13px;
      color: #856404;
    }
  </style>
</head>

    <select id="yearFilter"><option value="all">すべて</option></select>

  </div>

<div class="panel stats">

<!-- 問題パネル -->
<div class="panel" id="quizPanel">
  <div id="loadingMsg">データを読み込み中...</div>
  <div id="progressBar"><div id="progressFill"></div></div>

  <div id="quizContent" style="display:none;">
    <div class="question-meta" id="questionMeta"></div>
    <div class="question-text" id="questionText"></div>
    <div id="optionsContainer"></div>
    <div class="answer-info" id="answerInfo" style="display:none;"></div>
    <button class="btn-next" id="nextBtn" onclick="nextQuestion()" style="display:none;">次の問題へ →</button>
  </div>
</div>

<!-- 分野別成績 -->
<div class="panel">
  <h2>📊 分野別成績</h2>
  <table class="history-table">
    <thead>
      <tr><th>分野</th><th>回答</th><th>正解</th><th>正答率</th></tr>
    </thead>
    <tbody id="categoryStatsBody"></tbody>
  </table>
</div>

<script>
// ========================================================
// 問題データ（チャンク分割済み・遅延ロード対応）
// ========================================================
var CHUNKS = [];
var NUM_CHUNKS = 7;

// チャンクを非同期的に順番に読み込む
function loadChunksAsync(callback) {
  var loaded = 0;
  document.getElementById('progressBar').style.display = 'block';

  function loadNext(idx) {
    if (idx >= NUM_CHUNKS) {
      document.getElementById('progressBar').style.display = 'none';
      callback();
      return;
    }
    // setTimeoutでUIをブロックせずに各チャンクをロード
    setTimeout(function() {
      // チャンクはすでにメモリ上にあるが、処理を分割してiOSのウォッチドッグをかわす
      var pct = Math.round((idx + 1) / NUM_CHUNKS * 100);
      document.getElementById('progressFill').style.width = pct + '%';
      document.getElementById('loadingMsg').textContent = 'データ準備中... ' + pct + '%';
      loaded++;
      loadNext(idx + 1);
    }, 20);
  }
  loadNext(0);
}

{"id":"R07-Hoan-Q01","year":"R07","subject":"保安管理技術","category":"冷凍の原理・冷凍サイクル","tags":[],"question":"次のイ、ロ、ハ、ニの記述のうち、冷凍の原理について正しいものはどれか。\nイ．凝縮器で冷媒から放出される熱量は、圧縮機で冷媒に加えられた動力に等しい。\nロ．物質が液体から蒸気に、あるいは蒸気から液体に状態変化する場合に物質に出入りする熱量を潜熱と呼ぶ。\nハ．冷凍能力を理論断熱圧縮動力で除した値を理論冷凍サイクルの成績係数と呼び、この値が大きいほど、小さい動力で大きな冷凍能力が得られることになる。\nニ．圧縮機の駆動軸動力を小さくするためには、蒸発温度をできるだけ低くし、かつ、凝縮温度を高くして運転するのがよい。","options":["(1) イ、ロ","(2) イ、ハ","(3) ロ、ハ","(4) ロ、ニ","(5) イ、ハ、ニ"],"answer":3,"explanation":"・凝縮器で冷媒から放出される熱量は、冷凍装置の冷凍能力と圧縮機の駆動軸動力の和に等しい。\n・物質が液体から蒸気に、あるいは蒸気から液体に状態変化する場合に物質に出入りする熱量を潜熱と呼ぶ。\n・冷凍能力を理論断熱圧縮動力で除した値を理論冷凍サイクルの成績係数と呼び、この値が大きいほど、小さい動力で大きな冷凍能力が得られることになる。\n・圧縮機の駆動軸動力を小さくするためには、蒸発温度を必要以上に低くし過ぎず、かつ、凝縮温度を必要以上に高くし過ぎず運転するのがよい。","has_image":false,"image_path":null},{"id":"R07-Hoan-Q02","year":"R07","subject":"保安管理技術","category":"冷凍サイクル・熱の移動","tags":[],"question":"次のイ、ロ、ハ、ニの記述のうち、熱の移動について正しいものはどれか。\nイ．固体壁を通過する伝熱量は、その壁で隔てられた両側の流体間の温度差、固体壁の伝熱面積および熱通過率に比例する。\nロ．水冷却器の交換熱量の計算において、冷却管の入口側の冷媒と水との温度差をΔt1、出口側の温度差をΔt2とすると、冷媒と水との算術平均温度差Δtmは、Δtm＝（Δt1＋Δt2）／2である。\nハ．熱伝導抵抗は、固体壁の厚みをその材料の熱伝導率と伝熱面積の積で除したものであり、この値が大きいほど物体内を熱が流れやすい。\nニ．常温、常圧において、水あか、木材、鉄鋼、空気の中で、熱伝導率の値が一番小さいのは空気である。","options":["(1) イ、ロ","(2) イ、ハ","(3) ロ、ニ","(4) ハ、ニ","(5) イ、ロ、ニ"],"answer":5,"explanation":"・固体壁を通過する伝熱量は、その壁で隔てられた両側の流体間の温度差、固体壁の伝熱面積および熱通過率に比例する。\n・水冷却器の交換熱量の計算において、冷却管の入口側の冷媒と水との温度差をΔt1、出口側の温度差をΔt2とすると、冷媒と水との算術平均温度差Δtmは、Δtm＝（Δt1＋Δt2）／2である。\n・熱伝導抵抗は、固体壁の厚みをその材料の熱伝導率と伝熱面積の積で除したものであり、この値が大きいほど物体内を熱が流れにくい。\n・常温、常圧において、水あか、木材、鉄鋼、空気の中で、熱伝導率の値が一番小さいのは空気である。","has_image":false,"image_path":null},{"id":"R07-Hoan-Q03","year":"R07","subject":"保安管理技術","category":"冷凍能力・軸動力・成績係数","tags":[],"question":"次のイ、ロ、ハ、ニの記述のうち、圧縮機の性能などについて正しいものはどれか。\nイ．吸込み圧力が低いほど、また、吸込み蒸気の過熱度が大きいほど圧縮機の吸込み蒸気の比体積が大きくなり、圧縮機の冷媒循環量は増大する。\nロ．往復圧縮機のピストン押しのけ量は、1秒間当たりのピストン押しのけ量のことで、1つのピストンの行程容積と気筒数と回転速度の積によって決まる。\nハ．理論ヒートポンプサイクルの成績係数の値は、同一運転条件における理論冷凍サイクルの成績係数の値よりも1だけ大きな数値となる。\nニ．蒸発温度と凝縮温度との温度差が大きくなると、断熱効率と機械効率が大きくなるので、冷凍装置の成績係数は低下する。","options":["(1) イ、ロ","(2) イ、ニ","(3) ロ、ハ","(4) ハ、ニ","(5) ロ、ハ、ニ"],"answer":3,"explanation":"・吸込み圧力が低いほど、また、吸込み蒸気の過熱度が大きいほど圧縮機の吸込み蒸気の比体積が大きくなり、圧縮機の冷媒循環量は減少する\n・往復圧縮機のピストン押しのけ量は、1秒間当たりのピストン押しのけ量のことで、1つのピストンの行程容積と気筒数と回転速度の積によって決まる。\n・理論ヒートポンプサイクルの成績係数の値は、同一運転条件における理論冷凍サイクルの成績係数の値よりも1だけ大きな数値となる。\n・蒸発温度と凝縮温度との温度差が大きくなると、断熱効率と機械効率が小さくなるので、冷凍装置の成績係数は低下する。","has_image":false,"image_path":null},{"id":"R07-Hoan-Q04","year":"R07","subject":"保安管理技術","category":"冷媒・ブライン","tags":[],"question":"次のイ、ロ、ハ、ニの記述のうち、冷媒および冷凍機油について正しいものはどれか。\nイ．一般にフルオロカーボン冷媒は、液の場合は冷凍機油よりも重く、ガスの場合は空気よりも重い。\nロ．非共沸混合冷媒は、圧力一定のもとで凝縮するとき、凝縮始めの露点の温度と、凝縮終わりの沸点の温度とに差は生じない。\nハ．冷媒と冷凍機油の組み合わせとして、HCFC冷媒のR22には鉱油、HFC冷媒のR32には合成油、HFO冷媒のR1234yfにはHCFC冷媒と同様に鉱油が一般的に使用される。\nニ．R290、R717、R744は、自然冷媒と呼ばれることがある。","options":["(1) イ、ニ","(2) ロ、ハ","(3) イ、ロ、ニ","(4) イ、ハ、ニ","(5) ロ、ハ、ニ"],"answer":3,"explanation":"・一般にフルオロカーボン冷媒は、液の場合は冷凍機油よりも重く、ガスの場合は空気よりも重い。\n・非共沸混合冷媒は、圧力一定のもとで凝縮するとき、凝縮始めの露点の温度と、凝縮終わりの沸点の温度とに差が生じる。\n・冷媒と冷凍機油の組み合わせとして、HCFC冷媒のR22には鉱油、HFC冷媒のR32には合成油、HFO冷媒のR1234yfにはHFC冷媒と同様に合成油が一般的に使用される\n・R290、R717、R744は、自然冷媒と呼ばれることがある。\n※R290（プロパン）、R717（アンモニア）、R744（二酸化炭素）","has_image":false,"image_path":null},{"id":"R07-Hoan-Q05","year":"R07","subject":"保安管理技術","category":"圧縮機の特性等","tags":[],"question":"次のイ、ロ、ハ、ニの記述のうち、圧縮機について正しいものはどれか。\nイ．スクリュー圧縮機の容量制御をスライド弁で行う場合、スクリューの溝の数に応じた段階的な容量制御となり、無段階制御はできない。\nロ．圧縮機は冷媒蒸気の圧縮の方法により、往復式と遠心式に大別される。\nハ．停止中の圧縮機クランクケース内の油温が高いほど、始動時にオイルフォーミングを起こしやすい。\nニ．強制給油式の往復圧縮機の給油圧力は、油圧計指示圧力からクランクケース圧力を引いたものである。","options":["(1) イ","(2) ニ","(3) イ、ロ","(4) ロ、ハ","(5) ハ、ニ"],"answer":2,"explanation":"・スクリュー圧縮機の容量制御をスライド弁で行う場合、ある範囲内で無段階制御または段階制御が可能である。\n・圧縮機は冷媒蒸気の圧縮の方法により、容積式と遠心式に大別される。\n・停止中の圧縮機クランクケース内の油温が低いほど、始動時にオイルフォーミングを起こしやすい。\n・強制給油式の往復圧縮機の給油圧力は、油圧計指示圧力からクランクケース圧力を引いたものである。","has_image":false,"image_path":null},{"id":"R07-Hoan-Q06","year":"R07","subject":"保安管理技術","category":"凝縮器・冷却塔","tags":[],"question":"次のイ、ロ、ハ、ニの記述のうち、凝縮器について正しいものはどれか。\nイ．空冷凝縮器において、空気と冷却管外面との間の熱伝達率は、冷媒と冷却管内面との間の熱伝達率に比べるとはるかに小さい。\nロ．シェルアンドチューブ凝縮器は、円筒胴と管板に固定された冷却管で構成され、円筒胴内の冷却管外を冷却水が流れ、冷却管の中を冷媒が流れる。\nハ．一般に空冷凝縮器では、水冷凝縮器より冷媒の凝縮温度が高くなる。\nニ．理論凝縮負荷は、冷凍能力に理論断熱圧縮動力を加えて求めることができる。","options":["(1) イ、ハ","(2) ロ、ハ","(3) ロ、ニ","(4) イ、ロ、ニ","(5) イ、ハ、ニ"],"answer":5,"explanation":"・空冷凝縮器において、空気と冷却管外面との間の熱伝達率は、冷媒と冷却管内面との間の熱伝達率に比べるとはるかに小さい。\n・シェルアンドチューブ凝縮器は、円筒胴と管板に固定された冷却管で構成され、円筒胴内の冷却管外を冷媒が流れ、冷却管の中を冷却水が流れる。\n・一般に空冷凝縮器では、水冷凝縮器より冷媒の凝縮温度が高くなる。\n・理論凝縮負荷は、冷凍能力に理論断熱圧縮動力を加えて求めることができる。","has_image":false,"image_path":null},{"id":"R07-Hoan-Q07","year":"R07","subject":"保安管理技術","category":"蒸発器・除霜等","tags":[],"question":"次のイ、ロ、ハ、ニの記述のうち、蒸発器について正しいものはどれか。\nイ．空気冷却用蒸発器では、蒸発器を通過する空気の流れ方向と、冷媒の列方向の流れの方向とは、互いに逆方向（向流）になるようにする。\nロ．シェルアンドチューブ満液式蒸発器の冷媒側伝熱面における平均熱通過率は、乾式蒸発器のように冷媒の過熱に必要な過熱部・管部がないため、乾式蒸発器の平均熱通過率よりも小さい。\nハ．ホットガス除霜方式は、冷却管の内部から冷媒ガスの熱によって霜を均一に融解でき、霜が厚くなってからの除霜に適した方式である。\nニ．冷凍・冷蔵装置では、冷凍・冷蔵用フィンコイル蒸発器に、ファン（送風機）、ファン用電動機、ドレンパンなどを一体に組み込んだユニットクーラが用いられることが多い。","options":["(1) イ、ニ","(2) ロ、ハ","(3) ハ、ニ","(4) イ、ロ、ハ","(5) イ、ロ、ニ"],"answer":1,"explanation":"・空気冷却用蒸発器では、蒸発器を通過する空気の流れ方向と、冷媒の列方向の流れの方向とは、互いに逆方向（向流）になるようにする。\n・シェルアンドチューブ満液式蒸発器の冷媒側伝熱面における平均熱通過率は、乾式蒸発器のように冷媒の過熱に必要な過熱部・管部がないため、乾式蒸発器の平均熱通過率よりも大きい。\n・ホットガス除霜は、冷却管の内部から冷媒ガスの熱によって霜を融解させるため、霜が厚くなると融けにくくなり、除霜の時間が長くなる。\n・冷凍・冷蔵装置では、冷凍・冷蔵用フィンコイル蒸発器に、ファン（送風機）、ファン用電動機、ドレンパンなどを一体に組み込んだユニットクーラが用いられることが多い。","has_image":false,"image_path":null},{"id":"R07-Hoan-Q08","year":"R07","subject":"保安管理技術","category":"自動制御機器","tags":[],"question":"次のイ、ロ、ハ、ニの記述のうち、自動制御機器について正しいものはどれか。\nイ．電磁弁には、直動式とパイロット式がある。直動式では、電磁コイルに通電すると、磁場が作られてプランジャが吸引されて弁が閉じる。\nロ．キャピラリチューブは、冷媒の流動抵抗による圧力降下を利用して冷媒の絞り膨張を行うとともに、蒸発器出口冷媒蒸気の過熱度の制御を行うための機器である。\nハ．断水リレーとして使用されるフロースイッチには、水の流れを直接検出するパドルをもつものがある。\nニ．ガスチャージ方式の温度自動膨張弁の欠点は、運転中にダイアフラム受圧部の温度を常に感温筒温度よりも高く維持しないと、膨張弁が正常に作動しなくなることである。","options":["(1) イ、ロ","(2) イ、ニ","(3) ハ、ニ","(4) イ、ロ、ハ","(5) ロ、ハ、ニ"],"answer":3,"explanation":"・電磁弁には、直動式とパイロット式がある。直動式では、電磁コイルに通電すると、磁場が作られてプランジャが吸引されて弁が開く。\n・キャピラリチューブは、冷媒の流動抵抗による圧力降下を利用して冷媒の絞り膨張を行うが、冷媒の流量を制御することはできず、蒸発器出口冷媒蒸気の過熱度の制御を行うことはできない。\n・断水リレーとして使用されるフロースイッチには、水の流れを直接検出するパドルをもつものがある。\n・ガスチャージ方式の温度自動膨張弁の欠点は、運転中にダイアフラム受圧部の温度を常に感温筒温度よりも高く維持しないと、膨張弁が正常に作動しなくなることである。","has_image":false,"image_path":null},{"id":"R07-Hoan-Q09","year":"R07","subject":"保安管理技術","category":"附属機器","tags":[],"question":"次のイ、ロ、ハ、ニの記述のうち、附属機器について正しいものはどれか。\nイ．高圧受液器内には常に冷媒液を確保するようにし、受液器出口では蒸気が液とともに流れ出ないような構造とする。\nロ．油分離器は、一般に、大形・低温のフルオロカーボン冷凍装置やアンモニア冷凍装置に用いられている。\nハ．液分離器は、圧縮機の吐出しガス配管に設け、冷媒蒸気中に冷媒液が混在したときに蒸気と液を分離するために用いる。\nニ．フィルタドライヤの乾燥剤にシリカゲルやゼオライトが用いられる理由は、化学変化を起こして水分を除去しやすいこと、砕けにくいことである。","options":["(1) イ、ロ","(2) イ、ハ","(3) ハ、ニ","(4) イ、ロ、ニ","(5) ロ、ハ、ニ"],"answer":1,"explanation":"・高圧受液器内には常に冷媒液を確保するようにし、受液器出口では蒸気が液とともに流れ出ないような構造とする。\n・油分離器は、一般に、大形・低温のフルオロカーボン冷凍装置やアンモニア冷凍装置に用いられている。\n・液分離器は、蒸発器と圧縮機との間の吸込み蒸気配管に設け、冷媒蒸気中に冷媒液が混在したときに蒸気と液を分離するために用いる。\n・フィルタドライヤの乾燥剤にシリカゲルやゼオライトが用いられる理由は、化学変化を起こさず水分を除去しやすいこと、砕けにくいことである。","has_image":false,"image_path":null},{"id":"R07-Hoan-Q10","year":"R07","subject":"保安管理技術","category":"冷媒配管","tags":[],"question":"次のイ、ロ、ハ、ニの記述のうち、冷媒配管について正しいものはどれか。\nイ．低温用の冷媒配管として、配管用炭素鋼鋼管（SGP）を、-30℃で使用した。\nロ．フルオロカーボン冷凍装置に使用する小口径の銅配管の接続には、一般に、フレア管継手か、ろう付継手を用いる。\nハ．高圧液配管は、冷媒液がフラッシュ（気化）するのを防ぐために、流速ができるだけ小さくなるような管径とする。\nニ．横走り吸込み配管にUトラップがあると、軽負荷運転時や停止時に冷凍機油や冷媒液がたまり、圧縮機の再始動時に液圧縮の危険がある。","options":["(1) イ、ロ","(2) イ、ハ","(3) ハ、ニ","(4) イ、ロ、ニ","(5) ロ、ハ、ニ"],"answer":5,"explanation":"・低温用の冷媒配管として、配管用炭素鋼鋼管（SGP）を使用できるのは、-25℃までである。\n・フルオロカーボン冷凍装置に使用する小口径の銅配管の接続には、一般に、フレア管継手か、ろう付継手を用いる。\n・高圧液配管は、冷媒液がフラッシュ（気化）するのを防ぐために、流速ができるだけ小さくなるような管径とする。\n・横走り吸込み配管にUトラップがあると、軽負荷運転時や停止時に冷凍機油や冷媒液がたまり、圧縮機の再始動時に液圧縮の危険がある。","has_image":false,"image_path":null},{"id":"R07-Hoan-Q11","year":"R07","subject":"保安管理技術","category":"安全装置","tags":[],"question":"次のイ、ロ、ハ、ニの記述のうち、安全装置について正しいものはどれか。\nイ．圧力容器に取り付ける安全弁には、修理等のために止め弁を設けるが、この止め弁には「常時開」の表示をするなど、止め弁の操作に間違いのないようにしなければならない。\nロ．内容積500リットル未満のフルオロカーボン冷媒用受液器に使用する溶栓は、原則として125℃で溶融するものを用いる。\nハ．フルオロカーボン冷凍装置において、液封事故を防止するために、液封の起こるおそれのある部分に、圧力逃がし装置として溶栓を取り付けた。\nニ．高圧遮断装置は原則として手動復帰式とし、通常は、安全弁噴出以前に所定の圧力で圧縮機を停止させ、高圧側圧力の異常な上昇を防止する。","options":["(1) イ、ロ","(2) イ、ニ","(3) ロ、ハ","(4) イ、ハ、ニ","(5) ロ、ハ、ニ"],"answer":2,"explanation":"・圧力容器に取り付ける安全弁には、修理等のために止め弁を設けるが、この止め弁には「常時開」の表示をするなど、止め弁の操作に間違いのないようにしなければならない。\n・溶栓の溶融温度は原則として75℃以下である。\n・溶栓は温度によって溶融するものであるから、液封防止の圧力逃がし装置に溶栓は使用できない。\n・高圧遮断装置は原則として手動復帰式とし、通常は、安全弁噴出以前に所定の圧力で圧縮機を停止させ、高圧側圧力の異常な上昇を防止する。","has_image":false,"image_path":null},{"id":"R07-Hoan-Q12","year":"R07","subject":"保安管理技術","category":"材料の強さ・圧力容器","tags":[],"question":"次のイ、ロ、ハ、ニの記述のうち、材料の強さおよび圧力容器について正しいものはどれか。\nイ．薄肉円筒胴圧力容器の板厚を計算する場合、設計圧力、容器の内径、材料の許容引張応力、腐れしろ、および溶接継手の効率を考慮する。\nロ．二段圧縮冷凍装置における設計圧力は、高圧部、中圧部および低圧部の3つに区分され、高圧部では通常の運転状態で起こりうる最高の圧力を用いる。\nハ．薄肉円筒胴圧力容器に発生する応力には、接線方向に発生する応力と長手方向に発生する応力があり、円筒胴の接線方向の引張応力は、長手方向の引張応力の2倍になる。\nニ．一般の鋼材は低温で脆くなり、これを低温脆性という。この低温脆性による破壊は、衝撃荷重などが引き金になって、降伏点以下の低荷重のもとでも突発的に発生する。","options":["(1) イ、ロ","(2) イ、ハ","(3) ロ、ニ","(4) イ、ハ、ニ","(5) ロ、ハ、ニ"],"answer":4,"explanation":"・薄肉円筒胴圧力容器の板厚を計算する場合、設計圧力、容器の内径、材料の許容引張応力、腐れしろ、および溶接継手の効率を考慮する。\n・二段圧縮冷凍装置における設計圧力は、高圧部と低圧部の2つに区分され、高圧部では通常の運転状態で起こりうる最高の圧力を用いる。\n・薄肉円筒胴圧力容器に発生する応力には、接線方向に発生する応力と長手方向に発生する応力があり、円筒胴の接線方向の引張応力は、長手方向の引張応力の2倍になる。\n・一般の鋼材は低温で脆くなり、これを低温脆性という。この低温脆性による破壊は、衝撃荷重などが引き金になって、降伏点以下の低荷重のもとでも突発的に発生する。","has_image":false,"image_path":null},{"id":"R07-Hoan-Q13","year":"R07","subject":"保安管理技術","category":"据付け・試験・試運転","tags":[],"question":"次のイ、ロ、ハ、ニの記述のうち、据付けおよび試験について正しいものはどれか。\nイ．配管を含むすべての部分の気密試験を実施した後、圧力容器の耐圧試験を実施して、試験終了とした。\nロ．多気筒圧縮機を支持するコンクリート基礎の質量は、圧縮機の質量と同程度にする。\nハ．冷凍装置の真空放置試験を、0.6kPa以下の真空度で実施した。\nニ．受液器をもつ冷凍装置では、負荷の変動によって不足することのないだけの量の冷媒を充填しなければならない。ただし、冷媒が過充填にならないようにすることも大切である。","options":["(1) イ、ロ","(2) イ、ニ","(3) ハ、ニ","(4) イ、ロ、ハ","(5) ロ、ハ、ニ"],"answer":3,"explanation":"・耐圧試験は、気密試験の前に行わなければならない。\n・多気筒圧縮機を支持するコンクリート基礎の質量は、圧縮機、電動機またはエンジンなどの駆動機の質量の合計の2～3倍程度にする。\n・冷凍装置の真空放置試験は、0.6kPa以下の真空度で行う。\n・液器をもつ冷凍装置では、負荷の変動によって不足することのないだけの量の冷媒を充填しなければならない。ただし、冷媒が過充填にならないようにすることも大切である。","has_image":false,"image_path":null},{"id":"R07-Hoan-Q14","year":"R07","subject":"保安管理技術","category":"冷凍装置の運転","tags":[],"question":"次のイ、ロ、ハ、ニの記述のうち、冷凍装置の運転について正しいものはどれか。\nイ．冷凍装置の運転開始後、液配管にサイトグラスがある場合は、それにより気泡が発生していないことを確認する。\nロ．凝縮圧力が一定のもとでは、圧縮機の吸込み蒸気圧力の低下により、圧縮機の体積効率、冷凍装置の冷凍能力および圧縮機駆動の軸動力は、いずれも低下する。\nハ．シェルアンドチューブ凝縮器の運転状態が、冷却水の出入口温度差は5Kで、凝縮温度は冷却水出口温度よりも4K高い温度であったので、正常であると判定した。\nニ．冷凍装置を長期間休止させる場合には、安全弁の元弁および各部の止め弁を閉じ、弁にグランド部があるものは締めておく。","options":["(1) イ、ハ","(2) イ、ニ","(3) ロ、ニ","(4) イ、ロ、ハ","(5) ロ、ハ、ニ"],"answer":4,"explanation":"・冷凍装置の運転開始後、液配管にサイトグラスがある場合は、それにより気泡が発生していないことを確認する。\n・正しい。凝縮圧力が一定のもとでは、圧縮機の吸込み蒸気圧力の低下により、圧縮機の体積効率、冷凍装置の冷凍能力および圧縮機駆動の軸動力は、いずれも低下する。\n・冷凍装置運転中における、水冷凝縮器の冷却水の標準的な出入口温度差は、4～6Kであり、標準的な凝縮温度は、冷却水出口温度よりも3～5Kほど高い温度である。\n・冷凍装置を長期間休止させる場合には、各部の止め弁を閉じ、弁にグランド部があるものは締めておく。ただし、安全弁の元弁は閉じてはならない。","has_image":false,"image_path":null},{"id":"R07-Hoan-Q15","year":"R07","subject":"保安管理技術","category":"冷凍装置の保守管理","tags":[],"question":"次のイ、ロ、ハ、ニの記述のうち、冷凍装置の保守管理について正しいものはどれか。\nイ．冷媒充填量が大きく不足していると、圧縮機の吸込み蒸気の過熱度が大きくなり、圧縮機吐出しガスの圧力と温度がともに上昇する。\nロ．アンモニア冷凍装置の冷媒系統に水分が侵入すると、低温の運転では、わずかな水分量であっても膨張弁部に氷結して、冷媒が流れなくなる。\nハ．不凝縮ガスが冷凍装置内に存在すると、圧縮機吐出しガスの圧力と温度がともに上昇する。\nニ．オイルフォーミングとは、クランクケース内の冷凍機油に冷媒が混入することをいう。","options":["(1) イ","(2) ハ","(3) イ、ニ","(4) ロ、ハ","(5) ロ、ニ"],"answer":2,"explanation":"・冷媒充填量が大きく不足していると、圧縮機の吸込み蒸気の過熱度が大きくなり、圧縮機吐出しガスの圧力が低下し、吐出し温度は上昇する。\n・アンモニア冷凍装置の冷媒系統に水分が侵入すると、アンモニアがアンモニア水になるので、わずかな水分量であれば性能に与える影響はない。多量の水分の侵入は、運転に重大な支障をきたす。\n・不凝縮ガスが冷凍装置内に存在すると、圧縮機吐出しガスの圧力と温度がともに上昇する。\n・オイルフォーミングとは、冷凍機油に混入した冷媒液が、急激に蒸発して激しい泡立ちを生じる現象である。","has_image":false,"image_path":null},{"id":"R06-Hoan-Q01","year":"R06","subject":"保安管理技術","category":"冷凍の原理・冷凍サイクル","tags":[],"question":"次のイ、ロ、ハ、ニの記述のうち、冷凍の原理および冷凍サイクルについて正しいものはどれか。\nイ．流動する冷媒1 kg の中に含まれるエネルギーを比エンタルピーといい、その単位は、（kJ/kg）で表す。冷凍装置における冷凍能力は、各機器への熱の出入り前後の比エンタルピーがわかれば計算することができる。\nロ．吸収冷凍機では、圧縮機を使用せずに、吸収器、発生器（再生器）、溶液ポンプなどを用いて冷媒を循環させ、冷熱を得る。\nハ．実際の冷凍サイクルでは、常に理論断熱圧縮動力以上の圧縮動力を必要とし、圧縮機の機械的損失も伴う。そのため、蒸発温度と凝縮温度などの運転条件が同じであっても、理論冷凍サイクルの成績係数に比べ、実際の装置における冷凍サイクルの成績係数は小さくなる。\nニ．理論ヒートポンプサイクルでは、圧縮機で理論断熱圧縮動力を消費して、この圧縮動力に相当する熱と蒸発器で取り入れた熱とが冷媒に加わって凝縮負荷となり、凝縮器から放出される熱を利用する。","options":["(1) イ、ロ","(2) イ、ハ","(3) ロ、ハ","(4) ロ、ニ","(5) ロ、ハ、ニ"],"answer":5,"explanation":"・流動する冷媒1kgの中に含まれるエネルギーを比エンタルピーといい、その単位は、（kJ/kg）で表す。冷凍装置における冷凍能力は、各機器への熱の出入り前後の比エンタルピー差と冷媒循環量がわかれば計算することができる\n・吸収冷凍機では、圧縮機を使用せずに、吸収器、発生器（再生器）、溶液ポンプなどを用いて冷媒を循環させ、冷熱を得る。\n・実際の冷凍サイクルでは、常に理論断熱圧縮動力以上の圧縮動力を必要とし、圧縮機の機械的損失も伴う。そのため、蒸発温度と凝縮温度などの運転条件が同じであっても、理論冷凍サイクルの成績係数に比べ、実際の装置における冷凍サイクルの成績係数は小さくなる。\n・理論ヒートポンプサイクルでは、圧縮機で理論断熱圧縮動力を消費して、この圧縮動力に相当する熱と蒸発器で取り入れた熱とが冷媒に加わって凝縮負荷となり、凝縮器から放出される熱を利用する。","has_image":false,"image_path":null},{"id":"R06-Hoan-Q02","year":"R06","subject":"保安管理技術","category":"冷凍サイクル・熱の移動","tags":[],"question":"次のイ、ロ、ハ、ニの記述のうち、冷凍サイクルおよび熱の移動について正しいものはどれか。\nイ．二段圧縮冷凍装置の利点は、一般に、低段圧縮機から出た冷媒ガスを一度冷却しているので、高段圧縮機の吐出しガス温度が高くならないこと、また、圧縮機の損失を減らすことができ、圧縮機効率の低下を防ぐことができることである。\nロ．理論冷凍サイクルの成績係数は、理論ヒートポンプサイクルの成績係数よりも1だけ大きな成績係数の値となる。\nハ．熱の移動には熱伝導、対流熱伝達、熱放射（熱ふく射）の三つの形態がある。このうち固体壁表面とそれに接して流動する流体間の伝熱作用を熱伝導という。\nニ．水冷却器の交換熱量の計算において、冷媒と冷却水との間の温度差が流れ方向の場所によって変わるので、平均温度差には、これらの変化を考慮した対数平均温度差を用いる。なお、近似値として算術平均温度差を用いることもある。","options":["(1) イ、ロ","(2) イ、ニ","(3) ロ、ハ","(4) ロ、ニ","(5) ハ、ニ"],"answer":2,"explanation":"・二段圧縮冷凍装置の利点は、一般に、低段圧縮機から出た冷媒ガスを一度冷却しているので、高段圧縮機の吐出しガス温度が高くならないこと、また、圧縮機の損失を減らすことができ、圧縮機効率の低下を防ぐことができることである。\n・理論冷凍サイクルの成績係数は、理論ヒートポンプサイクルの成績係数よりも1だけ小さな成績係数の値となる。\n・熱の移動には熱伝導、対流熱伝達、熱放射（熱ふく射）の三つの形態がある。このうち固体壁表面とそれに接して流動する流体間の伝熱作用を対流熱伝達という。\n・水冷却器の交換熱量の計算において、冷媒と冷却水との間の温度差が流れ方向の場所によって変わるので、平均温度差には、これらの変化を考慮した対数平均温度差を用いる。なお、近似値として算術平均温度差を用いることもある。","has_image":false,"image_path":null},{"id":"R06-Hoan-Q03","year":"R06","subject":"保安管理技術","category":"冷凍能力・軸動力・成績係数","tags":[],"question":"次のイ、ロ、ハ、ニの記述のうち、圧縮機の効率、軸動力などについて正しいものはどれか。\nイ．体積効率ηvは、ピストン押しのけ量をV、圧縮機の実際の吸込み蒸気量をqvrとすると、ηv＝qvr／Vで表される。\nロ．圧縮機の圧力比が大きくなると、断熱効率は小さくなるが、機械効率は大きくなる。\nハ．圧縮機の吸込み蒸気の比体積は、吸込み圧力が低いほど、また、吸込み蒸気の過熱度が小さいほど大きくなり、圧縮機の冷媒循環量および冷凍能力が減少する。\nニ．圧縮機の実際の駆動に必要な軸動力は、蒸気の圧縮に必要な圧縮動力と機械的摩擦損失動力の和で表される。","options":["(1) イ、ロ","(2) イ、ニ","(3) ロ、ハ","(4) ロ、ニ","(5) イ、ハ、ニ"],"answer":2,"explanation":"・体積効率ηvは、ピストン押しのけ量をV、圧縮機の実際の吸込み蒸気量をqvrとすると、ηv＝qvr／Vで表される。\n・圧縮機の圧力比が大きくなると、断熱効率は小さくなり、機械効率は若干小さくなる。\n・圧縮機の吸込み蒸気の比体積は、吸込み圧力が低いほど、また、吸込み蒸気の過熱度が大きいほど大きくなり、圧縮機の冷媒循環量および冷凍能力が減少する。\n・圧縮機の実際の駆動に必要な軸動力は、蒸気の圧縮に必要な圧縮動力と機械的摩擦損失動力の和で表される。","has_image":false,"image_path":null},{"id":"R06-Hoan-Q04","year":"R06","subject":"保安管理技術","category":"冷媒・ブライン","tags":[],"question":"次のイ、ロ、ハ、ニの記述のうち、冷媒について正しいものはどれか。\nイ．R404Aは共沸混合冷媒である。\nロ．理論成績係数は、凝縮温度と蒸発温度が同じ条件下であれば、フルオロカーボン冷媒の種類が異なっても同じである。\nハ．一般に、アンモニア冷媒液は冷凍機油より比重が小さく、フルオロカーボン冷媒液は冷凍機油よりも比重が大きい。\nニ．一般に、HFC冷媒は、HCFC冷媒と比べると誘電率が大きく、その電気絶縁性がやや劣る。","options":["(1) イ、ハ","(2) ロ、ハ","(3) ロ、ニ","(4) ハ、ニ","(5) イ、ロ、ニ"],"answer":4,"explanation":"・R404Aは非共沸混合冷媒である。ただし、R404Aは温度勾配が小さく、疑似共沸混合冷媒と呼ばれる。\n・理論成績係数は、凝縮温度と蒸発温度が同じ条件下であれば、冷媒の種類によって異なる。\n・一般に、アンモニア冷媒液は冷凍機油より比重が小さく、フルオロカーボン冷媒液は冷凍機油よりも比重が大きい。\n・一般に、HFC冷媒は、HCFC冷媒と比べると誘電率が大きく、その電気絶縁性がやや劣る。","has_image":false,"image_path":null},{"id":"R06-Hoan-Q05","year":"R06","subject":"保安管理技術","category":"圧縮機の特性等","tags":[],"question":"次のイ、ロ、ハ、ニの記述のうち、圧縮機について正しいものはどれか。\nイ．圧縮機と電動機が直結されて、1つのケーシングの中に収められて、一体構造をしたものを密閉圧縮機という。とくに、ケーシングを溶接密閉した全密閉圧縮機は、アンモニア冷凍装置に多く使用される。\nロ．多気筒往復圧縮機の容量制御装置は、スライド弁を用いることで、ある程度連続的な容量制御を行うことが可能であるが、低負荷条件で長く運転する場合は、吐出しガス温度が上昇することがある。\nハ．往復圧縮機では、クランク軸端に付けたギアポンプで、クランクケースの油溜めから冷凍機油を汲み上げ加圧して、圧縮機各部の摺動部に給油を行うものがあり、この給油方式を強制給油式と呼ぶ。\nニ．フルオロカーボン冷凍装置の運転で、液戻りが著しく多くなると、冷凍機油に冷媒液が多量に溶け込み、冷凍機油の粘度を低下させる。また、フルオロカーボン冷媒用の往復圧縮機を、油温が低い状態から起動すると、オイルフォーミングが発生することがある。いずれの場合も、圧縮機が潤滑不良となる場合がある。","options":["(1) イ、ロ","(2) イ、ハ","(3) イ、ニ","(4) ロ、ハ","(5) ハ、ニ"],"answer":5,"explanation":"・圧縮機と電動機が直結されて、1つのケーシングの中に収められて、一体構造をしたものを密閉圧縮機という。アンモニア冷媒の圧縮機では、冷媒が電動機の銅巻線を侵食するので、開放型が主に使用される。近年は、電動機の巻線にアンモニア環境下で使用できる材質を用いて、圧縮機と電動機を直結した半密閉圧縮機も使用されるようになってきている。\n・スクリュー往復圧縮機の容量制御装置は、スライド弁を用いることで、ある程度連続的な容量制御を行うことが可能であるが、低負荷条件で長く運転する場合は、吐出しガス温度が上昇することがある。\n・往復圧縮機では、クランク軸端に付けたギアポンプで、クランクケースの油溜めから冷凍機油を汲み上げ加圧して、圧縮機各部の摺動部に給油を行うものがあり、この給油方式を強制給油式と呼ぶ。\n・フルオロカーボン冷凍装置の運転で、液戻りが著しく多くなると、冷凍機油に冷媒液が多量に溶け込み、冷凍機油の粘度を低下させる。また、フルオロカーボン冷媒用の往復圧縮機を、油温が低い状態から起動すると、オイルフォーミングが発生することがある。いずれの場合も、圧縮機が潤滑不良となる場合がある。","has_image":false,"image_path":null},{"id":"R06-Hoan-Q06","year":"R06","subject":"保安管理技術","category":"凝縮器・冷却塔","tags":[],"question":"次のイ、ロ、ハ、ニの記述のうち、凝縮器について正しいものはどれか。\nイ．水冷シェルアンドチューブ凝縮器の一つである受液器兼用凝縮器は、凝縮器の底部に溜められた冷媒液中に一部の冷却管を配置して、その冷媒液を過冷却にする。\nロ．水冷凝縮器では、冷却水の冷却管内水速が速いほど熱通過率は大きくなる。したがって、冷却水の冷却管内水速が2倍になれば熱通過率も2倍になる。\nハ．空冷凝縮器の一般的な設計条件は、入口空気乾球温度を約32℃としている。空冷凝縮器の前面風速を大きくすると、熱通過率は大きくなる。\nニ．主にアンモニア冷凍装置に用いられている蒸発式凝縮器は、冷却塔とは異なり、冷却作用のほとんどは水の蒸発潜熱による。このため、冷却水はほぼ一定の温度で循環するが、水冷凝縮器に比べて凝縮温度は高くなる。","options":["(1) イ、ハ","(2) イ、ニ","(3) ロ、ハ","(4) ロ、ニ","(5) ハ、ニ"],"answer":1,"explanation":"・水冷シェルアンドチューブ凝縮器の一つである受液器兼用凝縮器は、凝縮器の底部に溜められた冷媒液中に一部の冷却管を配置して、その冷媒液を過冷却にする。\n・水冷凝縮器では、冷却水の冷却管内水速が速いほど熱通過率は大きくなるが、冷却水の冷却管内水速が2倍になっても熱通過率は2倍にならない（2倍より小さくなる）。\n・空冷凝縮器の一般的な設計条件は、入口空気乾球温度を約32℃としている。空冷凝縮器の前面風速を大きくすると、熱通過率は大きくなる。\n・主にアンモニア冷凍装置に用いられている蒸発式凝縮器は、冷却塔とは異なり、冷却作用のほとんどは水の蒸発潜熱による。このため、冷却水はほぼ一定の温度で循環するが、水冷凝縮器に比べて凝縮温度は低くなる。","has_image":false,"image_path":null},{"id":"R06-Hoan-Q07","year":"R06","subject":"保安管理技術","category":"蒸発器・除霜等","tags":[],"question":"次のイ、ロ、ハ、ニの記述のうち、蒸発器について正しいものはどれか。\nイ．蒸発器は、乾式や満液式などに分類される。シェルアンドチューブ乾式蒸発器は、シェル側に冷媒を供給し、冷却管内にブラインを流して冷却する。\nロ．満液式蒸発器における平均熱通過率は、乾式蒸発器の平均熱通過率よりも大きい。\nハ．液ポンプ方式の冷凍装置では、蒸発液量の3～5倍程度の冷媒液を蒸発器へ強制循環させる。\nニ．除霜方法には、散水方式、ホットガス方式、オフサイクルデフロスト方式などがある。ホットガス方式では、高温の冷媒ガスの顕熱だけで霜を融解させる。","options":["(1) イ、ロ","(2) イ、ハ","(3) ロ、ハ","(4) ロ、ニ","(5) ハ、ニ"],"answer":3,"explanation":"・蒸発器は、乾式や満液式などに分類される。シェルアンドチューブ乾式蒸発器は、シェル側にブラインを供給し、冷却管内に冷媒を流して冷却する。\n・満液式蒸発器における平均熱通過率は、乾式蒸発器の平均熱通過率よりも大きい。\n・液ポンプ方式の冷凍装置では、蒸発液量の3～5倍程度の冷媒液を蒸発器へ強制循環させる。\n・除霜方法には、散水方式、ホットガス方式、オフサイクルデフロスト方式などがある。ホットガス方式では、高温の冷媒ガスの顕熱と凝縮潜熱とによって霜を融解させる。","has_image":false,"image_path":null},{"id":"R06-Hoan-Q08","year":"R06","subject":"保安管理技術","category":"自動制御機器","tags":[],"question":"次のイ、ロ、ハ、ニの記述のうち、自動制御機器について正しいものはどれか。\nイ．自動膨張弁は、高圧の冷媒液を低圧部に絞り膨張させる機能と、冷凍負荷に応じて蒸発器への冷媒流量を調節して冷凍装置を効率よく運転する機能の、二つの機能をもっている。\nロ．吸入圧力調整弁は、弁入口側の冷媒蒸気の圧力が設定値よりも高くならないように作動する。このことにより圧縮機駆動用電動機の過負荷を防止できる。\nハ．キャピラリチューブは、冷媒の流動抵抗による圧力降下を利用して冷媒の絞り膨張を行うとともに、冷媒の流量を制御し、蒸発器出口冷媒蒸気の過熱度の制御を行う。\nニ．断水リレーは、水冷凝縮器や水冷却器で、断水または循環水量が減少したときに、冷却水ポンプを停止させることによって装置を保護する安全装置である。","options":["(1) イ","(2) ロ","(3) イ、ハ","(4) ハ、ニ","(5) イ、ロ、ニ"],"answer":1,"explanation":"・自動膨張弁は、高圧の冷媒液を低圧部に絞り膨張させる機能と、冷凍負荷に応じて蒸発器への冷媒流量を調節して冷凍装置を効率よく運転する機能の、二つの機能をもっている。\n・吸入圧力調整弁は、弁出口側の冷媒蒸気の圧力が設定値よりも高くならないように作動する。このことにより圧縮機駆動用電動機の過負荷を防止できる。\n※吸入圧力調整弁は圧縮機の吸込み配管（圧縮機の手前）に取り付けるので、吸入圧力調整弁の出口側＝圧縮機の吸込み（入口）側\n・キャピラリチューブは、冷媒の流動抵抗による圧力降下を利用して冷媒の絞り膨張を行うが、冷媒の流量を制御することはできず、蒸発器出口冷媒蒸気の過熱度の制御を行うことはできない。\n・断水リレーは、水冷凝縮器や水冷却器で、断水または循環水量が減少したときに、圧縮機を停止させたり、警報を出したりして装置を保護する安全装置である。","has_image":false,"image_path":null},{"id":"R06-Hoan-Q09","year":"R06","subject":"保安管理技術","category":"附属機器","tags":[],"question":"次のイ、ロ、ハ、ニの記述のうち、附属機器について正しいものはどれか。\nイ．液分離器は、蒸発器と圧縮機との間の吸込み蒸気配管に取り付け、吸込み蒸気中に混在した冷媒液を分離して、冷凍装置外部に排出する。\nロ．サイトグラスには、のぞきガラスとその内側のモイスチャーインジケータからなるものと、のぞきガラスのないモイスチャーインジケータだけのものがある。\nハ．高圧受液器は、横形または立形円筒状の圧力容器で、受液器より冷媒液とともに冷媒ガスが通過して流れ出ないように、液出口管端を受液器の下部位置に設置し、下部から冷媒液を取り出す。\nニ．一般に、フィルタドライヤは冷媒液配管に取り付け、フルオロカーボン冷凍装置、アンモニア冷凍装置の冷媒系統の水分を除去する。","options":["(1) ハ","(2) ニ","(3) イ、ロ","(4) イ、ハ","(5) ロ、ニ"],"answer":1,"explanation":"・分離器は、蒸発器と圧縮機との間の吸込み蒸気配管に取り付け、吸込み蒸気中に混在した液を分離して、蒸気だけを圧縮機に吸い込ませて、液圧縮を防止する。\n・サイトグラスには、のぞきガラスとその内側のモイスチャーインジケータからなるものと、モイスチャーインジケータのない、のぞきガラスだけのものがある。\n・高圧受液器は、横形または立形円筒状の圧力容器で、受液器より冷媒液とともに冷媒ガスが通過して流れ出ないように、液出口管端を受液器の下部位置に設置し、下部から冷媒液を取り出す。\n・一般に、フィルタドライヤは冷媒液配管に取り付け、フルオロカーボン冷凍装置の冷媒系統の水分を除去するが、アンモニア冷凍装置では用いられない。","has_image":false,"image_path":null},{"id":"R06-Hoan-Q10","year":"R06","subject":"保安管理技術","category":"冷媒配管","tags":[],"question":"次のイ、ロ、ハ、ニの記述のうち、冷媒配管について正しいものはどれか。\nイ．冷媒配管では、冷媒の流れ抵抗を極力小さくするように留意し、配管の曲がり部はできるだけ少なくし、曲がりの半径は大きくする。\nロ．高圧冷媒液配管は、冷媒液がフラッシュ（気化）するのを防ぐために、流速ができるだけ大きくなるような管径とする。\nハ．吸込み蒸気配管には十分な防熱を施し、管表面における結露あるいは着霜を防止することによって吸込み蒸気温度の低下を防ぐ。\nニ．凝縮器と受液器を接続する液流下管を通して、冷媒液を凝縮器から受液器に流下しやすくするために、凝縮器と受液器との間に均圧管を設けた。","options":["(1) イ、ロ","(2) イ、ニ","(3) ハ、ニ","(4) イ、ロ、ハ","(5) ロ、ハ、ニ"],"answer":2,"explanation":"・冷媒配管では、冷媒の流れ抵抗を極力小さくするように留意し、配管の曲がり部はできるだけ少なくし、曲がりの半径は大きくする。\n・高圧冷媒液配管は、冷媒液がフラッシュ（気化）するのを防ぐために、流速ができるだけ小さくなるような管径とする。\n・吸込み蒸気配管には、管表面における結露あるいは結霜を防止し、吸込み蒸気温度の上昇を防ぐために十分な防熱を施す。\n・凝縮器と受液器を接続する液流下管を通して、冷媒液を凝縮器から受液器に流下しやすくするために、凝縮器と受液器との間に均圧管を設けた。","has_image":false,"image_path":null},{"id":"R06-Hoan-Q11","year":"R06","subject":"保安管理技術","category":"安全装置","tags":[],"question":"次のイ、ロ、ハ、ニの記述のうち、安全装置について正しいものはどれか。\nイ．圧縮機に取り付けるべき安全弁の最小口径は、冷媒の種類に応じて定まり、標準回転速度における1時間当たりのピストン押しのけ量に正比例する。\nロ．圧力容器に取り付ける安全弁には修理等のために止め弁を設けるが、この止め弁は修理等のとき以外は常時開にし、「常時開」の表示をしなければならない。\nハ．溶栓は、温度によって溶栓中央の金属が溶融するものであるから、高温の圧縮機吐出しガスで加熱される部分、あるいは、水冷凝縮器の冷却水で冷却される部分などに取り付けてはならない。\nニ．冷凍装置の安全弁の作動圧力とは、吹始め圧力と吹出し圧力のことである。この圧力は耐圧試験圧力を基準として定める。","options":["(1) イ、ロ","(2) イ、ニ","(3) ロ、ハ","(4) ハ、ニ","(5) イ、ロ、ハ"],"answer":3,"explanation":"・圧縮機に取り付けるべき安全弁の最小口径は、冷媒の種類に応じて定まり、標準回転速度における1時間当たりのピストン押しのけ量の平方根に正比例する。\n・圧力容器に取り付ける安全弁には修理等のために止め弁を設けるが、この止め弁は修理等のとき以外は常時開にし、「常時開」の表示をしなければならない\n・溶栓は、温度によって溶栓中央の金属が溶融するものであるから、高温の圧縮機吐出しガスで加熱される部分、あるいは、水冷凝縮器の冷却水で冷却される部分などに取り付けてはならない。\n・冷凍装置の安全弁の作動圧力とは、吹始め圧力と吹出し圧力のことである。この圧力は許容圧力を基準として定める。","has_image":false,"image_path":null},{"id":"R06-Hoan-Q12","year":"R06","subject":"保安管理技術","category":"材料の強さ・圧力容器","tags":[],"question":"次のイ、ロ、ハ、ニの記述のうち、材料の強さおよび圧力容器について正しいものはどれか。\nイ．円筒胴の内径が小さいほど、また、円筒胴の内側にかかっている内圧が高いほど、円筒胴の必要とする板厚は厚くなる。\nロ．圧力容器の腐れしろは、材料の種類により異なる。直接風雨にさらされない部分で耐食処理を施した鋼の腐れしろを0.2mmとした。\nハ．溶接継手の効率は、溶接継手の種類や形状によって決められており、溶接部の全長に対する放射線透過試験を行った部分の長さの割合を考慮して決められているものもある。\nニ．圧力容器においては、その材料に生じる応力は、使用する材料の応力－ひずみ線図における比例限度以下の適切な値に収まるように設計する必要がある。","options":["(1) イ、ロ","(2) イ、ハ","(3) ハ、ニ","(4) イ、ロ、ニ","(5) ロ、ハ、ニ"],"answer":3,"explanation":"・円筒胴の内径が大きいほど、また、円筒胴の内側にかかっている内圧が高いほど、円筒胴の必要とする板厚は厚くなる。\n・直接風雨にさらされない部分で耐食処理を施した鋼の腐れしろは0.5mmとしなければならない。\n・溶接継手の効率は、溶接継手の種類や形状によって決められており、溶接部の全長に対する放射線透過試験を行った部分の長さの割合を考慮して決められているものもある。\n・圧力容器においては、その材料に生じる応力は、使用する材料の応力－ひずみ線図における比例限度以下の適切な値に収まるように設計する必要がある。","has_image":false,"image_path":null},{"id":"R06-Hoan-Q13","year":"R06","subject":"保安管理技術","category":"据付け・試験・試運転","tags":[],"question":"次のイ、ロ、ハ、ニの記述のうち、冷凍装置の据付けおよび試験について正しいものはどれか。\nイ．アンモニア冷凍装置の気密試験には、乾燥空気、窒素ガスまたは炭酸ガスを使用し、酸素ガス、毒性ガス、可燃性ガスを使用してはならない。\nロ．多気筒圧縮機を支持するコンクリート基礎の質量は、圧縮機、電動機またはエンジンなどの駆動機の質量の合計の2～3倍程度にする。\nハ．気密試験に空気圧縮機を使用して圧縮空気を供給する場合は、吐出し空気の温度を140℃以下にする。\nニ．真空試験を行う前には、必ず気密試験を行う。真空試験では、装置全体からの微量の漏れは発見できるが、場所は特定できない。","options":["(1) イ、ロ","(2) イ、ニ","(3) ロ、ハ","(4) イ、ハ、ニ","(5) ロ、ハ、ニ"],"answer":5,"explanation":"・アンモニア冷凍装置の気密試験には、乾燥空気、窒素ガスを使用し、炭酸ガスを使用してはならない。また、気密試験には、酸素ガス、毒性ガス、可燃性ガスを使用してはならない。\n・多気筒圧縮機を支持するコンクリート基礎の質量は、圧縮機、電動機またはエンジンなどの駆動機の質量の合計の2～3倍程度にする。\n・気密試験に空気圧縮機を使用して圧縮空気を供給する場合は、吐出し空気の温度を140℃以下にする。\n・真空試験を行う前には、必ず気密試験を行う。真空試験では、装置全体からの微量の漏れは発見できるが、場所は特定できない。","has_image":false,"image_path":null},{"id":"R06-Hoan-Q14","year":"R06","subject":"保安管理技術","category":"冷凍装置の運転","tags":[],"question":"次のイ、ロ、ハ、ニの記述のうち、冷凍装置の運転について正しいものはどれか。\nイ．一定の凝縮圧力のもとでは、圧縮機の吸込み蒸気圧力の低下により、圧力比が大きくなり、冷凍能力は増加する。\nロ．冷凍装置を長期間休止させる場合には、低圧側の冷媒を受液器に回収する。この場合に、装置内への空気の吸込みを防ぐため、低圧側と圧縮機内に大気圧よりも高いガス圧力を残しておく。\nハ．冷蔵庫の蒸発器に厚く着霜すると、蒸発器における空気の流れ抵抗が増加するので、風量が減少し、熱通過率は大きくなるが、冷却能力は低下する。\nニ．蒸発圧力が一定のもとでは、圧縮機の吐出しガス圧力が上昇すれば、圧縮機の体積効率および装置の冷凍能力が低下し、圧縮機の駆動軸動力が増加する。","options":["(1) イ、ハ","(2) イ、ニ","(3) ロ、ハ","(4) ロ、ニ","(5) ハ、ニ"],"answer":4,"explanation":"・一定の凝縮圧力のもとでは、圧縮機の吸込み蒸気圧力の低下により、圧力比が大きくなり、冷凍能力は減少する。\n・冷凍装置を長期間休止させる場合には、低圧側の冷媒を受液器に回収する。この場合に、装置内への空気の吸込みを防ぐため、低圧側と圧縮機内に大気圧よりも高いガス圧力を残しておく。\n・冷蔵庫の蒸発器に厚く着霜すると、蒸発器における空気の流れ抵抗が増加するので、風量が減少し、熱通過率が小さくなり、冷却能力は低下する。\n・蒸発圧力が一定のもとでは、圧縮機の吐出しガス圧力が上昇すれば、圧縮機の体積効率および装置の冷凍能力が低下し、圧縮機の駆動軸動力が増加する。","has_image":false,"image_path":null},{"id":"R06-Hoan-Q15","year":"R06","subject":"保安管理技術","category":"冷凍装置の保守管理","tags":[],"question":"次のイ、ロ、ハ、ニの記述のうち、冷凍装置の保守管理について正しいものはどれか。\nイ．圧縮機が湿り蒸気を吸い込み、液戻りがさらに続くと、オイルフォーミングを生じて給油ポンプの油圧が上がり、潤滑不良になりやすい。\nロ．液封事故の発生しやすい箇所は、運転中に周囲温度より温度の低い冷媒液の配管に多い。\nハ．フルオロカーボン冷媒は水分の溶解度が極めて大きいので、フルオロカーボン冷凍装置に少量の水分が侵入しても装置に障害を引き起こすことがある。\nニ．冷凍負荷が急激に増大すると、蒸発器での冷媒の沸騰が激しくなり、蒸気とともに多量の液滴が圧縮機に吸い込まれ、液戻りが多いときには液圧縮を起こすことがある。","options":["(1) イ、ハ","(2) イ、ニ","(3) ロ、ハ","(4) ロ、ニ","(5) ハ、ニ"],"answer":4,"explanation":"・圧縮機が湿り蒸気を吸い込み、液戻りがさらに続くと、オイルフォーミングを生じて給油ポンプの油圧が下がり、潤滑不良になりやすい。\n・液封事故の発生しやすい箇所は、運転中に周囲温度より温度の低い冷媒液の配管に多い。\n・フルオロカーボン冷媒は水分の溶解度が極めて小さいので、フルオロカーボン冷凍装置に少量の水分が侵入しても装置に障害を引き起こすことがある。\n・冷凍負荷が急激に増大すると、蒸発器での冷媒の沸騰が激しくなり、蒸気とともに多量の液滴が圧縮機に吸い込まれ、液戻りが多いときには液圧縮を起こすことがある。","has_image":false,"image_path":null},{"id":"R05-Hoan-Q01","year":"R05","subject":"保安管理技術","category":"冷凍の原理・冷凍サイクル","tags":[],"question":"次のイ、ロ、ハ、ニの記述のうち、冷凍の原理について正しいものはどれか。\nイ．圧縮機で冷媒蒸気を圧縮すると、冷媒蒸気は圧縮仕事によって圧力と温度の高い液体になる。\nロ．理論ヒートポンプサイクルの成績係数は、理論冷凍サイクルの成績係数より1だけ大きい。\nハ．冷凍装置内の冷媒圧力は、一般にブルドン管圧力計で計測する。圧力計のブルドン管は、管内圧力と管外大気圧との圧力差によって変形するので、指示される圧力は測定しようとする冷媒圧力と大気圧との圧力差で、この指示圧力を絶対圧力と呼ぶ。\nニ．冷凍能力と理論断熱圧縮動力の比を理論冷凍サイクルの成績係数と呼び、この値が大きいほど、小さい動力で大きな冷凍能力が得られることになる。","options":["(1) イ","(2) ロ","(3) イ、ハ","(4) ロ、ニ","(5) ハ、ニ"],"answer":4,"explanation":"・圧縮機で冷媒蒸気を圧縮すると、冷媒蒸気は圧縮仕事によって圧力と温度の高いガスになる。\n・理論ヒートポンプサイクルの成績係数は、理論冷凍サイクルの成績係数より1だけ大きい。\n・冷凍装置内の冷媒圧力は、一般にブルドン管圧力計で計測する。圧力計のブルドン管は、管内圧力と管外大気圧との圧力差によって変形するので、指示される圧力は測定しようとする冷媒圧力と大気圧との圧力差で、この指示圧力をゲージ圧力と呼ぶ。\n・冷凍能力と理論断熱圧縮動力の比を理論冷凍サイクルの成績係数と呼び、この値が大きいほど、小さい動力で大きな冷凍能力が得られることになる。","has_image":false,"image_path":null},{"id":"R05-Hoan-Q02","year":"R05","subject":"保安管理技術","category":"冷凍サイクル・熱の移動","tags":[],"question":"次のイ、ロ、ハ、ニの記述のうち、冷凍サイクルおよび熱の移動について正しいものはどれか。\nイ．固体壁表面からの熱伝達による伝熱量は、伝熱面積、固体壁表面の温度と固体壁から十分に離れた位置の流体の温度との温度差および比例係数の積で表されるが、この比例係数のことを熱伝達率という。\nロ．冷凍サイクルの蒸発器で、周囲が冷媒1 kgから奪う熱量のことを、冷凍効果という。この冷凍効果の値は、同じ冷媒でも冷凍サイクルの運転条件によって変わる。\nハ．水冷却器の交換熱量の計算において、冷却管の入口側の水と冷媒との温度差をΔt1、出口側の温度差をΔt2 とすると、冷媒と水との算術平均温度差Δtm は、Δtm ＝ (Δt1 － Δt2)/2である。\nニ．二段圧縮冷凍装置では、蒸発器からの冷媒蒸気を低段圧縮機で中間圧力まで圧縮し、中間冷却器に送って過熱分を除去し、高段圧縮機で再び凝縮圧力まで圧縮する。","options":["(1) イ、ロ","(2) イ、ニ","(3) ロ、ハ","(4) ハ、ニ","(5) イ、ハ、ニ"],"answer":2,"explanation":"・固体壁表面からの熱伝達による伝熱量は、伝熱面積、固体壁表面の温度と固体壁から十分に離れた位置の流体の温度との温度差および比例係数の積で表されるが、この比例係数のことを熱伝達率という。\n・冷凍サイクルの蒸発器で、冷媒1kgが周囲から奪う熱量のことを、冷凍効果という。この冷凍効果の値は、同じ冷媒でも冷凍サイクルの運転条件によって変わる。\n・水冷却器の交換熱量の計算において、冷却管の入口側の水と冷媒との温度差をΔt1、出口側の温度差をΔt2とすると、冷媒と水との算術平均温度差Δtmは、Δtm＝(Δt1＋Δt2)/2である。\n・二段圧縮冷凍装置では、蒸発器からの冷媒蒸気を低段圧縮機で中間圧力まで圧縮し、中間冷却器に送って過熱分を除去し、高段圧縮機で再び凝縮圧力まで圧縮する。","has_image":false,"image_path":null},{"id":"R05-Hoan-Q03","year":"R05","subject":"保安管理技術","category":"冷凍能力・軸動力・成績係数","tags":[],"question":"次のイ、ロ、ハ、ニの記述のうち、圧縮機の効率、軸動力などについて正しいものはどれか。\nイ．往復圧縮機が、冷媒蒸気をシリンダに吸い込んで圧縮した後、シリンダ内から吐き出す量は、実際にはピストン押しのけ量よりも小さくなる。その理由の1つは、クリアランスボリューム内の圧縮ガスの再膨張である。\nロ．往復圧縮機の吸込み蒸気の比体積と体積効率の大きさが運転条件によって変わると、運転中の圧縮機の冷媒循環量は変化する。\nハ．実際の圧縮機の駆動軸動力は、理論断熱圧縮動力に、体積効率と機械効率の積を乗じて求めることができる。\nニ．実際の圧縮機吐出しガスの比エンタルピーは、圧縮機吸込み蒸気の圧力、温度および圧縮機吐出しガスの圧力が同じでも、理想的な断熱圧縮を行ったときより低い値となる。","options":["(1) イ、ロ","(2) イ、ハ","(3) ロ、ハ","(4) ロ、ニ","(5) ハ、ニ"],"answer":1,"explanation":"・往復圧縮機が、冷媒蒸気をシリンダに吸い込んで圧縮した後、シリンダ内から吐き出す量は、実際にはピストン押しのけ量よりも小さくなる。その理由の1つは、クリアランスボリューム内の圧縮ガスの再膨張である。\n・往復圧縮機の吸込み蒸気の比体積と体積効率の大きさが運転条件によって変わると、運転中の圧縮機の冷媒循環量は変化する。\n・実際の圧縮機の駆動軸動力は、理論断熱圧縮動力を、断熱効率と機械効率の積で除して求めることができる。\n・実際の圧縮機吐出しガスの比エンタルピーは、圧縮機吸込み蒸気の圧力、温度および圧縮機吐出しガスの圧力が同じでも、理想的な断熱圧縮を行ったときより高い値となる。","has_image":false,"image_path":null},{"id":"R05-Hoan-Q04","year":"R05","subject":"保安管理技術","category":"冷媒・ブライン","tags":[],"question":"次のイ、ロ、ハ、ニの記述のうち、冷媒について正しいものはどれか。\nイ．混合冷媒であるR 404A および R 507A は、どちらも温度勾配が 0.2～0.3 K と小さいので、疑似共沸混合冷媒とも呼ばれる。\nロ．アンモニアガスは空気より軽く、室内に漏えいした場合には、天井付近に滞留する傾向がある。\nハ．体積能力は、圧縮機の単位吸込み体積当たりの冷凍能力のことであり、その体積能力は、冷媒の種類によって異なる。往復圧縮機の場合、体積能力の大きな冷媒は、体積能力のより小さな冷媒と比べ、同じ冷凍能力に対して、より大きなピストン押しのけ量を必要とする。\nニ．冷媒は化学的に安定であることが求められる。\nフルオロカーボン冷媒の場合、冷媒の高温による熱分解を防止抑制するため、通常、圧縮機吐出しガス温度は120～130℃を超えないように制御茜運転される。","options":["(1) イ、ロ","(2) イ、ハ","(3) ロ、ニ","(4) イ、ハ、ニ","(5) ロ、ハ、ニ"],"answer":3,"explanation":"・R404Aは非共沸混合冷媒、R507Aは共沸混合冷媒である。\n・アンモニアガスは空気より軽く、室内に漏えいした場合には、天井付近に滞留する傾向がある。\n・体積能力は、圧縮機の単位吸込み体積当たりの冷凍能力のことであり、その体積能力は、冷媒の種類によって異なる。往復圧縮機の場合、体積能力の小さな冷媒は、体積能力のより大きな冷媒と比べ、同じ冷凍能力に対して、より大きなピストン押しのけ量を必要とする。\n・冷媒は化学的に安定であることが求められる。フルオロカーボン冷媒の場合、冷媒の高温による熱分解を防止・抑制するため、通常、圧縮機吐出しガス温度は120～130℃を超えないように制御・運転される。","has_image":false,"image_path":null},{"id":"R05-Hoan-Q05","year":"R05","subject":"保安管理技術","category":"圧縮機の特性等","tags":[],"question":"次のイ、ロ、ハ、ニの記述のうち、圧縮機について正しいものはどれか。\nイ．圧縮機は冷媒蒸気の圧縮の方法により、往復式と遠心式に大別される。\nロ．容量制御装置が取り付けられた多気筒の往復圧縮機は、吸込み板弁を開放して作動気筒数を減らすことにより、段階的に圧縮機の容量を調節できる。\nハ．停止中のフルオロカーボン冷媒用圧縮機クランクケース内の油温が高いと、冷凍機油に冷媒が溶け込む溶解量は大きくなり、圧縮機始動時にオイルフォーミングを起こすことがある。\nニ．冷凍能力は、圧縮機の回転速度によって変えることができる。\nインバータを利用すると、圧縮機駆動用電動機への供給電源の周波数を変えて、回転速度を調節することができる。","options":["(1) イ、ロ","(2) イ、ニ","(3) ロ、ハ","(4) ロ、ニ","(5) ハ、ニ"],"answer":4,"explanation":"・圧縮機は冷媒蒸気の圧縮の方法により、容積式と遠心式に大別される。\n・容量制御装置が取り付けられた多気筒の往復圧縮機は、吸込み板弁を開放して作動気筒数を減らすことにより、段階的に圧縮機の容量を調節できる。\n・停止中のフルオロカーボン冷媒用圧縮機クランクケース内の油温が低いと、冷凍機油に冷媒が溶け込む溶解量は大きくなり、圧縮機始動時にオイルフォーミングを起こすことがある。\n・冷凍能力は、圧縮機の回転速度によって変えることができる。インバータを利用すると、圧縮機駆動用電動機への供給電源の周波数を変えて、回転速度を調節することができる。","has_image":false,"image_path":null},{"id":"R05-Hoan-Q06","year":"R05","subject":"保安管理技術","category":"凝縮器・冷却塔","tags":[],"question":"次のイ、ロ、ハ、ニの記述のうち、凝縮器などについて正しいものはどれか。\nイ．一般に、空冷凝縮器では、水冷凝縮器より冷媒の凝縮温度が高くなる。\nロ．凝縮器への不凝縮ガスの混入は、冷媒側の熱伝達が不良となるため、凝縮圧力の低下を招く。\nハ．開放形冷却塔では、冷却水の一部が蒸発して、その蒸発潜熱により冷却水が冷却される。冷却塔では、冷却水の一部が常に蒸発しながら運転されるので、冷却水を補給する必要がある。\nニ．水冷シェルアンドチューブ凝縮器では、冷却水中の汚れや不純物が冷却管の内面に水あかとなって付着し、水あかの熱伝導率が小さいので、熱通過率の値が小さくなり、凝縮温度が低くなる。","options":["(1) イ、ハ","(2) イ、ニ","(3) ロ、ニ","(4) イ、ロ、ハ","(5) ロ、ハ、ニ"],"answer":1,"explanation":"・一般に、空冷凝縮器では、水冷凝縮器より冷媒の凝縮温度が高くなる。\n・凝縮器への不凝縮ガスの混入は、冷媒側の熱伝達が不良となるため、凝縮圧力の上昇を招く。\n・開放形冷却塔では、冷却水の一部が蒸発して、その蒸発潜熱により冷却水が冷却される。冷却塔では、冷却水の一部が常に蒸発しながら運転されるので、冷却水を補給する必要がある\n・水冷シェルアンドチューブ凝縮器では、冷却水中の汚れや不純物が冷却管の内面に水あかとなって付着し、水あかの熱伝導率が小さいので、熱通過率の値が小さくなり、凝縮温度が高くなる。","has_image":false,"image_path":null},{"id":"R05-Hoan-Q07","year":"R05","subject":"保安管理技術","category":"蒸発器・除霜等","tags":[],"question":"次のイ、ロ、ハ、ニの記述のうち、蒸発器について正しいものはどれか。\nイ．乾式蒸発器では、冷却管内を冷媒が流れるため、冷媒の圧力降下が生じる。この圧力降下が大きいと蒸発器出入口間での冷媒の蒸発温度差が小さくなり、冷却能力が増大する。\nロ．空気冷却器用蒸発器の平均熱通過率に与える空気側の熱伝達率の影響は、冷媒側の熱伝達率より相当に大きく、冷却管外表面のフィンの高性能化が極めて重要となる。\nハ．シェルアンドチューブ満液式蒸発器では、蒸発器内に入った冷凍機油は冷媒ガスと分離し、圧縮機への戻りが悪いので、油戻し装置が必要になる。\nニ．プレートフィンチューブ冷却器のフィン表面に霜が厚く付着すると、伝熱が妨げられて蒸発圧力が上昇し、圧縮機の能力が大きくなって冷却が良好になるため、装置の成績係数は増大する。","options":["(1) イ、ハ","(2) イ、ニ","(3) ロ、ハ","(4) ロ、ニ","(5) ハ、ニ"],"answer":3,"explanation":"・乾式蒸発器では、冷却管内を冷媒が流れるため、冷媒の圧力降下が生じる。この圧力降下が大きいと蒸発器出入口間での冷媒の蒸発温度差が大きくなり、冷却能力が低下する。\n・空気冷却器用蒸発器の平均熱通過率に与える空気側の熱伝達率の影響は、冷媒側の熱伝達率より相当に大きく、冷却管外表面のフィンの高性能化が極めて重要となる。\n・シェルアンドチューブ満液式蒸発器では、蒸発器内に入った冷凍機油は冷媒ガスと分離し、圧縮機への戻りが悪いので、油戻し装置が必要になる。\n・プレートフィンチューブ冷却器のフィン表面に霜が厚く付着すると、伝熱が妨げられて蒸発圧力が低下し、圧縮機の能力が低くなって冷却が不良になるため、装置の成績係数は低下する。","has_image":false,"image_path":null},{"id":"R05-Hoan-Q08","year":"R05","subject":"保安管理技術","category":"自動制御機器","tags":[],"question":"次のイ、ロ、ハ、ニの記述のうち、自動制御機器について正しいものはどれか。\nイ．自動膨張弁は、高圧の冷媒液を低圧部に絞り膨張させる機能に加えて、冷凍負荷に応じて冷媒流量を調節して冷凍装置を効率よく運転する機能の二つの役割を持っている。\nロ．定圧自動膨張弁は、蒸発圧力が設定値よりも高くなると開き、逆に低くなると閉じて、蒸発圧力をほぼ一定に保ち、蒸発器出口冷媒の過熱度を制御する。\nハ．吸入圧力調整弁は、圧縮機吸込み圧力が設定値よりも下がらないように調節し、凝縮圧力調整弁は、凝縮圧力を所定の圧力に保持する。\nニ．圧力スイッチは、圧縮機の過度の吸込み圧力低下や吐出し圧力上昇に対する保護、凝縮器の送風機の起動、停止などに使われる。","options":["(1) イ、ハ","(2) イ、ニ","(3) ロ、ハ","(4) ロ、ニ","(5) ハ、ニ"],"answer":2,"explanation":"・自動膨張弁は、高圧の冷媒液を低圧部に絞り膨張させる機能に加えて、冷凍負荷に応じて冷媒流量を調節して冷凍装置を効率よく運転する機能の二つの役割を持っている。\n・定圧自動膨張弁は、蒸発圧力が設定値よりも高くなると閉じ、逆に低くなると開いて、蒸発圧力をほぼ一定に保つ。定圧自動膨張弁では蒸発器出口冷媒の過熱度は制御できないので、一般に熱負荷変動の少ない小形冷凍装置に用いられる。\n・吸入圧力調整弁は、圧縮機吸込み圧力が設定値よりも上がらないように調節し、凝縮圧力調整弁は、凝縮圧力を所定の圧力に（下がらないように）保持する。\n・圧力スイッチは、圧縮機の過度の吸込み圧力低下や吐出し圧力上昇に対する保護、凝縮器の送風機の起動、停止などに使われる。","has_image":false,"image_path":null},{"id":"R05-Hoan-Q09","year":"R05","subject":"保安管理技術","category":"附属機器","tags":[],"question":"次のイ、ロ、ハ、ニの記述のうち、附属機器について正しいものはどれか。\nイ．凝縮器の出口側に高圧受液器を設置することにより、受液器内の蒸気空間に余裕をもたせ、運転状態の変化があっても、凝縮器で凝縮した冷媒液が凝縮器に滞留しないように、冷媒液量の変動を受液器で吸収することができる。\nロ．冷凍機油は、凝縮器や蒸発器に送られると伝熱を妨げるので、油分離器を圧縮機の吸込み蒸気配管に設け、冷凍機油を分離する。\nハ．小形のフルオロカーボン冷凍装置やヒートポンプ装置に使用される液分離器では、内部のU字管下部に設けられた小さな孔から、液圧縮にならない程度に、少量ずつ液を圧縮機に吸い込ませるものがある。\nニ．フルオロカーボン冷凍装置の冷媒系統に水分が存在すると、装置の各部に悪影響を及ぼすため、ドライヤを設ける。ドライヤの乾燥剤として、砕けにくく、水分を吸着して化学変化を起こさないシリカゲルやゼオライトなどが用いられる。","options":["(1) イ、ハ","(2) ロ、ハ","(3) ロ、ニ","(4) イ、ハ、ニ","(5) ロ、ハ、ニ"],"answer":4,"explanation":"・凝縮器の出口側に高圧受液器を設置することにより、受液器内の蒸気空間に余裕をもたせ、運転状態の変化があっても、凝縮器で凝縮した冷媒液が凝縮器に滞留しないように、冷媒液量の変動を受液器で吸収することができる。\n・冷凍機油は、凝縮器や蒸発器に送られると伝熱を妨げるので、油分離器を圧縮機の吐出し管に設け、冷凍機油を分離する。\n・小形のフルオロカーボン冷凍装置やヒートポンプ装置に使用される液分離器では、内部のU字管下部に設けられた小さな孔から、液圧縮にならない程度に、少量ずつ液を圧縮機に吸い込ませるものがある。\n・フルオロカーボン冷凍装置の冷媒系統に水分が存在すると、装置の各部に悪影響を及ぼすため、ドライヤを設ける。ドライヤの乾燥剤として、砕けにくく、水分を吸着して化学変化を起こさないシリカゲルやゼオライトなどが用いられる。","has_image":false,"image_path":null},{"id":"R05-Hoan-Q10","year":"R05","subject":"保安管理技術","category":"冷媒配管","tags":[],"question":"次のイ、ロ、ハ、ニの記述のうち、冷媒配管について正しいものはどれか。\nイ．圧縮機吸込み蒸気配管の二重立ち上がり管は、最小負荷と最大負荷の運転のとき管内蒸気速度を適切な範囲内にすることができる。\nロ．高圧液配管内の圧力が、液温に相当する飽和圧力よりも上昇すると、フラッシュガスが発生する。\nハ．配管用炭素鋼鋼管（SGP）は、毒性をもつ冷媒の配管には使用しない。\nニ．冷媒配管では、冷媒の流れ抵抗を極力小さくするように留意し、配管の曲がり部はできるだけ少なくし、曲がりの半径は大きくする。","options":["(1) イ、ロ","(2) ロ、ハ","(3) ハ、ニ","(4) イ、ロ、ニ","(5) イ、ハ、ニ"],"answer":5,"explanation":"・圧縮機吸込み蒸気配管の二重立ち上がり管は、最小負荷と最大負荷の運転のとき管内蒸気速度を適切な範囲内にすることができる。\n・高圧液配管内の圧力が、液温に相当する飽和圧力よりも低下すると、フラッシュガスが発生する。\n・配管用炭素鋼鋼管（SGP）は、毒性をもつ冷媒の配管には使用しない。\n・冷媒配管では、冷媒の流れ抵抗を極力小さくするように留意し、配管の曲がり部はできるだけ少なくし、曲がりの半径は大きくする。","has_image":false,"image_path":null},{"id":"R05-Hoan-Q11","year":"R05","subject":"保安管理技術","category":"安全装置","tags":[],"question":"次のイ、ロ、ハ、ニの記述のうち、安全装置などについて正しいものはどれか。\nイ．ガス漏えい検知警報設備は、冷媒の種類や機械換気装置の有無にかかわらず、必ず設置しなければならない。\nロ．溶栓は、圧力を感知して冷媒を放出するが、可燃性や毒性を有する冷媒を用いた冷凍装置では使用できない。\nハ．圧力容器に取り付ける安全弁の最小口径は、容器の外径と長さの和の平方根と、冷媒の種類ごとに高圧部と低圧部に分けて定められた定数の積で決まる。\nニ．液封による事故は、二段圧縮冷凍装置の過冷却された液配管や、冷媒液強制循環式冷凍装置の低圧受液器まわりの液配管で発生することが多い。","options":["(1) イ","(2) ニ","(3) イ、ロ","(4) ロ、ハ","(5) ハ、ニ"],"answer":2,"explanation":"・可燃性ガス、毒性ガス又は特定不活性ガスの製造施設には、当該製造施設から漏えいするガスが滞留するおそれのある場所に、ガス漏えい検知警報設備の設置が義務付けられている。\n・溶栓は、温度を感知して冷媒を放出するが、可燃性や毒性を有する冷媒を用いた冷凍装置では使用できない。\n・圧力容器に取り付ける安全弁の最小口径は、容器の外径と長さの積の平方根と、冷媒の種類ごとに高圧部と低圧部に分けて定められた定数の積で決まる。\n・液封による事故は、二段圧縮冷凍装置の過冷却された液配管や、冷媒液強制循環式冷凍装置の低圧受液器まわりの液配管で発生することが多い。","has_image":false,"image_path":null},{"id":"R05-Hoan-Q12","year":"R05","subject":"保安管理技術","category":"材料の強さ・圧力容器","tags":[],"question":"次のイ、ロ、ハ、ニの記述のうち、材料の強さおよび圧力容器について正しいものはどれか。\nイ．薄肉円筒胴に発生する応力は、長手方向にかかる応力と接線方向にかかる応力があるが、長手方向にかかる応力のほうが接線方向にかかる応力よりも大きい。\nロ．板厚が一定の圧力容器であれば、さら形鏡板に応力集中は起こらない。\nハ．円筒胴圧力容器の必要な板厚は、設計圧力、容器の内径、材料の許容引張応力、腐れしろ、溶接継手の効率を用いて計算する。\nニ．応力とひずみの関係が直線的で、正比例する限界を比例限度という。","options":["(1) イ、ハ","(2) イ、ニ","(3) ロ、ハ","(4) ロ、ニ","(5) ハ、ニ"],"answer":5,"explanation":"・薄肉円筒胴に発生する応力は、長手方向にかかる応力と接線方向にかかる応力があるが、接線方向にかかる応力は長手方向にかかる応力の2倍となる。\n・応力集中は、形状や板厚が急変する部分やくさび形のくびれの部分に発生しやすい。板厚が一定のさら形鏡板であっても応力集中は起こる。\n・円筒胴圧力容器の必要な板厚は、設計圧力、容器の内径、材料の許容引張応力、腐れしろ、溶接継手の効率を用いて計算する。\n・応力とひずみの関係が直線的で、正比例する限界を比例限度という。","has_image":false,"image_path":null},{"id":"R05-Hoan-Q13","year":"R05","subject":"保安管理技術","category":"据付け・試験・試運転","tags":[],"question":"次のイ、ロ、ハ、ニの記述のうち、据付けおよび試験について正しいものはどれか。\nイ．耐圧試験は、気密試験の前に冷凍装置のすべての部分について行わなければならない。\nロ．アンモニア冷凍装置の気密試験には、乾燥空気や窒素ガスを使用し、炭酸ガスを使用してはならない。\nハ．真空放置試験は、数時間から一昼夜近い十分に長い時間を必要とする。\nニ．多気筒圧縮機を支持するコンクリート基礎の質量は、圧縮機の質量と同程度にする。","options":["(1) イ、ハ","(2) イ、ニ","(3) ロ、ハ","(4) ロ、ニ","(5) ハ、ニ"],"answer":3,"explanation":"・耐圧試験は、気密試験の前に、配管以外の部分について行わなければならない。\n・アンモニア冷凍装置の気密試験には、乾燥空気や窒素ガスを使用し、炭酸ガスを使用してはならない。\n・真空放置試験は、数時間から一昼夜近い十分に長い時間を必要とする。\n・多気筒圧縮機を支持するコンクリート基礎の質量は、圧縮機、電動機またはエンジンなどの駆動機の質量の2～3倍程度にする。","has_image":false,"image_path":null},{"id":"R05-Hoan-Q14","year":"R05","subject":"保安管理技術","category":"冷凍装置の運転","tags":[],"question":"次のイ、ロ、ハ、ニの記述のうち、冷凍装置の運転について正しいものはどれか。\nイ．冷凍装置の運転開始前に行う点検確認項目の中に、圧縮機クランクケースの冷凍機油の油面の高さや清浄さの点検、凝縮器と油冷却器の冷却水出入口弁が開いていることの確認がある。\nロ．冷蔵庫に高い温度の品物が大量に入り、冷凍負荷が増加すると、庫内温度が高くなり、冷媒の蒸発温度が上昇する。また、冷凍負荷の増加に対応して凝縮圧力も上昇する。\nハ．冷凍装置を長期間休止させる場合には、ポンプダウンして低圧側の冷媒を受液器に回収し、低圧側と圧縮機内を大気圧よりも低い圧力に保持しておく。\nニ．往復圧縮機を用いた冷凍装置では、同じ運転条件において、アンモニア冷媒を用いた場合に比べ、フルオロカーボン冷媒を用いた方が、吐出しガス温度は高くなる。","options":["(1) イ、ロ","(2) イ、ニ","(3) ロ、ハ","(4) イ、ハ、ニ","(5) ロ、ハ、ニ"],"answer":1,"explanation":"・冷凍装置の運転開始前に行う点検確認項目の中に、圧縮機クランクケースの冷凍機油の油面の高さや清浄さの点検、凝縮器と油冷却器の冷却水出入口弁が開いていることの確認がある。\n・冷蔵庫に高い温度の品物が大量に入り、冷凍負荷が増加すると、庫内温度が高くなり、冷媒の蒸発温度が上昇する。また、冷凍負荷の増加に対応して凝縮圧力も上昇する。\n・冷凍装置を長期間休止させる場合には、ポンプダウンして低圧側の冷媒を受液器に回収するが、装置に漏れがあったとき装置内に空気を吸い込まないように、低圧側と圧縮機内には大気圧より高いガス圧力を残しておく。\n・往復圧縮機を用いた冷凍装置では、同じ運転条件において、アンモニア冷媒を用いた場合に比べ、フルオロカーボン冷媒を用いた方が、吐出しガス温度は低くなる。","has_image":false,"image_path":null},{"id":"R05-Hoan-Q15","year":"R05","subject":"保安管理技術","category":"冷凍装置の保守管理","tags":[],"question":"次のイ、ロ、ハ、ニの記述のうち、冷凍装置の保守管理について正しいものはどれか。\nイ．アンモニア冷凍装置の冷媒系統に水分が侵入すると、アンモニアがアンモニア水になるので、少量の水分の侵入であっても、冷凍装置内でのアンモニア冷媒の蒸発圧力の低下、冷凍機油の乳化による潤滑性能の低下などを引き起こし、運転に重大な支障をきたす。\nロ．圧縮機が過熱運転になると、冷凍機油の温度が上昇し、冷凍機油の粘度が下がるため、油膜切れを起こすおそれがある。\nハ．冷凍機油中に冷媒が溶け込むと、冷凍機油の粘度が高くなり、潤滑装置に不具合が生じる。\nニ．吸込み蒸気配管の途中の大きなUトラップに冷媒液や冷凍機油が溜まっていると、圧縮機の始動時やアンロードからフルロード運転に切り替わったときに、液戻りが生じる。","options":["(1) イ、ロ","(2) イ、ハ","(3) イ、ニ","(4) ロ、ハ","(5) ロ、ニ"],"answer":5,"explanation":"・アンモニア冷凍装置の冷媒系統に水分が侵入すると、アンモニアがアンモニア水になるので、少量の水分の侵入があっても性能に与える影響はない。ただし、多量の水分の侵入は、冷凍装置内でのアンモニア冷媒の蒸発圧力の低下、冷凍機油の乳化による潤滑性能の低下などを引き起こし、運転に重大な支障をきたす。\n・圧縮機が過熱運転になると、冷凍機油の温度が上昇し、冷凍機油の粘度が下がるため、油膜切れを起こすおそれがある。\n・冷凍機油中に冷媒が溶け込むと、冷凍機油の粘度が低くなり、潤滑装置に不具合が生じる。\n・吸込み蒸気配管の途中の大きなUトラップに冷媒液や冷凍機油が溜まっていると、圧縮機の始動時やアンロードからフルロード運転に切り替わったときに、液戻りが生じる。","has_image":false,"image_path":null},{"id":"R04-Hoan-Q01","year":"R04","subject":"保安管理技術","category":"冷凍の原理・冷凍サイクル","tags":[],"question":"次のイ、ロ、ハ、ニの記述のうち、冷凍サイクルおよび冷凍の原理について正しいものはどれか。\nイ．圧縮機の吸込み蒸気の比体積を直接測定することは困難である。そのため、圧縮機吸込み蒸気の比体積は、吸込み蒸気の圧力と温度を測って、それらの値から冷媒のp-h線図や熱力学性質表により求められる。比体積の単位は（m^3/kg）であり、比体積が大きくなると冷媒蒸気の密度は小さくなる。\nロ．圧縮機の圧力比が大きいほど、圧縮前後の比エンタルピー差は大きくなる。その結果、単位冷媒循環量当たりの理論断熱圧縮動力も大きくなる。\nハ．膨張弁は、過冷却となった冷媒液を絞り膨張させることで、蒸発圧力まで冷媒の圧力を下げる。このとき、冷媒は周囲との間で、熱と仕事の授受を行うことで冷媒自身の温度が下がる。\nニ．理論ヒートポンプサイクルの成績係数は、理論冷凍サイクルの成績係数よりも1だけ大きな成績係数の値となる。","options":["(1) イ、ニ","(2) ロ、ハ","(3) ハ、ニ","(4) イ、ロ、ハ","(5) イ、ロ、ニ"],"answer":5,"explanation":"・圧縮機の吸込み蒸気の比体積を直接測定することは困難である。そのため、圧縮機吸込み蒸気の比体積は、吸込み蒸気の圧力と温度を測って、それらの値から冷媒のp-h線図や熱力学性質表により求められる。比体積の単位は（m3/kg）であり、比体積が大きくなると冷媒蒸気の密度は小さくなる。\n・圧縮機の圧力比が大きいほど、圧縮前後の比エンタルピー差は大きくなる。その結果、単位冷媒循環量当たりの理論断熱圧縮動力も大きくなる。\n・膨張弁は、過冷却となった冷媒液を絞り膨張させることで、蒸発圧力まで冷媒の圧力を下げる。このとき、冷媒液の一部が蒸発することにより、膨張後の蒸発圧力に対応した蒸発温度まで冷媒自身の温度が下がる。\n・理論ヒートポンプサイクルの成績係数は、理論冷凍サイクルの成績係数よりも1だけ大きな成績係数の値となる。","has_image":false,"image_path":null},{"id":"R04-Hoan-Q02","year":"R04","subject":"保安管理技術","category":"冷凍サイクル・熱の移動","tags":[],"question":"次のイ、ロ、ハ、ニの記述のうち、冷凍サイクルおよび熱の移動について正しいものはどれか。\nイ．冷凍装置に使用される蒸発器や凝縮器の交換熱量の計算では、入口側温度差と出口側温度差にあまり大きな差がない場合には、対数平均温度差の近似値として、算術平均温度差が使われている。\nロ．二段圧縮冷凍装置では、蒸発器からの冷媒蒸気を低段圧縮機で中間圧力まで圧縮し、中間冷却器に送って過熱分を除去し、高段圧縮機で凝縮圧力まで再び圧縮するようにしている。圧縮の途中で冷媒ガスを一度冷却しているので、高段圧縮機の吐出しガス温度が単段で圧縮した場合よりも低くなる。\nハ．冷凍サイクルの成績係数は運転条件によって変化するが、蒸発圧力だけが低くなった場合、あるいは凝縮圧力だけが高くなった場合には、成績係数の値は大きくなる。\nニ．固体壁表面からの熱移動による伝熱量は、伝熱面積、固体壁表面の温度と周囲温度との温度差および比例係数の積で表されるが、この比例係数のことを熱伝導率という。","options":["(1) イ、ロ","(2) イ、ハ","(3) ロ、ニ","(4) イ、ハ、ニ","(5) ロ、ハ、ニ"],"answer":1,"explanation":"・冷凍装置に使用される蒸発器や凝縮器の交換熱量の計算では、入口側温度差と出口側温度差にあまり大きな差がない場合には、対数平均温度差の近似値として、算術平均温度差が使われている。\n・二段圧縮冷凍装置では、蒸発器からの冷媒蒸気を低段圧縮機で中間圧力まで圧縮し、中間冷却器に送って過熱分を除去し、高段圧縮機で凝縮圧力まで再び圧縮するようにしている。圧縮の途中で冷媒ガスを一度冷却しているので、高段圧縮機の吐出しガス温度が単段で圧縮した場合よりも低くなる。\n・冷凍サイクルの成績係数は運転条件によって変化するが、蒸発圧力だけが低くなった場合、あるいは凝縮圧力だけが高くなった場合には、成績係数の値は小さくなる。\n・固体壁表面からの熱移動による伝熱量は、伝熱面積、固体壁表面の温度と周囲温度との温度差および比例係数の積で表されるが、この比例係数のことを熱伝達率という。","has_image":false,"image_path":null},{"id":"R04-Hoan-Q03","year":"R04","subject":"保安管理技術","category":"冷凍能力・軸動力・成績係数","tags":[],"question":"次のイ、ロ、ハ、ニの記述のうち、冷凍装置の冷凍能力、軸動力および冷媒循環量について正しいものはどれか。\nイ．冷凍装置の冷凍能力は、蒸発器出入口における冷媒の比エンタルピー差に冷媒循環量を乗じて求められる。\nロ．実際の圧縮機の駆動に必要な軸動力は、理論断熱圧縮動力と機械的摩擦損失動力の和で表される。\nハ．冷媒循環量は、ピストン押しのけ量、圧縮機の吸込み蒸気の比体積および体積効率との積である。\nニ．理論断熱圧縮動力が同じ場合、圧縮機の全断熱効率が大きくなると、実際の圧縮機の駆動軸動力は小さくなる。","options":["(1) イ、ロ","(2) イ、ニ","(3) ロ、ハ","(4) イ、ハ、ニ","(5) ロ、ハ、ニ"],"answer":2,"explanation":"・冷凍装置の冷凍能力は、蒸発器出入口における冷媒の比エンタルピー差に冷媒循環量を乗じて求められる。\n・実際の圧縮機の駆動に必要な軸動力は、蒸気の圧縮に必要な圧縮動力と機\n械的摩擦損失動力の和で表すことができる。\n・冷媒循環量は、ピストン押しのけ量と体積効率との積を、圧縮機の吸込み蒸気の比体積で除して求められる。\n冷媒循環量＝ピストン押しのけ量×体積効率÷圧縮機の吸込み蒸気の比体積\n・理論断熱圧縮動力が同じ場合、圧縮機の全断熱効率が大きくなると、実際の圧縮機の駆動軸動力は小さくなる。","has_image":false,"image_path":null},{"id":"R04-Hoan-Q04","year":"R04","subject":"保安管理技術","category":"冷媒・ブライン","tags":[],"question":"次のイ、ロ、ハ、ニの記述のうち、冷媒およびブラインの性質などについて正しいものはどれか。\nイ．フルオロカーボン冷媒の中でも、塩素を含むCFC冷媒、HCFC冷媒は、オゾン破壊係数が0より大きい。また、オゾン破壊係数が0であるHFC冷媒は、地球温暖化をもたらす温室効果ガスである。\nロ．冷媒の熱力学性質を表にした飽和表から、飽和液および飽和蒸気の比体積、比エンタルピー、比エントロピーなどを読み取ることができ、飽和蒸気の比エントロピーと飽和液の比エントロピーの差が蒸発潜熱となる。\nハ．無機ブラインは、できるだけ空気と接触しないように扱う。それは、酸素が溶け込むと腐食性が促進され、また水分が凝縮して取り込まれると濃度が低下するためである。\nニ．一般に、冷凍機油はアンモニア液よりも軽く、アンモニアガスは室内空気よりも軽い。また、アンモニアは、銅および銅合金に対して腐食性があるが、鋼に対しては腐食性がないので、アンモニア冷凍装置には鋼管や鋼板が使用される。","options":["(1) イ、ハ","(2) イ、ニ","(3) ロ、ハ","(4) ロ、ニ","(5) ハ、ニ"],"answer":1,"explanation":"・フルオロカーボン冷媒の中でも、塩素を含むCFC冷媒、HCFC冷媒は、オゾン破壊係数が0より大きい。また、オゾン破壊係数が0であるHFC冷媒は、地球温暖化をもたらす温室効果ガスである。\n・冷媒の熱力学性質を表にした飽和表から、飽和液および飽和蒸気の比体積、比エンタルピー、比エントロピーなどを読み取ることができ、飽和蒸気の比エンタルピーと飽和液の比エンタルピーの差が蒸発潜熱となる。\n・無機ブラインは、できるだけ空気と接触しないように扱う。それは、酸素が溶け込むと腐食性が促進され、また水分が凝縮して取り込まれると濃度が低下するためである。\n・一般に、冷凍機油はアンモニア液よりも重く、アンモニアガスは室内空気よりも軽い。またアンモニアは銅および銅合金に対して腐食性があるが、鋼に対しては腐食性がないので、アンモニア冷凍装置には鋼管や鋼板が使用される。","has_image":false,"image_path":null},{"id":"R04-Hoan-Q05","year":"R04","subject":"保安管理技術","category":"圧縮機の特性等","tags":[],"question":"次のイ、ロ、ハ、ニの記述のうち、圧縮機について正しいものはどれか。\nイ．圧縮機は、冷媒蒸気の圧縮の方式により容積式と遠心式に大別される。容積式のスクリュー圧縮機は、遠心式に比べて高圧力比での使用に適している。\nロ．多気筒の往復圧縮機では、吸込み弁を閉じて作動気筒数を減らすことにより、容量を段階的に変えることができる。\nハ．強制給油式の往復圧縮機は、クランク軸端に油ポンプを設け、圧縮機各部のしゅう動部に給油する。この際の給油圧力は、油圧計指示圧力とクランクケース圧力の和となる。\nニ．圧縮機の停止中に、冷媒が油に多量に溶け込んだ状態で圧縮機を始動すると、オイルフォーミングが発生することがある。","options":["(1) イ、ハ","(2) イ、ニ","(3) ロ、ハ","(4) ロ、ニ","(5) ハ、ニ"],"answer":2,"explanation":"・圧縮機は、冷媒蒸気の圧縮の方式により容積式と遠心式に大別される。容積式のスクリュー圧縮機は、遠心式に比べて高圧力比での使用に適している。\n・多気筒の往復圧縮機では、吸込み弁を開いて作動気筒数を減らすことにより、容量を段階的に変えることができる。\n・強制給油式の往復圧縮機は、クランク軸端に油ポンプを設け、圧縮機各部のしゅう動部に給油する。この際の給油圧力は、油圧計指示圧力とクランクケース圧力の差となる。\n・圧縮機の停止中に、冷媒が油に多量に溶け込んだ状態で圧縮機を始動すると、オイルフォーミングが発生することがある。","has_image":false,"image_path":null},{"id":"R04-Hoan-Q06","year":"R04","subject":"保安管理技術","category":"凝縮器・冷却塔","tags":[],"question":"次のイ、ロ、ハ、ニの記述のうち、凝縮器について正しいものはどれか。\nイ．凝縮器において、冷媒から熱を取り出して凝縮させるとき、取り出さなければならない熱量を凝縮負荷という。理論凝縮負荷は、冷凍能力に理論断熱圧縮動力を加えて求めることができる。\nロ．シェルアンドチューブ凝縮器の冷却管として、フルオロカーボン冷媒の場合には、冷却水側にフィンが設けられている銅製のローフィンチューブを使うことが多い。\nハ．シェルアンドチューブ凝縮器では、冷却水中の汚れや不純物が冷却管表面に水あかとなって付着する。水あかは、熱伝導率が小さいので、水冷凝縮器の熱通過率の値が小さくなり、凝縮温度が低くなる。\nニ．冷却塔の運転性能は、水温、水量、風量および湿球温度によって定まる。冷却塔の出口水温と周囲空気の湿球温度との温度差をアプローチと呼び、その値は通常 5K 程度である。","options":["(1) イ、ロ","(2) イ、ニ","(3) ロ、ハ","(4) ハ、ニ","(5) イ、ロ、ニ"],"answer":2,"explanation":"・凝縮器において、冷媒から熱を取り出して凝縮させるとき、取り出さなければならない熱量を凝縮負荷という。理論凝縮負荷は、冷凍能力に理論断熱圧縮動力を加えて求めることができる。\n・シェルアンドチューブ凝縮器の冷却管として、フルオロカーボン冷媒の場合には、冷媒側にフィンが設けられている銅製のローフィンチューブを使うことが多い。\n・シェルアンドチューブ凝縮器では、冷却水中の汚れや不純物が冷却管表面に水あかとなって付着する。水あかは、熱伝導率が小さいので、水冷凝縮器の熱通過率の値が小さくなり、凝縮温度が高くなる。\n・冷却塔の運転性能は、水温、水量、風量および湿球温度によって定まる。冷却塔の出口水温と周囲空気の湿球温度との温度差をアプローチと呼び、その値は通常5K程度である。","has_image":false,"image_path":null},{"id":"R04-Hoan-Q07","year":"R04","subject":"保安管理技術","category":"蒸発器・除霜等","tags":[],"question":"次のイ、ロ、ハ、ニの記述のうち、蒸発器について正しいものはどれか。\nイ．冷蔵用の空気冷却器では、庫内温度と蒸発温度との平均温度差は通常5～10K 程度にする。この値が大き過ぎると、蒸発温度を高くする必要があり、装置の成績係数が低下する。\nロ．プレートフィンチューブ冷却器のフィン表面に霜が厚く付着すると、空気の通路を狭め、風量が減少する。また同時に、霜の熱伝導率が小さいため伝熱が妨げられ、蒸発圧力が低下し、圧縮機の能力が低くなる。\nハ．ホットガス除霜方式は、圧縮機から吐き出される高温の冷媒ガスを蒸発器に送り込み、霜が厚くならないうちに、冷媒ガスの顕熱だけを用いて、早めに霜を融解させる除霜方法である。\nニ．大きな容量の乾式蒸発器では、多数の冷却管に均等に冷媒を分配させるためにディストリビュータ（分配器）を取り付けるが、ディストリビュータでの圧力降下分だけ膨張弁前後の圧力差が小さくなるために、膨張弁の容量は小さくなる。","options":["(1) イ、ロ","(2) イ、ハ","(3) イ、ニ","(4) ロ、ハ","(5) ロ、ニ"],"answer":5,"explanation":"・冷蔵用の空気冷却器では、庫内温度と蒸発温度との平均温度差は通常5～10K程度にする。この値が大き過ぎると、蒸発温度を低くする必要があり、装置の成績係数が低下する。\n・プレートフィンチューブ冷却器のフィン表面に霜が厚く付着すると、空気の通路を狭め、風量が減少する。また同時に、霜の熱伝導率が小さいため伝熱が妨げられ、蒸発圧力が低下し、圧縮機の能力が低くなる。\n・ホットガス除霜方式は、圧縮機から吐き出される高温の冷媒ガスを蒸発器に送り込み、霜が厚くならないうちに、冷媒ガスの顕熱と凝縮潜熱を用いて、早めに霜を融解させる除霜方法である。\n・大きな容量の乾式蒸発器では、多数の冷却管に均等に冷媒を分配させるためにディストリビュータ（分配器）を取り付けるが、ディストリビュータでの圧力降下分だけ膨張弁前後の圧力差が小さくなるために、膨張弁の容量は小さくなる。","has_image":false,"image_path":null},{"id":"R04-Hoan-Q08","year":"R04","subject":"保安管理技術","category":"自動制御機器","tags":[],"question":"次のイ、ロ、ハ、ニの記述のうち、自動制御機器について正しいものはどれか。\nイ．感温筒は、蒸発器出口冷媒の温度を出口管壁を介して検知して、過熱度を制御するので、感温筒の取付けは重要である。温度自動膨張弁の感温筒の取付け場所は、冷却コイルのヘッダが適切である。\nロ．蒸発圧力調整弁は、蒸発器出口の冷媒配管に取り付けて、蒸発圧力が所定の蒸発圧力よりも低くなることを防止する。\nハ．断水リレーは、水冷凝縮器や水冷却器で、断水または循環水量が減少したときに、冷却水ポンプを停止させることによって装置を保護する安全装置である。\nニ．キャピラリチューブは、細い銅管を流れる冷媒の流動抵抗による圧力降下を利用して、冷媒の絞り膨張を行う。","options":["(1) イ、ハ","(2) イ、ニ","(3) ロ、ニ","(4) イ、ロ、ハ","(5) ロ、ハ、ニ"],"answer":3,"explanation":"・感温筒は、蒸発器出口冷媒の温度を出口管壁を介して検知して、過熱度を制御するので、感温筒の取付けは重要である。感温筒を冷却コイル出口ヘッダや吸込み管の液のたまりやすい所に取り付けると、正しい温度を検出できない。\n・蒸発圧力調整弁は、蒸発器出口の冷媒配管に取り付けて、蒸発圧力が所定の蒸発圧力よりも低くなることを防止する。\n・断水リレーは、水冷凝縮器や水冷却器で、断水または循環水量が減少したときに、圧縮機を停止させたり、警報を出したりして装置を保護する安全装置である。\n・キャピラリチューブは、細い銅管を流れる冷媒の流動抵抗による圧力降下を利用して、冷媒の絞り膨張を行う。","has_image":false,"image_path":null},{"id":"R04-Hoan-Q09","year":"R04","subject":"保安管理技術","category":"附属機器","tags":[],"question":"次のイ、ロ、ハ、ニの記述のうち、附属機器について正しいものはどれか。\nイ．一般に、フィルタドライヤは液管に取り付け、フルオロカーボン冷凍装置、アンモニア冷凍装置の冷媒系統の水分を除去する。\nロ．冷媒をチャージするときの過充填量は、サイトグラスで測定することができる。\nハ．冷凍装置に用いる受液器には、大別して、凝縮器の出口側に連結する高圧受液器と、冷却管内蒸発式の満液式蒸発器に連結して用いる低圧受液器とがある。\nニ．液ガス熱交換器は、冷媒液を過冷却させるとともに、圧縮機に戻る冷媒蒸気を適度に過熱させ、湿り状態の冷媒蒸気が圧縮機に吸い込まれることを防止する。","options":["(1) イ、ロ","(2) イ、ハ","(3) ロ、ハ","(4) ロ、ニ","(5) ハ、ニ"],"answer":5,"explanation":"・一般に、フィルタドライヤは液管に取り付け、フルオロカーボン冷凍装置の冷媒系統の水分を除去するが、アンモニア冷凍装置では用いられない。\n・サイトグラスは、冷媒液配管のフィルタドライヤの下流に設置され、冷媒充填量の不足やフィルタドライヤの交換時期などの判断に用いられる。\n・冷凍装置に用いる受液器には、大別して、凝縮器の出口側に連結する高圧受液器と、冷却管内蒸発式の満液式蒸発器に連結して用いる低圧受液器とがある。\n・液ガス熱交換器は、冷媒液を過冷却させるとともに、圧縮機に戻る冷媒蒸気を適度に過熱させ、湿り状態の冷媒蒸気が圧縮機に吸い込まれることを防止する。","has_image":false,"image_path":null},{"id":"R04-Hoan-Q10","year":"R04","subject":"保安管理技術","category":"冷媒配管","tags":[],"question":"次のイ、ロ、ハ、ニの記述のうち、冷媒配管について正しいものはどれか。\nイ．冷媒配管では、冷媒の流れ抵抗を極力小さくするように留意し、配管の曲がり部はできるだけ少なくし、曲がりの半径は大きくする。\nロ．冷媒液配管内にフラッシュガスが発生すると、このガスの影響で液のみで流れるよりも配管内の流れの抵抗が小さくなる。\nハ．容量制御装置をもった圧縮機の吸込み蒸気配管では、アンロード運転での立ち上がり管における冷媒液の戻りが問題になる。一般に、圧縮機吸込み管の二重立ち上がり管は、冷媒液の戻り防止のために使用される。\nニ．フルオロカーボン冷凍装置に使用する小口径の銅配管の接続には、一般に、フレア管継手か、ろう付継手を用いる。","options":["(1) イ、ロ","(2) イ、ハ","(3) イ、ニ","(4) ロ、ハ","(5) ロ、ニ"],"answer":3,"explanation":"・冷媒配管では、冷媒の流れ抵抗を極力小さくするように留意し、配管の曲がり部はできるだけ少なくし、曲がりの半径は大きくする。\n・冷媒液配管内にフラッシュガスが発生すると、このガスの影響で液のみで流れるよりも配管内の流れの抵抗が大きくなる。\n・一般に、圧縮機吸込み管の二重立ち上がり管は、油戻しのために使用される。\n・フルオロカーボン冷凍装置に使用する小口径の銅配管の接続には、一般に、フレア管継手か、ろう付継手を用いる。","has_image":false,"image_path":null},{"id":"R04-Hoan-Q11","year":"R04","subject":"保安管理技術","category":"安全装置","tags":[],"question":"次のイ、ロ、ハ、ニの記述のうち、安全装置などについて正しいものはどれか。\nイ．圧縮機に取り付けるべき安全弁の最小口径は、ピストン押しのけ量の立方根と冷媒の種類により定められた定数との積で求められる。\nロ．安全弁の各部のガス通路面積は、安全弁の口径面積より小さくしてはならない。また、作動圧力を設定した後、設定圧力が変更できないように封印できる構造であることが必要である。\nハ．高圧遮断装置は、異常な高圧圧力を検知して作動し、圧縮機を駆動している電動機の電源を切って圧縮機を停止させ、運転中の異常な圧力の上昇を防止する。\nニ．液封による配管や弁の破壊、破裂などの事故は、低圧液配管において発生することが多い。液封は弁操作ミスなどが原因になることが多いので、厳重に注意する必要がある。","options":["(1) イ、ロ、ハ","(2) イ、ロ、ニ","(3) イ、ハ、ニ","(4) ロ、ハ、ニ","(5) イ、ロ、ハ、ニ"],"answer":4,"explanation":"・圧縮機に取り付けるべき安全弁の最小口径は、ピストン押しのけ量の平方根と冷媒の種類により定められた定数との積で求められる。\n・安全弁の各部のガス通路面積は、安全弁の口径面積より小さくしてはならない。また、作動圧力を設定した後、設定圧力が変更できないように封印できる構造であることが必要である。\n・高圧遮断装置は、異常な高圧圧力を検知して作動し、圧縮機を駆動している電動機の電源を切って圧縮機を停止させ、運転中の異常な圧力の上昇を防止する。\n・液封による配管や弁の破壊、破裂などの事故は、低圧液配管において発生することが多い。液封は弁操作ミスなどが原因になることが多いので、厳重に注意する必要がある。","has_image":false,"image_path":null},{"id":"R04-Hoan-Q12","year":"R04","subject":"保安管理技術","category":"材料の強さ・圧力容器","tags":[],"question":"次のイ、ロ、ハ、ニの記述のうち、材料の強さおよび圧力容器について正しいものはどれか。\nイ．引張荷重を作用させた後、荷重を静かに除去したときに、ひずみがもとに戻る限界を弾性限度という。\nロ．一般的な冷凍装置の低圧部設計圧力は、冷凍装置の停止中に、内部の冷媒が43℃まで上昇したときの冷媒の飽和圧力とする。\nハ．円筒胴圧力容器に発生する応力としては、円筒胴の接線方向に作用する応力と、円筒胴の長手方向に作用する応力があるが、必要な板厚を求めるときには、接線方向の応力を考えればよい。\nニ．圧力容器の腐れしろは、材料の種類により異なり、銅および銅合金は0.2 mm とする。また、ステンレス鋼は0.1 mm とする。","options":["(1) イ、ロ","(2) イ、ハ","(3) ロ、ハ","(4) ロ、ニ","(5) ハ、ニ"],"answer":2,"explanation":"・引張荷重を作用させた後、荷重を静かに除去したときに、ひずみがもとに戻る限界を弾性限度という。\n・一般的な冷凍装置の低圧部設計圧力は、冷凍装置の停止中に周囲温度の高い夏季に、内部の冷媒が38℃から40℃程度まで上昇したときの冷媒の飽和圧力に基づいている。\n・円筒胴圧力容器に発生する応力としては、円筒胴の接線方向に作用する応力と、円筒胴の長手方向に作用する応力があるが、必要な板厚を求めるときには、接線方向の応力を考えればよい。\n・圧力容器の腐れしろは、材料の種類により異なり、銅および銅合金、ステンレス鋼のいずれも0.2mmとする。","has_image":false,"image_path":null},{"id":"R04-Hoan-Q13","year":"R04","subject":"保安管理技術","category":"据付け・試験・試運転","tags":[],"question":"次のイ、ロ、ハ、ニの記述のうち、冷凍装置の圧力試験について正しいものはどれか。\nイ．耐圧試験は、一般に液体を使用して行う試験であるが、使用が困難な場合は、空気や窒素などの気体を使用することができる。\nロ．気密試験は、漏れを確認しやすいように、ガス圧で試験を行う。一般に、乾燥した空気、窒素ガスなどを使用する。\nハ．真空試験は、冷凍装置の最終確認として微量の漏れやわずかな水分の侵入箇所の特定のために行う試験である。\nニ．真空放置試験は、数時間から一昼夜近い十分に長い時間が必要で、必要に応じて、水分の残留しやすい場所を中心に加熱するとよい。","options":["(1) イ、ロ","(2) ロ、ハ","(3) ハ、ニ","(4) イ、ロ、ニ","(5) イ、ハ、ニ"],"answer":4,"explanation":"・耐圧試験は、一般に液体を使用して行う試験であるが、使用が困難な場合は、空気や窒素などの気体を使用することができる。\n・気密試験は、漏れを確認しやすいように、ガス圧で試験を行う。一般に、乾燥した空気、窒素ガスなどを使用する。\n・真空試験では、微量の漏れは発見できるが、わずかな水分の侵入箇所は特定できない。\n・真空放置試験は、数時間から一昼夜近い十分に長い時間が必要で、必要に応じて、水分の残留しやすい場所を中心に加熱するとよい。","has_image":false,"image_path":null},{"id":"R04-Hoan-Q14","year":"R04","subject":"保安管理技術","category":"冷凍装置の運転","tags":[],"question":"次のイ、ロ、ハ、ニの記述のうち、冷凍装置の運転について正しいものはどれか。\nイ．冷凍装置の毎日の運転開始前には、受液器の液面計や高圧圧力計により、冷媒が適正に充填されていることを確認する。\nロ．凝縮温度の標準的な値は、シェルアンドチューブ凝縮器では冷却水出口温度よりも3～5K高く、空冷凝縮器では外気乾球温度よりも8～10K高い。\nハ．冷凍機の運転を停めるときには、液封を生じさせないように、圧縮機吸込み側止め弁を閉じてしばらく運転してから圧縮機を停止する。\nニ．圧縮機の吸込み蒸気の圧力は、蒸発器や吸込み配管内の抵抗により、蒸発器内の冷媒の蒸発圧力よりもいくらか低い圧力になる。","options":["(1) イ、ロ","(2) イ、ニ","(3) ロ、ハ","(4) ハ、ニ","(5) イ、ロ、ニ"],"answer":2,"explanation":"・冷凍装置の毎日の運転開始前には、受液器の液面計や高圧圧力計により、冷媒が適正に充填されていることを確認する。\n・凝縮温度の標準的な値は、シェルアンドチューブ凝縮器では冷却水出口温度よりも3～5K高く、空冷凝縮器では外気乾球温度よりも12～20K高い\n・冷凍機の運転を停めるときには、液封が生じないように、受液器液出口弁を閉じてしばらく運転してから圧縮機を停止し、その直後に圧縮機吸込み側止め弁を閉じる。\n・圧縮機の吸込み蒸気の圧力は、蒸発器や吸込み配管内の抵抗により、蒸発器内の冷媒の蒸発圧力よりもいくらか低い圧力になる。","has_image":false,"image_path":null},{"id":"R04-Hoan-Q15","year":"R04","subject":"保安管理技術","category":"冷凍装置の保守管理","tags":[],"question":"次のイ、ロ、ハ、ニの記述のうち、冷凍装置の保守管理について正しいものはどれか。\nイ．冷媒が過充填されると、凝縮器内の凝縮のために有効に働く伝熱面積が減少するため、凝縮圧力が低下する。\nロ．密閉フルオロカーボン往復圧縮機では、冷凍装置全体として冷媒充填量が不足すると、吸込み冷媒蒸気による電動機の冷却が不十分となり、電動機の巻線を焼損するおそれがある。\nハ．高圧液配管のような液で常に満たされている管が、運転停止中にその管の両端の弁が閉じられると、液封となる。液封が発生しやすい場所は、運転中の温度が低い冷媒液の配管に多い。\nニ．同じ運転条件でも、アンモニア圧縮機の吐出しガス温度は、フルオロカーボン圧縮機の場合よりも低くなる。","options":["(1) ロ","(2) ハ","(3) イ、ロ","(4) ロ、ハ","(5) ハ、ニ"],"answer":4,"explanation":"・冷媒が過充填されると、凝縮器内の凝縮のために有効に働く伝熱面積が減少するため、凝縮圧力が上昇する。\n・密閉フルオロカーボン往復圧縮機では、冷凍装置全体として冷媒充填量が不足すると、吸込み冷媒蒸気による電動機の冷却が不十分となり、電動機の巻線を焼損するおそれがある。\n・高圧液配管のような液で常に満たされている管が、運転停止中にその管の両端の弁が閉じられると、液封となる。液封が発生しやすい場所は、運転中の温度が低い冷媒液の配管に多い。\n・同じ運転条件でも、アンモニア圧縮機の吐出しガス温度は、フルオロカーボン圧縮機の場合よりも高くなる。","has_image":false,"image_path":null},{"id":"R03-Hoan-Q01","year":"R03","subject":"保安管理技術","category":"冷凍の原理・冷凍サイクル","tags":[],"question":"次のイ、ロ、ハ、ニの記述のうち、冷凍の原理などについて正しいものはどれか。\nイ．ブルドン管圧力計で指示される圧力は、管内圧力である大気圧と管外圧力である冷媒圧力の差であり、この圧力をゲージ圧力と呼ぶ。\nロ．液体1kgを等圧のもとで蒸発させるのに必要な熱量を、蒸発潜熱という。\nハ．冷凍装置の冷凍能力に圧縮機の駆動軸動力を加えたものが、凝縮器の凝縮負荷である。\nニ．必要な冷凍能力を得るための圧縮機の駆動軸動力が小さいほど、冷凍装置の性能が良い。この圧縮機の駆動軸動力あたりの冷凍能力の値が、圧縮機の効率である。","options":["(1) イ、ロ","(2) ロ、ハ","(3) ハ、ニ","(4) イ、ロ、ニ","(5) イ、ハ、ニ"],"answer":2,"explanation":"・ブルドン管圧力計で指示される圧力は、管内圧力である冷媒圧と管外圧力である大気圧の差であり、この圧力をゲージ圧力と呼ぶ。\n・液体1kgを等圧のもとで蒸発させるのに必要な熱量を、蒸発潜熱という。\n・冷凍装置の冷凍能力に圧縮機の駆動軸動力を加えたものが、凝縮器の凝縮負荷である。\n・必要な冷凍能力を得るための圧縮機の駆動軸動力が小さいほど、冷凍装置の性能が良いことになるが、圧縮機の駆動軸動力あたりの冷凍能力の値は、成績係数である。","has_image":false,"image_path":null},{"id":"R03-Hoan-Q02","year":"R03","subject":"保安管理技術","category":"冷凍サイクル・熱の移動","tags":[],"question":"次のイ、ロ、ハ、ニの記述のうち、熱の移動について正しいものはどれか。\nイ．冷凍装置に使用される蒸発器や凝縮器の伝熱量は、対数平均温度差を使用すると正確に求められるが、条件によっては、算術平均温度差でも数％の差で求めることができる。\nロ．固体壁を隔てた流体間の伝熱量は、伝熱面積、固体壁で隔てられた両側の流体間の温度差と熱通過率を乗じたものである。\nハ．固体壁と流体との熱交換による伝熱量は、固体壁表面と流体との温度差、伝熱面積および比例係数の積で表され、この比例係数を熱伝導率という。\nニ．熱の移動には、熱放射、対流熱伝達、熱伝導の三つの形態が存在し、冷凍・空調装置で取り扱う熱移動現象は、主に熱放射と熱伝導である。","options":["(1) イ、ロ","(2) イ、ニ","(3) ロ、ハ","(4) ロ、ニ","(5) ハ、ニ"],"answer":1,"explanation":"・冷凍装置に使用される蒸発器や凝縮器の伝熱量は、対数平均温度差を使用すると正確に求められるが、条件によっては、算術平均温度差でも数%の差で求めることができる。\n・固体壁を隔てた流体間の伝熱量は、伝熱面積、固体壁で隔てられた両側の流体間の温度差と熱通過率を乗じたものである。\n・固体壁と流体との熱交換による伝熱量は、固体壁表面と流体との温度差、伝熱面積および比例係数の積で表され、この比例係数を熱伝達率という。\n・熱の移動には、熱伝導、熱伝達、熱放射（熱ふく射）の三つの形態が存在し、冷凍・空調装置で取り扱う熱移動現象は、主に熱伝導と熱伝達である。","has_image":false,"image_path":null},{"id":"R03-Hoan-Q03","year":"R03","subject":"保安管理技術","category":"冷凍能力・軸動力・成績係数","tags":[],"question":"次のイ、ロ、ハ、ニの記述のうち、冷凍装置の冷凍能力、軸動力、成績係数などについて正しいものはどれか。\nイ．圧縮機の実際の駆動に必要な軸動力は、理論断熱圧縮動力と機械的摩擦損失動力の和で表される。\nロ．圧縮機の全断熱効率が低下するほど、実際の圧縮機吐出しガスの比エンタルピーは大きくなる。\nハ．実際の冷凍装置の成績係数は、理論冷凍サイクルの成績係数に圧縮機の断熱効率と体積効率を乗じて求められる。\nニ．機械的摩擦損失仕事が熱となって冷媒に加わる場合、実際のヒートポンプ装置の成績係数の値は、同一運転温度条件における実際の冷凍装置の成績係数の値よりも常に1の数値だけ大きい。","options":["(1) イ、ハ","(2) イ、ニ","(3) ロ、ニ","(4) イ、ロ、ハ","(5) ロ、ハ、ニ"],"answer":3,"explanation":"・圧縮機の実際の駆動に必要な軸動力は、蒸気の圧縮に必要な圧縮動力と機械的摩擦損失動力の和で表すことができる。\n・圧縮機の全断熱効率が低下するほど、実際の圧縮機吐出しガスの比エンタルピーは大きくなる。\n・実際の冷凍装置の成績係数は、理論冷凍サイクルの成績係数に圧縮機の断熱効率と機械効率を乗じて求められる。\n・機械的摩擦損失仕事が熱となって冷媒に加わる場合、実際のヒートポンプ装置の成績係数の値は、同一運転温度条件における実際の冷凍装置の成績係数の値よりも常に1の数値だけ大きい。","has_image":false,"image_path":null},{"id":"R03-Hoan-Q04","year":"R03","subject":"保安管理技術","category":"冷媒・ブライン","tags":[],"question":"次のイ、ロ、ハ、ニの記述のうち、冷媒およびブラインについて正しいものはどれか。\nイ．R290、R717、R744は、自然冷媒と呼ばれることがある。\nロ．臨界点は、気体と液体の区別がなくなる状態点である。この臨界点は飽和圧力曲線の終点として表される。臨界点における温度および圧力を臨界温度および臨界圧力という。\nハ．塩化カルシウムブラインの凍結温度は、濃度が0mass％から共晶点の濃度までは塩化カルシウム濃度の増加に伴って低下し、最低の凍結温度は－40℃である。\nニ．二酸化炭素は、アンモニア冷凍機などと組み合わせた冷凍・冷却装置の二次冷媒（ブライン）としても使われている。","options":["(1) イ、ハ","(2) イ、ニ","(3) ロ、ハ","(4) イ、ロ、ニ","(5) ロ、ハ、ニ"],"answer":4,"explanation":"・R290、R717、R744は、自然冷媒と呼ばれることがある。\n・臨界点は、気体と液体の区別がなくなる状態点である。この臨界点は飽和圧力曲線の終点として表される。臨界点における温度および圧力を臨界温度および臨界圧力という。\n・塩化カルシウムブラインの最低の凍結温度は-55℃である。\n・二酸化炭素は、アンモニア冷凍機などと組み合わせた冷凍・冷却装置の二次冷媒（ブライン）としても使われている。","has_image":false,"image_path":null},{"id":"R03-Hoan-Q05","year":"R03","subject":"保安管理技術","category":"圧縮機の特性等","tags":[],"question":"次のイ、ロ、ハ、ニの記述のうち、圧縮機について正しいものはどれか。\nイ．開放圧縮機は、動力を伝えるための軸が圧縮機ケーシングを貫通して外部に突き出ている。\nロ．一般の往復圧縮機のピストンには、ピストンリングとして、上部にコンプレッションリング、下部にオイルリングが付いている。\nハ．多気筒の往復圧縮機の容量制御装置では、吸込み板弁を開放することで、無段階制御が可能である。\nニ．スクリュー圧縮機は、遠心式に比べて高圧力比での使用に適しているため、ヒートポンプや冷凍用に使用されることが多い。","options":["(1) イ、ロ","(2) ロ、ハ","(3) ハ、ニ","(4) イ、ロ、ニ","(5) イ、ハ、ニ"],"answer":4,"explanation":"・開放圧縮機は、動力を伝えるための軸が圧縮機ケーシングを貫通して外部に突き出ている。\n・一般の往復圧縮機のピストンには、ピストンリングとして、上部にコンプレッションリング、下部にオイルリングが付いている。\n・多気筒の往復圧縮機の容量制御装置では、吸込み板弁を開放することで、容量を段階的に変えられるようになっている。\n・スクリュー圧縮機は、遠心式に比べて高圧力比での使用に適しているため、ヒートポンプや冷凍用に使用されることが多い。","has_image":false,"image_path":null},{"id":"R03-Hoan-Q06","year":"R03","subject":"保安管理技術","category":"凝縮器・冷却塔","tags":[],"question":"次のイ、ロ、ハ、ニの記述のうち、凝縮器および冷却塔について正しいものはどれか。\nイ．シェルアンドチューブ凝縮器は、円筒胴と管板に固定された冷却管で構成され、円筒胴の内側と冷却管の間に圧縮機吐出しガスが流れ、冷却管内には冷却水が流れる。\nロ．二重管凝縮器は、冷却水を内管と外管との間に通し、内管内で圧縮機吐出しガスを凝縮させる。\nハ．冷却塔の運転性能は、水温、水量、風量および湿球温度によって定まる。また、冷却塔の出入口の冷却水の温度差は、クーリングレンジといい、その値はほぼ5k程度である。\nニ．蒸発式凝縮器は、空冷凝縮器と比較して凝縮温度が高く、主としてアンモニア冷凍装置に使われている。","options":["(1) イ、ロ","(2) イ、ハ","(3) ロ、ハ","(4) ロ、ニ","(5) イ、ハ、ニ"],"answer":2,"explanation":"・シェルアンドチューブ凝縮器は、円筒胴と管板に固定された冷却管で構成され、円筒胴の内側と冷却管の間に圧縮機吐出しガスが流れ、冷却管内には冷却水が流れる。\n・二重管凝縮器は、内管に冷却水を通し、冷媒を内管と外管との間で凝縮させる。\n・冷却塔の運転性能は、水温、水量、風量および湿球温度によって定まる。また、冷却塔の出入口の冷却水の温度差は、クーリングレンジといい、その値はほぼ5K程度である。\n・蒸発式凝縮器は、空冷凝縮器と比較して凝縮温度を低く保つことができる凝縮器であり、主としてアンモニア冷凍装置に使われている。","has_image":false,"image_path":null},{"id":"R03-Hoan-Q07","year":"R03","subject":"保安管理技術","category":"蒸発器・除霜等","tags":[],"question":"次のイ、ロ、ハ、ニの記述のうち、蒸発器および蒸発器の除霜について正しいものはどれか。\nイ．蒸発器における冷凍能力は、冷却される空気や水などと冷媒との間の平均温度差、熱通過率および伝熱面積に比例する。\nロ．大きな容量の乾式蒸発器では、蒸発器の冷媒の出口側にディストリビュータを取り付けるが、これは多数の伝熱管に冷媒を均等に分配するためである。\nハ．満液式蒸発器における平均熱通過率は、乾式蒸発器の平均熱通過率よりも大きい。\nニ．ホットガス除霜は、冷却管の内部から冷媒ガスの熱によって霜を均一に融解でき、霜が厚くなってからの除霜に適した方法である。","options":["(1) イ、ハ","(2) イ、ニ","(3) ロ、ハ","(4) ロ、ニ","(5) ハ、ニ"],"answer":1,"explanation":"・蒸発器における冷凍能力は、冷却される空気や水などと冷媒との間の平均温度差、熱通過率および伝熱面積に比例する。\n・大きな容量の乾式蒸発器では、蒸発器の冷媒の入口側にディストリビュータを取り付けるが、これは多数の伝熱管に冷媒を均等に分配するためである。\n・満液式蒸発器における平均熱通過率は、乾式蒸発器の平均熱通過率よりも大きい。\n・ホットガス除霜は、冷却管の内部から冷媒ガスの熱によって霜を融解させるため、霜が厚くなると融けにくくなり、除霜の時間が長くなる。","has_image":false,"image_path":null},{"id":"R03-Hoan-Q08","year":"R03","subject":"保安管理技術","category":"自動制御機器","tags":[],"question":"次のイ、ロ、ハ、ニの記述のうち、自動制御機器について正しいものはどれか。\nイ．温度自動膨張弁は、蒸発器出口冷媒蒸気の過熱度が一定になるように、冷媒流量を調節する。\nロ．温度自動膨張弁の感温筒が外れると、膨張弁が閉じて、蒸発器出口冷媒蒸気の過熱度が高くなり、冷凍能力が小さくなる。\nハ．キャピラリチューブは、冷媒の流動抵抗による圧力降下を利用して冷媒の絞り膨張を行うとともに、冷媒の流量を制御し、蒸発器出口冷媒蒸気の過熱度の制御を行う。\nニ．断水リレーとして使用されるフロースイッチは、水の流れを直接検出する機構をもっている。","options":["(1) イ、ハ","(2) イ、ニ","(3) ロ、ハ","(4) ロ、ニ","(5) ハ、ニ"],"answer":2,"explanation":"・温度自動膨張弁は、蒸発器出口冷媒蒸気の過熱度が一定になるように、冷媒流量を調節する。\n・温度自動膨張弁の感温筒が外れると、膨張弁が開いて冷媒流量が増加し、過熱度は低くなり、冷凍能力は小さくなる。\n・キャピラリチューブは、冷媒の流動抵抗による圧力降下を利用して冷媒の絞り膨張を行うが、冷媒の流量を制御することはできず、蒸発器出口冷媒の過熱度の制御を行うことはできない。\n・断水リレーとして使用されるフロースイッチは、水の流れを直接検出する機構をもっている。","has_image":false,"image_path":null},{"id":"R03-Hoan-Q09","year":"R03","subject":"保安管理技術","category":"附属機器","tags":[],"question":"次のイ、ロ、ハ、ニの記述のうち、附属機器について正しいものはどれか。\nイ．高圧受液器内には、常に冷媒液が保持されるようにし、受液器出口から冷媒ガスが冷媒液とともに流れ出ないように、その冷媒の液面よりも低い位置に液出口管端を設ける。\nロ．圧縮機から吐き出される冷媒ガスとともに、若干の冷凍機油が一緒に吐き出されるので、小形のフルオロカーボン冷凍装置でも、一般に、油分離器を設ける場合が多い。\nハ．冷凍機油は、凝縮器や蒸発器に送られると伝熱を妨げるので、液分離器を圧縮機の吸込み蒸気配管に設け、冷媒蒸気と冷凍機油を分離する。\nニ．サイトグラスは、冷媒液配管のフィルタドライヤの下流に設置され、冷媒充填量の不足やフィルタドライヤの交換時期などの判断に用いられる。","options":["(1) イ、ロ","(2) イ、ハ","(3) イ、ニ","(4) ロ、ハ","(5) ハ、ニ"],"answer":3,"explanation":"・高圧受液器内には、常に冷媒液が保持されるようにし、受液器出口から冷媒ガスが冷媒液とともに流れ出ないように、その冷媒の液面よりも低い位置に液出口管端を設ける。\n・圧縮機から吐き出される冷媒ガスとともに、若干の冷凍機油が一緒に吐き出されるが、小形のフルオロカーボン冷凍装置では、一般に、油分離器を設けない場合が多い。\n・冷凍機油は、凝縮器や蒸発器に送られると伝熱を妨げるので、油分離器を圧縮機の吐出し管に設け、冷媒蒸気と冷凍機油を分離する。\n・サイトグラスは、冷媒液配管のフィルタドライヤの下流に設置され、冷媒充填量の不足やフィルタドライヤの交換時期などの判断に用いられる。","has_image":false,"image_path":null},{"id":"R03-Hoan-Q10","year":"R03","subject":"保安管理技術","category":"冷媒配管","tags":[],"question":"次のイ、ロ、ハ、ニの記述のうち、冷媒配管について正しいものはどれか。\nイ．配管用炭素鋼鋼管（SGP）は、低温用の冷媒配管として、－30 ℃で使用できる。\nロ．フルオロカーボン冷凍装置の配管でろう付け作業を実施する場合、配管内に乾燥空気を流して、配管内に酸化皮膜を生成させないようにする。\nハ．高圧冷媒液管内にフラッシュガスが発生すると、膨張弁の冷媒流量が変動して、安定した冷凍作用が得られなくなる。\nニ．圧縮機吸込み管の二重立ち上がり管は、容量制御装置をもった圧縮機の吸込み管に、油戻しのために設置する。","options":["(1) イ、ロ","(2) イ、ハ","(3) ロ、ハ","(4) ロ、ニ","(5) ハ、ニ"],"answer":5,"explanation":"・配管用炭素鋼鋼管（SGP）は、低温用の冷媒配管として、-25℃まで使用できる。\n・フルオロカーボン冷凍装置の配管でろう付け作業を実施する場合、配管内に窒素ガスを流して、配管内に酸化皮膜を生成させないようにする。\n・高圧冷媒液管内にフラッシュガスが発生すると、膨張弁の冷媒流量が変動して、安定した冷凍作用が得られなくなる。\n・圧縮機吸込み管の二重立ち上がり管は、容量制御装置をもった圧縮機の吸込み管に、油戻しのために設置する。","has_image":false,"image_path":null},{"id":"R03-Hoan-Q11","year":"R03","subject":"保安管理技術","category":"安全装置","tags":[],"question":"次のイ、ロ、ハ、ニの記述のうち、安全装置について正しいものはどれか。\nイ．圧力容器などに取り付ける安全弁には、修理等のために止め弁を設ける。修理等のとき以外は、この止め弁を常に閉じておかなければならない。\nロ．破裂板は、構造が簡単であるために、容易に大口径のものを製作できるが、比較的高い圧力の装置や可燃性または毒性を有する冷媒を使用した装置には使用しない。\nハ．圧縮機に取り付けるべき安全弁の最小口径は、ピストン押しのけ量の平方根に反比例する。\nニ．液封による事故は、低圧液配管で発生することが多く、弁操作ミスなどが原因になることが多い。","options":["(1) イ、ロ","(2) イ、ニ","(3) ロ、ハ","(4) ロ、ニ","(5) ハ、ニ"],"answer":4,"explanation":"・圧力容器などに取り付ける安全弁には、修理等のために止め弁を設ける。修理等のとき以外は、この止め弁を常に開けておかなければならない。\n・破裂板は、構造が簡単であるために、容易に大口径のものを製作できるが、比較的高い圧力の装置や可燃性または毒性を有する冷媒を使用した装置には使用しない。\n・圧縮機に取り付けるべき安全弁の最小口径は、ピストン押しのけ量の平方根に比例する。\n・液封による事故は、低圧液配管で発生することが多く、弁操作ミスなどが原因になることが多い。","has_image":false,"image_path":null},{"id":"R03-Hoan-Q12","year":"R03","subject":"保安管理技術","category":"材料の強さ・圧力容器","tags":[],"question":"次のイ、ロ、ハ、ニの記述のうち、材料の強さおよび圧力容器について正しいものはどれか。\nイ．JISの定める溶接構造用圧延鋼材SM400Bの許容引張応力は100N/mm^2であり、最小引張強さは400N/mm^2である。\nロ．高圧部の設計圧力は、凝縮温度が基準凝縮温度以外のときには、最も近い下位の基準凝縮温度に対応する圧力とする。\nハ．フルオロカーボン冷媒は、プラスチック、ゴムなどの有機物を溶解したり、その浸透によって材料を膨張させたりする。\nニ．圧力容器を設計するときは、一般に、材料に生じる引張応力が、材料の引張強さの1/2の応力である許容引張応力以下になるようにする。","options":["(1) イ、ハ","(2) ロ、ニ","(3) イ、ロ、ハ","(4) ロ、ハ、ニ","(5) イ、ロ、ハ、ニ"],"answer":1,"explanation":"・ISの定める溶接構造用圧延鋼材SM400Bの許容引張応力は100N/mm2であ\nり、最小引張強さは400N/mm2である。\n・高圧部の設計圧力は、凝縮温度が基準凝縮温度以外のときには、最も近い上位の基準凝縮温度に対応する圧力とする。\n・フルオロカーボン冷媒は、プラスチック、ゴムなどの有機物を溶解したり、その浸透によって材料を膨張させたりする。\n・圧力容器を設計するときは、一般に、材料に生じる引張応力が、材料の引張強さの1/4の応力である許容引張応力以下になるようにする。","has_image":false,"image_path":null},{"id":"R03-Hoan-Q13","year":"R03","subject":"保安管理技術","category":"据付け・試験・試運転","tags":[],"question":"次のイ、ロ、ハ、ニの記述のうち、据付けおよび試験について正しいものはどれか。\nイ．耐圧試験は、耐圧強度を確認するための試験であり、被試験品の破壊の有無を確認しやすいように、体積変化の大きい気体を用いて試験を行わなくてはならない。\nロ．真空試験は、法規で定められたものではないが、装置全体からの微量な漏れを発見できるため、気密試験の前に実施する。\nハ．圧縮機の据付けにおいて、圧縮機の加振力による動荷重も考慮し、十分に質量をもたせたコンクリート基礎を地盤に築き、固定する。\nニ．冷凍装置に使用する冷凍機油は、圧縮機の種類、冷媒の種類などによって異なり、特に常用の蒸発温度に注意して冷凍機油を選定する必要がある。","options":["(1) イ、ロ","(2) イ、ハ","(3) ロ、ハ","(4) ロ、ニ","(5) ハ、ニ"],"answer":5,"explanation":"・耐圧試験は、耐圧強度を確認するための試験であるが、体積変化の小さい水その他の安全な液体を使用して行う。「水その他の安全な液体を使用することが困難であると認められるときは、空気、窒素等の気体を使用して許容圧力の1.25倍以上の圧力で行うことができる。」と定められている。\n・真空試験は、法規で定められたものではないが、装置全体からの微量な漏れを発見できるため、気密試験の後に実施する。\n・圧縮機の据付けにおいて、圧縮機の加振力による動荷重も考慮し、十分に質量をもたせたコンクリート基礎を地盤に築き、固定する。\n・冷凍装置に使用する冷凍機油は、圧縮機の種類、冷媒の種類などによって異なり、特に常用の蒸発温度に注意して冷凍機油を選定する必要がある。","has_image":false,"image_path":null},{"id":"R03-Hoan-Q14","year":"R03","subject":"保安管理技術","category":"冷凍装置の運転","tags":[],"question":"次のイ、ロ、ハ、ニの記述のうち、冷凍装置の運転などについて正しいものはどれか。\nイ．外気温度が一定の状態で、冷蔵庫内の品物から出る熱量が減少すると、冷凍装置における蒸発器出入口の空気温度差は変化しないが、凝縮圧力は低下する。\nロ．冷凍装置を長期間休止させる場合、冷媒系統全体の漏れを点検し、漏れ箇所を発見した場合は、完全に修理しておく。\nハ．蒸発圧力一定で運転中の冷凍装置において、往復圧縮機の吐出しガス圧力が上昇した場合、吐出しガス温度も上昇するが、圧縮機の体積効率は変化しない。\nニ．冷凍装置運転中における、水冷凝縮器の冷却水の標準的な出入口温度差は、4～6kであり、標準的な凝縮温度は、冷却水出口温度よりも3～5kほど高い温度である。","options":["(1) イ、ハ","(2) イ、ニ","(3) ロ、ニ","(4) イ、ロ、ハ","(5) ロ、ハ、ニ"],"answer":3,"explanation":"・外気温度が一定の状態で、冷蔵庫内の品物から出る熱量が減少すると、冷凍装置における蒸発器出入口の空気温度差は減少し、凝縮圧力は低下する。\n・冷凍装置を長期間休止させる場合、冷媒系統全体の漏れを点検し、漏れ箇所を発見した場合は、完全に修理しておく。\n・蒸発圧力一定で運転中の冷凍装置において、往復圧縮機の吐出しガス圧力が上昇した場合、吐出しガス温度も上昇するが、圧縮機の体積効率は低下する。\n・冷凍装置運転中における、水冷凝縮器の冷却水の標準的な出入口温度差は、4～6Kであり、標準的な凝縮温度は、冷却水出口温度よりも3～5Kほど高い温度である。","has_image":false,"image_path":null},{"id":"R03-Hoan-Q15","year":"R03","subject":"保安管理技術","category":"冷凍装置の保守管理","tags":[],"question":"次のイ、ロ、ハ、ニの記述のうち、保守管理について正しいものはどれか。\nイ．冷凍負荷が急激に増大すると、蒸発器での冷媒の沸騰が激しくなり、蒸気とともに液滴が圧縮機に吸い込まれ、液戻り運転となることがある。\nロ．アンモニア冷凍装置の液封事故を防ぐため、液封が起こりそうな箇所には、安全弁や破裂板を取り付ける。\nハ．フルオロカーボン冷媒の大気への排出を抑制するため、フルオロカーボン冷凍装置内の不凝縮ガスを含んだ冷媒を全量回収し、装置内に混入した不凝縮ガスを排除した。\nニ．フルオロカーボン冷凍装置において、冷凍機油の充填には、水分への配慮は必要ないが、冷媒の充填には、水分が混入しないように細心の注意が必要である。","options":["(1) イ、ロ","(2) イ、ハ","(3) イ、ニ","(4) ロ、ハ","(5) ロ、ニ"],"answer":2,"explanation":"・冷凍負荷が急激に増大すると、蒸発器での冷媒の沸騰が激しくなり、蒸気とともに液滴が圧縮機に吸い込まれ、液戻り運転となることがある。\n・冷凍装置の液封事故を防ぐためには、液封が起こりそうな箇所に安全弁や破裂板を取り付ける。ただし、可燃性ガスまたは毒性ガスには破裂板を使用することはできない。\n・フルオロカーボン冷媒の大気への排出を抑制するため、フルオロカーボン冷凍装置内の不凝縮ガスを含んだ冷媒を全量回収し、装置内に混入した不凝縮ガスを排除するのは適切である。\n・冷凍機油の充填は、外気に触れないよう水分への配慮が必要であり、冷媒の充填には、水分が混入しないように細心の注意が必要である。","has_image":false,"image_path":null},{"id":"R02-Hoan-Q01","year":"R02","subject":"保安管理技術","category":"冷凍の原理・冷凍サイクル","tags":[],"question":"次のイ、ロ、ハ、ニの記述のうち、冷凍の原理などについて正しいものはどれか。\nイ．蒸発温度や凝縮温度が一定の運転状態では、圧縮機の駆動軸動力は、凝縮器の凝縮負荷と冷凍装置の冷凍能力の差に等しい。\nロ．冷凍装置における各種の熱計算では、比エンタルピーの絶対値は特に必要ない。冷媒は、0℃ の飽和液の比エンタルピー値を200kJ/kgとし、これを基準としている。\nハ．蒸気圧縮冷凍装置の一種である家庭用冷蔵庫は、一般に、圧縮機、蒸発器、膨張弁および凝縮器で構成されており、受液器なしで凝縮器の出口に液を溜め込むようにし、装置を簡略化している。\nニ．吸収冷凍機は、圧縮機を用いずに、機械的な可動部である吸収器、発生器、溶液ポンプを用いて冷媒を循環させ、冷媒に温度差を発生させて冷熱を得る冷凍機である。","options":["(1) イ、ロ","(2) ロ、ニ","(3) ハ、ニ","(4) イ、ロ、ハ","(5) イ、ハ、ニ"],"answer":1,"explanation":"・蒸発温度や凝縮温度が一定の運転状態では、圧縮機の駆動軸動力は、凝縮器の凝縮負荷と冷凍装置の冷凍能力の差に等しい。\n※圧縮機の駆動軸動力＝凝縮器の凝縮負荷－冷凍装置の冷凍能力\n・冷凍装置における各種の熱計算では、比エンタルピーの絶対値は特に必要ない。冷媒は、0℃の飽和液の比エンタルピー値を200kJ/kgとし、これを基準としている。\n・蒸気圧縮冷凍装置の一種である家庭用冷蔵庫は、受液器なしで凝縮器の出口に液を溜め込むようにし、装置を簡略化しているが、膨張弁の代わりに毛細管（キャピラリチューブ）を用いて、冷媒液の減圧（沸点低下）をしている。\n・吸収冷凍機で機械的な可動部なのは、溶液ポンプのみである。","has_image":false,"image_path":null},{"id":"R02-Hoan-Q02","year":"R02","subject":"保安管理技術","category":"冷凍サイクル・熱の移動","tags":[],"question":"次のイ、ロ、ハ、ニの記述のうち、冷凍サイクルおよび熱の移動について正しいものはどれか。\nイ．冷凍サイクルの蒸発器で、冷媒から奪う熱量のことを冷凍効果という。この冷凍効果の値は、同じ冷媒でも冷凍サイクルの運転条件によって変わる。\nロ．理論ヒートポンプサイクルの成績係数は、理論冷凍サイクルの成績係数よりも1だけ大きい。\nハ．固体壁で隔てられた流体間で熱が移動するとき、固体壁両表面の熱伝達率と固体壁の熱伝導率が与えられれば、水あかの付着を考慮しない場合の熱通過率の値を計算することができる。\nニ．熱の移動には、熱伝導、熱放射および熱伝達の3つの形態がある。一般に、熱量の単位はJまたはkJであり、伝熱量の単位はW またはkWである。","options":["(1) イ、ロ","(2) イ、ハ","(3) ロ、ハ","(4) ロ、ニ","(5) イ、ハ、ニ"],"answer":4,"explanation":"・誤り。冷凍サイクルの蒸発器で冷媒1kg当たりが周囲から奪う熱量のことを、冷凍効果という。この冷凍効果の値は、同じ冷媒でも冷凍サイクルの運転条件によって変わる。\n・理論ヒートポンプサイクルの成績係数は、理論冷凍サイクルの成績係数よりも1だけ大きい。\n・熱通過率の値は、固体壁両面の熱伝達率、固体壁の熱伝導率、固体壁の厚さの値が与えられれば算出することができる。\n・熱の移動には、熱伝導、熱放射および熱伝達の3つの形態がある。一般に、熱量の単位はJまたはkJであり、伝熱量の単位はWまたはkWである。","has_image":false,"image_path":null},{"id":"R02-Hoan-Q03","year":"R02","subject":"保安管理技術","category":"冷凍能力・軸動力・成績係数","tags":[],"question":"次のイ、ロ、ハ、ニの記述のうち、圧縮機の性能、軸動力などについて正しいものはどれか。\nイ．冷凍装置の実際の成績係数は、理論冷凍サイクルの成績係数に断熱効率、機械効率、体積効率を乗じて求められる。\nロ．実際の圧縮機の駆動軸動力は、理論断熱圧縮動力と断熱効率により決まる。\nハ．往復圧縮機の断熱効率は、一般に、圧力比が大きくなると小さくなる。\nニ．圧縮機の実際の冷媒吸込み蒸気量は、ピストン押しのけ量と圧縮機の体積効率の積で求められる。","options":["(1) イ、ロ","(2) ロ、ハ","(3) ハ、ニ","(4) イ、ロ、ニ","(5) イ、ハ、ニ"],"answer":3,"explanation":"・冷凍装置の実際の成績係数は、理論冷凍サイクルの成績係数に断熱効率と機械効率を乗じて求められる。\n・実際の圧縮機の駆動軸動力は、理論断熱圧縮動力を、断熱効率と機械効率の積で除して求められる。\n・往復圧縮機の断熱効率は、一般に、圧力比が大きくなると小さくなる。\n・圧縮機の実際の冷媒吸込み蒸気量は、ピストン押しのけ量と圧縮機の体積効率の積で求められる。","has_image":false,"image_path":null},{"id":"R02-Hoan-Q04","year":"R02","subject":"保安管理技術","category":"冷媒・ブライン","tags":[],"question":"次のイ、ロ、ハ、ニの記述のうち、冷媒、ブラインの性質などについて正しいものはどれか。\nイ．R410Aは共沸混合冷媒である。\nロ．単一成分冷媒の飽和圧力が標準大気圧に等しいときの飽和温度を標準沸点といい、冷媒の種類によって異なる。\nハ．有機ブラインの溶質には、エチレングリコール系やプロピレングリコール系のほかに、塩化カルシウムや塩化ナトリウムなどがある。\nニ．フルオロカーボン冷凍装置では、圧縮機から吐き出された冷凍機油は、冷媒とともに装置内を循環する。","options":["(1) イ、ロ","(2) ロ、ニ","(3) ハ、ニ","(4) イ、ロ、ハ","(5) イ、ハ、ニ"],"answer":2,"explanation":"・R410Aは非共沸混合冷媒である。ただし、R410Aは温度勾配が小さく、疑似共沸混合冷媒と呼ばれる。\n・単一成分冷媒の飽和圧力が標準大気圧に等しいときの飽和温度を標準沸点といい、冷媒の種類によって異なる。\n・塩化カルシウムや塩化ナトリウムは、無機ブラインである。\n・フルオロカーボン冷凍装置では、圧縮機から吐き出された冷凍機油は、冷媒とともに装置内を循環する。\n※逆にアンモニアでは循環させない。","has_image":false,"image_path":null},{"id":"R02-Hoan-Q05","year":"R02","subject":"保安管理技術","category":"圧縮機の特性等","tags":[],"question":"次のイ、ロ、ハ、ニの記述のうち、圧縮機について正しいものはどれか。\nイ．ロータリー圧縮機は遠心式に分類され、ロータの回転による遠心力で冷媒蒸気を圧縮する。\nロ．運転条件が同じであれば、圧縮機の体積効率が小さくなるほど冷媒循環量は減少する。\nハ．スクリュー圧縮機は、高圧力比に適しているため、ヒートポンプ装置に利用される。\nニ．往復圧縮機では、停止中のクランクケース内の油温が高いほど、始動時にオイルフォーミングを起こしやすくなる。","options":["(1) イ、ロ","(2) イ、ハ","(3) イ、ニ","(4) ロ、ハ","(5) ロ、ニ"],"answer":4,"explanation":"・ロータリー圧縮機は容積式に分類され、ロータの回転により冷媒蒸気を圧縮する。\n・運転条件が同じであれば、圧縮機の体積効率が小さくなるほど冷媒循環量は減少する。\n・スクリュー圧縮機は、高圧力比に適しているため、ヒートポンプ装置に利用される。\n・往復圧縮機では、停止中のクランクケース内の油温が低いほど、始動時にオイルフォーミングを起こしやすくなる。","has_image":false,"image_path":null},{"id":"R02-Hoan-Q06","year":"R02","subject":"保安管理技術","category":"凝縮器・冷却塔","tags":[],"question":"次のイ、ロ、ハ、ニの記述のうち、凝縮器について正しいものはどれか。\nイ．水冷横形シェルアンドチューブ凝縮器は、円筒胴、管板、冷却管などによって構成され、高温高圧の冷媒ガスは冷却管内を流れる冷却水により冷却され、凝縮液化する。\nロ．冷却管の水あかの熱伝導抵抗を汚れ係数で表すと、汚れ係数が大きいほど、熱通過率が低下する。\nハ．空冷凝縮器は、空気の潜熱を用いて冷媒を凝縮させる凝縮器である。\nニ．凝縮器への不凝縮ガスの混入は、冷媒側の熱伝達の不良や凝縮圧力の低下を招く。","options":["(1) イ、ロ","(2) イ、ハ","(3) イ、ニ","(4) ロ、ハ","(5) ロ、ニ"],"answer":1,"explanation":"・水冷横形シェルアンドチューブ凝縮器は、円筒胴、管板、冷却管などによって構成され、高温高圧の冷媒ガスは冷却管内を流れる冷却水により冷却され、凝縮液化する。\n・冷却管の水あかの熱伝導抵抗を汚れ係数で表すと、汚れ係数が大きいほど、熱通過率が低下する。\n・空冷凝縮器は、空気の顕熱を用いて冷媒を凝縮させる凝縮器である。\n・凝縮器への不凝縮ガスの混入は、冷媒側の熱伝達の不良や凝縮圧力の上昇を招く。","has_image":false,"image_path":null},{"id":"R02-Hoan-Q07","year":"R02","subject":"保安管理技術","category":"蒸発器・除霜等","tags":[],"question":"次のイ、ロ、ハ、ニの記述のうち、蒸発器について正しいものはどれか。\nイ．蒸発器の冷凍能力は、冷却される空気や水などと冷媒との間の平均温度差、熱通過率および伝熱面積に比例する。\nロ．大きな容量の乾式蒸発器は、多数の伝熱管へ均等に冷媒を送り込むために、蒸発器出口側にディストリビュータを取り付ける。\nハ．液ポンプ方式の冷凍装置では、蒸発液量の3倍から5倍程度の冷媒液を強制循環させるため、蒸発器内に冷凍機油が滞留することはない。\nニ．一般的な散水方式の除霜は、送風機を運転しながら水を冷却器に散水し、霜を融解させる方式である。","options":["(1) イ、ハ","(2) イ、ニ","(3) ロ、ニ","(4) イ、ロ、ハ","(5) ロ、ハ、ニ"],"answer":1,"explanation":"・蒸発器の冷凍能力は、冷却される空気や水などと冷媒との間の平均温度差、熱通過率および伝熱面積に比例する。\n・大きな容量の乾式蒸発器は、多数の伝熱管へ均等に冷媒を送り込むために、蒸発器入口側にディストリビュータを取り付ける。\n・液ポンプ方式の冷凍装置では、蒸発液量の3倍から5倍程度の冷媒液を強制循環させるため、蒸発器内に冷凍機油が滞留することはない。\n・一般的な散水方式の除霜は、送風機を停止して水を冷却器に散水し、霜を融解させる方式である","has_image":false,"image_path":null},{"id":"R02-Hoan-Q08","year":"R02","subject":"保安管理技術","category":"自動制御機器","tags":[],"question":"次のイ、ロ、ハ、ニの記述のうち、自動制御機器について正しいものはどれか。\nイ．電磁弁には、直動式とパイロット式がある。直動式では、電磁コイルに通電すると、磁場が作られてプランジャに力が作用し、弁が閉じる。\nロ．吸入圧力調整弁は、弁入口側の冷媒蒸気の圧力が設定値よりも高くならないように作動する。このことにより圧縮機駆動用電動機の過負荷を防止できる。\nハ．温度自動膨張弁から蒸発器出口までの圧力降下が大きい場合には、外部均圧形温度自動膨張弁が使用されている。\nニ．低圧圧力スイッチは、設定値よりも圧力が下がると圧縮機が停止するので、過度の低圧運転を防止できる。","options":["(1) イ、ロ","(2) ロ、ハ","(3) ロ、ニ","(4) ハ、ニ","(5) イ、ハ、ニ"],"answer":4,"explanation":"・電磁弁には、直動式とパイロット式がある。直動式では、電磁コイルに通電すると、磁場が作られてプランジャに力が作用し、弁が開く。\n・吸入圧力調整弁は、弁出口側の冷媒蒸気の圧力が設定値よりも高くならないように作動する。このことにより圧縮機駆動用電動機の過負荷を防止できる。\n※吸入圧力調整弁は圧縮機の吸込み配管（圧縮機の手前）に取り付けるので、吸入圧力調整弁の出口側＝圧縮機の吸込み（入口）側\n・温度自動膨張弁から蒸発器出口までの圧力降下が大きい場合には、外部均圧形温度自動膨張弁が使用されている。\n・低圧圧力スイッチは、設定値よりも圧力が下がると圧縮機が停止するので、過度の低圧運転を防止できる。","has_image":false,"image_path":null},{"id":"R02-Hoan-Q09","year":"R02","subject":"保安管理技術","category":"附属機器","tags":[],"question":"次のイ、ロ、ハ、ニの記述のうち、附属機器について正しいものはどれか。\nイ．低圧受液器は、冷媒液強制循環式冷凍装置において、冷凍負荷が変動しても液ポンプが蒸気を吸い込まないように、液面レベル確保と液面位置の制御を行う。\nロ．油分離器にはいくつかの種類があるが、そのうちの一つに、大きな容器内にガスを入れることによりガス速度を大きくし、油滴を重力で落下させて分離するものがある。\nハ．アンモニア冷凍装置では、圧縮機の吸込み蒸気過熱度の増大にともなう吐出しガス温度の上昇が著しいので、液ガス熱交換器は使用しない。\nニ．サイトグラスは、のぞきガラスとその内側のモイスチャーインジケータからなる。のぞきガラスのないモイスチャーインジケータだけのものもある。","options":["(1) イ、ハ","(2) イ、ニ","(3) ロ、ハ","(4) ロ、ニ","(5) イ、ロ、ハ"],"answer":1,"explanation":"・低圧受液器は、冷媒液強制循環式冷凍装置において、冷凍負荷が変動しても液ポンプが蒸気を吸い込まないように、液面レベル確保と液面位置の制御を行う。\n・油分離器にはいくつかの種類があるが、そのうちの一つに、大きな容器内にガスを入れることによりガス速度を小さくし、油滴を重力で落下させて分離するものがある。\n・アンモニア冷凍装置では、圧縮機の吸込み蒸気過熱度の増大にともなう吐出しガス温度の上昇が著しいので、液ガス熱交換器は使用しない。\n・サイトグラスは、のぞきガラスとその内側のモイスチャーインジケータからなる。モイスチャーインジケータのない、のぞきガラスだけのものもある。","has_image":false,"image_path":null},{"id":"R02-Hoan-Q10","year":"R02","subject":"保安管理技術","category":"冷媒配管","tags":[],"question":"次のイ、ロ、ハ、ニの記述のうち、冷媒配管について正しいものはどれか。\nイ．フルオロカーボン冷媒、アンモニア冷媒用の配管には、銅および銅合金の配管がよく使用される。\nロ．高圧液配管は、冷媒液が気化するのを防ぐために、流速ができるだけ大きくなるような管径とする。\nハ．横走り吸込み蒸気配管に大きなUトラップがあると、トラップの底部に油や冷媒液の溜まる量が多くなり、圧縮機始動時などに、一挙に多量の液が圧縮機に吸い込まれて液圧縮の危険が生じる。\nニ．吐出しガス配管では、冷媒ガス中に混在している冷凍機油が確実に運ばれるだけのガス速度が必要である。ただし、摩擦損失による圧力降下は、20 kPaを超えないことが望ましい。","options":["(1) イ、ロ","(2) イ、ハ","(3) ハ、ニ","(4) イ、ロ、ニ","(5) ロ、ハ、ニ"],"answer":3,"explanation":"・アンモニア冷媒用の配管には、銅および銅合金を使用してはならない。\n・高圧液配管は、冷媒液が気化するのを防ぐために、流速ができるだけ小さくなるような管径とする。\n※流速で摩擦熱（圧損）を発生させない為\n・横走り吸込み蒸気配管に大きなUトラップがあると、トラップの底部に油や冷媒液の溜まる量が多くなり、圧縮機始動時などに、一挙に多量の液が圧縮機に吸い込まれて液圧縮の危険が生じる。\n・吐出しガス配管では、冷媒ガス中に混在している冷凍機油が確実に運ばれるだけのガス速度が必要である。ただし、摩擦損失による圧力降下は、20kPaを超えないことが望ましい。","has_image":false,"image_path":null},{"id":"R02-Hoan-Q11","year":"R02","subject":"保安管理技術","category":"安全装置","tags":[],"question":"次のイ、ロ、ハ、ニの記述のうち、安全装置などについて正しいものはどれか。\nイ．冷凍装置の安全弁の作動圧力とは、吹始め圧力と吹出し圧力のことである。この圧力は耐圧試験圧力を基準として定める。\nロ．圧縮機に取り付ける安全弁の最小口径は、冷媒の種類に応じて決まるが、圧縮機のピストン押しのけ量の平方根に比例する。\nハ．許容圧力以下に戻す安全装置の一つに溶栓がある。溶栓の口径は、取り付ける容器の外径と長さの積の平方根と、冷媒毎に定められた定数の積で求められた値の1/2以下としなくてはならない。\nニ．高圧遮断装置は、原則として手動復帰式とする。","options":["(1) イ、ロ","(2) ロ、ニ","(3) イ、ロ、ハ","(4) イ、ハ、ニ","(5) ロ、ハ、ニ"],"answer":2,"explanation":"・冷凍装置の安全弁の作動圧力とは、吹始め圧力と吹出し圧力のことである。この圧力は許容圧力を基準として定める。\n・圧縮機に取り付ける安全弁の最小口径は、冷媒の種類に応じて決まるが、圧縮機のピストン押しのけ量の平方根に比例する。\n・許容圧力以下に戻す安全装置の一つに溶栓がある。溶栓の口径は、取り付ける容器の外径と長さの積の平方根と、冷媒毎に定められた定数の積で求められた値（安全弁の最小口径）の1/2以上としなくてはならない。\n・高圧遮断装置は、原則として手動復帰式とする。","has_image":false,"image_path":null},{"id":"R02-Hoan-Q12","year":"R02","subject":"保安管理技術","category":"材料の強さ・圧力容器","tags":[],"question":"次のイ、ロ、ハ、ニの記述のうち、材料の強さおよび圧力容器について正しいものはどれか。\nイ．圧力容器では、使用する材料の応力－ひずみ線図における弾性限度以下の応力の値とするように設計する必要がある。\nロ．設計圧力とは、圧力容器の設計や耐圧試験圧力などの基準となるものであり、高圧部においては、一般に、通常の運転状態で起こりうる最高の圧力を設計圧力としている。\nハ．円筒胴圧力容器の胴板内部に発生する応力は、円筒胴の接線方向に作用する応力と、円筒胴の長手方向に作用する応力のみを考えればよく、圧力と内径に比例し、板厚に反比例する。\nニ．溶接継手の効率は、溶接継手の種類に依存せず、溶接部の全長に対する放射線透過試験を行った部分の長さの割合によって決められている。","options":["(1) イ、ロ","(2) イ、ニ","(3) ロ、ハ","(4) ロ、ニ","(5) ハ、ニ"],"answer":3,"explanation":"・圧力容器では、使用する材料の応力－ひずみ線図における比例限度以下の応力の値とするように設計する必要がある。\n・設計圧力とは、圧力容器の設計や耐圧試験圧力などの基準となるものであり、高圧部においては、一般に、通常の運転状態で起こりうる最高の圧力を設計圧力としている。\n・円筒胴圧力容器の胴板内部に発生する応力は、円筒胴の接線方向に作用する応力と、円筒胴の長手方向に作用する応力のみを考えればよく、圧力と内径に比例し、板厚に反比例する。\n・溶接継手の効率は、溶接継手の種類により決められており、更に溶接部の全長に対する放射線透過試験を行った部分の長さの割合によって決められているものもある。","has_image":false,"image_path":null},{"id":"R02-Hoan-Q13","year":"R02","subject":"保安管理技術","category":"据付け・試験・試運転","tags":[],"question":"次のイ、ロ、ハ、ニの記述のうち、冷凍装置の据付け、圧力試験および試運転について正しいものはどれか。\nイ．圧縮機を防振支持し、吸込み蒸気配管に可とう管（フレキシブルチューブ）を用いる場合、可とう管表面が氷結し破損するおそれのあるときは、可とう管をゴムで被覆することがある。\nロ．気密試験は、気密の性能を確かめるための試験であり、漏れを確認しやすいように、ガス圧で試験を行う。\nハ．真空試験は、気密試験の後に行い、微少な漏れの確認および装置内の水分と油分の除去を目的に行われる。\nニ．真空乾燥の後に水分が混入しないように配慮しながら冷凍装置に冷凍機油と冷媒を充てんし、電力、制御系統、冷却水系統などを十分に点検してから始動試験を行う。","options":["(1) イ、ロ","(2) イ、ハ","(3) ロ、ハ","(4) ハ、ニ","(5) イ、ロ、ニ"],"answer":5,"explanation":"・圧縮機を防振支持し、吸込み蒸気配管に可とう管（フレキシブルチューブ）を用いる場合、可とう管表面が氷結し破損するおそれのあるときは、可とう管をゴムで被覆することがある。\n・気密試験は、気密の性能を確かめるための試験であり、漏れを確認しやすいように、ガス圧で試験を行う。\n水でするのは耐圧試験。\n・真空試験は、気密試験の後に行い、微少な漏れの確認および装置内の水分の除去を目的に行われる。\n※油分の除去は考えない。\n・真空乾燥の後に水分が混入しないように配慮しながら冷凍装置に冷凍機油と冷媒を充てんし、電力、制御系統、冷却水系統などを十分に点検してから始動試験を行う。","has_image":false,"image_path":null},{"id":"R02-Hoan-Q14","year":"R02","subject":"保安管理技術","category":"冷凍装置の運転","tags":[],"question":"次のイ、ロ、ハ、ニの記述のうち、冷凍装置の運転状態について正しいものはどれか。\nイ．アンモニア冷媒の場合は、蒸発と凝縮のそれぞれの温度が同じ運転状態でも、フルオロカーボン冷媒に比べて圧縮機の吐出しガス温度が高くなる。\nロ．水冷凝縮器の冷却水量が減少すると、凝縮圧力の低下、圧縮機吐出しガス温度の上昇、装置の冷凍能力の低下が起こる。\nハ．冷蔵庫の蒸発器に厚く着霜すると、空気の流れ抵抗が増加するので風量が減少し、蒸発器の熱通過率が小さくなる。\nニ．冷蔵庫の負荷が大きく増加したとき、冷蔵庫の庫内温度と蒸発温度が上昇し、温度自動膨張弁の冷媒流量が増加するが、蒸発器における空気の出入口の温度差は変化しない。","options":["(1) イ、ロ","(2) イ、ハ","(3) ロ、ハ","(4) ロ、ニ","(5) ハ、ニ"],"answer":2,"explanation":"・アンモニア冷媒の場合は、蒸発と凝縮のそれぞれの温度が同じ運転状態でも、フルオロカーボン冷媒に比べて圧縮機の吐出しガス温度が高くなる。\n・水冷凝縮器の冷却水量が減少すると、凝縮圧力の上昇、圧縮機吐出しガス温度の上昇、装置の冷凍能力の低下が起こる。\n・蔵庫の蒸発器に厚く着霜すると、空気の流れ抵抗が増加するので風量が減少し、蒸発器の熱通過率が小さくなる。\n・冷蔵庫の負荷が大きく増加したとき、冷蔵庫の庫内温度と蒸発温度が上昇し、温度自動膨張弁の冷媒流量が増加するとともに、蒸発器における空気の出入口の温度差は増大する。","has_image":false,"image_path":null},{"id":"R02-Hoan-Q15","year":"R02","subject":"保安管理技術","category":"冷凍装置の保守管理","tags":[],"question":"次のイ、ロ、ハ、ニの記述のうち、冷凍装置の保守管理について正しいものはどれか。\nイ．冷媒充てん量が大きく不足していると、圧縮機の吸込み蒸気の過熱度が大きくなり、圧縮機吐出しガスの圧力と温度がともに上昇する。\nロ．圧縮機が過熱運転となると、冷凍機油の温度が上昇し、冷凍機油の粘度が下がるため
