、油膜切れを起こすおそれがある。\nハ．冷凍負荷が急激に増大すると、蒸発器での冷媒の沸騰が激しくなり、蒸気とともに液滴が圧縮機に吸い込まれ、液戻り運転となることがある。\nニ．不凝縮ガスが冷凍装置内に存在すると、圧縮機吐出しガスの圧力と温度がともに上昇する。","options":["(1) イ、ロ","(2) イ、ニ","(3) ロ、ハ","(4) イ、ハ、ニ","(5) ロ、ハ、ニ"],"answer":5,"explanation":"・冷媒充てん量が大きく不足していると、圧縮機の吸込み蒸気の過熱度が大きくなり、圧縮機吐出しガスの圧力が低下し、吐出し温度は上昇する。\n・圧縮機が過熱運転となると、冷凍機油の温度が上昇し、冷凍機油の粘度が下がるため、油膜切れを起こすおそれがある。\n・冷凍負荷が急激に増大すると、蒸発器での冷媒の沸騰が激しくなり、蒸気とともに液滴が圧縮機に吸い込まれ、液戻り運転となることがある。\n・不凝縮ガスが冷凍装置内に存在すると、圧縮機吐出しガスの圧力と温度がともに上昇する。","has_image":false,"image_path":null},{"id":"R01-Hoan-Q01","year":"R01","subject":"保安管理技術","category":"冷凍の原理・冷凍サイクル","tags":[],"question":"次のイ、ロ、ハ、ニの記述のうち、冷凍の原理、冷凍サイクルについて正しいものはどれか。\nイ．吸収冷凍機では、圧縮機を使用せずに、吸収器、発生器、溶液ポンプなどを用いて冷媒を循環させ、冷熱を得る。\nロ．膨張弁における膨張過程では、冷媒液の一部が蒸発することにより、膨張後の蒸発圧力に対応した蒸発温度まで冷媒自身の温度が下がる。\nハ．圧縮機駆動の軸動力を小さくし、大きな冷凍能力を得るためには、蒸発温度はできるだけ低くして、凝縮温度は必要以上に高くし過ぎないことが重要である。\nニ．冷媒のp-h線図は、実用上の便利さから、縦軸の絶対圧力、横軸の比エンタルピーのいずれも対数目盛でそれぞれ目盛られている。","options":["(1) イ","(2) ハ","(3) イ、ロ","(4) ロ、ニ","(5) ハ、ニ"],"answer":3,"explanation":"・吸収冷凍機では、圧縮機を使用せずに、吸収器、発生器、溶液ポンプなどを用いて冷媒を循環させ、冷熱を得る。\n・膨張弁における膨張過程では、冷媒液の一部が蒸発することにより、膨張後の蒸発圧力に対応した蒸発温度まで冷媒自身の温度が下がる。\n・圧縮機駆動の軸動力を小さくし、大きな冷凍能力を得るためには、蒸発温度を必要以上に低くし過ぎないこと、凝縮温度を必要以上に高くし過ぎないことが重要である。\n・冷媒のp-h線図では実用上の便利さから、縦軸の絶対圧力は対数目盛で、横軸の比エンタルピーは等間隔目盛りでそれぞれ目盛られている。","has_image":false,"image_path":null},{"id":"R01-Hoan-Q02","year":"R01","subject":"保安管理技術","category":"冷凍サイクル・熱の移動","tags":[],"question":"次のイ、ロ、ハ、ニの記述のうち、冷凍サイクル、熱の移動について正しいものはどれか。\nイ．常温、常圧において、水あか、グラスウール、鉄鋼、空気のなかで、熱伝導率の値が一番小さいのは空気である。\nロ．固体壁を通過する伝熱量は、その壁で隔てられた両側の流体間の温度差、固体壁の伝熱面積および熱通過率に比例する。\nハ．水冷却器の交換熱量の計算において、冷却管の入口側の水と冷媒との温度差をΔt1、出口側の温度差をΔt2とすると、冷媒と水との算術平均温度差Δtm は、Δtm＝（Δt1＋Δt2）／2である。\nニ．冷凍サイクルの蒸発器で周囲が冷媒から奪う熱量のことを、冷凍効果という。","options":["(1) イ、ロ","(2) イ、ハ","(3) ロ、ニ","(4) ハ、ニ","(5) イ、ロ、ハ"],"answer":5,"explanation":"・常温、常圧において、水あか、グラスウール、鉄鋼、空気のなかで、熱伝導率の値が一番小さいのは空気である。\n・固体壁を通過する伝熱量は、その壁で隔てられた両側の流体間の温度差、固体壁の伝熱面積および熱通過率に比例する。\n・水冷却器の交換熱量の計算において、冷却管の入口側の水と冷媒との温度差をΔt1、出口側の温度差をΔt2とすると、冷媒と水との算術平均温度差Δtmは、Δtm＝（Δt1＋Δt2）／2である。\n・冷凍サイクルの蒸発器で冷媒1kg当たりが周囲から奪う熱量のことを、冷凍効果という。","has_image":false,"image_path":null},{"id":"R01-Hoan-Q03","year":"R01","subject":"保安管理技術","category":"冷凍能力・軸動力・成績係数","tags":[],"question":"次のイ、ロ、ハ、ニの記述のうち、成績係数および冷媒循環量について正しいものはどれか。\nイ．圧縮機の全断熱効率が大きくなると、圧縮機駆動の軸動力は小さくなり、冷凍装置の実際の成績係数は大きくなる。\nロ．蒸発温度と凝縮温度との温度差が大きくなると、断熱効率と機械効率が大きくなるとともに、冷凍装置の実際の成績係数は低下する。\nハ．往復圧縮機の冷媒循環量は、ピストン押しのけ量、圧縮機の吸込み蒸気の比体積および体積効率の大きさにより決まる。\nニ．圧縮機の吸込み圧力が低いほど、また、吸込み蒸気の過熱度が大きいほど、圧縮機の冷媒循環量および冷凍能力が大きくなる。","options":["(1) イ、ハ","(2) イ、ニ","(3) ロ、ハ","(4) ロ、ニ","(5) ハ、ニ"],"answer":1,"explanation":"・圧縮機の全断熱効率が大きくなると、圧縮機駆動の軸動力は小さくなり、冷凍装置の実際の成績係数は大きくなる。\n・蒸発温度と凝縮温度との温度差が大きくなると、断熱効率と機械効率が小さくなるので、冷凍装置の成績係数は大きく低下する。\n・往復圧縮機の冷媒循環量は、ピストン押しのけ量、圧縮機の吸込み蒸気の比体積および体積効率の大きさにより決まる。\n・圧縮機の吸込み圧力が低いほど、また、吸込み蒸気の過熱度が大きいほど、圧縮機の冷媒循環量および冷凍能力が減少する。","has_image":false,"image_path":null},{"id":"R01-Hoan-Q04","year":"R01","subject":"保安管理技術","category":"冷媒・ブライン","tags":[],"question":"次のイ、ロ、ハ、ニの記述のうち、冷媒について正しいものはどれか。\nイ．アンモニアガスは空気より軽く、室内に漏えいした場合には、部屋の上方に滞留する。\nロ．R134aとR410Aは、ともに単一成分冷媒である。\nハ．非共沸混合冷媒は、圧力一定のもとで凝縮するとき、凝縮始めの冷媒温度（露点温度）と、凝縮終わりの冷媒温度（沸点温度）の間に差が生じる。\nニ．0℃における飽和圧力を標準沸点といい、冷媒の種類によって異なっている。","options":["(1) イ、ハ","(2) イ、ニ","(3) ロ、ハ","(4) ロ、ニ","(5) ハ、ニ"],"answer":1,"explanation":"・アンモニアガスは空気より軽く、室内に漏えいした場合には、部屋の上方に滞留する。\n・R134aは単一成分冷媒であるが、R410Aは混合冷媒である。\n・非共沸混合冷媒は、圧力一定のもとで凝縮するとき、凝縮始めの冷媒温度（露点温度）と、凝縮終わりの冷媒温度（沸点温度）の間に差が生じる。\n・飽和圧力が大気圧に等しいときの飽和温度を標準沸点といい、冷媒の種類によって異なっている。","has_image":false,"image_path":null},{"id":"R01-Hoan-Q05","year":"R01","subject":"保安管理技術","category":"圧縮機の特性等","tags":[],"question":"次のイ、ロ、ハ、ニの記述のうち、圧縮機について正しいものはどれか。\nイ．圧縮機は、冷媒蒸気の圧縮の方法により、往復式、スクリュー式およびスクロール式に大別される。\nロ．多気筒圧縮機のアンローダと呼ばれる容量制御装置は、圧縮機始動時の負荷軽減装置としても機能する。\nハ．スクリュー圧縮機の容量制御をスライド弁で行う場合、スクリューの溝の数に応じた段階的な容量制御となり、無段階制御はできない。\nニ．停止中のフルオロカーボン用圧縮機クランクケース内の油温が低いと、冷凍機油に冷媒が溶け込む溶解量は大きくなり、圧縮機始動時にオイルフォーミングを起こしやすい。","options":["(1) イ、ロ","(2) イ、ハ","(3) ロ、ハ","(4) ロ、ニ","(5) イ、ハ、ニ"],"answer":4,"explanation":"・圧縮機は、冷媒蒸気の圧縮の方法により、容積式と遠心式に大別される。\n・多気筒圧縮機のアンローダと呼ばれる容量制御装置は、圧縮機始動時の負荷軽減装置としても機能する。\n・スクリュー圧縮機の容量制御をスライド弁で行う場合、ある範囲内で無段階制御または段階制御が可能である。\n・停止中のフルオロカーボン用圧縮機クランクケース内の油温が低いと、冷凍機油に冷媒が溶け込む溶解量は大きくなり、圧縮機始動時にオイルフォーミングを起こしやすい。","has_image":false,"image_path":null},{"id":"R01-Hoan-Q06","year":"R01","subject":"保安管理技術","category":"凝縮器・冷却塔","tags":[],"question":"次のイ、ロ、ハ、ニの記述のうち、凝縮器および冷却塔について正しいものはどれか。\nイ．水冷横形シェルアンドチューブ凝縮器は、円筒胴と管板に固定された冷却管で構成され、円筒胴の内側と冷却管の間に冷却水が流れ、冷却管内には冷媒が流れる。\nロ．水冷横形シェルアンドチューブ凝縮器では、冷却水中の汚れや不純物が冷却管表面に水あかとなって付着し、水あかの熱伝導率が小さいので、熱通過率の値が小さくなり、凝縮温度が低くなる。\nハ．蒸発式凝縮器は、水の蒸発潜熱を利用して冷媒を凝縮させるので、一般に、空冷凝縮器よりも凝縮温度を低く保つことができる。\nニ．冷却塔の出口水温と周囲空気の湿球温度との温度差をアプローチと呼び、その値は通常5K程度である。","options":["(1) イ、ロ","(2) イ、ハ","(3) ロ、ハ","(4) ロ、ニ","(5) ハ、ニ"],"answer":5,"explanation":"・水冷横形シェルアンドチューブ凝縮器は、円筒胴と管板に固定された冷却管で構成され、円筒胴の内側と冷却管の間に冷媒が流れ、冷却管内には冷却水が流れる。\n・水あかの熱伝導率は小さいので、熱通過率の値が小さくなり、凝縮温度が高くなる。\n・蒸発式凝縮器は、水の蒸発潜熱を利用して冷媒を凝縮させるので、一般に、空冷凝縮器よりも凝縮温度を低く保つことができる。\n・冷却塔の出口水温と周囲空気の湿球温度との温度差をアプローチと呼び、その値は通常5K程度である。","has_image":false,"image_path":null},{"id":"R01-Hoan-Q07","year":"R01","subject":"保安管理技術","category":"蒸発器・除霜等","tags":[],"question":"次のイ、ロ、ハ、ニの記述のうち、蒸発器について正しいものはどれか。\nイ．蒸発器における冷凍能力は、冷却される空気や水などと冷媒との間の平均温度差、熱通過率および伝熱面積に正比例する。\nロ．蒸発器は、冷媒の供給方式により、乾式、満液式および冷媒液強制循環式などに分類される。シェル側に冷媒を供給し、冷却管内にブラインを流して冷却するシェルアンドチューブ蒸発器は乾式である。\nハ．シェルアンドチューブ乾式蒸発器では、水側の熱伝達率を向上させるために、バッフルプレートを設置する。\nニ．散水方式でデフロストをする場合、冷蔵庫外の排水管にトラップを設けることで、冷蔵庫内への外気の侵入を防止できる。","options":["(1) イ、ロ","(2) イ、ハ","(3) ロ、ニ","(4) イ、ハ、ニ","(5) ロ、ハ、ニ"],"answer":4,"explanation":"・蒸発器における冷凍能力は、冷却される空気や水などと冷媒との間の平均温度差、熱通過率および伝熱面積に正比例する。\n・蒸発器は、冷媒の供給方式により、乾式、満液式および冷媒液強制循環式などに分類される。シェル側に冷媒を供給し、冷却管内にブラインを流して冷却するシェルアンドチューブ蒸発器は満液式である。\n・シェルアンドチューブ乾式蒸発器では、水側の熱伝達率を向上させるために、バッフルプレートを設置する。\n※バッフルプレート（邪魔板）は、流体（気体や液体）の流れを遮り、方向や速度を制御するための板です。用途に応じて役割が異なり、エンジン性能の維持や騒音低減、撹拌効率の向上などに広く使用されます。\n・散水方式でデフロストをする場合、冷蔵庫外の排水管にトラップを設けることで、冷蔵庫内への外気の侵入を防止できる。\n※デフロスト（Defrost）とは、冷凍・冷蔵庫や空調機器、自動車などに付着した「霜（しも）」や「氷」を取り除く除霜運転のことです。","has_image":false,"image_path":null},{"id":"R01-Hoan-Q08","year":"R01","subject":"保安管理技術","category":"自動制御機器","tags":[],"question":"次のイ、ロ、ハ、ニの記述のうち、自動制御機器について正しいものはどれか。\nイ．温度自動膨張弁は、高圧の冷媒液を低圧部に絞り膨張させる機能と、過熱度により蒸発器への冷媒流量を調節して冷凍装置を効率よく運転する機能の、ニつの機能をもっている。\nロ．キャピラリチューブは、細い銅管を流れる冷媒の流れ抵抗による圧力降下を利用して、冷媒の絞り膨張を行う機器である。\nハ．吸入圧力調整弁は、圧縮機吸込み配管に取り付けて、圧縮機吸込み圧力が設定値よりも高くならないように調整できる。また、圧縮機の始動時や蒸発器の除霜などのときに、圧縮機駆動用電動機の過負荷も防止できる。\nニ．内部均圧形温度自動膨張弁は、冷媒の流れの圧力降下の大きな蒸発器、ディストリビュータで冷媒を分配する蒸発器に使用される。","options":["(1) イ、ロ、ハ","(2) イ、ロ、ニ","(3) イ、ハ、ニ","(4) ロ、ハ、ニ","(5) イ、ロ、ハ、ニ"],"answer":1,"explanation":"・温度自動膨張弁は、高圧の冷媒液を低圧部に絞り膨張させる機能と、過熱度により蒸発器への冷媒流量を調節して冷凍装置を効率よく運転する機能の、二つの機能をもっている。\n・キャピラリチューブは、細い銅管を流れる冷媒の流れ抵抗による圧力降下を利用して、冷媒の絞り膨張を行う機器である。\n・吸入圧力調整弁は、圧縮機吸込み配管に取り付けて、圧縮機吸込み圧力が設定値よりも高くならないように調整できる。また、圧縮機の始動時や蒸発器の除霜などのときに、圧縮機駆動用電動機の過負荷も防止できる。\n・外部均圧形温度自動膨張弁は、冷媒の流れの圧力降下の大きな蒸発器、ディストリビュータで冷媒を分配する蒸発器に使用される。","has_image":false,"image_path":null},{"id":"R01-Hoan-Q09","year":"R01","subject":"保安管理技術","category":"附属機器","tags":[],"question":"次のイ、ロ、ハ、ニの記述のうち、附属機器について正しいものはどれか。\nイ．液分離器は、蒸発器と圧縮機との間の吸込み蒸気配管に取り付け、吸込み蒸気中に混在した液を分離して、冷凍装置外部に排出する。\nロ．フルオロカーボン冷凍装置では、凝縮器を出た冷媒液を過冷却させるとともに、圧縮機に戻る冷媒蒸気を適度に過熱させるために、液ガス熱交換器を設けることがある。\nハ．シリカゲルを乾燥剤に用いたドライヤは、フルオロカーボン冷凍装置の冷媒系統の水分を除去する。\nニ．往復圧縮機を用いたアンモニア冷凍装置では、一般に、油分離器で分離された鉱油を圧縮機クランクケース内に自動返油する。","options":["(1) イ","(2) ロ","(3) ハ","(4) ニ","(5) ロ、ハ"],"answer":5,"explanation":"・液分離器は、蒸発器と圧縮機との間の吸込み蒸気配管に取り付け、吸込み蒸気中に混在した液を分離して、蒸気だけを圧縮機に吸い込ませて、液圧縮を防止する。\n・フルオロカーボン冷凍装置では、凝縮器を出た冷媒液を過冷却させるとともに、圧縮機に戻る冷媒蒸気を適度に過熱させるために、液ガス熱交換器を設けることがある。\n・シリカゲルを乾燥剤に用いたドライヤは、フルオロカーボン冷凍装置の冷媒系統の水分を除去する。\n・アンモニア冷凍装置の油分離器で分離された鉱油は、吐出しガス温度が高く油が劣化するので、一般には自動返油せず、油だめに抜き取ることがある。","has_image":false,"image_path":null},{"id":"R01-Hoan-Q10","year":"R01","subject":"保安管理技術","category":"冷媒配管","tags":[],"question":"次のイ、ロ、ハ、ニの記述のうち、冷媒配管について正しいものはどれか。\nイ．圧縮機吸込み蒸気配管のニ重立ち上がり管は、冷媒液の戻り防止のために使用される。\nロ．高圧冷媒液管内にフラッシュガスが発生すると、膨張弁の冷媒流量が減少して、冷凍能力が減少する。\nハ．配管用炭素鋼鋼管（SGP）は、一般に、冷媒R410Aの高圧冷媒配管に使用される。\nニ．圧縮機の停止中に、配管内で凝縮した冷媒液や油が逆流しないようにすることは、圧縮機吐出し管の施工上、重要なことである。","options":["(1) イ、ロ","(2) イ、ハ","(3) ロ、ニ","(4) イ、ハ、ニ","(5) ロ、ハ、ニ"],"answer":3,"explanation":"・圧縮機吸込み蒸気配管の二重立ち上がり管は、油戻しのために使用される。\n・高圧冷媒液管内にフラッシュガスが発生すると、膨張弁の冷媒流量が減少して、冷凍能力が減少する。\n・配管用炭素鋼鋼管（SGP）は、毒性をもつ冷媒、設計圧力が1MPaを超える耐圧部分、温度が100℃を超える耐圧部分には使用できない。冷媒R410Aの高圧部設計圧力は1MPaを超えるため使用することはできない。\n・圧縮機の停止中に、配管内で凝縮した冷媒液や油が逆流しないようにすることは、圧縮機吐出し管の施工上、重要なことである。","has_image":false,"image_path":null},{"id":"R01-Hoan-Q11","year":"R01","subject":"保安管理技術","category":"安全装置","tags":[],"question":"次のイ、ロ、ハ、ニの記述のうち、安全装置などについて正しいものはどれか。\nイ．圧力容器に取り付ける安全弁の最小口径は、容器の外径と長さの積の平方根と、冷媒の種類ごとに高圧部、低圧部に分けて定められた定数の積で決まる。\nロ．溶栓は、取り付けられる容器内の圧力を直接検知して破裂し、内部の冷媒を放出することにより、圧力の異常な上昇を防ぐ。\nハ．高圧遮断装置は、高圧側の圧力の異常な上昇を検知して作動し、圧縮機を駆動している電動機の電源を切って圧縮機を停止させる。\nニ．ガス漏えい検知警報設備は、冷媒の種類や機械換気装置の有無にかかわらず、酸欠事故を防止するために必ず設置しなければならない。","options":["(1) イ、ロ","(2) イ、ハ","(3) ロ、ハ","(4) ロ、ニ","(5) イ、ハ、ニ"],"answer":2,"explanation":"・圧力容器に取り付ける安全弁の最小口径は、容器の外径と長さの積の平方根と、冷媒の種類ごとに高圧部、低圧部に分けて定められた定数の積で決まる。\n・破裂板は、取り付けられる容器内の圧力を直接検知して破裂し、内部の冷媒を放出することにより、圧力の異常な上昇を防ぐ。溶栓は、温度の上昇により溶融することで冷媒を放出し、圧力の異常な上昇を防ぐ。\n・高圧遮断装置は、高圧側の圧力の異常な上昇を検知して作動し、圧縮機を駆動している電動機の電源を切って圧縮機を停止させる。\n・可燃性ガス、毒性ガス（経済産業大臣が告示で定めるものに限る。）又は特定不活性ガスの製造施設には、当該製造施設から漏えいするガスが滞留するおそれのある場所に、ガス漏えい検知警報設備の設置が義務付けられている。","has_image":false,"image_path":null},{"id":"R01-Hoan-Q12","year":"R01","subject":"保安管理技術","category":"材料の強さ・圧力容器","tags":[],"question":"次のイ、ロ、ハ、ニの記述のうち、圧力容器などについて正しいものはどれか。\nイ．圧力容器の鏡板の板厚は、同じ設計圧力で、同じ材質では、さら形よりも半球形を用いたほうが薄くできる。\nロ．円筒胴の圧力容器の胴板に生じる応力は、円筒胴の接線方向に作用する応力と長手方向に作用する応力を考えればよい。円筒胴の接線方向の引張応力は、長手方向の引張応力よりも大きい。\nハ．圧力容器の腐れしろは、材料の種類により異なり、鋼、銅および銅合金は1mmとする。また、ステンレス鋼には腐れしろを設ける必要がない。\nニ．圧力容器の強度や保安に関する圧力は、設計圧力、許容圧力ともに絶対圧力を使用する。","options":["(1) イ、ロ","(2) イ、ハ","(3) イ、ニ","(4) ロ、ハ","(5) ロ、ニ"],"answer":1,"explanation":"・圧力容器の鏡板の板厚は、同じ設計圧力で、同じ材質では、さら形よりも半球形を用いたほうが薄くできる。\n・円筒胴の圧力容器の胴板に生じる応力は、円筒胴の接線方向に作用する応力と長手方向に作用する応力を考えればよい。円筒胴の接線方向の引張応力は、長手方向の引張応力よりも大きい。\n・圧力容器の腐れしろは、材料の種類により異なり、鋼の直接風雨にさらされない部分で耐蝕処理を施したものは0.5mm、鋼の被冷却液または加熱熱媒に触れる部分およびその他の部分は1mm、銅、銅合金およびステンレス鋼は0.2mmとしなければならない。なお、鋳鉄の腐れしろは1mmである。\n・圧力容器の強度や保安に関する圧力は、設計圧力、許容圧力ともにゲージ圧力を使用する。","has_image":false,"image_path":null},{"id":"R01-Hoan-Q13","year":"R01","subject":"保安管理技術","category":"据付け・試験・試運転","tags":[],"question":"次のイ、ロ、ハ、ニの記述のうち、冷凍装置の据付け、圧力試験および試運転について正しいものはどれか。\nイ．多気筒圧縮機を支持するコンクリート基礎の質量は、圧縮機の質量と同程度にする。\nロ．アンモニア冷凍装置の気密試験には、乾燥空気、窒素ガスまたは酸素を使用し、炭酸ガスを使用してはならない。\nハ．受液器を設けた冷凍装置に冷媒を充てんするときは、受液器の冷媒出口弁を閉じ、圧縮機を運転しながら、その先の冷媒チャージ弁から液状の冷媒を充てんする。\nニ．真空試験では、装置内に残留水分があると真空になりにくいので、乾燥のために水分の残留しやすい場所を、120 ℃ を超えない範囲で加熱するとよい。","options":["(1) イ、ロ","(2) イ、ハ","(3) ロ、ハ","(4) ロ、ニ","(5) ハ、ニ"],"answer":5,"explanation":"・多気筒圧縮機を支持するコンクリート基礎の質量は、圧縮機、電動機またはエンジンなどの駆動機の質量の2～3倍程度にする。\n・気密試験に使用するガスは、空気または不燃性ガスとし、酸素や毒性ガス、可燃性ガスを使用してはならない。一般には、乾燥空気、窒素ガス、炭酸ガスが用いられるが、アンモニア冷凍装置に対しては炭酸ガスを使用してはならない。\n・受液器を設けた冷凍装置に冷媒を充てんするときは、受液器の冷媒出口弁を閉じ、圧縮機を運転しながら、その先の冷媒チャージ弁から液状の冷媒を充てんする。\n・真空試験では、装置内に残留水分があると真空になりにくいので、乾燥のために水分の残留しやすい場所を、120℃を超えない範囲で加熱するとよい。","has_image":false,"image_path":null},{"id":"R01-Hoan-Q14","year":"R01","subject":"保安管理技術","category":"冷凍装置の運転","tags":[],"question":"次のイ、ロ、ハ、ニの記述のうち、冷凍装置の運転管理について正しいものはどれか。\nイ．毎日運転する冷凍装置の運転開始前の準備では、配管中にある電磁弁の作動、操作回路の絶縁低下、電動機の始動状態の確認を省略できる場合がある。\nロ．蒸発圧力が一定のもとで、圧縮機の吐出しガス圧力が高くなると、圧力比は大きくなり、圧縮機の体積効率が増大し、圧縮機駆動の軸動力は増加する。\nハ．冷凍装置を長期間休止させる場合には、低圧側の冷媒を受液器に回収するが、装置内への空気の侵入を防ぐために、低圧側と圧縮機内に大気圧より高いガス圧力を残しておく。\nニ．水冷凝縮器の冷却水量が減少すると、凝縮圧力の低下、圧縮機吐出しガス温度の上昇、冷凍装置の冷凍能力の低下が起こる。","options":["(1) イ、ロ","(2) イ、ハ","(3) ロ、ハ","(4) ロ、ニ","(5) ハ、ニ"],"answer":2,"explanation":"・毎日運転する冷凍装置の運転開始前の準備では、配管中にある電磁弁の作動、操作回路の絶縁低下、電動機の始動状態の確認を省略できる場合がある。\n・蒸発圧力が一定のもとで、圧縮機の吐出しガス圧力が高くなると、圧力比は大きくなるので、圧縮機の体積効率が低下し、圧縮機駆動の軸動力が増加する。\n・冷凍装置を長期間休止させる場合には、低圧側の冷媒を受液器に回収するが、装置内への空気の侵入を防ぐために、低圧側と圧縮機内に大気圧より高いガス圧力を残しておく。\n・水冷凝縮器の冷却水量が減少すると、凝縮圧力の上昇、圧縮機吐出しガス温度の上昇、装置の冷凍能力の低下が起こる","has_image":false,"image_path":null},{"id":"R01-Hoan-Q15","year":"R01","subject":"保安管理技術","category":"冷凍装置の保守管理","tags":[],"question":"次のイ、ロ、ハ、ニの記述のうち、冷凍装置の保守管理について正しいものはどれか。\nイ．横走り吸込み配管の途中の大きなUトラップに冷媒液や油がたまっていると、圧縮機の始動時やアンロードからロード運転に切り換わったときに、液戻りが生じる。とくに、圧縮機の近くでは、立ち上がり吸込み管以外には、Uトラップを、設けないようにする。\nロ．強制給油式の往復圧縮機では、潤滑装置と冷凍機油の状態がその潤滑作用に大きな影響を及ぼす。油圧が過大になると、シリンダ部への給油量が多くなり、凝縮器、蒸発器の熱交換部の汚れを引き起こす。\nハ．密閉形フルオロカーボン往復圧縮機では、冷媒充てん量が不足していると、吸込み蒸気による電動機の冷却が不十分になり、電動機を焼損するおそれがある。冷媒充てん量の不足は、運転中の受液器の冷媒液面の低下によって確認できる。\nニ．アンモニア冷凍装置の冷媒系統に水分が浸入すると、アンモニアがアンモニア水になるので、少量の水分の浸入であっても、冷凍装置内でのアンモニア冷媒の蒸発圧力の低下、冷凍機油の乳化による潤滑性能の低下などを引き起こし、運転に重大な支障をきたす。","options":["(1) イ、ロ","(2) ハ、ニ","(3) イ、ロ、ハ","(4) ロ、ハ、ニ","(5) イ、ロ、ハ、ニ"],"answer":3,"explanation":"・横走り吸込み配管の途中の大きなUトラップに冷媒液や油がたまっていると、圧縮機の始動時やアンロードからロード運転に切り換わったときに、液戻りが生じる。とくに、圧縮機の近くでは、立ち上がり吸込み管以外には、Uトラップを、設けないようにする。\n・強制給油式の往復圧縮機では、潤滑装置と冷凍機油の状態がその潤滑作用に大きな影響を及ぼす。油圧が過大になると、シリンダ部への給油量が多くなり、凝縮器、蒸発器の熱交換部の汚れを引き起こす。\n・密閉形フルオロカーボン往復圧縮機では、冷媒充てん量が不足していると、吸込み蒸気による電動機の冷却が不十分になり、電動機を焼損するおそれがある。冷媒充てん量の不足は、運転中の受液器の冷媒液面の低下によって確認できる。\n・アンモニア冷凍装置の冷媒系統に水分が浸入すると、アンモニアがアンモニア水になるので、少量の水分の浸入があっても性能に与える影響はない。ただし、多量の水分の侵入は、冷凍装置内でのアンモニア冷媒の蒸発圧力の低下、冷凍機油の乳化による潤滑性能の低下などを引き起こし、運転に重大な支障をきたす。","has_image":false,"image_path":null}

// ========================================================
// アプリケーションロジック
// ========================================================
var allQuestions = [];
var currentQuestions = [];
var currentQuestion = null;
var currentIndex = 0;
var storageAvailable = false;

var STORAGE_KEY = 'denken3_houki_v2';

// localStorage の可用性チェック（プライベートブラウズ対策）
function checkStorage() {
  try {
    var test = '__storage_test__';
    localStorage.setItem(test, '1');
    localStorage.removeItem(test);
    storageAvailable = true;
  } catch(e) {
    storageAvailable = false;
    document.getElementById('storageBanner').style.display = 'block';
  }
}

function loadResults() {
  if (!storageAvailable) return {};
  try {
    return JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
  } catch(e) {
    return {};
  }
}

function saveResult(id, isCorrect, category) {
  if (!storageAvailable) return;
  var data = loadResults();
  if (!data[id]) {
    data[id] = { correct: 0, wrong: 0, category: category };
  }
  if (isCorrect) { data[id].correct++; } else { data[id].wrong++; }
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
  } catch(e) {
    // クォータ超過時: 古いデータを削除して再試行
    try {
      localStorage.removeItem(STORAGE_KEY);
      localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
    } catch(e2) {
      storageAvailable = false;
      document.getElementById('storageBanner').style.display = 'block';
    }
  }
}

function getStats() {
  var data = loadResults();
  var total = 0, correct = 0;
  for (var key in data) {
    if (Object.prototype.hasOwnProperty.call(data, key)) {
      correct += data[key].correct;
      total += data[key].correct + data[key].wrong;
    }
  }
  return {
    total: total,
    correct: correct,
    rate: total === 0 ? 0 : Math.round(correct / total * 100)
  };
}

function updateStats() {
  var stats = getStats();
  document.getElementById('totalQuestions').textContent = allQuestions.length;
  document.getElementById('correctRate').textContent = stats.rate + '%';
  document.getElementById('answerCount').textContent = stats.total;
  if (currentQuestions.length > 0) {
    document.getElementById('currentQuestionIndex').textContent = (currentIndex + 1) + ' / ' + currentQuestions.length;
  } else {
    document.getElementById('currentQuestionIndex').textContent = '-';
  }
  updateCategoryStats();
}

function updateCategoryStats() {
  var data = loadResults();
  var map = {};
  for (var key in data) {
    if (Object.prototype.hasOwnProperty.call(data, key)) {
      var item = data[key];
      if (!map[item.category]) {
        map[item.category] = { total: 0, correct: 0 };
      }
      map[item.category].correct += item.correct;
      map[item.category].total += item.correct + item.wrong;
    }
  }
  var body = document.getElementById('categoryStatsBody');
  body.innerHTML = '';
  var categories = Object.keys(map).sort();
  for (var i = 0; i < categories.length; i++) {
    var cat = categories[i];
    var row = document.createElement('tr');
    var rate = map[cat].total === 0 ? 0 : Math.round(map[cat].correct / map[cat].total * 100);
    row.innerHTML =
      '<td>' + cat + '</td>' +
      '<td>' + map[cat].total + '</td>' +
      '<td>' + map[cat].correct + '</td>' +
      '<td>' + rate + '%</td>';
    body.appendChild(row);
  }
}

function populateFilters() {
  var yearSet = {}, categorySet = {};
  for (var i = 0; i < allQuestions.length; i++) {
    yearSet[allQuestions[i].year] = true;
    categorySet[allQuestions[i].category] = true;
  }
  var yearFilter = document.getElementById('yearFilter');
  var categoryFilter = document.getElementById('categoryFilter');

  var years = Object.keys(yearSet).sort();
  for (var i = 0; i < years.length; i++) {
    var opt = document.createElement('option');
    opt.value = years[i];
    opt.textContent = years[i] + '年';
    yearFilter.appendChild(opt);
  }

  var categories = Object.keys(categorySet).sort();
  for (var i = 0; i < categories.length; i++) {
    var opt = document.createElement('option');
    opt.value = categories[i];
    opt.textContent = categories[i];
    categoryFilter.appendChild(opt);
  }
}

function startQuiz() {
  if (allQuestions.length === 0) {
    alert('データ準備中です。しばらくお待ちください。');
    return;
  }
  var year = document.getElementById('yearFilter').value;
  var category = document.getElementById('categoryFilter').value;
  var mode = document.getElementById('modeFilter').value;
  var results = loadResults();

  currentQuestions = [];
  for (var i = 0; i < allQuestions.length; i++) {
    var q = allQuestions[i];
    if (year !== 'all' && q.year !== year) continue;
    if (category !== 'all' && q.category !== category) continue;
    if (mode === 'wrongOnly' && (!results[q.id] || results[q.id].wrong === 0)) continue;
    if (mode === 'unanswered' && results[q.id]) continue;
    currentQuestions.push(q);
  }

  currentIndex = 0;
  if (currentQuestions.length === 0) {
    alert('該当する問題がありません。条件を変えてください。');
    return;
  }
  showQuestion();
}

function showQuestion() {
  currentQuestion = currentQuestions[currentIndex];
  document.getElementById('quizContent').style.display = 'block';
  document.getElementById('loadingMsg').style.display = 'none';
  document.getElementById('progressBar').style.display = 'none';
  document.getElementById('answerInfo').style.display = 'none';
  document.getElementById('nextBtn').style.display = 'none';

  document.getElementById('questionMeta').textContent =
    currentQuestion.year + '年 ／ ' + currentQuestion.category + ' ／ ' + currentQuestion.id;
  document.getElementById('questionText').textContent = currentQuestion.question;

  var container = document.getElementById('optionsContainer');
  container.innerHTML = '';

  for (var i = 0; i < currentQuestion.options.length; i++) {
    (function(idx, optText) {
      var btn = document.createElement('button');
      btn.className = 'option-btn';
      btn.textContent = optText;
      btn.setAttribute('type', 'button');
      btn.onclick = function() { answerQuestion(idx, btn); };
      container.appendChild(btn);
    })(i + 1, currentQuestion.options[i]);
  }

  updateStats();
  // ページトップへスクロール（モバイルで問題が見えないのを防ぐ）
  window.scrollTo(0, 0);
}

function answerQuestion(choice, buttonElement) {
  var buttons = document.getElementsByClassName('option-btn');
  for (var i = 0; i < buttons.length; i++) {
    buttons[i].disabled = true;
  }

  var correct = currentQuestion.answer;
  var isCorrect = choice === correct;

  if (isCorrect) {
    buttonElement.classList.add('correct');
  } else {
    buttonElement.classList.add('wrong');
    if (buttons[correct - 1]) {
      buttons[correct - 1].classList.add('correct');
    }
  }

  saveResult(currentQuestion.id, isCorrect, currentQuestion.category);

  var info = document.getElementById('answerInfo');
  info.style.display = 'block';
  info.innerHTML =
    '<b>' + (isCorrect ? '✅ 正解！' : '❌ 不正解') + '</b><br><br>' +
    '正解：(' + correct + ')<br><br>' +
    (currentQuestion.explanation || '解説なし');

  document.getElementById('nextBtn').style.display = 'block';
  updateStats();
}

function nextQuestion() {
  currentIndex++;
  if (currentIndex >= currentQuestions.length) {
    alert('選択された範囲の問題を一通り確認しました。最初の問題に戻ります。');
    currentIndex = 0;
  }
  showQuestion();
}

// ========================================================
// 初期化：チャンクを非同期でロードしてからUIを構築
// ========================================================
function initApp() {
  checkStorage();

  // 全チャンクを結合
  var combined = [];
  for (var i = 0; i < NUM_CHUNKS; i++) {
    if (CHUNKS[i]) {
      combined = combined.concat(CHUNKS[i]);
    }
  }

  // チャンクを非同期で処理してメインスレッドをブロックしない
  loadChunksAsync(function() {
    allQuestions = combined;
    populateFilters();
    updateStats();
    document.getElementById('loadingMsg').textContent =
      '✅ 準備完了（' + allQuestions.length + '問）。「問題開始」を押してください。';
  });
}

// DOMContentLoaded後に初期化
if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', initApp);
} else {
  setTimeout(initApp, 0);
}
</script>
