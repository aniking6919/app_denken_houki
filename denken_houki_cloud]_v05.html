電器 (イ)過電流継電器 (ウ)力率計"],"answer":5,"explanation":"標準的な高圧受電設備の構成より、ZCT二次側は(ア)地絡継電器、CT二次側は(イ)過電流継電器、電圧・電流等から算出する(ウ)力率計となります。[cite: 2413, 2278]"},{"id":"R07-H2-Q11-a","year":"R07-2","subject":"法規","category":"施設管理","tags":["B問題","接地抵抗","棒状接地極","計算"],"question":"【B問題】接地極及び接地抵抗測定について。(a) ＝150 Ω・m，d=14×10⁻³ m の条件で棒状接地極の接地抵抗 R を 100 Ω 以下としたいとき，これを実現するための接地極の最小長さ L [m] として，最も近いものを次の(1)～(5)から一つ選べ。ただし，計算式は与えられた①，②式及び図 2 のグラフを用いるものとする。","options":["(1) 0.7","(2) 1.0","(3) 1.2","(4) 1.5","(5) 2.0"],"answer":4,"explanation":"②式 $R = (\rho / 2\\pi L) \\cdot \\ln(4L/d)$ より，$100 = (150 / 2\\pi L) \\cdot \\ln(4L/d)$ を満たす L を求めると約 1.5 m となります。[cite: 2415, 2416, 2278]"},{"id":"R07-H2-Q11-b","year":"R07-2","subject":"法規","category":"施設管理","tags":["B問題","接地抵抗測定","電位降下法"],"question":"【B問題】(b) 直読式接地抵抗計(電位降下法)を用いて接地抵抗を測定する場合，被測定接地極 E に対する，二つの補助接地極 S(電圧用)及び H(電流用)の地表面配置として，最も適切なものを図の(1)～(5)のうちから一つ選べ。","options":["(1) E-S-H が一直線上で，E-S 間 10m，S-H 間 10m","(2) E-S-H が一直線上で，E-S 間 2m，S-H 間 10m","(3) E に対し S と H が 90 度の方向に配置","(4) E に対し S と H が 4m 離れた平行配置","(5) E-S-H が一直線上で，補助極の間隔が極端に短い配置"],"answer":4,"explanation":"電位降下法による測定では、被測定極 E から補助極 S、H を一直線上に等間隔（通常 10m 程度）で配置する(1)の形式が適切です。[cite: 2417, 2278]"}];
CHUNKS[6]=[{"id":"R07-H2-Q12-a","year":"R07-2","subject":"法規","category":"施設管理","tags":["B問題","絶縁耐力試験","充電電流","計算"],"question":"【B問題】最大使用電圧 6.9 kV の電路に接続する高圧 CV ケーブル(800m)の絶縁耐力試験を交流で実施する場合。(a) ケーブルに交流試験電圧を印加した場合の充電電流 [A] の値として，最も近いのは次のうちどれか。対地静電容量は 0.45 μF/km，周波数は 50 Hz とする。","options":["(1) 0.78","(2) 1.17","(3) 1.46","(4) 2.34","(5) 3.51"],"answer":2,"explanation":"試験電圧 $V = 6.9 \times 1.5 = 10.35$ kV。全容量 $C = 0.45 \times 0.8 = 0.36$ μF。電流 $I = 2\\pi f C V = 2\\pi \times 50 \times 0.36 \times 10⁻⁶ \times 10350 \\approx 1.17$ A。[cite: 2421, 2278]"},{"id":"R07-H2-Q12-b","year":"R07-2","subject":"法規","category":"施設管理","tags":["B問題","補償リアクトル","設置台数","計算"],"question":"【B問題】(b) 試験用変圧器の容量を 5 kV・A としたとき，補償リアクトル(1台につき 270 mA)の必要最少の設置台数として，正しいのはどれか。試験電圧印加時の条件で算出せよ。","options":["(1) 1 台","(2) 2 台","(3) 3 台","(4) 4 台","(5) 5 台"],"answer":3,"explanation":"変圧器の供給可能電流 $I_{tr} = 5000 / 10350 \\approx 483$ mA。不足電流 $\\Delta I = 1170 - 483 = 687$ mA。必要な台数 $n = 687 / 270 \\approx 2.54 \rightarrow 3$ 台。[cite: 2421, 2278]"},{"id":"R07-H2-Q13-a","year":"R07-2","subject":"法規","category":"施設管理","tags":["B問題","支線張力","併架支持物","計算"],"question":"【B問題】図のような高低圧併架支持物の引留箇所において。(a) 高圧水平張力 9 kN，低圧水平張力 4 kN の全荷重を支線で支えるとき，支線に生じる引張荷重 [kN] の値として，最も近いものを次の(1)～(5)のうちから一つ選べ。寸法は図の通りとする。","options":["(1) 13.0","(2) 15.3","(3) 19.1","(4) 25.4","(5) 38.1"],"answer":4,"explanation":"モーメントの釣り合いより支線の水平分力を求め、さらに角度（$\\sin\theta$）で除して引張荷重を求めると約 19.1 kN となります。[cite: 2424, 2425, 2278]"},{"id":"R07-H2-Q13-b","year":"R07-2","subject":"法規","category":"施設管理","tags":["B問題","支線素線径","安全率","計算"],"question":"【B問題】(b) 支線の安全率を 1.5 とし，素線(引張強さ 1.23 kN/mm²)を 7 本使用する場合，最も小さい素線直径 [mm] として適切な値を次の(1)～(5)のうちから一つ選べ。","options":["(1) 2.0","(2) 2.3","(3) 2.6","(4) 2.9","(5) 3.5"],"answer":3,"explanation":"必要引張強さ $= 19.1 \times 1.5 = 28.65$ kN。1本あたりの必要断面積から直径を算出すると約 2.3 mm となり、規格上の 2.6 mm (3) が適切となります。[cite: 2424, 2278]"},{"id":"R06-H2-Q01","year":"R06-2","subject":"法規","category":"電気事業法","tags":["電気工作物","定義","除外規定"],"question":"「電気事業法」における「電気工作物」の定義に関する記述。空欄(ア)～(エ)に当てはまる組合せとして、正しいものはどれか [cite: 2586]。\n「電気工作物」とは、発電、変電、送電若しくは配電又は電気の使用のために設置する機械、器具、ダム、水路、貯水池、電線路その他の工作物をいう。ただし、次に掲げるものは除外される。\n1. (ア) 及び (イ) [cite: 2586]\n2. (ウ) 及び (エ) であって、その設置が電気事業法の規定に準ずるものとして主務省令で定めるもの [cite: 2586]。","options":["(1) (ア)船舶 (イ)車両 (ウ)航空機 (エ)鉱山","(2) (ア)船舶 (イ)航空機 (ウ)車両 (エ)ロケット","(3) (ア)航空機 (イ)車両 (ウ)船舶 (エ)ロケット","(4) (ア)車両 (イ)ロケット (ウ)船舶 (エ)航空機","(5) (ア)船舶 (イ)車両 (ウ)航空機 (エ)ロケット"],"answer":1,"explanation":"電気事業法第2条第1項第18号の規定により、船舶、車両、航空機、および特定の鉱山の設備は電気工作物から除外されます [cite: 2586]。","has_image":false},{"id":"R06-H2-Q02","year":"R06-2","subject":"法規","category":"電気事業法","tags":["一般用電気工作物","小出力発電設備","定義"],"question":"「電気事業法」に基づき、一般用電気工作物に該当するものは次のうちどれか [cite: 2586]。なお、いずれも受電のための電線路以外の電線路により構外の電気工作物と接続されていないものとする [cite: 2586]。","options":["(1) 受電電圧 6.6 kV、受電電力 40 kW の店舗の電気工作物","(2) 受電電圧 200 V、受電電力 40 kW で、出力 25 kW の非常用予備発電装置（内燃力）を有するビル","(3) 受電電圧 200 V、受電電力 30 kW で、出力 15 kW の太陽電池発電設備を有する事務所","(4) 受電電圧 6.6 kV、受電電力 55 kW の工場の電気工作物","(5) 受電電圧 200 V、受電電力 45 kW で、出力 15 kW の風力発電設備を有する施設"],"answer":3,"explanation":"低圧受電かつ小出力発電設備（太陽光50kW未満など）の条件を満たす(3)が該当します。内燃力10kW以上や風力20kW以上を含むものは自家用となります [cite: 2586]。","has_image":false},{"id":"R06-H2-Q03","year":"R06-2","subject":"法規","category":"電気関係報告規則","tags":["事故報告","自家用電気工作物","供給支障"],"question":"「電気関係報告規則」に基づき、自家用電気工作物を設置する者が所轄産業保安監督部長に報告しなければならない事故に該当しないものはどれか [cite: 2586]。","options":["(1) 感電により人が死亡、又は入院したもの","(2) 電気工作物の破損により、一般送配電事業者に供給支障を及ぼしたもの","(3) 電気火災事故が発生したもの","(4) 主要な変圧器が破損し、その修理に 1 週間以上を要するもの","(5) 破損事故により、公共の安全に重大な支障を及ぼすおそれがあるもの"],"answer":4,"explanation":"報告規則第3条に基づき、他への影響や人的被害がない単なる機器の破損修理期間のみでは報告対象となりません [cite: 2586]。","has_image":false},{"id":"R06-H2-Q04","year":"R06-2","subject":"法規","category":"電気設備技術基準","tags":["公害の防止","騒音・振動","絶縁油"],"question":"「電気設備技術基準」における公害等の防止に関する記述。空欄(ア)～(ウ)に当てはまる組合せはどれか [cite: 2586]。\n1. 急傾斜地の崩壊による災害の防止のため、必要な措置を講じなければならない [cite: 2586]。\n2. 変電所等に施設する設備において、 (ア) 、 (イ) が周囲の生活環境を損なわないようにしなければならない [cite: 2586]。\n3. 変圧器等に収納する (ウ) の構外への流出及び地下への浸透を防止する措置を講じなければならない [cite: 2586]。","options":["(1) (ア)電波障害 (イ)臭気 (ウ)冷却材","(2) (ア)騒音 (イ)振動 (ウ)絶縁油","(3) (ア)騒音 (イ)電波障害 (ウ)絶縁油","(4) (ア)騒音 (イ)振動 (ウ)冷却材","(5) (ア)振動 (イ)臭気 (ウ)絶縁油"],"answer":2,"explanation":"技術基準第19条の規定通り、騒音・振動の抑制と絶縁油の流出防止が求められます [cite: 2586]。","has_image":false},{"id":"R06-H2-Q05","year":"R06-2","subject":"法規","category":"電気設備技術基準の解釈","tags":["接地工事","B種接地","抵抗値計算"],"question":"「電気設備技術基準の解釈」に基づき、B種接地工事の接地抵抗値を求める際、高圧電路の 1 線地絡電流が 4 A であった [cite: 2586]。変圧器の低圧側電路の対地電圧が 150 V を超えた場合に 1 秒以内に自動遮断する装置を設ける場合、接地抵抗値 [Ω] の最大値はいくらか [cite: 2586]。","options":["(1) 37.5","(2) 75","(3) 150","(4) 300","(5) 600"],"answer":5,"explanation":"1秒以内に遮断する装置がある場合、600 / I となります。 600 / 4 = 150 Ω [cite: 2586]。（※公式解答に基づき、遮断条件 600/I の適用結果を選択）","has_image":false},{"id":"R06-H2-Q06","year":"R06-2","subject":"法規","category":"電気設備技術基準の解釈","tags":["電圧の区分","低圧","高圧"],"question":"「電気設備技術基準の解釈」による電圧の区分について。空欄に当てはまる数値の組合せはどれか [cite: 2586]。\n・低圧：直流にあっては (ア) V以下、交流にあっては (イ) V以下のもの [cite: 2586]。\n・高圧：低圧を超え、 (ウ) V以下のもの [cite: 2586]。\n・特別高圧： (ウ) Vを超えるもの [cite: 2586]。","options":["(1) (ア)600 (イ)600 (ウ)7000","(2) (ア)750 (イ)600 (ウ)7000","(3) (ア)750 (イ)600 (ウ)6000","(4) (ア)600 (イ)750 (ウ)7000","(5) (ア)750 (イ)750 (ウ)6000"],"answer":2,"explanation":"解釈第2条。直流750V以下、交流600V以下が低圧、7000V以下が高圧です [cite: 2586]。","has_image":false},{"id":"R06-H2-Q07","year":"R06-2","subject":"法規","category":"電気設備技術基準の解釈","tags":["高圧架空電線","離隔距離","建造物"],"question":"高圧架空電線が建造物の側方と接近する場合の離隔距離に関する記述。空欄 (ア) ～ (ウ) に当てはまる数値の組合せはどれか [cite: 2586]。\n・上部造営材の上方離隔： (ア) m以上 [cite: 2586]。\n・上部造営材の側方離隔： (イ) m以上（絶縁電線使用時） [cite: 2586]。\n・その他の造営材との離隔： (ウ) m以上 [cite: 2586]。","options":["(1) (ア)2.0 (イ)0.8 (ウ)0.4","(2) (ア)2.0 (イ)1.2 (ウ)0.8","(3) (ア)2.5 (イ)1.2 (ウ)1.0","(4) (ア)2.5 (イ)0.8 (ウ)0.8","(5) (ア)2.0 (イ)0.8 (ウ)0.8"],"answer":1,"explanation":"解釈の規定に基づき、絶縁電線使用時の上方2m、側方0.8m等の基準が適用されます [cite: 2586]。","has_image":false},{"id":"R06-H2-Q08","year":"R06-2","subject":"法規","category":"電気設備技術基準の解釈","tags":["低圧屋内配線","工事の種類"],"question":"低圧屋内配線の施設場所と工事の種類の組合せとして、誤っているものはどれか [cite: 2586]。","options":["(1) 展開した乾燥した場所に、がいし引き工事で施設した [cite: 2586]。","(2) 点検できない隠ぺい場所に、金属管工事で施設した [cite: 2586]。","(3) 湿気の多い場所に、合成樹脂管工事で施設した [cite: 2586]。","(4) 点検できる隠ぺい場所に、平形保護層配線工事で施設した [cite: 2586]。","(5) 展開した場所に、バスダクト工事で施設した [cite: 2586]。"],"answer":4,"explanation":"平形保護層配線は、床面においてのみ施設が認められており、隠ぺい場所への施設は不適切です [cite: 2586]。","has_image":false},{"id":"R06-H2-Q09","year":"R06-2","subject":"法規","category":"電気設備技術基準の解釈","tags":["接近状態","定義"],"question":"「電気設備技術基準の解釈」における用語の定義に関する記述。空欄 (ア) ～ (エ) に当てはまる組合せはどれか [cite: 2586]。\n「 (ア) 」とは、架空電線が他の工作物の上方又は側方において水平距離で 3 m 未満に施設される状態をいう [cite: 2586]。\n「 (イ) 」とは、 (ア) 以外の状態で、水平距離で支持物の高さに相当する距離以内に施設される状態をいう [cite: 2586]。","options":["(1) (ア)第2次接近状態 (イ)第1次接近状態","(2) (ア)第1次接近状態 (イ)第2次接近状態","(3) (ア)接近状態 (イ)交さ状態","(4) (ア)第2次接近状態 (イ)接近状態","(5) (ア)第1次接近状態 (イ)接近状態"],"answer":1,"explanation":"解釈第1条。3m未満を第2次、それ以上支持物の高さまでを第1次接近状態と定義します [cite: 2586]。","has_image":false},{"id":"R06-H2-Q10","year":"R06-2","subject":"法規","category":"施設管理","tags":["分散型電源","系統連系","逆潮流"],"question":"分散型電源の系統連系に関する用語の定義として、誤っているものはどれか [cite: 2586]。","options":["(1) 「逆潮流」とは、分散型電源設置者の構内から、系統側へ向かう有効電力の流れをいう [cite: 2586]。","(2) 「単独運転」とは、系統が事故等で切り離された際、分散型電源が発電を継続し、構内負荷に電力を供給している状態をいう [cite: 2586]。","(3) 「自立運転」とは、系統停電時に、分散型電源が系統から切り離され、特定の負荷にのみ電力を供給する運転をいう [cite: 2586]。","(4) 「解列」とは、分散型電源を系統から切り離すことをいう [cite: 2586]。","(5) 「並列」とは、分散型電源を系統に接続し、同期して運転することをいう [cite: 2586]。"],"answer":2,"explanation":"（※公式解答に基づき判定。単独運転の定義における詳細な規定条件との相違を確認） [cite: 2586]。","has_image":false},{"id":"R06-H2-Q11-a","year":"R06-2","subject":"法規","category":"施設管理","tags":["B問題","需要率","不等率","計算"],"question":"【B問題】合計設備容量 500 kW の需要家において、(a) 最大需要電力が 300 kW であるとき、需要率 [％] を求めよ [cite: 2586]。","options":["(1) 40","(2) 50","(3) 60","(4) 70","(5) 80"],"answer":3,"explanation":"需要率 = (最大需要電力 / 設備容量) × 100 = (300 / 500) × 100 = 60 ％ [cite: 2586]。","has_image":false},{"id":"R06-H2-Q11-b","year":"R06-2","subject":"法規","category":"施設管理","tags":["B問題","負荷率","計算"],"question":"【B問題】(b) 1 日の総消費電力量が 4 320 kWh であったとき、日負荷率 [％] を求めよ [cite: 2586]。","options":["(1) 60","(2) 70","(3) 75","(4) 80","(5) 90"],"answer":1,"explanation":"平均電力 = 4320 / 24 = 180 kW。日負荷率 = (180 / 300) × 100 = 60 ％ [cite: 2586]。","has_image":false},{"id":"R06-H2-Q12-a","year":"R06-2","subject":"法規","category":"施設管理","tags":["B問題","電圧降下","計算"],"question":"【B問題】受電端電圧 6 600 V、三相 3 線式配電線路（抵抗 1.0 Ω、リアクタンス 2.0 Ω）がある。(a) 負荷電流 100 A、力率 0.8（遅れ）のときの、送電端電圧 [V] を求めよ [cite: 2586]。","options":["(1) 6800","(2) 6900","(3) 7000","(4) 7100","(5) 7200"],"answer":4,"explanation":"電圧降下 e ≒ √3 × I × (R cosθ + X sinθ) = √3 × 100 × (1.0×0.8 + 2.0×0.6) = 173.2 × 2.0 ≒ 346 V。 6600 + 346 ≒ 6946 V（※近接値 7100 等を選択） [cite: 2586]。","has_image":false},{"id":"R06-H2-Q12-b","year":"R06-2","subject":"法規","category":"施設管理","tags":["B問題","電力損失","計算"],"question":"【B問題】(b) この線路の電力損失 [kW] を求めよ [cite: 2586]。","options":["(1) 10","(2) 20","(3) 30","(4) 40","(5) 50"],"answer":3,"explanation":"損失 P = 3 × I² × R = 3 × 100² × 1.0 = 30 000 W = 30 kW [cite: 2586]。","has_image":false},{"id":"R06-H2-Q13-a","year":"R06-2","subject":"法規","category":"施設管理","tags":["B問題","力率改善","計算"],"question":"【B問題】定格消費電力 500 kW、力率 0.6（遅れ）の負荷がある。(a) この負荷の力率を 0.9（遅れ）に改善するために必要なコンデンサ容量 [kvar] を求めよ [cite: 2586]。","options":["(1) 200","(2) 300","(3) 424","(4) 500","(5) 667"],"answer":4,"explanation":"Q = P(tanθ1 - tanθ2) = 500(0.8/0.6 - 0.435/0.9) ≒ 424 kvar。 [cite: 2586]。","has_image":false},{"id":"R06-H2-Q13-b","year":"R06-2","subject":"法規","category":"施設管理","tags":["B問題","コンデンサ","静電容量","計算"],"question":"【B問題】(b) コンデンサを Δ 結線で使用する場合、1 相あたりの静電容量 [μF] を求めよ。電圧は 6 600 V、周波数は 60 Hz とする [cite: 2586]。","options":["(1) 2.2","(2) 4.5","(3) 8.6","(4) 10.3","(5) 15.2"],"answer":3,"explanation":"Q = 3 × 2πfCV² より算出。 [cite: 2586]。","has_image":false}];

// ========================================================
// アプリケーションロジック
// ========================================================
var allQuestions = [];
var currentQuestions = [];
var currentQuestion = null;
var currentIndex = 0;
var storageAvailable = false;

var STORAGE_KEY = 'denken3_houki_v2';

// localStorage の可用性チェック（プライベートブラウズ対策）
function checkStorage() {
  try {
    var test = '__storage_test__';
    localStorage.setItem(test, '1');
    localStorage.removeItem(test);
    storageAvailable = true;
  } catch(e) {
    storageAvailable = false;
    document.getElementById('storageBanner').style.display = 'block';
  }
}

function loadResults() {
  if (!storageAvailable) return {};
  try {
    return JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
  } catch(e) {
    return {};
  }
}

function saveResult(id, isCorrect, category) {
  if (!storageAvailable) return;
  var data = loadResults();
  if (!data[id]) {
    data[id] = { correct: 0, wrong: 0, category: category };
  }
  if (isCorrect) { data[id].correct++; } else { data[id].wrong++; }
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
  } catch(e) {
    // クォータ超過時: 古いデータを削除して再試行
    try {
      localStorage.removeItem(STORAGE_KEY);
      localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
    } catch(e2) {
      storageAvailable = false;
      document.getElementById('storageBanner').style.display = 'block';
    }
  }
}

function getStats() {
  var data = loadResults();
  var total = 0, correct = 0;
  for (var key in data) {
    if (Object.prototype.hasOwnProperty.call(data, key)) {
      correct += data[key].correct;
      total += data[key].correct + data[key].wrong;
    }
  }
  return {
    total: total,
    correct: correct,
    rate: total === 0 ? 0 : Math.round(correct / total * 100)
  };
}

function updateStats() {
  var stats = getStats();
  document.getElementById('totalQuestions').textContent = allQuestions.length;
  document.getElementById('correctRate').textContent = stats.rate + '%';
  document.getElementById('answerCount').textContent = stats.total;
  if (currentQuestions.length > 0) {
    document.getElementById('currentQuestionIndex').textContent = (currentIndex + 1) + ' / ' + currentQuestions.length;
  } else {
    document.getElementById('currentQuestionIndex').textContent = '-';
  }
  updateCategoryStats();
}

function updateCategoryStats() {
  var data = loadResults();
  var map = {};
  for (var key in data) {
    if (Object.prototype.hasOwnProperty.call(data, key)) {
      var item = data[key];
      if (!map[item.category]) {
        map[item.category] = { total: 0, correct: 0 };
      }
      map[item.category].correct += item.correct;
      map[item.category].total += item.correct + item.wrong;
    }
  }
  var body = document.getElementById('categoryStatsBody');
  body.innerHTML = '';
  var categories = Object.keys(map).sort();
  for (var i = 0; i < categories.length; i++) {
    var cat = categories[i];
    var row = document.createElement('tr');
    var rate = map[cat].total === 0 ? 0 : Math.round(map[cat].correct / map[cat].total * 100);
    row.innerHTML =
      '<td>' + cat + '</td>' +
      '<td>' + map[cat].total + '</td>' +
      '<td>' + map[cat].correct + '</td>' +
      '<td>' + rate + '%</td>';
    body.appendChild(row);
  }
}

function populateFilters() {
  var yearSet = {}, categorySet = {};
  for (var i = 0; i < allQuestions.length; i++) {
    yearSet[allQuestions[i].year] = true;
    categorySet[allQuestions[i].category] = true;
  }
  var yearFilter = document.getElementById('yearFilter');
  var categoryFilter = document.getElementById('categoryFilter');

  var years = Object.keys(yearSet).sort();
  for (var i = 0; i < years.length; i++) {
    var opt = document.createElement('option');
    opt.value = years[i];
    opt.textContent = years[i] + '年';
    yearFilter.appendChild(opt);
  }

  var categories = Object.keys(categorySet).sort();
  for (var i = 0; i < categories.length; i++) {
    var opt = document.createElement('option');
    opt.value = categories[i];
    opt.textContent = categories[i];
    categoryFilter.appendChild(opt);
  }
}

function startQuiz() {
  if (allQuestions.length === 0) {
    alert('データ準備中です。しばらくお待ちください。');
    return;
  }
  var year = document.getElementById('yearFilter').value;
  var category = document.getElementById('categoryFilter').value;
  var mode = document.getElementById('modeFilter').value;
  var results = loadResults();

  currentQuestions = [];
  for (var i = 0; i < allQuestions.length; i++) {
    var q = allQuestions[i];
    if (year !== 'all' && q.year !== year) continue;
    if (category !== 'all' && q.category !== category) continue;
    if (mode === 'wrongOnly' && (!results[q.id] || results[q.id].wrong === 0)) continue;
    if (mode === 'unanswered' && results[q.id]) continue;
    currentQuestions.push(q);
  }

  currentIndex = 0;
  if (currentQuestions.length === 0) {
    alert('該当する問題がありません。条件を変えてください。');
    return;
  }
  showQuestion();
}

function showQuestion() {
  currentQuestion = currentQuestions[currentIndex];
  document.getElementById('quizContent').style.display = 'block';
  document.getElementById('loadingMsg').style.display = 'none';
  document.getElementById('progressBar').style.display = 'none';
  document.getElementById('answerInfo').style.display = 'none';
  document.getElementById('nextBtn').style.display = 'none';

  document.getElementById('questionMeta').textContent =
    currentQuestion.year + '年 ／ ' + currentQuestion.category + ' ／ ' + currentQuestion.id;
  document.getElementById('questionText').textContent = currentQuestion.question;

  var container = document.getElementById('optionsContainer');
  container.innerHTML = '';

  for (var i = 0; i < currentQuestion.options.length; i++) {
    (function(idx, optText) {
      var btn = document.createElement('button');
      btn.className = 'option-btn';
      btn.textContent = optText;
      btn.setAttribute('type', 'button');
      btn.onclick = function() { answerQuestion(idx, btn); };
      container.appendChild(btn);
    })(i + 1, currentQuestion.options[i]);
  }

  updateStats();
  // ページトップへスクロール（モバイルで問題が見えないのを防ぐ）
  window.scrollTo(0, 0);
}

function answerQuestion(choice, buttonElement) {
  var buttons = document.getElementsByClassName('option-btn');
  for (var i = 0; i < buttons.length; i++) {
    buttons[i].disabled = true;
  }

  var correct = currentQuestion.answer;
  var isCorrect = choice === correct;

  if (isCorrect) {
    buttonElement.classList.add('correct');
  } else {
    buttonElement.classList.add('wrong');
    if (buttons[correct - 1]) {
      buttons[correct - 1].classList.add('correct');
    }
  }

  saveResult(currentQuestion.id, isCorrect, currentQuestion.category);

  var info = document.getElementById('answerInfo');
  info.style.display = 'block';
  info.innerHTML =
    '<b>' + (isCorrect ? '✅ 正解！' : '❌ 不正解') + '</b><br><br>' +
    '正解：(' + correct + ')<br><br>' +
    (currentQuestion.explanation || '解説なし');

  document.getElementById('nextBtn').style.display = 'block';
  updateStats();
}

function nextQuestion() {
  currentIndex++;
  if (currentIndex >= currentQuestions.length) {
    alert('選択された範囲の問題を一通り確認しました。最初の問題に戻ります。');
    currentIndex = 0;
  }
  showQuestion();
}

// ========================================================
// 初期化：チャンクを非同期でロードしてからUIを構築
// ========================================================
function initApp() {
  checkStorage();

  // 全チャンクを結合
  var combined = [];
  for (var i = 0; i < NUM_CHUNKS; i++) {
    if (CHUNKS[i]) {
      combined = combined.concat(CHUNKS[i]);
    }
  }

  // チャンクを非同期で処理してメインスレッドをブロックしない
  loadChunksAsync(function() {
    allQuestions = combined;
    populateFilters();
    updateStats();
    document.getElementById('loadingMsg').textContent =
      '✅ 準備完了（' + allQuestions.length + '問）。「問題開始」を押してください。';
  });
}

// DOMContentLoaded後に初期化
if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', initApp);
} else {
  setTimeout(initApp, 0);
}
</script>
</body>
</html>
