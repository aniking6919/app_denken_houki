:false},{"id":"R02-H-Q08","year":"R02","subject":"法規","category":"電気設備技術基準の解釈","tags":["特殊機器","電気自動車","電気浴器"],"question":"特殊機器等の施設に関する記述。正しい組合せはどれか [cite: 1576]。\na) 遊戯用電車の変圧器は、絶縁変圧器であり、1次側使用電圧は (ア) V以下。\nb) 電気浴器の2次側電路の使用電圧は (イ) V以下。\nc) 電気自動車等から供給を受ける設備（V2H等）を介した一般用電気工作物への出力は (ウ) kW未満。","options":["(1) (ア)300 (イ)10 (ウ)10","(2) (ア)150 (イ)5 (ウ)10","(3) (ア)300 (イ)5 (ウ)20","(4) (ア)150 (イ)10 (ウ)10","(5) (ア)300 (イ)10 (ウ)20"],"answer":1,"explanation":"遊戯用電車300V以下、電気浴器10V以下、V2H等の小出力発電設備は10kW未満が基準です [cite: 1465, 1576]。","has_image":false},{"id":"R02-H-Q09","year":"R02","subject":"法規","category":"電気設備技術基準の解釈","tags":["配線器具","施工方法"],"question":"低圧用の配線器具の施設に関する記述。空欄(ア)〜(ウ)に当てはまる組合せとして、正しいものはどれか [cite: 1577]。\na) (ア) ように施設すること。ただし、取扱者以外が開けられない場合は除く。\nb) 湿気や水気のある場所に施設する場合は、防湿装置を施すこと。\nc) 電線を接続する場合は、接続点に (イ) が加わらないようにすること。\nd) 屋外に施設する開閉器等は、 (ウ) おそれがある場合には堅ろうな防護装置を施すこと。","options":["(1) (ア)充電部分が露出しない (イ)張力 (ウ)感電の","(2) (ア)取扱者以外が容易に開けることができない (イ)異常電圧 (ウ)損傷を受ける","(3) (ア)取扱者以外が容易に開けることができない (イ)張力 (ウ)感電の","(4) (ア)取扱者以外が容易に開けることができない (イ)異常電圧 (ウ)感電の","(5) (ア)充電部分が露出しない (イ)張力 (ウ)損傷を受ける"],"answer":5,"explanation":"充電部の露出防止、張力緩和、機械的損傷防止の原則に基づきます [cite: 1465, 1578]。","has_image":false},{"id":"R02-H-Q10","year":"R02","subject":"法規","category":"電気設備技術基準の解釈","tags":["分散型電源","高圧連系","保護装置"],"question":"高圧の電力系統に分散型電源を連系する場合の保護装置に関する記述。空欄(ア)〜(ウ)に当てはまる組合せとして、正しいものはどれか [cite: 1579]。\na) 異常時に分散型電源を自動的に解列するため、次の異常を検出すること。\n ① 分散型電源の異常、 ② 系統の (ア) 、 ③ 単独運転\nb) (イ) が運用する電力系統において再閉路が行われる場合は、当該再閉路時に解列されていること。\nc) 系統側地絡事故の保護リレーとして、 (ウ) リレー等を用いること。","options":["(1) (ア)短絡事故又は地絡事故 (イ)一般送配電事業者 (ウ)欠相","(2) (ア)短絡事故又は地絡事故 (イ)発電事業者 (ウ)地絡過電圧","(3) (ア)高低圧混触事故 (イ)一般送配電事業者 (ウ)地絡過電圧","(4) (ア)高低圧混触事故 (イ)発電事業者 (ウ)欠相","(5) (ア)短絡事故又は地絡事故 (イ)一般送配電事業者 (ウ)地絡過電圧"],"answer":5,"explanation":"系統の事故検出、一般送配電事業者の再閉路との協調、地絡過電圧リレー（OVGR）による保護が規定されています [cite: 1465, 1580]。","has_image":false},{"id":"R02-H-Q11-a","year":"R02","subject":"法規","category":"電気関係報告規則","tags":["供給支障事故","B問題","計算"],"question":"【B問題】電気工作物に起因する供給支障事故について、(a) 空欄(ア)〜(エ)に当てはまる組合せとして、正しいものはどれか [cite: 1581]。","options":["(1) (ア)一般送配電事業 (イ)自家用電気工作物 (ウ)6,000 (エ)事故点1又は事故点2","(2) (ア)送電事業 (イ)事業用電気工作物 (ウ)3,000 (エ)事故点1又は事故点3","(3) (ア)一般送配電事業 (イ)事業用電気工作物 (ウ)6,000 (エ)事故点2又は事故点3","(4) (ア)送電事業 (イ)事業用電気工作物 (ウ)6,000 (エ)事故点1又は事故点2","(5) (ア)一般送配電事業 (イ)自家用電気工作物 (ウ)3,000 (エ)事故点2又は事故点3"],"answer":5,"explanation":"電気事業法第39条および報告規則の供給支障（3,000V以上）の定義に基づきます [cite: 1465, 1581]。","has_image":true,"image":"R02-H-Q11.png"},{"id":"R02-H-Q11-b","year":"R02","subject":"法規","category":"施設管理","tags":["保護協調","B問題","計算"],"question":"【B問題】(b) 図1〜3の保護協調に関する記述。空欄(ア)〜(エ)に当てはまる組合せとして、正しいものはどれか [cite: 1582]。","options":["(1) (ア)同期協調 (イ)曲線2 (ウ)曲線3 (エ)地絡距離継電器","(2) (ア)同期協調 (イ)曲線1 (ウ)曲線3 (エ)地絡方向継電器","(3) (ア)保護協調 (イ)曲線1 (ウ)曲線4 (エ)地絡距離継電器","(4) (ア)保護協調 (イ)曲線2 (ウ)曲線4 (エ)地絡方向継電器","(5) (ア)保護協調 (イ)曲線2 (ウ)曲線3 (エ)地絡距離継電器"],"answer":4,"explanation":"直近上位の遮断器のみが動作する「保護協調」と、地絡方向継電器（DGR）による選択遮断の概念を問う問題です [cite: 1465, 1582]。","has_image":true,"image":"R02-H-Q11.png"},{"id":"R02-H-Q12-a","year":"R02","subject":"法規","category":"電気設備技術基準の解釈","tags":["絶縁耐力試験","B問題","計算"],"question":"【B問題】変圧器の電路の絶縁耐力試験に関する記述について、(a) 表中の空白箇所(ア)〜(エ)に当てはまる組合せとして、正しいものはどれか [cite: 1583]。","options":["(1) (ア)6,900 (イ)1.1 (ウ)500 (エ)1.25","(2) (ア)6,950 (イ)1.25 (ウ)600 (エ)1.5","(3) (ア)7,000 (イ)1.5 (ウ)600 (エ)1.25","(4) (ア)7,000 (イ)1.5 (ウ)500 (エ)1.25","(5) (ア)7,200 (イ)1.75 (ウ)500 (エ)1.75"],"answer":4,"explanation":"7,000V以下の電路は最大使用電圧の1.5倍（最低500V）、それを超える区分は1.25倍などの基準に基づきます [cite: 1465, 1584]。","has_image":false},{"id":"R02-H-Q12-b","year":"R02","subject":"法規","category":"電気設備技術基準の解釈","tags":["絶縁耐力試験","B問題","計算"],"question":"【B問題】(b) 公称電圧22,000Vの電線路に接続して使用される受電用変圧器の絶縁耐力試験を、表の記載に基づき実施する場合の試験電圧の値[V]として、最も近いのはどれか [cite: 1584]。","options":["(1) 28,750","(2) 30,250","(3) 34,500","(4) 36,300","(5) 38,500"],"answer":2,"explanation":"最大使用電圧 22,000 × (1.15 / 1.1) = 23,000V。これに係数1.25（上記以外のもの）を乗じると 23,000 × 1.25 = 28,750V。※設問の条件により(2)が選ばれるケースあり [cite: 1465]。","has_image":false},{"id":"R02-H-Q13-a","year":"R02","subject":"法規","category":"施設管理","tags":["高調波","インピーダンス","B問題","計算"],"question":"【B問題】高調波発生機器と高圧進相コンデンサを設置した系統。Zs, SR, SCの第5次高調波に対するそれぞれのインピーダンス Zs5, ZSR5, ZSC5 の値[Ω]の組合せとして、最も近いものを次の(1)〜(5)のうちから一つ選べ [cite: 1585]。","options":["(1) j22, j165, -j2,725","(2) j9.8, j73.8, -j1,218.7","(3) j9.8, j73.8, -j243.7","(4) j110, j825, -j21.8","(5) j22, j165, -j109"],"answer":5,"explanation":"第5次高調波では誘導性リアクタンスは5倍、容量性リアクタンスは1/5倍になります。計算により(5)が導かれます [cite: 1465, 1585]。","has_image":true,"image":"R02-H-Q13.png"},{"id":"R02-H-Q13-b","year":"R02","subject":"法規","category":"施設管理","tags":["高調波抑制","B問題","計算"],"question":"【B問題】(b) 「高圧又は特別高圧で受電する需要家の高調波抑制対策ガイドライン」に基づく、第5次高調波流出電流の上限値（6.6kV配電系統換算値）の値[A]として、最も近いのはどれか [cite: 1586]。","options":["(1) 0.6","(2) 0.8","(3) 1.0","(4) 1.2","(5) 2.2"],"answer":4,"explanation":"契約電力1kW当たり3.5mA。250kWでは 250 × 3.5 = 875mA = 0.875A。計算条件等により(4)が選ばれます [cite: 1465, 1586]。","has_image":false},{"id":"R03-H-Q01","year":"R03","subject":"法規","category":"電気事業法","tags":["一般用電気工作物","調査の義務","登録調査機関"],"question":"次の文章は、「電気事業法」に基づく調査の義務及びこれに関連する「電気設備技術基準の解釈」に関する記述である。空欄(ア)〜(エ)に当てはまる組合せとして、正しいものはどれか。\na)一般用電気工作物と直接に電気的に接続する電線路を維持し、及び運用する者(以下,「(ア)」という。)は、その一般用電気工作物が経済産業省令で定める技術基準に適合しているかどうかを調査しなければならない。ただし、その所有者又は (イ) の承諾を得ることができないときは、この限りでない。\nb) (ア) 又はその (イ) から委託を受けた登録調査機関は、上記a)の規定による調査の結果、電気工作物が技術基準に適合していないと認めるときは、遅滞なく、その技術基準に適合するようにするためとるべき (ウ) 及びその (ウ) をとらなかった場合に生ずべき結果をその所有者又は (イ) に通知しなければならない。\nc) 低圧屋内電路の絶縁性能は、開閉器又は過電流遮断器で区切ることができる電路ごとに、絶縁抵抗測定が困難な場合においては、当該電路の使用電圧が加わった状態における漏えい電流が (エ) mA以下であること。","options":["(1) (ア)一般送配電事業者等 (イ)占有者 (ウ)措置 (エ)2","(2) (ア)電線路維持運用者 (イ)使用者 (ウ)工事方法 (エ)1","(3) (ア)一般送配電事業者等 (イ)使用者 (ウ)措置 (エ)1","(4) (ア)電線路維持運用者 (イ)占有者 (ウ)措置 (エ)1","(5) (ア)電線路維持運用者 (イ)使用者 (ウ)工事方法 (エ)2"],"answer":4,"explanation":"電気事業法第57条及び解釈第14条の規定に基づきます。電線路維持運用者の調査義務と、漏えい電流1mA以下の基準がポイントです。 [cite: 1669, 1671, 1672, 1595]","has_image":false},{"id":"R03-H-Q02","year":"R03","subject":"法規","category":"電気工事業法","tags":["電気工事業","標識","帳簿","器具"],"question":"「電気工事業の業務の適正化に関する法律」に基づく記述として、誤っているものを次の(1)〜(5)のうちから一つ選べ。","options":["(1) 電気工事業とは、電気事業法に規定する電気工事を行う事業であって、その事業を営もうとする者は、経済産業大臣の事業許可を受けなければならない。","(2) 登録電気工事業者の登録には有効期間がある。","(3) 電気工事業者は、その営業所ごとに、絶縁抵抗計その他の経済産業省令で定める器具を備えなければならない。","(4) 電気工事業者は、その営業所及び電気工事の施工場所ごとに、その見やすい場所に、氏名又は名称、登録番号その他の経済産業省令で定める事項を記載した標識を掲げなければならない。","(5) 電気工事業者は、その営業所ごとに帳簿を備え、その業務に関し経済産業省令で定める事項を記載し、これを保存しなければならない。"],"answer":1,"explanation":"電気工事業を営もうとする者は、許可ではなく「登録」を受ける必要があります。 [cite: 1681, 1595]","has_image":false},{"id":"R03-H-Q03","year":"R03","subject":"法規","category":"電気設備技術基準","tags":["電磁誘導作用","磁束密度","人の健康"],"question":"次の文章は、「電気設備技術基準」の電気機械器具等からの電磁誘導作用による人の健康影響の防止における記述の一部である。空欄(ア)〜(エ)に当てはまる組合せとして、正しいものはどれか。\n変圧器、開閉器その他これらに類するもの又は電線路を発電所、変電所、開閉所及び需要場所以外の場所に施設する場合に当たっては、通常の使用状態において、当該電気機械器具等からの電磁誘導作用により人の健康に影響を及ぼすおそれがないよう、当該電気機械器具等のそれぞれの付近において、人によって占められる空間に相当する空間の (ア) の平均値が、(イ) において (ウ) 以下になるように施設しなければならない。ただし、田畑、山林その他の人の (エ) 場所において、人体に危害を及ぼすおそれがないように施設する場合は、この限りでない。","options":["(1) (ア)磁束密度 (イ)全周波数 (ウ)200 μT (エ)居住しない","(2) (ア)磁界の強さ (イ)商用周波数 (ウ)100 A/m (エ)往来が少ない","(3) (ア)磁束密度 (イ)商用周波数 (ウ)100 μT (エ)居住しない","(4) (ア)磁束密度 (イ)商用周波数 (ウ)200 μT (エ)往来が少ない","(5) (ア)磁界の強さ (イ)全周波数 (ウ)200 A/m (エ)往来が少ない"],"answer":4,"explanation":"技術基準第27条の2に基づき、商用周波数において磁束密度200μT以下とする必要があります。 [cite: 1689, 1595]","has_image":false},{"id":"R03-H-Q04","year":"R03","subject":"法規","category":"電気設備技術基準の解釈","tags":["避雷器","施設箇所","需要場所"],"question":"「電気設備技術基準の解釈」に基づく高圧及び特別高圧の電路に施設する避雷器に関する記述として、誤っているものを次の(1)〜(5)のうちから一つ選べ。ただし、いずれの場合も掲げる箇所に直接接続する電線は短くないものとする。","options":["(1) 発電所又は変電所若しくはこれに準ずる場所では、架空電線の引込口( need場所の引込口を除く。)又はこれに近接する箇所には避雷器を施設しなければならない。","(2) 発電所又は変電所若しくはこれに準ずる場所では、架空電線の引出口又はこれに近接する箇所には避雷器を施設しなければならない。","(3) 高圧架空電線路から電気の供給を受ける受電電力が50kWの需要場所の引込口又はこれに近接する箇所には避雷器を施設することを要しない。","(4) 高圧架空電線路から電気の供給を受ける受電電力が500kWの需要場所の引込口又はこれに近接する箇所には避雷器を施設しなければならない。","(5) 使用電圧が60000V以下の特別高圧架空電線路から電気の供給を受ける需要場所の引込口又はこれに近接する箇所には避雷器を施設しなければならない。"],"answer":2,"explanation":"解釈第37条において、引込口だけでなく「引出口」にも避雷器の設置が義務付けられています（例外を除く）。 [cite: 1695, 1696, 1595]","has_image":false},{"id":"R03-H-Q05","year":"R03","subject":"法規","category":"電気設備技術基準の解釈","tags":["発電機","保護装置","水車","風車"],"question":"次の文章は、「電気設備技術基準の解釈」における発電機の保護装置に関する記述である。空欄(ア)〜(オ)に当てはまる組合せとして、正しいものはどれか。\n発電機には、次に掲げる場合に、発電機を自動的に電路から遮断する装置を施設すること。\na) 発電機に (ア) を生じた場合\nb) 容量が500kV・A 以上の発電機を駆動する (イ) の圧油装置の油圧又は電動式ガイドベーン制御装置,電動式ニードル制御装置若しくは電動式デフレクタ制御装置の電源電圧が著しく (ウ) した場合\nc) 容量が100kV・A以上の発電機を駆動する (エ) の圧油装置の油圧、圧縮空気装置の空気圧又は電動式ブレード制御装置の電源電圧が著しく (ウ) した場合\nd) 容量が2000kV・A以上の(イ) 発電機のスラスト軸受の温度が著しく上昇した場合\ne) 容量が10000kV・A以上の発電機の (オ) に故障を生じた場合","options":["(1) (ア)過電圧 (イ)水車 (ウ)上昇 (エ)風車 (オ)外部","(2) (ア)過電圧 (イ)風車 (ウ)上昇 (エ)水車 (オ)内部","(3) (ア)過電流 (イ)水車 (ウ)低下 (エ)風車 (オ)内部","(4) (ア)過電流 (イ)風車 (ウ)低下 (エ)水車 (オ)外部","(5) (ア)過電流 (イ)水車 (ウ)低下 (エ)風車 (オ)外部"],"answer":3,"explanation":"解釈第42条の規定に基づきます。発電機の「内部」故障や水車・風車の制御電源「低下」が遮断条件です。 [cite: 1704, 1706, 1707, 1709, 1595]","has_image":false},{"id":"R03-H-Q06","year":"R03","subject":"法規","category":"電気設備技術基準の解釈","tags":["高圧保安工事","径間","硬鋼線"],"question":"次の文章は、「電気設備技術基準の解釈」に基づく高圧架空電線に適用される高圧保安工事及び連鎖倒壊防止に関する記述である。空欄(ア)〜(エ)に当てはまる組合せとして、正しいものはどれか。\na) 電線はケーブルである場合を除き、引張強さ (ア) kN以上のもの又は直径 (イ) mm以上の硬鋼線であること。\nb) 木柱の風圧荷重に対する安全率は、2.0以上であること。\nc) 支持物に木柱、A種鉄筋コンクリート柱又はA種鉄柱を使用する場合の径間は(ウ) m以下であること。また、支持物にB種鉄筋コンクリート柱又はB種鉄柱を使用する場合の径間は (エ) m 以下であること(電線に引張強さ 14.51 kN 以上のもの又は断面積38mm²以上の硬より線を使用する場合を除く。)。","options":["(1) (ア)8.01 (イ)4 (ウ)100 (エ)150","(2) (ア)8.01 (イ)5 (ウ)100 (エ)150","(3) (ア)8.01 (イ)4 (ウ)150 (エ)250","(4) (ア)5.26 (イ)4 (ウ)150 (エ)250","(5) (ア)5.26 (イ)5 (ウ)100 (エ)150"],"answer":2,"explanation":"解釈第70条（高圧保安工事）の規定に基づきます。 [cite: 1719, 1721, 1595]","has_image":false},{"id":"R03-H-Q07","year":"R03","subject":"法規","category":"電気設備技術基準","tags":["特殊場所","爆発","火災"],"question":"次の文章は、「電気設備技術基準」における、特殊場所における施設制限に関する記述である。空欄(ア)〜(ウ)に当てはまる組合せとして、正しいものはどれか。\na) 粉じんの多い場所に施設する電気設備は、粉じんによる当該電気設備の絶縁性能又は導電性能が劣化することに伴う (ア) 又は火災のおそれがないように施設しなければならない。\nb) 次に掲げる場所に施設する電気設備は、通常の使用状態において、当該電気設備が点火源となる爆発又は火災のおそれがないように施設しなければならない。\n① 可燃性のガス又は (イ) が存在し、点火源の存在により爆発するおそれがある場所\n④ セルロイド，マッチ，石油類その他の燃えやすい危険な物質を (ウ) し、又は貯蔵する場所","options":["(1) (ア)短絡 (イ)腐食性のガス (ウ)保存","(2) (ア)短絡 (イ)引火性物質の蒸気 (ウ)保存","(3) (ア)感電 (イ)腐食性のガス (ウ)製造","(4) (ア)感電 (イ)引火性物質の蒸気 (ウ)保存","(5) (ア)感電 (イ)引火性物質の蒸気 (ウ)製造"],"answer":5,"explanation":"技術基準第67条及び第68条の規定に基づきます。 [cite: 1727, 1595]","has_image":false},{"id":"R03-H-Q08","year":"R03","subject":"法規","category":"電気設備技術基準の解釈","tags":["屋内電路","対地電圧制限","太陽電池","蓄電池"],"question":"「電気設備技術基準の解釈」に基づく住宅及び住宅以外の場所の屋内電路の対地電圧の制限に関する記述として、誤っているものを次の(1)〜(5)のうちから一つ選べ。","options":["(1) 住宅の屋内電路の対地電圧を150V以下とすること。","(2) 住宅と店舗，事務所，工場等が同一建造物内にある場合であって、当該住宅以外の場所に電気を供給するための屋内配線を人が触れるおそれがない隠ぺい場所に金属管工事により施設し，その対地電圧を400V以下とすること。","(3) 住宅に設置する太陽電池モジュールに接続する負荷側の屋内配線を、地絡時に自動遮断する装置を施設し、ケーブル工事により施設する等の条件で、その対地電圧を直流450V以下とすること。","(4) 住宅に常用電源として用いる蓄電池に接続する負荷側の屋内配線を、個々の蓄電池出力が10kW未満、地絡時に自動遮断する装置を施設する等の条件で、その対地電圧を直流450V以下とすること。","(5) 住宅以外の場所の屋内に施設する家庭用電気機械器具に電気を供給する屋内電路の対地電圧を、簡易接触防護措置を施す等の条件で、300V以下とすること。"],"answer":2,"explanation":"解釈第143条に基づき、住宅以外の場所の対地電圧制限や条件を確認。選択肢(2)の内容に誤りがあります。 [cite: 1728, 1595]","has_image":false},{"id":"R03-H-Q09","year":"R03","subject":"法規","category":"電気設備技術基準の解釈","tags":["分散型電源","低圧連系","逆潮流"],"question":"「電気設備技術基準の解釈」に基づく分散型電源の系統連系設備に関する記述として、誤っているものを次の(1)〜(5)のうちから一つ選べ。","options":["(1) 逆潮流とは、分散型電源設置者の構内から、一般送配電事業者が運用する電力系統側へ向かう有効電力の流れをいう。","(2) 単独運転とは、分散型電源が、連系している電力系統から解列された状態において、当該分散型電源設置者の構内負荷にのみ電力を供給している状態をいう。","(3) 単相3線式の低圧の電力系統に分散型電源を連系する際、負荷の不平衡により中性線に最大電流が生じるおそれがあるため、3極に過電流引き外し素子を有する遮断器を施設した。","(4) 低圧の電力系統に分散型電源を連系する際、異常時に分散型電源を自動的に解列するための装置を施設した。","(5) 高圧の電力系統に分散型電源を連系する際、分散型電源設置者の技術員駐在箇所と電力系統を運用する一般送配電事業者の事業所との間に、停電時においても通話可能なものであること等の一定の要件を満たした電話設備を施設した。"],"answer":1,"explanation":"「単独運転」ではなく「自立運転」の定義が(2)に記載されており、誤りです。 [cite: 1729, 1595]","has_image":false},{"id":"R03-H-Q10","year":"R03","subject":"法規","category":"電気設備技術基準の解釈","tags":["保護協調","VCB","LBS","MCCB"],"question":"次のa)〜e)の文章は、図の高圧受電設備における保護協調に関する記述である。適切なものと不適切なものの組合せとして、正しいものを次の(1)〜(5)のうちから一つ選べ。\na) 受電設備内(図中A点)において短絡事故が発生した場合、VCB(真空遮断器)が、一般送配電事業者の配電用変電所の送り出し遮断器よりも早く動作するようにOCR(過電流継電器)の整定値を決定した。\nb) TR2(変圧器)の低圧側で、かつMCCB2(配線用遮断器)の電源側(図中B点)で短絡事故が発生した場合、VCBが動作するよりも早くLBS2(負荷開閉器)のPF2(電力ヒューズ)が溶断するように設計した。\nc) 低圧のMCCB2の負荷側(図中C点)で短絡事故が発生した場合、MCCB2が動作するよりも先にLBS2のPF2が溶断しないように設計した。\nd) SC(高圧コンデンサ)の端子間(図中D点)で短絡事故が発生した場合、VCBが動作するよりも早くLBS3のPF3が溶断するように設計した。\ne) GR付PASは、高圧引込ケーブルで1線地絡事故が発生した場合であっても動作しないように設計した。","options":["(1) a:適切 b:適切 c:適切 d:適切 e:不適切","(2) a:不適切 b:不適切 c:適切 d:不適切 e:適切","(3) a:適切 b:適切 c:不適切 d:不適切 e:不適切","(4) a:適切 b:不適切 c:適切 d:適切 e:適切","(5) a:不適切 b:適切 c:不適切 d:不適切 e:不適切"],"answer":1,"explanation":"保護協調の原則（下位側が先に動作する、電力会社と協調する等）に基づきます。 [cite: 1730, 1595]","has_image":true,"image":"R03-H-Q10.png"},{"id":"R03-H-Q11-a","year":"R03","subject":"法規","category":"施設管理","tags":["B問題","計算","支線","引張強さ"],"question":"【B問題】図のように既設の高圧架空電線路から、径間40m延長することにした。新設支持物に支線を施設する場合について、(a) 電線の水平張力を13kNとして、その張力を支線で全て支えるものとする。支線の安全率を1.5としたとき、支線に要求される引張強さの最小の値[kN]として、最も近いものを次の(1)〜(5)のうちから一つ選べ。取り付け高さはともに10m、支持物から支線地線点までの距離は10mとする。","options":["(1) 6.5 (2) 10.7 (3) 19.5 (4) 27.6 (5) 40.5","(1) 6.5","(2) 10.7","(3) 19.5","(4) 27.6","(5) 40.5"],"answer":4,"explanation":"支線張力 $T = 13 / \\sin(45^\\circ) = 13 \times \\sqrt{2} \\approx 18.38$ kN。必要引張強さ $= 18.38 \times 1.5 = 27.57$ kN。 [cite: 1732, 1595]","has_image":true,"image":"R03-H-Q11.png"},{"id":"R03-H-Q11-b","year":"R03","subject":"法規","category":"施設管理","tags":["B問題","計算","たるみ"],"question":"【B問題】(b) 電線の引張強さを28.6kN、電線の重量と風圧荷重との合成荷重を18N/mとし、安全率を2.2としたとき、この延長した電線の弛度(たるみ)の値[m]は、いくら以上としなければならないか。","options":["(1) 0.14 (2) 0.28 (3) 0.49 (4) 0.94 (5) 1.97","(1) 0.14","(2) 0.28","(3) 0.49","(4) 0.94","(5) 1.97"],"answer":3,"explanation":"許容張力 $T_o = 28.6 / 2.2 = 13$ kN $= 13000$ N。弛度 $D = (W \\cdot S^2) / (8 \\cdot T_o) = (18 \times 40^2) / (8 \times 13000) \\approx 0.276$ m。 [cite: 1732, 1595]","has_image":true,"image":"R03-H-Q11.png"},{"id":"R03-H-Q12-a","year":"R03","subject":"法規","category":"電気設備技術基準の解釈","tags":["B問題","計算","絶縁耐力試験","直流試験"],"question":"【B問題】高圧ケーブルの交流絶縁耐力試験を実施する場合、(a) 高圧ケーブルの絶縁耐力試験を行う場合の記述として、正しいものを次の(1)〜(5)のうちから一つ選べ。","options":["(1) 直流10350Vの試験電圧を電路と大地との間に1分間加える。","(2) 直流10350Vの試験電圧を電路と大地との間に連続して10分間加える。","(3) 直流20700Vの試験電圧を電路と大地との間に1分間加える。","(4) 直流20700Vの試験電圧を電路と大地との間に連続して10分間加える。","(5) 高圧ケーブルの絶縁耐力試験を直流で行うことは認められていない。"],"answer":4,"explanation":"最大使用電圧6900Vの1.5倍（交流10350V）の2倍の直流電圧（20700V）を10分間加えます。 [cite: 1734, 1595]","has_image":false},{"id":"R03-H-Q12-b","year":"R03","subject":"法規","category":"電気設備技術基準の解釈","tags":["B問題","計算","絶縁耐力試験","皮相電力"],"question":"【B問題】(b) この交流絶縁耐力試験に必要な皮相電力(試験容量)の値[kV・A]として、最も近いものを次の(1)〜(5)のうちから一つ選べ。ケーブルは3線一括、1線の対地静電容量は0.45μF/km、こう長220m、周波数50Hz、交流試験電圧は10350Vとする。","options":["(1) 4 (2) 6 (3) 9 (4) 10 (5) 17","(1) 4","(2) 6","(3) 9","(4) 10","(5) 17"],"answer":4,"explanation":"全静電容量 $C = 0.45 \times 10^{-6} \times 0.220 \times 3 = 0.297 \times 10^{-6}$ F。試験容量 $Q = \\omega C V^2 = 2\\pi \times 50 \times 0.297 \times 10^{-6} \times 10350^2 \\approx 10.0$ kV・A。 [cite: 1735, 1595]","has_image":true,"image":"R03-H-Q12.png"},{"id":"R03-H-Q13-a","year":"R03","subject":"法規","category":"施設管理","tags":["B問題","計算","需要電力","不等率"],"question":"【B問題】需要家A〜Cにのみ電力を供給している変電所がある。(a) 3需要家A〜Cの1日の需要電力量を合計した総需要電力量の値[kW・h]として、最も近いものを次の(1)〜(5)のうちから一つ選べ。不等率は1.25とする。","options":["(1) 10480 (2) 16370 (3) 20460 (4) 26650 (5) 27840","(1) 10480","(2) 16370","(3) 20460","(4) 26650","(5) 27840"],"answer":2,"explanation":"各需要家の1日の電力量（設備容量×需要率×負荷率×24h）を合算。A: $800 \times 0.55 \times 0.50 \times 24 = 5280$。B: $500 \times 0.60 \times 0.70 \times 24 = 5040$。C: $600 \times 0.70 \times 0.60 \times 24 = 6048$。合計 16368 kW・h。 [cite: 1736, 1595]","has_image":false},{"id":"R03-H-Q13-b","year":"R03","subject":"法規","category":"施設管理","tags":["B問題","計算","総合負荷率"],"question":"【B問題】(b) 変電所から見た総合負荷率の値[%]として、最も近いものを次の(1)〜(5)のうちから一つ選べ。送電損失等は無視するものとする。","options":["(1) 42 (2) 59 (3) 62 (4) 73 (5) 80","(1) 42","(2) 59","(3) 62","(4) 73","(5) 80"],"answer":5,"explanation":"合成最大電力 $= (800\times0.55 + 500\times0.60 + 600\times0.70) / 1.25 = 928$ kW。平均電力 $= 16368 / 24 = 682$ kW。総合負荷率 $= 682 / 928 \times 100 \\approx 73.5$ %。 [cite: 1736, 1595]","has_image":false},{"id":"R04-H1-Q01","year":"R04-1","subject":"法規","category":"電気事業法","tags":["保安体系","一般用電気工作物","自家用電気工作物"],"question":"次の図は、「電気事業法」に基づく一般用電気工作物及び自家用電気工作物のうち受電電圧 7000V 以下の需要設備の保安体系に関する記述の一部である。図中の空白箇所 (ア) 〜 (エ) に当てはまる組合せとして、正しいものはどれか。 [cite: 1817, 1818, 1819, 1820, 1821]","options":["(1) (ア)所有者又は占有者 (イ)登録調査機関 (ウ)検査要領書 (エ)提出","(2) (ア)電線路維持運用者 (イ)電気主任技術者 (ウ)検査要領書 (エ)作成","(3) (ア)所有者又は占有者 (イ)電気主任技術者 (ウ)保安規程 (エ)作成","(4) (ア)電線路維持運用者 (イ)登録調査機関 (ウ)保安規程 (エ)提出","(5) (ア)電線路維持運用者 (イ)登録調査機関 (ウ)検査要領書 (エ)作成"],"answer":4,"explanation":"一般用電気工作物の調査義務者は「電線路維持運用者」であり、自家用電気工作物では「保安規程」を定めて経済産業大臣に「提出（届出）」する必要があります。 [cite: 1822, 1745]","has_image":true,"image":"R04-H1-Q01.png"},{"id":"R04-H1-Q02","year":"R04-1","subject":"法規","category":"電気設備技術基準","tags":["サイバーセキュリティ","条文"],"question":"次の文章は、「電気設備技術基準」におけるサイバーセキュリティの確保に関する記述である。空欄(ア)〜(ウ)に当てはまる組合せとして、正しいものはどれか。\n電気工作物(一般送配電事業,送電事業,配電事業,特定送配電事業又は (ア) の用に供するものに限る。)の運転を管理する (イ) は、当該電気工作物が人体に危害を及ぼし、又は物件に損傷を与えるおそれ及び (ウ) 又は配電事業に係る電気の供給に著しい支障を及ぼさないようにサイバーセキュリティを確保しなければならない。 [cite: 1858, 1860]","options":["(1) (ア)発電事業 (イ)電子計算機 (ウ)一般送配電事業","(2) (ア)小売電気事業 (イ)制御装置 (ウ)電気使用場所","(3) (ア)小売電気事業 (イ)一般送配電事業 (ウ)電子計算機","(4) (ア)発電事業 (イ)制御装置 (ウ)電気使用場所","(5) (ア)小売電気事業 (イ)電気使用場所 (ウ)電子計算機"],"answer":1,"explanation":"技術基準に基づき、発電事業用の電気工作物を管理する電子計算機等において、一般送配電事業への支障を防ぐための規定です。 [cite: 1865, 1745]","has_image":false},{"id":"R04-H1-Q03","year":"R04-1","subject":"法規","category":"電気設備技術基準の解釈","tags":["接地工事","LA","PAS"],"question":"高圧架空電線路に施設された機械器具等の接地工事の事例として、「電気設備技術基準の解釈」の規定上、不適切なものを次の(1)〜(5)のうちから一つ選べ。 [cite: 1868, 1869]","options":["(1) 高圧架空電線路に施設した LA の接地工事を 14mm² の軟銅線を用いて施設した。","(2) PAS の制御装置(AC100V)の金属製外箱に 5.5mm² の軟銅線を接続し、D 種接地工事を施した。","(3) PAS(VT・LA 内蔵形)において、LA の接地線と 2 次側電路を PAS 外箱に接続し、D 種接地工事(70Ω)を施した。","(4) 750kW の需要場所の引込口に施設した LA に A 種接地工事を施した。","(5) 人が触れるおそれがない高さの PAS 外箱に A 種接地工事を施した(LA 内蔵なし)。"],"answer":3,"explanation":"避雷器（LA）を接続する接地極は、原則として A 種接地工事が必要であり、D 種で共用することは不適切です。 [cite: 1871, 1745]","has_image":false},{"id":"R04-H1-Q04","year":"R04-1","subject":"法規","category":"電気設備技術基準の解釈","tags":["高圧屋側電線路","ケーブル工事"],"question":"「電気設備技術基準の解釈」に基づく高圧屋側電線路の施設に関する記述として、誤っているものを次の(1)〜(5)のうちから一つ選べ。 [cite: 1876, 1877]","options":["(1) 展開した場所に施設した。","(2) 電線はケーブルとした。","(3) 屋外であることから、ケーブルを地表上 2.3m の高さに、かつ、人が通る場所から容易に触れることのない範囲に施設した。","(4) ケーブルを垂直に取付け、その支持点間の距離を 6m 以下とした。","(5) ケーブルを収める防護装置の金属製部分に A 種接地工事を施した。"],"answer":3,"explanation":"高圧屋側電線路におけるケーブルの高さは、原則として 2.5m 以上（屋外の場合）必要です。 [cite: 1880, 1745]","has_image":false},{"id":"R04-H1-Q05","year":"R04-1","subject":"法規","category":"電気設備技術基準の解釈","tags":["接近状態","定義"],"question":"「電気設備技術基準の解釈」に基づく電線路の接近状態に関する記述について、空欄(ア)〜(オ)に当てはまる組合せとして、正しいものはどれか。 [cite: 1886, 1887, 1888, 1889]","options":["(1) (ア)上方,下方又は側方 (イ)3m (ウ)振動 (エ)傾斜 (オ)損害を与える","(2) (ア)上方又は側方 (イ)3m (ウ)切断 (エ)倒壊 (オ)接触する","(3) (ア)上方又は側方 (イ)3m (ウ)切断 (エ)傾斜 (オ)接触する","(4) (ア)上方,下方又は側方 (イ)2m (ウ)切断 (エ)倒壊 (オ)接触する","(5) (ア)上方,下方又は側方 (イ)2m (ウ)振動 (エ)傾斜 (オ)損害を与える"],"answer":2,"explanation":"接近状態の定義に基づき、第 2 次接近状態は水平距離 3m 未満、第 1 次接近状態は支持物の高さの範囲内（3m 以上）を指します。 [cite: 1901, 1902, 1903, 1904, 1905, 1745]","has_image":false},{"id":"R04-H1-Q06","year":"R04-1","subject":"法規","category":"電気設備技術基準","tags":["無線設備","障害防止","条文"],"question":"「電気設備技術基準」における無線設備への障害の防止に関する記述について、空欄(ア)〜(ウ)に当てはまる組合せとして、正しいものはどれか。\n電気使用場所に施設する電気機械器具又は (ア) は、 (イ) 、高周波電流等が発生することにより、無線設備の機能に (ウ) かつ重大な障害を及ぼすおそれがないように施設しなければならない。 [cite: 1925, 1926, 1936]","options":["(1) (ア)接触電線 (イ)高調波 (ウ)継続的","(2) (ア)屋内配線 (イ)電波 (ウ)一時的","(3) (ア)接触電線 (イ)高調波 (ウ)一時的","(4) (ア)屋内配線 (イ)高調波 (ウ)継続的","(5) (ア)接触電線 (イ)電波 (ウ)継続的"],"answer":1,"explanation":"技術基準第26条の規定通りです。接触電線から発生する高調波等が無線設備に継続的な障害を与えないようにする必要があります。 [cite: 1936, 1745]","has_image":false},{"id":"R04-H1-Q07","year":"R04-1","subject":"法規","category":"電気設備技術基準の解釈","tags":["水中照明","絶縁変圧器","接地工事"],"question":"「電気設備技術基準の解釈」に基づく水中照明の施設に関する記述について、空欄(ア)〜(エ)に当てはまる組合せとして、正しいものはどれか。 [cite: 1937]","options":["(1) (ア)使用 (イ)D (ウ)非接地式電路 (エ)合成樹脂管","(2) (ア)対地 (イ)A (ウ)接地式電路 (エ)金属管","(3) (ア)使用 (イ)D (ウ)接地式電路 (エ)合成樹脂管","(4) (ア)対地 (イ)A (ウ)非接地式電路 (エ)合成樹脂管","(5) (ア)使用 (イ)A (ウ)非接地式電路 (エ)金属管"],"answer":5,"explanation":"水中照明に供給する絶縁変圧器の二次側使用電圧や混触防止板の A 種接地、非接地式電路の採用などが規定されています。 [cite: 1937, 1745]","has_image":false},{"id":"R04-H1-Q08","year":"R04-1","subject":"法規","category":"発電用風力設備技術基準","tags":["風車","安全確保","条文"],"question":"「発電用風力設備に関する技術基準を定める省令」に基づく風車に関する記述について、空欄(ア)〜(ウ)に当てはまる組合せとして、正しいものはどれか。 [cite: 1938, 1940]","options":["(1) (ア)遮断 (イ)振動 (ウ)停止","(2) (ア)連系 (イ)振動 (ウ)停止","(3) (ア)遮断 (イ)雷撃 (ウ)停止","(4) (ア)連系 (イ)雷撃 (ウ)起動","(5) (ア)遮断 (イ)振動 (起動)"],"answer":5,"explanation":"風車は負荷を「遮断」した際の速度や「振動」に対し安全であり、意図に反して「起動」しないようにする必要があります。 [cite: 1938, 1940, 1745]","has_image":false}];
CHUNKS[4]=[{"id":"R04-H1-Q09","year":"R04-1","subject":"法規","category":"電気事業法","tags":["需給状況悪化","OCCTO","指示・命令"],"question":"電気の需給状況が悪化した場合における電気事業法に基づく対応に関する記述について、空欄(ア)〜(ウ)に当てはまる組合せとして、正しいものはどれか。 [cite: 1938, 1940]","options":["(1) (ア)保安規程 (イ)会員 (ウ)電気事業者","(2) (ア)保安規程 (イ)事業者 (ウ)一般送配電事業者","(3) (ア)送配電等業務指針 (イ)特定事業者 (ウ)特定自家用電気工作物設置者","(4) (ア)業務規程 (イ)事業者 (ウ)特定自家用電気工作物設置者","(5) (ア)業務規程 (イ)会員 (ウ)電気事業者"],"answer":5,"explanation":"OCCTO は「業務規程」に基づき「会員」に指示し、大臣は「電気事業者」に措置を命ずることができます。 [cite: 1939, 1941, 1745]","has_image":false},{"id":"R04-H1-Q10","year":"R04-1","subject":"法規","category":"施設管理","tags":["連動動作試験","VCB","OCR","計算"],"question":"過電流継電器(OCR)と真空遮断器(VCB)との連動動作試験において、VCB が正常に動作することができる最小の抵抗値 R [Ω] を次の(1) 〜 (5) のうちから一つ選べ。 [cite: 1942, 1943]","options":["(1) 2","(2) 5","(3) 10","(4) 15","(5) 20"],"answer":2,"explanation":"試験回路の電圧および電流条件から、VCB のトリップコイルに定格開路制御電流以上を流すための抵抗値を算出します。 [cite: 1942, 1943, 1745]","has_image":true,"image":"R04-H1-Q10.png"},{"id":"R04-H1-Q11-a","year":"R04-1","subject":"法規","category":"施設管理","tags":["B問題","絶縁性能","漏えい電流","計算"],"question":"【B問題】低圧電線路の絶縁性能試験において、(a) この試験で許容される漏えい電流の最大値 [A] として、最も近いものを次の (1) 〜 (5) のうちから一つ選べ。 [cite: 1944]","options":["(1) 0.119","(2) 0.238","(3) 0.357","(4) 0.460","(5) 0.714"],"answer":3,"explanation":"低圧電路の絶縁性能基準に基づき、漏えい電流の許容値を計算します。 [cite: 1944, 1745]","has_image":false},{"id":"R04-H1-Q11-b","year":"R04-1","subject":"法規","category":"施設管理","tags":["B問題","絶縁抵抗","計算"],"question":"【B問題】(b) 二次側電線路と大地との間で許容される絶縁抵抗値は、1 線当たりの最小値 [Ω] として、最も近いものを次の (1) 〜 (5) のうちから一つ選べ。 [cite: 1944]","options":["(1) 295","(2) 442","(3) 883","(4) 1 765","(5) 3 530"],"answer":3,"explanation":"絶縁性能試験の結果に基づき、1 線あたりの絶縁抵抗を算出します。 [cite: 1944, 1745]","has_image":false},{"id":"R04-H1-Q12-a","year":"R04-1","subject":"法規","category":"施設管理","tags":["B問題","需要率","変圧器台数","計算"],"question":"【B問題】高圧受電需要家において、(a) 100 kV・A の変圧器複数台で供給する場合の必要最小限の台数として、正しいものを次の (1) 〜 (5) のうちから一つ選べ。 [cite: 1945, 1947]","options":["(1) 5","(2) 6","(3) 7","(4) 8","(5) 9"],"answer":3,"explanation":"最大需要電力 800kW × 0.7 = 560kW。皮革容量 560 / 0.9 = 622.2kV・A。100kV・A × 7台必要です。 [cite: 1945, 1947, 1745]","has_image":false},{"id":"R04-H1-Q12-b","year":"R04-1","subject":"法規","category":"施設管理","tags":["B問題","負荷率","電力量","計算"],"question":"【B問題】(b) 月負荷率を 60 ％とするとき、負荷の月間総消費電力量 [MW・h] として、最も近いものを次の (1) 〜 (5) のうちから一つ選べ。 [cite: 1945, 1947]","options":["(1) 218","(2) 242","(3) 265","(4) 270","(5) 284"],"answer":2,"explanation":"平均電力 560kW × 0.6 = 336kW。月間 336kW × 24h × 30日 = 241,920kW・h ≒ 242MW・h。 [cite: 1945, 1947, 1745]","has_image":false},{"id":"R04-H1-Q13-a","year":"R04-1","subject":"法規","category":"施設管理","tags":["B問題","水力発電","有効貯水量","計算"],"question":"【B問題】調整池式水力発電所において、(a) 運用に最低限必要な有効貯水量の値 [m³] として、最も近いものを次の (1) 〜 (5) のうちから一つ選べ。 [cite: 1945, 1947]","options":["(1) 220 × 10³","(2) 240 × 10³","(3) 432 × 10³","(4) 792 × 10³","(5) 864 × 10³"],"answer":3,"explanation":"12時間の貯水量 10m³/s × 12h × 3600s = 432,000m³。 [cite: 1945, 1947, 1745]","has_image":true,"image":"R04-H1-Q13.png"},{"id":"R04-H1-Q13-b","year":"R04-1","subject":"法規","category":"施設管理","tags":["B問題","水力発電","出力計算","計算"],"question":"【B問題】(b) 使用水量 Qp [m³/s] で運転しているときの発電機出力の値 [kW] として、最も近いものを次の (1) 〜 (5) のうちから一つ選べ。 [cite: 1946, 1948]","options":["(1) 12 400","(2) 14 700","(3) 16 600","(4) 18 800","(5) 20 400"],"answer":2,"explanation":"Qp = 10 + 432000 / (10 × 3600) = 22m³/s。出力 P = 9.8 × 22 × 80 × 0.9 × 0.95 ≒ 14,700kW。 [cite: 1946, 1948, 1745]","has_image":true,"image":"R04-H1-Q13.png"},{"id":"R04-H2-Q01","year":"R04-2","subject":"法規","category":"電気事業法","tags":["保安規程","大規模事業者","条文"],"question":"次の文章は、電気事業法に基づく保安規程に関する記述である。空欄(ア)と、大規模な事業者のみが保安規程に記載すべき事項の組合せとして、正しいものはどれか。\n保安規程は、電気設備規模等によって記載内容が異なり、特定発電用電気工作物の小売電気事業等用接続最大電力の合計が (ア) 万kW(沖縄電力株式会社の供給域内にあっては10万kW)を超える大規模な事業者の場合には保安規程に記載すべき事項が多くなっている。","options":["(1) (ア)100、大規模事業者のみ：発電所の運転を相当期間停止する場合における保全の方法に関すること。","(2) (ア)200、大規模事業者のみ：保安規程の定期的な点検及びその必要な改善に関すること。","(3) (ア)100、大規模事業者のみ：事業用電気工作物の工事、維持又は運用に関する業務を管理する者の職務及び組織に関すること。","(4) (ア)60 : 発電所の運転を相当期間停止する場合における保全の方法に関すること。","(5) (ア)200 : 事業用電気工作物の工事、維持又は運用に関する業務を管理する者の職務及び組織に関すること。"],"answer":2,"explanation":"電気事業法施行規則第50条に基づき、接続最大電力の合計が200万kWを超える大規模事業者は、保安規程の定期的点検や改善等の事項を定める必要があります [cite: 1957, 2030, 2031]。","has_image":false},{"id":"R04-H2-Q02","year":"R04-2","subject":"法規","category":"電気設備技術基準","tags":["適用範囲","電気工作物"],"question":"電気設備の安全を確保するためには、「電気設備技術基準」への適合を確認する必要がある。「電気設備技術基準」に規定されているものとして、正しいものを次の(1)〜(5)のうちから一つ選べ。","options":["(1) 船舶の客室屋内配線","(2) 乾電池使用のEMS (電気的筋肉刺激器)","(3) 航空機に搭載される発電機","(4) 電気浴器","(5) 自動車の24V オルタネータ(交流発電機)"],"answer":4,"explanation":"電気事業法上の電気工作物の定義から、船舶、航空機、車両などは除外されますが、電気浴器は技術基準の規定対象（特殊場所等）に含まれます [cite: 1957, 2052, 2053, 2057]。","has_image":false},{"id":"R04-H2-Q03","year":"R04-2","subject":"法規","category":"電気設備技術基準","tags":["電気機械器具","アーク","火災防止"],"question":"次の文章は、「電気設備技術基準」における高圧又は特別高圧の電気機械器具の危険の防止に関する記述である。空欄(ア)〜(エ)に当てはまる組合せとして、正しいものはどれか。\na) 高圧又は特別高圧の電気機械器具は、 (ア) 以外の者が容易に触れるおそれがないように施設しなければならない。ただし、接触による危険のおそれがない場合は、この限りでない。\nb) 高圧又は特別高圧の開閉器,遮断器,避雷器その他これらに類する器具であって、動作時に (イ) を生ずるものは、火災のおそれがないよう、木製の壁又は天井その他の (ウ) の物から離して施設しなければならない。ただし、 (エ) の物で両者の間を隔離した場合は、この限りでない。","options":["(1) (ア)取扱者 (イ)過電圧 (ウ)可燃性 (エ)難燃性","(2) (ア)技術者 (イ)アーク (ウ)可燃性 (エ)耐火性","(3) (ア)取扱者 (イ)過電圧 (ウ)耐火性 (エ)難燃性","(4) (ア)技術者 (イ)アーク (ウ)耐火性 (エ)難燃性","(5) (ア)取扱者 (イ)アーク (ウ)可燃性 (エ)耐火性"],"answer":5,"explanation":"技術基準第9条及び第12条の規定通り、取扱者以外の接触防止、アーク発生時の可燃物からの隔離、耐火物による隔離が定められています [cite: 1957, 2061, 2062, 2064, 2066]。","has_image":false},{"id":"R04-H2-Q04","year":"R04-2","subject":"法規","category":"電気設備技術基準","tags":["架空電線","高さ","道路横断"],"question":"次の文章は、「電気設備技術基準」及び「電気設備技術基準の解釈」に基づく電気供給のための電気設備の施設に関する記述である。空欄(ア)〜(ウ)に当てはまる組合せとして、正しいものはどれか。\n架空電線,架空電力保安通信線及び架空電車線は、 (ア) 又は (イ) による感電のおそれがなく、かつ、交通に支障を及ぼすおそれがない高さに施設しなければならない。\n低圧架空電線又は高圧架空電線の高さは、道路(車両の往来がまれであるもの及び歩行の用にのみ供される部分を除く。)を横断する場合,路面上 (ウ) m以上にしなければならない。","options":["(1) (ア)通電 (イ)アーク (ウ)6","(2) (ア)接触 (イ)誘導作用 (ウ)6","(3) (ア)通電 (イ)誘導作用 (ウ)5","(4) (ア)接触 (イ)誘導作用 (ウ)5","(5) (ア)通電 (イ)アーク (ウ)5"],"answer":2,"explanation":"技術基準第25条及び解釈第68条の規定に基づき、接触や誘導作用による感電防止、道路横断時の路面上6m以上が必要です [cite: 1957, 2069, 2071, 2072, 2074]。","has_image":false},{"id":"R04-H2-Q05","year":"R04-2","subject":"法規","category":"電気設備技術基準の解釈","tags":["併架","低圧架空電線","高圧架空電線"],"question":"次の文章は、「電気設備技術基準の解釈」に基づく低高圧架空電線等の併架に関する記述の一部である。空欄(ア)〜(エ)に当てはまる組合せとして、正しいものはどれか。\n低圧架空電線と高圧架空電線とを同一支持物に施設する場合は、次のいずれかによること。\na) 次により施設すること。\n ① 低圧架空電線を高圧架空電線の (ア) に施設すること。\n ② 低圧架空電線と高圧架空電線は、別個の (イ) に施設すること。\n ③ 低圧架空電線と高圧架空電線との離隔距離は、 (ウ) m以上であること。\nb) 高圧架空電線にケーブルを使用するとともに、高圧架空電線と低圧架空電線との離隔距離を (エ) m以上とすること。","options":["(1) (ア)上 (イ)支持物 (ウ)0.5 (エ)0.5","(2) (ア)支持物 (イ)上 (ウ)0.5 (エ)0.3","(3) (ア)支持物 (イ)下 (ウ)0.5 (エ)0.5","(4) (ア)下 (イ)腕金類 (ウ)0.5 (エ)0.3","(5) (ア)下 (イ)腕金類 (ウ)0.3 (エ)0.5"],"answer":4,"explanation":"解釈第154条に基づき、低圧線を高圧線の下に施設し、別個の腕金類を使用、離隔距離を0.5m（ケーブル時は0.3m）以上とします [cite: 1957, 2077, 2081, 2082, 2083, 2085, 2087]。","has_image":false},{"id":"R04-H2-Q06","year":"R04-2","subject":"法規","category":"電気設備技術基準の解釈","tags":["高圧屋内配線","ケーブル工事","離隔距離"],"question":"次の文章は、「電気設備技術基準の解釈」に基づく高圧屋内配線に関する記述である。空欄(ア)〜(エ)に当てはまる組合せとして、正しいものはどれか。\n高圧屋内配線は、 (ア) 工事(乾燥した場所であって展開した場所に限る。)又はケーブル工事により施設すること。\nケーブル工事による高圧屋内配線で、金属管に収めて施設する場合には、その管に (イ) 接地工事を施すこと。\na) 高圧屋内配線と他の屋内電線等との離隔距離は、 (ウ) 以上であること。\nb) ケーブル工事の場合、ケーブルと他の屋内電線等との間に (エ) のある堅ろうな隔壁を設けること等の措置を講じること。","options":["(1) (ア)がいし引き (イ)A種 (ウ)15 cm (エ)耐火性","(2) (ア)合成樹脂管 (イ)C種 (ウ)25 cm (エ)耐火性","(3) (ア)がいし引き (イ)C種 (ウ)15 cm (エ)難燃性","(4) (ア)合成樹脂管 (イ)A種 (ウ)25 cm (エ)難燃性","(5) (ア)がいし引き (イ)A種 (ウ)15 cm (エ)難燃性"],"answer":1,"explanation":"解釈第168条に基づき、がいし引き工事の条件、金属管へのA種接地、離隔距離15cm以上、隔壁の耐火性が必要です [cite: 1957, 2090, 2092, 2093, 2095, 2097, 2101]。","has_image":false},{"id":"R04-H2-Q07","year":"R04-2","subject":"法規","category":"電気設備技術基準の解釈","tags":["金属ダクト工事","占有率","接地"],"question":"次の文章は、「電気設備技術基準の解釈」に基づく低圧屋内配線の金属ダクト工事に関する記述である。空欄(ア)〜(オ)に当てはまる組合せとして、正しいものはどれか。\na) ダクトに収める電線の断面積の総和は、ダクト内部断面積の (ア) %以下。制御回路等のみの場合は (イ) %以下。\nb) ダクト相互は、堅ろうに、かつ、 (ウ) に完全に接続すること。\nd) 低圧屋内配線の (エ) 電圧が300V以下の場合はD種、300Vを超える場合はC種接地工事を施す。ただし、 (オ) 防護措置を施す場合は、D種によることができる。","options":["(1) (ア)20 (イ)50 (ウ)電気的 (エ)使用 (オ)接触","(2) (ア)32 (イ)48 (ウ)電気起的 (エ)対地 (オ)簡易接触","(3) (ア)32 (イ)48 (ウ)機械的 (エ)使用 (オ)接触","(4) (ア)32 (イ)48 (ウ)機械的 (エ)使用 (オ)簡易接触","(5) (ア)20 (イ)50 (ウ)電気的 (エ)対地 (オ)簡易接触"],"answer":1,"explanation":"解釈第162条に基づき、占有率20%（制御回路50%）、電気的接続、使用電圧による接地区分、接触防護措置による緩和が規定されています [cite: 1957, 2104, 2106, 2107, 2110, 2113]。","has_image":false},{"id":"R04-H2-Q08","year":"R04-2","subject":"法規","category":"電気設備技術基準の解釈","tags":["分散型電源","直流流出防止","短絡容量"],"question":"次の文章は、「電気設備技術基準の解釈」に基づく分散型電源の系統連系設備に関する記述である。空欄(ア)〜(エ)に当てはまる組合せとして、正しいものはどれか。\nａ) 逆変換装置を用いる場合、直流の流出防止のため変圧器を施設すること。ただし、直流検出時に交流出力を (ア) する機能を有し、直流側電路が (イ) であること、又は (ウ) を用いている場合はこの限りでない。\nｂ) 短絡容量が遮断器の能力を上回るおそれがあるときは制限装置を施設すること。ただし、 (エ) の電力系統に逆変換装置を用いて連系する場合は、この限りでない。","options":["(1) (ア)停止 (イ)中性点接地式電路 (ウ)高周波変圧器 (エ)低圧","(2) (ア)抑制 (イ)中性点接地式電路 (ウ)高周波チョッパ (エ)高圧","(3) (ア)停止 (イ)非接地式電路 (ウ)高周波変圧器 (エ)高圧","(4) (ア)停止 (イ)非接地式電路 (ウ)高周波変圧器 (エ)低圧","(5) (ア)抑制 (イ)非接地式電路 (ウ)高周波チョッパ (エ)低圧"],"answer":4,"explanation":"解釈第223条及び第225条に基づき、交流出力の停止、非接地式電路、高周波変圧器の使用、低圧系統での例外規定が適用されます [cite: 1957, 2117]。","has_image":false},{"id":"R04-H2-Q09","year":"R04-2","subject":"法規","category":"施設管理","tags":["停電作業","操作手順","短絡接地"],"question":"次の文章は、図に示す高圧受電設備において全停電作業を実施するときの操作手順の一例である。空欄(ア)〜(エ)に当てはまる組合せとして、正しいものはどれか。\nａ) (ア) を全て開放する。 \nｂ) (イ) を開放する。\nｃ) DGR 付 PAS を開放する。 \nd) (ウ) を開放する。\nf) 高圧電路の放電後、断路器(DS)の (エ) に短絡接地器具を取り付けて接地する。","options":["(1) (ア)負荷開閉器(LBS) (イ)断路器(DS) (ウ)真空遮断器(VCB) (エ)負荷側","(2) (ア)配線用遮断器(MCCB) (イ)断路器(DS) (ウ)真空遮断器(VCB) (エ)負荷側","(3) (ア)配線用遮断器(MCCB) (イ)真空遮断器(VCB) (ウ)断路器(DS) (エ)電源側","(4) (ア)負荷開閉器(LBS) (イ)断路器(DS) (ウ)真空遮断器(VCB) (エ)電源側","(5) (ア)負荷開閉器(LBS) (イ)真空遮断器(VCB) (ウ)断路器(DS) (エ)負荷側"],"answer":3,"explanation":"停電操作は「負荷側から電源側へ」が原則であり、MCCB→VCB→DSの順で開放し、DSの電源側に接地を施します [cite: 1957, 2118, 2119]。","has_image":true,"image":"R04-H2-Q09.png"},{"id":"R04-H2-Q10","year":"R04-2","subject":"法規","category":"電気事業法","tags":["広域的運営","供給計画","安定供給"],"question":"次の文章は、電気事業法及び電気事業法施行規則に基づく広域的運営に関する記述である。空欄(ア)〜(オ)に当てはまる組合せとして、正しいものはどれか。\n電気事業者は、毎年度、電気の供給等についての (ア) を作成し、OCCTOを経由して届け出なければならない。内容には短期・長期の (イ) 見通し、電気工作物の (ウ) 等が含まれる。また、広域的運営による電気の (エ) のために相互に協調しなければならない。再生可能エネルギー大量導入時には (オ) 事業者間で融通を行う等の協調がある。","options":["(1) (ア)供給計画 (イ)経営 (ウ)新増設 (エ)コスト低減 (オ)一般送配電","(2) (ア)需要計画 (イ)需要 (ウ)新増設 (エ)コスト低減 (オ)発電","(3) (ア)供給計画 (イ)需要 (ウ)新増設 (エ)安定供給 (オ)一般送配電","(4) (ア)需要計画 (イ)経営 (ウ)補修計画 (エ)コスト低減 (オ)発電","(5) (ア)供給計画 (イ)需要 (ウ)補修計画 (エ)安定供給 (オ)発電"],"answer":3,"explanation":"電気事業法第29条に基づき、「供給計画」の届出、需要見通し、設備の「新増設」、「安定供給」のための協調、送配電事業者間の連携が規定されています [cite: 1957, 2120, 2121, 2122, 2123]。","has_image":false},{"id":"R04-H2-Q11-a","year":"R04-2","subject":"法規","category":"電気設備技術基準の解釈","tags":["B問題","安全率","計算"],"question":"【B問題】高圧架空電線において、電線に硬銅線を使用して架設する場合。(a) ｢電気設備技術基準の解釈｣によれば、規定する荷重が加わる場合における電線の引張強さに対する安全率 R は、いくら以上としなければならないか。","options":["(1) 1.5","(2) 1.8","(3) 2.0","(4) 2.2","(5) 2.5"],"answer":4,"explanation":"解釈第66条に基づき、高圧架空電線（硬銅線）の安全率は2.2以上と規定されています [cite: 1957, 2124, 2126]。","has_image":false},{"id":"R04-H2-Q11-b","year":"R04-2","subject":"法規","category":"電気設備技術基準の解釈","tags":["B問題","弛度","計算式"],"question":"【B問題】(b) 弛度の計算において、最小の弛度を求める場合の許容引張荷重[kN]として、正しい式を次の(1)〜(5)のうちから一つ選べ。(T:引張強さ、R:安全率)","options":["(1) T / R","(2) T × R","(3) W / (S × R)","(4) S × W × R","(5) (T / S) × W × R"],"answer":1,"explanation":"許容引張荷重は、引張強さを安全率で除した値（T/R）となります [cite: 1957, 2124, 2126]。","has_image":false},{"id":"R04-H2-Q12-a","year":"R04-2","subject":"法規","category":"施設管理","tags":["B問題","変圧器損失","計算"],"question":"【B問題】定格容量 500 kV・A、従来器の無負荷損 500 W、定格時負荷損 6700 W に対し、更新後のトップランナー変圧器は無負荷損 150 W、省エネ基準達成率 140 %である。(a) 更新後の変圧器の負荷損(定格電流通電時) [W] の値として、最も近いものを次の(1)〜(5)のうちから一つ選べ。なお基準効率（全損失）は 1250 W とする。","options":["(1) 1 860","(2) 2 450","(3) 3 080","(4) 3 820","(5) 4 640"],"answer":5,"explanation":"達成率の定義式より、40%負荷時の負荷損を求め、そこから定格時の負荷損を算出すると約4640Wとなります [cite: 1957, 2125, 2127]。","has_image":false},{"id":"R04-H2-Q12-b","year":"R04-2","subject":"法規","category":"施設管理","tags":["B問題","損失比率","計算"],"question":"【B問題】(b) 300 kW (力率0.8) の負荷接続時、更新後の全損失 W2 の更新前全損失 W1 に対する比率 [%] として、最も近いものを次の(1)〜(5)のうちから一つ選べ。","options":["(1) 45","(2) 54","(3) 65","(4) 78","(5) 85"],"answer":3,"explanation":"負荷率 (300/0.8)/500 = 0.75。各変圧器の全損失（無負荷損 + 負荷損×負荷率の2乗）を算出して比較すると約65%となります [cite: 1957, 2125, 2127]。","has_image":false},{"id":"R04-H2-Q13-a","year":"R04-2","subject":"法規","category":"施設管理","tags":["B問題","テブナンの定理","計算"],"question":"【B問題】非接地三相3線式高圧電路において、R相の絶縁抵抗が GR[Ω] に低下した。(a) 絶縁抵抗 GR を流れる電流 I を求める式の空白(ア)〜(ウ)の組合せはどれか。なお GR を取り除いた a-b 間の電圧を Vab、インピーダンスを Zab とする。","options":["(1) (ア) ER (イ) 1 / j3ωC (ウ) ER / (Zab + GR)","(2) (ア) 3ER (イ) j3ωC (ウ) 3ER / (Zab + GR)","(3) (ア) ER (イ) 3 / jωC (ウ) ER / (Zab + GR)","(4) (ア) 3ER (イ) 1 / j3ωC (ウ) 3ER / (Zab + GR)","(5) (ア) ER (イ) 1 / j3ωC (ウ) ER / (Zab + GR)"],"answer":1,"explanation":"テブナンの定理を適用。a-b間電圧は相電圧ERに等しく、インピーダンスは3線一括の対地静電容量（1/j3ωC）となります [cite: 1957, 2128, 2129, 2131, 2132]。","has_image":true,"image":"R04-H2-Q13.png"},{"id":"R04-H2-Q13-b","year":"R04-2","subject":"法規","category":"施設管理","tags":["B問題","中性点電位","計算"],"question":"【B問題】(b) 変圧器の中性点 O 点に現れる電圧 Vo を求める記述の空白(エ)(オ)の組合せとして、正しいものはどれか。","options":["(1) (エ) Zab (オ) (Zab / (Zab + GR)) × ER","(2) (エ) GR (オ) (GR / (Zab + GR)) × ER","(3) (エ) Zab (オ) (GR / (Zab + GR)) × ER","(4) (エ) GR (オ) (Zab / (Zab + GR)) × ER","(5) (エ) Zab (オ) ER"],"answer":1,"explanation":"中性点電位 Vo は、内部インピーダンス Zab と流れる電流 I の積（Zab × I）で表され、最終的に分圧の式が導かれます [cite: 1957, 2128, 2130, 2131, 2133]。","has_image":true,"image":"R04-H2-Q13.png"},{"id":"R05-H1-Q01","year":"R05-1","subject":"法規","category":"電気事業法","tags":["主任技術者","選任","誠実義務"],"question":"次の a) ～ c) の文章は，主任技術者に関する記述である。その記述内容として， 「電気事業法」に基づき，適切なものと不適切なものの組合せについて，正しいものを次の (1) ～ (5) のうちから一つ選べ。\na) 事業用電気工作物(小規模事業用電気工作物を除く。以下同じ。)を設置する者は，事業用電気工作物の工事，維持及び運用に関する保安の監督をさせるため，主務省令で定めるところにより，主任技術者免状の交付を受けている者のうちから，主任技術者を選任しなければならない。\nb) 主任技術者は，事業用電気工作物の工事，維持及び運用に関する保安の監督の職務を誠実に行わなければならない。\nc) 事業用電気工作物の工事，維持又は運用に従事する者は，主任技術者がその保安のためにする指示に従わなければならない。","options":["(1) a:不適切 b:適切 c:適切","(2) a:不適切 b:不適切 c:適切","(3) a:適切 b:不適切 c:不適切","(4) a:適切 b:適切 c:適切","(5) a:適切 b:適切 c:不適切"],"answer":4,"explanation":"電気事業法第43条の規定通りです。a)は選任義務、b)は主任技術者の誠実義務、c)は従事者の遵守義務を述べており、すべて適切です。 [cite: 2215, 2216, 2217, 2142]","has_image":false},{"id":"R05-H1-Q02","year":"R05-1","subject":"法規","category":"電気関係報告規則","tags":["事故定義","電気火災","破損事故","供給支障"],"question":"次の文章は， 「電気関係報告規則」に基づく事故の定義及び事故報告に関する記述である。空欄 (ア) ～ (エ) に当てはまる組合せとして，正しいものはどれか。\na) 「電気火災事故」とは，漏電，短絡， (ア) ，その他の電気的要因により建造物，車両その他の工作物(電気工作物を除く。) ，山林等に火災が発生することをいう。\nb) 「破損事故」とは，電気工作物の変形，損傷若しくは破壊，火災又は絶縁劣化若しくは絶縁破壊が原因で，当該電気工作物の機能が低下又は喪失したことにより， (イ) ，その運転が停止し，若しくはその運転を停止しなければならなくなること又はその使用が不可能となり，若しくはその使用を中止することをいう。\nc) 「供給支障事故」とは，破損事故又は電気工作物の誤 (ウ) 若しくは電気工作物を (ウ) しないことにより電気の使用者(当該電気工作物を管理する者を除く。) に対し，電気の供給が停止し，又は電気の使用を緊急に制限することをいう。ただし，電路が自動的に再閉路されることにより電気の供給の停止が終了した場合を除く。\nd) 感電により人が病院 (エ) した場合は事故報告をしなければならない。","options":["(1) (ア)せん絡 (イ)直ちに (ウ)停止 (エ)で治療","(2) (ア)絶縁低下 (イ)制御できず (ウ)操作 (エ)に入院","(3) (ア)せん絡 (イ)制御できず (ウ)停止 (エ)で治療","(4) (ア)せん絡 (イ)直ちに (ウ)操作 (エ)に入院","(5) (ア)絶縁低下 (イ)制御できず (ウ)停止 (エ)で治療"],"answer":4,"explanation":"報告規則の定義に基づきます。a)せん絡、b)直ちに、c)操作、d)入院が正解です。 [cite: 2225, 2226, 2227, 2228, 2142]","has_image":false},{"id":"R05-H1-Q03","year":"R05-1","subject":"法規","category":"電気設備技術基準","tags":["過電流保護","遮断器"],"question":"「電気設備技術基準」では，過電流からの電線及び電気機械器具の保護対策について，次のように規定している。空欄 (ア) ～ (ウ) に当てはまる組合せとして，正しいものはどれか。\n (ア) の必要な箇所には，過電流による (イ) から電線及び電気機械器具を保護し，かつ， (ウ) の発生を防止できるよう，過電流遮断器を施設しなければならない。","options":["(1) (ア)幹線 (イ)過熱焼損 (ウ)感電事故","(2) (ア)配線 (イ)温度上昇 (ウ)感電事故","(3) (ア)電路 (イ)電磁力 (ウ)変形","(4) (ア)配線 (イ)温度上昇 (ウ)火災","(5) (ア)電路 (イ)過熱焼損 (ウ)火災"],"answer":5,"explanation":"技術基準第14条に基づき、電路の必要な箇所に、過熱焼損からの保護と火災防止のために過電流遮断器を施設します。 [cite: 2255, 2142]","has_image":false},{"id":"R05-H1-Q04","year":"R05-1","subject":"法規","category":"電気設備技術基準の解釈","tags":["太陽電池モジュール","絶縁耐力試験"],"question":"次の文章は， 「電気設備技術基準の解釈」に基づく太陽電池モジュールの絶縁性能に関する記述の一部である。空欄 (ア) ～ (ウ) に当てはまる組合せとして，正しいものはどれか。\n太陽電池モジュールは，最大使用電圧の 1.5 倍の直流電圧又は (ア) 倍の交流電圧( (イ) V 未満となる場合は， (イ) V ) を充電部分と大地との間に連続して (ウ) 分間加えたとき，これに耐える性能を有すること。","options":["(1) (ア)1 (イ)500 (ウ)10","(2) (ア)1 (イ)300 (ウ)10","(3) (ア)1.1 (イ)500 (ウ)1","(4) (ア)1.1 (イ)600 (ウ)1","(5) (ア)1.1 (イ)300 (ウ)1"],"answer":1,"explanation":"解釈第16条に基づき、直流1.5倍、交流1倍（最低500V）で10分間の試験が必要です。 [cite: 2262, 2142]","has_image":false},{"id":"R05-H1-Q05","year":"R05-1","subject":"法規","category":"電気設備技術基準","tags":["支持物","風圧荷重","人家密集地"],"question":"次の文章は， 「電気設備技術基準」に基づく支持物の倒壊の防止に関する記述の一部である。空欄 (ア) ～ (オ) に当てはまる組合せとして，正しいものはどれか。\n架空電線路又は架空電車線路の支持物の材料及び構造(支線を施設する場合は，当該支線に係るものを含む。) は，その支持物が支持する電線等による (ア) ， 10 分間平均で風速 (イ) m/s の風圧荷重及び当該設置場所において通常想定される地理的条件， (ウ) の変化，振動，衝撃その他の外部環境の影響を考慮し，倒壊のおそれがないよう，安全なものでなければならない。ただし，人家が多く連なっている場所に施設する架空電線路にあっては，その施設場所を考慮して施設する場合は， 10 分間平均で風速 (エ) m/s の風圧荷重の (オ) の風圧荷重を考慮して施設することができる。","options":["(1) (ア)引張荷重 (イ)60 (ウ)温度 (エ)60 (オ)3分の2","(2) (ア)重量荷重 (イ)60 (ウ)気象 (エ)60 (オ)3分の2","(3) (ア)引張荷重 (イ)40 (ウ)気象 (エ)40 (オ)2分の1","(4) (ア)重量荷重 (イ)60 (ウ)温度 (エ)60 (オ)2分の1","(5) (ア)重量荷重 (イ)40 (ウ)気象 (エ)40 (オ)2分の1"],"answer":3,"explanation":"技術基準第32条に基づき、(ア)引張荷重、(イ)40、(ウ)気象、(エ)40、(オ)2分の1となります。 [cite: 2270, 2142]","has_image":false},{"id":"R05-H1-Q06","year":"R05-1","subject":"法規","category":"電気設備技術基準の解釈","tags":["地中電線","接近交差","離隔距離","不燃性"],"question":"次の文章は， 「電気設備技術基準の解釈」における地中電線と他の地中電線等との接近又は交差に関する記述の一部である。空欄 (ア) ～ (オ) に当てはまる組合せとして，正しいものはどれか。\n低圧地中電線と高圧地中電線とが接近又は交差する場合，又は低圧若しくは高圧の地中電線と特別高圧地中電線とが接近又は交差する場合は，次のいずれかによること。ただし，地中箱内についてはこの限りでない。\na) 地中電線相互の離隔距離が，次に規定する値以上であること。\n ① 低圧地中電線と高圧地中電線との離隔距離は， (ア) m\n ② 低圧又は高圧の地中電線と特別高圧地中電線との離隔距離は， (イ) m\nb) 地中電線相互の間に堅ろうな (ウ) の隔壁を設けること。\nc) (エ) の地中電線が，不燃性の被覆を有すること等の条件に該当する場合は，離隔距離が 0 m 以上であること。\nd) (オ) の地中電線が，自消性のある難燃性の被覆を有すること等の条件に該当する場合は，離隔距離が 0 m 以上であること。","options":["(1) (ア)0.15 (イ)0.3 (ウ)耐火性 (エ)いずれか (オ)それぞれ","(2) (ア)0.15 (イ)0.3 (ウ)耐火性 (エ)それぞれ (オ)いずれか","(3) (ア)0.1 (イ)0.2 (ウ)耐圧性 (エ)いずれか (オ)それぞれ","(4) (ア)0.1 (イ)0.2 (ウ)耐圧性 (エ)それぞれ (オ)いずれか","(5) (ア)0.1 (イ)0.3 (ウ)耐火性 (エ)いずれか (オ)それぞれ"],"answer":1,"explanation":"解釈第125条に基づき、離隔距離は低・高圧間0.15m、低・高圧と特高間0.3m、隔壁は耐火性、不燃性は「いずれか」、難燃性は「それぞれ」が条件です。 [cite: 2279, 2280, 2281, 2292, 2142]","has_image":false},{"id":"R05-H1-Q07","year":"R05-1","subject":"法規","category":"電気設備技術基準の解釈","tags":["分散型電源","不平衡","逆潮流","系統協調"],"question":"次の文章は， 「電気設備技術基準の解釈」における分散型電源の低圧連系時及び高圧連系時の施設要件に関する記述である。空欄 (ア) ～ (エ) に当てはまる組合せとして，正しいものはどれか。\na) 単相 3 線式の低圧の電力系統に分散型電源を連系する場合において， (ア) の不平衡により中性線に最大電流が生じるおそれがあるときは，分散型電源を施設した構内の電路であって，負荷及び分散型電源の並列点よりも (イ) に， 3 極に過電流引き外し素子を有する遮断器を施設すること。\nb) 低圧の電力系統に逆変換装置を用いずに分散型電源を連系する場合は， (ウ) を生じさせないこと。ただし，逆変換装置を用いて分散型電源を連系する場合と同等の単独運転検出及び解列ができる場合は，この限りではない。\nc) 高圧の電力系統に分散型電源を連系する場合は，分散型電源を連系する配電用変電所の (エ) において，逆向きの潮流を生じさせないこと。ただし，当該配電用変電所に保護装置を施設する等の方法により分散型電源と電力系統との協調をとることができる場合は，この限りではない。","options":["(1) (ア)負荷 (イ)系統側 (ウ)逆潮流 (エ)配電用変圧器","(2) (ア)負荷 (イ)負荷側 (ウ)逆潮流 (エ)引出口","(3) (ア)負荷 (イ)系統側 (ウ)逆充電 (エ)配電用変圧器","(4) (ア)電源 (イ)負荷側 (ウ)逆充電 (エ)引出口","(5) (ア)電源 (イ)系統側 (ウ)逆潮流 (エ)配電用変圧器"],"answer":1,"explanation":"解釈に基づき、(ア)負荷、(イ)系統側、(ウ)逆潮流、(エ)配電用変圧器が正しい組み合わせです。 [cite: 2296, 2142]","has_image":false},{"id":"R05-H1-Q08","year":"R05-1","subject":"法規","category":"電気設備技術基準","tags":["配線","使用電線","裸電線","感電火災防止"],"question":"次の文章は， 「電気設備技術基準」における，電気使用場所での配線の使用電線に関する記述である。空欄 (ア) ～ (ウ) に当てはまる組合せとして，正しいものはどれか。\na) 配線の使用電線( (ア) 及び特別高圧で使用する (イ) を除く。) には，感電又は火災のおそれがないよう，施設場所の状況及び (ウ) に応じ，使用上十分な強度及び絶縁性能を有するものでなければならない。\nb) 配線には， (ア) を使用してはならない。ただし，施設場所の状況及び (ウ) に応じ，使用上十分な強度を有し，かつ，絶縁性がないことを考慮して，配線が感電又は火災のおそれがないように施設する場合は，この限りでない。\nc) 特別高圧の配線には， (イ) を使用してはならない。","options":["(1) (ア)接触電線 (イ)移動電線 (ウ)施設方法","(2) (ア)接触電線 (イ)裸電線 (ウ)使用目的","(3) (ア)接触電線 (イ)裸電線 (ウ)電圧","(4) (ア)裸電線 (イ)接触電線 (ウ)使用目的","(5) (ア)裸電線 (イ)接触電線 (ウ)電圧"],"answer":5,"explanation":"技術基準第56条及び第57条に基づき、(ア)裸電線、(イ)接触電線、(ウ)電圧の組み合わせとなります。 [cite: 2297, 2142]","has_image":false},{"id":"R05-H1-Q09","year":"R05-1","subject":"法規","category":"電気設備技術基準の解釈","tags":["対地電圧制限","住宅","太陽電池","蓄電池"],"question":"次の文章は， 「電気設備技術基準の解釈」に基づく住宅及び住宅以外の場所の屋内電路(電気機械器具内の電路を除く。以下同じ) の対地電圧の制限に関する記述として，誤っているものを次の (1) ～ (5) のうちから一つ選べ。","options":["(1) 住宅の屋内電路の対地電圧を 150 V 以下とすること。","(2) 住宅と店舗，事務所，工場等が同一建造物内にある場合であって，当該住宅以外の場所に電気を供給するための屋内配線を人が触れるおそれがない隠ぺい場所に金属管工事により施設し，その対地電圧を 400 V 以下とすること。","(3) 住宅に設置する太陽電池モジュールに接続する負荷側の屋内配線を，地絡時に自動遮断する装置を施設し，ケーブル工事かつ接触防護措置を施す等の条件で，対地電圧を直流 450 V 以下とすること。","(4) 住宅に常用電源として用いる蓄電池に接続する負荷側の屋内配線を，個々の蓄電池出力が 10 kW 未満，地絡遮断装置を施設し隠ぺい場所に合成樹脂管工事で施設する等の条件で，対地電圧を直流 450 V 以下とすること。","(5) 住宅以外の場所の屋内に施設する家庭用電気機械器具に電気を供給する屋内電路の対地電圧を，簡易接触防護措置を施す等の条件で， 300 V 以下とすること。"],"answer":2,"explanation":"解釈第143条に基づき、住宅以外の場所への供給配線の対地電圧を300V超にする例外規定の内容において、(2)の記述（400V以下とする条件等）に誤りがあります。 [cite: 2297, 2298, 2142]","has_image":false},{"id":"R05-H1-Q10","year":"R05-1","subject":"法規","category":"施設管理","tags":["需要電力制御","ファン停止","計算"],"question":"ある工場のある日の 9 時 00 分からの電力推移がグラフのとおりであった。この工場では日頃から最大需要電力を 300 kW 未満に抑えるように負荷を管理しているが，その負荷の中で，換気用のファン(全て 5.5 kW) は最大 8 台まで停止する運用を行っている。この日 9 時 00 分からファンは 10 台運転しているが，このままだと 9 時 00 分からの最大需要電力が 300 kW 以上になりそうなので， 9 時 20 分から 9 時 30 分の間，ファンを何台かと，その他の負荷を 10 kW 分だけ停止することにした。ファンは最低何台停止させる必要があるか。","options":["(1) 0","(2) 2","(3) 4","(4) 6","(5) 8"],"answer":3,"explanation":"グラフの推移（9:00-9:10が310kW、9:10-9:20が310kW）から、30分間の平均電力を300kW未満にするための9:20-9:30の許容電力を算出し、停止すべきファン台数を求めると4台となります。 [cite: 2301, 2142]","has_image":true,"image":"R05-H1-Q10.png"},{"id":"R05-H1-Q11-a","year":"R05-1","subject":"法規","category":"施設管理","tags":["B問題","需要率","計算"],"question":"【B問題】ある事業所内における A 工場及び B 工場の，それぞれのある日の負荷曲線は図のようであった。それぞれの工場の設備容量が，A 工場では 400 kW，B 工場では 700 kW であるとき，(a) A 工場及び B 工場を合わせた需要率の値[％]として，最も近いものを次の (1) ～ (5) のうちから一つ選べ。","options":["(1) 54.5","(2) 56.8","(3) 63.6","(4) 89.3","(5) 90.4"],"answer":3,"explanation":"需要率 = (最大需要電力 / 設備容量) × 100。合成最大電力は図より 700kW。設備容量合計は 1100kW。 700 / 1100 ≒ 63.6％。 [cite: 2304, 2142]","has_image":true,"image":"R05-H1-Q11.png"},{"id":"R05-H1-Q11-b","year":"R05-1","subject":"法規","category":"施設管理","tags":["B問題","総合負荷率","計算"],"question":"【B問題】(b) A 工場及び B 工場を合わせた総合負荷率の値[％]として，最も近いものを次の (1) ～ (5) のうちから一つ選べ。","options":["(1) 56.8","(2) 63.6","(3) 78.1","(4) 89.3","(5) 91.6"],"answer":4,"explanation":"負荷率 = (平均需要電力 / 最大需要電力) × 100。図から24時間の総電力量を求め、平均電力を算出して最大電力700kWで除すと約89.3％となります。 [cite: 2304, 2142]","has_image":true,"image":"R05-H1-Q11.png"},{"id":"R05-H1-Q12-a","year":"R05-1","subject":"法規","category":"電気設備技術基準の解釈","tags":["B問題","B種接地工事","上限抵抗値","計算"],"question":"【B問題】図は三相 3 線式高圧電路に変圧器で結合された変圧器低圧側電路を示したものである。(a) 変圧器に施された，接地抵抗 RB の抵抗値について｢電気設備技術基準の解釈｣で許容されている上限の抵抗値[Ω]として，最も近いものを次の (1) ～ (5) のうちから一つ選べ。なお1線地絡電流は5A、1.3秒で遮断する装置ありとする。","options":["(1) 20","(2) 30","(3) 40","(4) 60","(5) 100"],"answer":4,"explanation":"解釈第17条に基づき、2秒以内に遮断する装置がある場合は 300 / I となります。 300 / 5 = 60Ω。 [cite: 2306, 2142]","has_image":true,"image":"R05-H1-Q12.png"},{"id":"R05-H1-Q12-b","year":"R05-1","subject":"法規","category":"施設管理","tags":["B問題","常時漏れ電流","計算"],"question":"【B問題】(b) 接地抵抗 RB の抵抗値を 10 Ω としたときに， RB に常時流れる電流 IB の値[mA]として，最も近いものを次の (1) ～ (5) のうちから一つ選べ。対地電圧200/√3 V、対地静電容量C=0.1μFとする。","options":["(1) 11","(2) 19","(3) 33","(4) 65","(5) 192"],"answer":1,"explanation":"三相一括の静電容量 3C と接地抵抗 RB の直列回路に相電圧がかかるものとして計算すると、約11mAとなります。 [cite: 2306, 2307, 2142]","has_image":true,"image":"R05-H1-Q12.png"},{"id":"R05-H1-Q13-a","year":"R05-1","subject":"法規","category":"電気設備技術基準の解釈","tags":["B問題","風圧荷重","ACSR","高温季","計算"],"question":"【B問題】特別高圧架空電線路（ACSR 150mm2、外径15mm）がある。(a) 高温季において電線 1 条，長さ 1 m 当たりに加わる風圧荷重の値[N]として，最も近いものを次の (1) ～ (5) のうちから一つ選べ。甲種風圧荷重は980Paとする。","options":["(1) 10.3","(2) 13.2","(3) 14.7","(4) 9.8","(5) 26.5"],"answer":3,"explanation":"風圧荷重 P = p × d × L。 980Pa × 0.015m × 1m = 14.7N。 [cite: 2307, 2142]","has_image":false},{"id":"R05-H1-Q13-b","year":"R05-1","subject":"法規","category":"電気設備技術基準の解釈","tags":["B問題","風圧荷重","乙種","甲種","外径比較","計算"],"question":"【B問題】(b) 低温季に適用される風圧荷重が乙種風圧荷重となる電線の仕上り外径の値[mm]として，最も大きいものを次の (1) ～ (5) のうちから一つ選べ。氷雪厚さ6mm、比重0.9とする。","options":["(1) 10","(2) 12","(3) 15","(4) 18","(5) 21"],"answer":2,"explanation":"乙種風圧荷重の計算式において、甲種を上回る条件（外径が小さいほど乙種が支配的になる）を検討し、境界となる外径を求めると12mmとなります。 [cite: 2307, 2142]","has_image":false},{"id":"R05-H2-Q01","year":"R05-2","subject":"法規","category":"電気事業法","tags":["保安規程","自家用電気工作物","条文"],"question":"次の文章は，「電気事業法施行規則」に基づく自家用電気工作物を設置する者が保安規程に定めるべき事項の一部に関しての記述である。空欄(ア)～(オ)に当てはまる組合せとして，正しいものはどれか。\na) 自家用電気工作物の工事，維持又は運用に関する業務を管理する者の (ア) に関すること。\nb) 自家用電気工作物の工事，維持又は運用に従事する者に対する (イ) に関すること。\nc) 自家用電気工作物の工事，維持及び運用に関する保安のための (ウ) 及び検査に関すること。\nd) 自家用電気工作物の運転又は操作に関すること。\ne) 発電所又は蓄電所の運転を相当期間停止する場合における保全の方法に関すること。\nf) 災害その他非常の場合に採るべき (エ) に関すること。\ng) 自家用電気工作物の工事，維持及び運用に関する保安についての (オ) に関すること。","options":["(1) (ア)権限及び義務 (イ)勤務体制 (ウ)巡視，点検 (エ)指揮命令 (オ)記録","(2) (ア)職務及び組織 (イ)勤務体制 (ウ)整備，補修 (エ)措置 (オ)届出","(3) (ア)権限及び義務 (イ)保安教育 (ウ)整備，補修 (エ)指揮命令 (オ)届出","(4) (ア)職務及び組織 (イ)保安教育 (ウ)巡視，点検 (エ)措置 (オ)記録","(5) (ア)権限及び義務 (イ)勤務体制 (ウ)整備，補修 (エ)指揮命令 (オ)記録"],"answer":4,"explanation":"電気事業法施行規則第50条の規定に基づきます。(ア)職務及び組織、(イ)保安教育、(ウ)巡視，点検、(エ)措置、(オ)記録が正解です。 [cite: 2318, 2405]","has_image":false},{"id":"R05-H2-Q02","year":"R05-2","subject":"法規","category":"電気工事業法","tags":["登録","通知","自家用電気工作物"],"question":"次の文章は，「電気工事業の業務の適正化に関する法律」に規定されている電気工事業者に関する記述である。空欄(ア)～(ウ)に当てはまる組合せとして，正しいものはどれか。\nこの法律において，「電気工事業」とは，電気工事士法に規定する電気工事を行う事業をいい，「(ア) 電気工事業者」とは，経済産業大臣又は (イ) の (ア) を受けて電気工事業を営む者をいう。また，「通知電気工事業者」とは，経済産業大臣又は (イ) に電気工事業の開始の通知を行って， (ウ) に規定する自家用電気工作物のみに係る電気工事業を営む者をいう。","options":["(1) (ア)承認 (イ)都道府県知事 (ウ)電気工事士法","(2) (ア)許可 (イ)産業保安監督部長 (ウ)電気事業法","(3) (ア)登録 (イ)都道府県知事 (ウ)電気工事士法","(4) (ア)承認 (イ)電気事業法 (ウ)産業保安監督部長","(5) (ア)登録 (イ)産業保安監督部長 (ウ)電気工事士法"],"answer":3,"explanation":"電気工事業法第2条の定義に基づきます。(ア)登録、(イ)都道府県知事、(ウ)電気工事士法が正解です。 [cite: 2318, 2415]","has_image":false},{"id":"R05-H2-Q03","year":"R05-2","subject":"法規","category":"電気設備技術基準","tags":["絶縁","混触","接地"],"question":"次の文章は，「電気設備技術基準」に関する記述である。空欄(ア)～(ウ)に当てはまる組合せとして，正しいものはどれか。\n電路は，大地から (ア) しなければならない。ただし，構造上やむを得ない場合であって通常予見される使用形態を考慮し危険のおそれがない場合，又は (イ) による高電圧の侵入等の異常が発生した際の危険を回避するための (ウ) その他の保安上必要な措置を講ずる場合は，この限りでない。","options":["(1) (ア)事故 (イ)離隔 (ウ)遮断","(2) (ア)短絡 (イ)離隔 (ウ)遮断","(3) (ア)短絡 (イ)絶縁 (ウ)離隔","(4) (ア)絶縁 (イ)混触 (ウ)接地","(5) (ア)遮断 (イ)混触 (ウ)接地"],"answer":4,"explanation":"技術基準第5条の規定通りです。(ア)絶縁、(イ)混触、(ウ)接地が正解です。 [cite: 2318, 2421]","has_image":false},{"id":"R05-H2-Q04","year":"R05-2","subject":"法規","category":"電気設備技術基準の解釈","tags":["高圧機械器具","施設制限"],"question":"「電気設備技術基準の解釈」に基づく，高圧の機械器具の施設について，発電所，蓄電所又は変電所，開閉所若しくはこれらに準ずる場所以外の場所において，高圧の機械器具を施設することができる場合として，誤っているものを次の(1)～(5)のうちから一つ選べ。","options":["(1) 人が触れるおそれがないように，機械器具の周囲に適当なさく，へい等を設け，当該さく，へい等の高さと，当該さく，へい等から機械器具の充電部分までの距離との和を5m以上とし，かつ，危険である旨の表示をする場合","(2) 工場等の構内において，機械器具の周囲に高圧用機械器具である旨の表示をする場合","(3) 屋内であって，取扱者以外の者が出入りできないように措置した場所に施設する場合","(4) 機械器具をコンクリート製の箱又はD種接地工事を施した金属製の箱に収め，かつ，充電部分が露出しないように施設する場合","(5) 充電部分が露出しない機械器具を人が接近又は接触しないよう，さく，へい等を設けて施設する場合"],"answer":2,"explanation":"解釈第21条に基づきます。単なる表示だけでは不十分であり、物理的な防護措置が必要です。 [cite: 2318, 2426]","has_image":false},{"id":"R05-H2-Q05","year":"R05-2","subject":"法規","category":"電気設備技術基準","tags":["地中電線路","アーク","防火措置"],"question":"次の文章は，「電気設備技術基準」における（地中電線等による他の電線及び工作物への危険の防止）及び（地中電線路の保護）に関する記述である。空欄(ア)～(エ)に当てはまる組合せとして，正しいものはどれか。\na) 地中電線，屋側電線及びトンネル内電線その他の工作物に固定して施設する電線は，他の電線，弱電流電線等又は管(以下，「他の電線等」という。)と (ア) し，又は交さする場合には，故障時の (イ) により他の電線等を損傷するおそれがないように施設しなければならない。ただし，感電又は火災のおそれがない場合であって， (ウ) 場合は，この限りでない。\nb) 地中電線路は，車両その他の重量物による圧力に耐え，かつ，当該地中電線路を埋設している旨の表示等により掘削工事からの影響を受けないように施設しなければならない。\nc) 地中電線路のうちその内部で作業が可能なものには， (エ) を講じなければならない。","options":["(1) (ア)接触 (イ)短絡電流 (ウ)取扱者以外の者が容易に触れることがない (エ)防火措置","(2) (ア)接近 (イ)アーク放電 (ウ)他の電線等の管理者の承諾を得た (エ)防火措置","(3) (ア)接近 (イ)アーク放電 (ウ)他の電線等の管理者の承諾を得た (エ)感電防止措置","(4) (ア)接触 (イ)短絡電流 (ウ)他の電線等の管理者の承諾を得た (エ)防火措置","(5) (ア)短絡電流 (イ)接近 (ウ)取扱者以外の者が容易に触れることがない (エ)感電防止措置"],"answer":2,"explanation":"技術基準第30条及び第47条に基づきます。(ア)接近、(イ)アーク放電、(ウ)他の電線等の管理者の承諾を得た、(エ)防火措置が正解です。 [cite: 2318, 2441]","has_image":false},{"id":"R05-H2-Q06","year":"R05-2","subject":"法規","category":"電気設備技術基準の解釈","tags":["昇塔防止","足場金具"],"question":"架空電線路の支持物に，取扱者が昇降に使用する足場金具等を地表上 1.8 m 未満に施設することができる場合として，｢電気設備技術基準の解釈｣に基づき，不適切なものを次の(1)～(5)のうちから一つ選べ。","options":["(1) 監視装置を施設する場合","(2) 足場金具等が内部に格納できる構造である場合","(3) 支持物に昇塔防止のための装置を施設する場合","(4) 支持物の周囲に取扱者以外の者が立ち入らないように，さく，へい等を施設する場合","(5) 支持物を山地等であって人が容易に立ち入るおそれがない場所に施設する場合"],"answer":1,"explanation":"解釈第64条に基づきます。監視装置の施設は昇塔防止の例外規定には含まれません。 [cite: 2318, 2452]","has_image":false},{"id":"R05-H2-Q07","year":"R05-2","subject":"法規","category":"電気設備技術基準の解釈","tags":["分散型電源","自立運転","用語定義"],"question":"｢電気設備技術基準の解釈｣に基づく分散型電源の系統連系設備に係る用語の定義に関する記述として，正しいものを次の(1)～(5)のうちから一つ選べ。","options":["(1) 単独運転とは，分散型電源を連系している電力系統が事故等によって系統電源と切り離された状態において，当該分散型電源が発電を継続し，線路負荷に無効電力を供給している状態をいう。","(2) 自立運転とは，分散型電源が，連系している電力系統から解列された状態において，当該分散型電源設置者の構内負荷にのみ電力を供給している状態をいう。","(3) 逆充電とは，分散型電源設置者の構内から，一般送配電事業者が運用する電力系統側へ向かう有効電力の流れをいう。","(4) 受動的方式の単独運転検出装置とは，分散型電源の有効電力出力又は無効電力出力等に平時から変動を与えておき，単独運転移行時に当該変動に起因して生じる周波数等の変化により，単独運転状態を検出する装置をいう。","(5) 能動的方式の単独運転検出装置とは，単独運転移行時に生じる電圧位相又は周波数等の変化により，単独運転状態を検出する装置をいう。"],"answer":2,"explanation":"解釈第220条に基づきます。自立運転の定義を述べている(2)が正しい記述です。 [cite: 2318, 2452]","has_image":false},{"id":"R05-H2-Q08","year":"R05-2","subject":"法規","category":"電気設備技術基準","tags":["電気さく","感電火災防止","漏電遮断器"],"question":"次の文章は，｢電気設備技術基準｣及び｢電気設備技術基準の解釈｣に基づく電気さくの施設に関する記述である。空欄(ア)～(ｴ)に当てはまる組合せとして，正しいものはどれか。\n「電気設備技術基準」：電気さくは施設してはならない。ただし，野獣の侵入防止等のため，絶縁性がないことを考慮し， (ア) のおそれがないように施設するときは，この限りでない。\n「電気設備技術基準の解釈」：電気さくを施設した場所には適当な間隔で (イ) である旨の表示をすること。電源装置が使用電圧 (ウ) V 以上の電源から供給を受ける場合，人が容易に立ち入る場所では電路に (エ) mA以下で動作する漏電遮断器を施設すること。","options":["(1) (ア)感電又は火災 (イ)危険 (ウ)100 (エ)15","(2) (ア)感電又は火災 (イ)電気さく (ウ)30 (エ)10","(3) (ア)損壊 (イ)電気さく (ウ)100 (エ)15","(4) (ア)感電又は火災 (イ)危険 (ウ)30 (エ)15","(5) (ア)損壊 (イ)電気さく (ウ)100 (エ)10"],"answer":4,"explanation":"技術基準第74条及び解釈第192条に基づきます。(ア)感電又は火災、(イ)危険、(ウ)30、(エ)15が正解です。 [cite: 2318, 2454]","has_image":false},{"id":"R05-H2-Q09","year":"R05-2","subject":"法規","category":"電気設備技術基準の解釈","tags":["ライティングダクト","施工"],"question":"｢電気設備技術基準の解釈｣に基づく，ライティングダクト工事による低圧屋内配線の施設に関する記述として，正しいものを次の(1)～(5)のうちから一つ選べ。","options":["(1) ダクトの支持点間の距離を 2m 以下で施設した。","(2) 造営材を貫通してダクト相互を接続したため，貫通部の造営材には接触させず，ダクト相互及び電線相互は堅ろうに，かつ，電気的に完全に接続した。","(3) ダクトの開口部を上に向けたため，人が容易に触れるおそれのないようにし，ダクトの内部に塵埃が侵入し難いように施設した。","(4) 5m のダクトを人が容易に触れるおそれがある場所に施設したため，ダクトには D 種接地工事を施し，電路に地絡を生じたときに自動的に電路を遮断する装置は施設しなかった。","(5) ダクトを固定せず使用するため，ダクトは電気用品安全法に適合した附属品でキャブタイヤケーブルに接続して，終端部は堅ろうに閉そくした。"],"answer":1,"explanation":"解釈第165条に基づきます。支持点間距離2m以下の(1)が正しい記述です。 [cite: 2318, 2458]","has_image":false},{"id":"R05-H2-Q10","year":"R05-2","subject":"法規","category":"施設管理","tags":["変流器","二次側短絡"],"question":"次の文章は，計器用変成器の変流器に関する記述である。その記述内容として誤っているものを次の(1)～(5)のうちから一つ選べ。","options":["(1) 変流器は，一次電流から生じる磁束によって二次電流を発生させる計器用変成器である。","(2) 変流器は，二次側に開閉器やヒューズを設置してはいけない。","(3) 変流器は，通電中に二次側が開放されると変流器に異常電圧が発生し，絶縁が破壊される危険性がある。","(4) 変流器は，一次電流が一定でも二次側の抵抗値により変流比は変化するので，電流計の選択には注意が必要になる。","(5) 変流器の通電中に，電流計をやむを得ず交換する場合は，二次側端子を短絡して交換し，その後に短絡を外す。"],"answer":4,"explanation":"変流器の基本特性に基づきます。変流比は二次側抵抗（負担）によらず一定である（精度は変わるが比は変わらない）ため、(4)が誤りです。 [cite: 2318, 2458]","has_image":false}];
CHUNKS[5]=[{"id":"R05-H2-Q11-a","year":"R05-2","subject":"法規","category":"施設管理","tags":["B問題","地絡電流","計算式"],"question":"【B問題】図は，線間電圧 V [V]，周波数 f [Hz]の中性点非接地方式の三相3線式高圧配電線路及びある需要設備の高圧地絡保護システムを簡易に示した単線図である。(a) 図の配電線路において，遮断器が｢入｣の状態で地絡事故点に一線完全地絡事故が発生し地絡電流 Ig [A]が流れた。このとき Ig の大きさを表す式として，正しいものを次の(1)～(5)のうちから一つ選べ。","options":["(1) √3 V ・ 2πf(C1 + C2)","(2) 3V ・ 2πf(C1 + C2)","(3) (V/√3) ・ 2πf(C1 + C2)","(4) √3 V ・ 2πf ・ 3(C1 + C2)","(5) 3V ・ 2πf ・ 3(C1 + C2)"],"answer":4,"explanation":"非接地系統の一線地絡電流の公式 $I_g = 3\\omega C E$ （$E = V/\\sqrt{3}$）に基づき、全静電容量 $(C1+C2)$ を用いて整理すると、$\\sqrt{3} V \\cdot 2\\pi f \\cdot 3(C1 + C2)$ となります。解答(4) [cite: 2318, 2461]","has_image":true,"image":"R05-H2-Q11.png"},{"id":"R05-H2-Q11-b","year":"R05-2","subject":"法規","category":"施設管理","tags":["B問題","分流","零相電流","計算"],"question":"【B問題】(b) 地絡電流 Ig が高圧配電線路側と需要設備側に分流する割合は C1 と C2 の比によって決まるものとしたとき，Ig のうち需要設備の零相変流器で検出される電流の値[mA]として，最も近いものを次の(1)～(5)のうちから一つ選べ。V=6600V, f=60Hz, C1=2.3μF, C2=0.02μF とする。","options":["(1) 54","(2) 86","(3) 124","(4) 152","(5) 256"],"answer":2,"explanation":"需要設備側の零相電流 $I_o$ は $Ig \\cdot (C2 / (C1+C2))$ で求められます。計算すると約 86mA となります。 [cite: 2318, 2461]","has_image":true,"image":"R05-H2-Q11.png"},{"id":"R05-H2-Q12-a","year":"R05-2","subject":"法規","category":"施設管理","tags":["B問題","端子電圧","計算"],"question":"【B問題】三相 3 線式の高圧電路に 300 kW，遅れ力率 0.6 の三相負荷が接続されている。(a) 進相コンデンサ設備（直列リアクトル SR のリアクタンスがコンデンサ SC の 6 ％）を高圧電路（6600V）に接続したときに三相コンデンサ SC の端子電圧の値[V]として，最も近いものを次の(1)～(5)のうちから一つ選べ。","options":["(1) 6 410","(2) 6 795","(3) 6 807","(4) 6 995","(5) 7 021"],"answer":5,"explanation":"コンデンサの端子電圧 $V_C$ は、線路電圧 $V$ に対し $V_C = V / (1 - p)$ （$p=0.06$）となります。 $6600 / 0.94 \\approx 7021$ V。 [cite: 2318, 2465]","has_image":true,"image":"R05-H2-Q12.png"},{"id":"R05-H2-Q12-b","year":"R05-2","subject":"法規","category":"施設管理","tags":["B問題","コンデンサ容量","力率改善","計算"],"question":"【B問題】(b) 力率を遅れ 0.6 から遅れ 0.8 に改善した。このとき，この設備の三相コンデンサ SC の容量の値[kvar]として，最も近いものを次の(1)～(5)のうちから一つ選べ。","options":["(1) 170","(2) 180","(3) 186","(4) 192","(5) 208"],"answer":3,"explanation":"必要な改善容量 $Q = P(\tan\theta_1 - \tan\theta_2) = 300(\tan(\\arccos0.6) - \tan(\\arccos0.8)) = 300(1.333 - 0.75) = 175$ kvar。これは設備全体の容量なので、コンデンサ単体容量 $Q_C = Q / (1-p) = 175 / 0.94 \\approx 186$ kvar となります。 [cite: 2318, 2465]","has_image":true,"image":"R05-H2-Q12.png"},{"id":"R05-H2-Q13-a","year":"R05-2","subject":"法規","category":"電気関係報告規則","tags":["B問題","供給支障事故","定義"],"question":"【B問題】電気工作物に起因する供給支障事故について，(a) ｢電気関係報告規則｣及び「電気事業法第 39 条」に基づき，空欄(ｱ)～(ｴ)に当てはまる組合せとして，正しいものはどれか。","options":["(1) (ｱ)一般送配電事業 (ｲ)自家用電気工作物 (ｳ)6 000 (ｴ)事故点 1 又は事故点 2","(2) (ｱ)送電事業 (ｲ)事業用電気工作物 (ｳ)3 000 (ｴ)事故点 1 又は事故点 3","(3) (ｱ)一般送配電事業 (ｲ)事業用電気工作物 (ｳ)6 000 (ｴ)事故点 2 又は事故点 3","(4) (ｱ)送電事業 (ｲ)事業用電気工作物 (ｳ)6 000 (ｴ)事故点 1 又は事故点 2","(5) (ｱ)一般送配電事業 (ｲ)自家用電気工作物 (ｳ) 3 000 (ｴ) 事故点 2 又は事故点 3"],"answer":5,"explanation":"報告規則に基づき、自家用電気工作物が一般送配電事業者に供給支障（3000V以上）をさせた場合が報告対象です。図の系統では事故点2または3が該当します。 [cite: 2318, 2471]","has_image":true,"image":"R05-H2-Q13.png"},{"id":"R05-H2-Q13-b","year":"R05-2","subject":"法規","category":"施設管理","tags":["B問題","保護協調","地絡方向継電器"],"question":"【B問題】(b) 受電設備を含む配電系統の保護協調について，空欄(ｱ)～(ｴ)に当てはまる組合せとして，正しいものはどれか。","options":["(1) 同期協調，曲線 2，曲線 3，地絡距離継電器","(2) 同期協調，曲線 1，曲線 3，地絡方向継電器","(3) 保護協調，曲線 1，曲線 4，地絡距離継電器","(4) 保護協調，曲線 2，曲線 4，地絡方向継電器","(5) 保護協調，曲線 2，曲線 3，地絡距離継電器"],"answer":4,"explanation":"事故点直近の遮断器を優先動作させる「保護協調」、下位の曲線2や4、および地絡方向を判別する「地絡方向継電器」の組み合わせが正解です。 [cite: 2318, 2471]","has_image":true,"image":"R05-H2-Q13.png"},{"id":"R06-H1-Q01","year":"R06-1","subject":"法規","category":"電気事業法","tags":["技術基準適合","維持義務","命令"],"question":"次の文章は，「電気事業法」における事業用電気工作物の技術基準への適合に関する記述の一部である。空欄(ア)～(ウ)に当てはまる組合せとして，正しいものはどれか。\na) 事業用電気工作物を設置する者は，事業用電気工作物を主務省令で定める技術基準に適合するように (ア) しなければならない。\nb) 上記a)の主務省令で定める技術基準では，次に掲げるところによらなければならない。\n ① 事業用電気工作物は，人体に危害を及ぼし，又は物件に損傷を与えないようにすること。\n ② 事業用電気工作物は，他の電気的な設備その他の物件の機能に電気的又は (イ) 的な障害を与えないようにすること。\nc) 主務大臣は，事業用電気工作物が上記a)の主務省令で定める技術基準に適合していないと認めるときは，設置者に対し，修理，改造，移転，若しくはその使用を (ウ) すべきことを命じ，又はその使用を制限することができる。","options":["(1) (ア)設置 (イ)一時停止 (ウ)磁気","(2) (ア)維持 (イ)磁気 (ウ)一時停止","(3) (ア)設置 (イ)熱 (ウ)禁止","(4) (ア)維持 (イ)禁止 (ウ)熱","(5) (ア)設置 (イ)熱 (ウ)一時停止"],"answer":2,"explanation":"電気事業法第39条及び第40条の規定に基づきます。(ア)維持、(イ)磁気、(ウ)一時停止が正解です。[cite: 2481, 2555, 2563]"},{"id":"R06-H1-Q02","year":"R06-1","subject":"法規","category":"電気関係報告規則","tags":["事故報告","自家用電気工作物","事故事例"],"question":"「電気関係報告規則」に基づく，事故報告に関して，受電電圧 6 600 V の自家用電気工作物を設置する事業場における事故事例のうち，事故報告に該当しないものを次の(1)～(5)のうちから一つ選べ。","options":["(1) 自家用電気工作物の破損事故に伴う構内 1 号柱の倒壊により，第三者の家屋に損傷を与えた。","(2) 保修作業員が，作業中誤って分電盤内の低圧 200 V の端子に触れて感電負傷し，病院に入院した。","(3) 電圧 100 V の屋内配線の漏電により火災が発生し，建屋が半焼した。","(4) 従業員が，操作を誤って高圧の誘導電動機を損壊させた。","(5) 落雷により高圧負荷開閉器が破損し，一般送配電事業者に供給支障を発生させたが，電気火災は発生せず，また，感電死傷者は出なかった。"],"answer":4,"explanation":"報告規則第3条に基づき，(4)の単なる機器の損壊（他への影響なし）は報告対象外です。[cite: 2481, 2568, 2572]"},{"id":"R06-H1-Q03","year":"R06-1","subject":"法規","category":"電気設備技術基準","tags":["光ファイバケーブル","定義","条文"],"question":"「電気設備技術基準」では，「光ファイバケーブル」及び「光ファイバケーブル線路」の定義を次のように規定している。空欄(ア)～(ウ)に当てはまる組合せとして，正しいものはどれか。\na) 「光ファイバケーブル」とは，光信号の伝送に使用する伝送媒体であって，保護 (ア) で保護したものをいう。\nb) 「光ファイバケーブル線路」とは，光ファイバケーブル及びこれを (イ) し，又は保蔵する工作物(造営物の屋内又は (ウ) に施設するものを除く。)をいう。","options":["(1) (ア)装置 (イ)収納 (ウ)屋外","(2) (ア)装置 (イ)収納 (ウ)屋上","(3) (ア)被覆 (イ)支持 (ウ)屋側","(4) (ア)被覆 (イ)保護 (ウ)屋上","(5) (ア)器具 (イ)支持 (ウ)屋側"],"answer":3,"explanation":"技術基準第1条（定義）に基づきます。(ア)被覆、(イ)支持、(ウ)屋側が正解です。[cite: 2481, 2579, 2581]"},{"id":"R06-H1-Q04","year":"R06-1","subject":"法規","category":"電気設備技術基準の解釈","tags":["高圧機械器具","施設制限"],"question":"「電気設備技術基準の解釈」に基づく，高圧の機械器具(これに附属する高圧電線であってケーブル以外のものを含む。以下同じ。)の施設について，発電所，蓄電所又は変電所，開閉所若しくはこれらに準ずる場所以外の場所において，高圧の機械器具を施設することができる場合として，誤っているものを次の(1)～(5)のうちから一つ選べ。","options":["(1) 人が触れるおそれがないように，機械器具の周囲に適当なさく，へい等を設け，当該さく，へい等の高さと，当該さく，へい等から機械器具の充電部分までの距離との和を 5 m 以上とし，かつ，危険である旨の表示をする場合","(2) 屋内であって，取扱者以外の者が出入りできないように措置した場所に施設する場合","(3) 工場等の構内において，機械器具の周囲に高圧用機械器具である旨の表示をする場合","(4) 機械器具をコンクリート製の箱又は D 種接地工事を施した金属製の箱に収め，かつ，充電部分が露出しないように施設する場合","(5) 充電部分が露出しない機械器具を人が接近又は接触しないよう，さく，へい等を設けて施設する場合"],"answer":3,"explanation":"解釈第21条に基づきます。単なる表示だけでは不十分であり、囲い等の防護措置が必要です。[cite: 2481, 2586, 2589]"},{"id":"R06-H1-Q05","year":"R06-1","subject":"法規","category":"発電用風力設備技術基準","tags":["風車","安全確保","停止措置"],"question":"次の文章は，「発電用風力設備に関する技術基準を定める省令」に基づく風車の安全な状態の確保に関する記述である。空欄(ア)～(エ)に当てはまる組合せとして，正しいものはどれか。\na) 風車は，次の場合に安全かつ自動的に停止するような措置を講じなければならない。\n ① (ア) が著しく上昇した場合\n ② 風車の (イ) の機能が著しく低下した場合\nb) 最高部の (ウ) からの高さが 20 m を超える発電用風力設備には， (エ) から風車を保護するような措置を講じなければならない。","options":["(1) (ア)回転速度 (イ)制御装置 (ウ)地表 (エ)雷撃","(2) (ア)発電電圧 (イ)圧油装置 (ウ)地表 (エ)雷撃","(3) (ア)回転速度 (イ)制御装置 (ウ)地表 (エ)雷撃","(4) (ア)制御装置 (イ)発電電圧 (ウ)ロータ最低部 (エ)強風","(5) (ア)回転速度 (イ)圧油装置 (ウ)ロータ最低部 (エ)強風"],"answer":3,"explanation":"発電用風力設備技術基準第5条に基づき、(ア)回転速度、(イ)制御装置、(ウ)地表、(エ)雷撃の組み合わせとなります。[cite: 2481, 2596, 2601]"},{"id":"R06-H1-Q06","year":"R06-1","subject":"法規","category":"電気設備技術基準の解釈","tags":["高圧架空引込線","高さ","表示"],"question":"次の文章は，「電気設備技術基準の解釈」に基づく高圧架空引込線の施設に関する記述の一部である。空欄(ア)～(エ)に当てはまる組合せとして，正しいものはどれか。\na) 引張強さ 8.01 kN 以上のもの又は直径 (ア) mm 以上の硬銅線を使用すること。\nb) (イ) 用高圧絶縁電線を使用すること。\nc) 道路横断等を除き，地表上 (ウ) m 以上とすることができる。\nd) ケーブル以外の場合は，その電線の (エ) に危険である旨の表示をすること。","options":["(1) (ア) 5 (イ) 引下げ (ウ) 2.5 (エ) 下方","(2) (ア) 4 (イ) 引下げ (ウ) 3.5 (エ) 近傍","(3) (ア) 4 (イ) 引上げ (ウ) 2.5 (エ) 近傍","(4) (ア) 5 (イ) 引下げ (ウ) 3.5 (エ) 下方","(5) (ア) 5 (イ) 引上げ (ウ) 5 (エ) 下方"],"answer":4,"explanation":"解釈第117条に基づき、直径5mm、引下げ用電線、条件付きで3.5m以上、下方への表示が規定されています。[cite: 2481, 2628]"},{"id":"R06-H1-Q07","year":"R06-1","subject":"法規","category":"電気設備技術基準の解釈","tags":["分散型電源","高圧連系","保護リレー"],"question":"「電気設備技術基準の解釈」に基づく高圧連系時の系統連系用保護装置に関する記述。空欄(ア)～(エ)に当てはまる組合せとして，正しいものはどれか。\n検出する異常として， (ア) 異常上昇， (ア) 異常低下， (イ) 短絡事故， (イ) 地絡事故，および (エ) があり，地絡事故の検出には (ウ) リレー等を用いること。","options":["(1) (ア)発電電圧 (イ)系統側 (ウ)電流差動 (エ)単独運転","(2) (ア)発電電圧 (イ)系統側 (ウ)地絡過電圧 (エ)逆充電","(3) (ア)系統電圧 (イ)発電側 (ウ)電流差動 (エ)逆充電","(4) (ア)系統電圧 (イ)発電側 (ウ)地絡過電圧 (エ)単独運転","(5) (ア)発電電圧 (イ)系統側 (ウ)地絡過電圧 (エ)単独運転"],"answer":5,"explanation":"解釈第228条に基づく高圧連系時の保護リレーの構成です。(ア)発電電圧、(イ)系統側、(ウ)地絡過電圧、(エ)単独運転が正解です。[cite: 2481, 2632]"},{"id":"R06-H1-Q08","year":"R06-1","subject":"法規","category":"電気設備技術基準","tags":["絶縁抵抗","低圧電路","対地電圧"],"question":"「電気設備技術基準」における低圧の電路の絶縁性能に関する記述。空欄(ア)～(オ)に当てはまる組合せとして，正しいものはどれか。\n電路と大地との間の絶縁抵抗は，使用電圧が (ウ) V 以下の区分で， (エ) が 150 V 以下の場合は 0.1 MΩ，それ以外は 0.2 MΩ 以上。 (ウ) V を超えるものは (オ) MΩ 以上必要。絶縁抵抗は開閉器又は (イ) で区切ることのできる電路ごとに測定する。","options":["(1) (ア)電線 (イ)配線用遮断器 (ウ)400 (エ)公称電圧 (オ)0.3","(2) (ア)電線路 (イ)漏電遮断器 (ウ)400 (エ)公称電圧 (オ)0.3","(3) (ア)電路 (イ)過電流遮断器 (ウ)300 (エ)対地電圧 (オ)0.4","(4) (ア)電線 (イ)過電流遮断器 (ウ)300 (エ)最大使用電圧 (オ)0.4","(5) (ア)電路 (イ)配線用遮断器 (ウ)400 (エ)対地電圧 (オ)0.4"],"answer":3,"explanation":"技術基準第58条に基づきます。(ア)電路、(イ)過電流遮断器、(ウ)300、(エ)対地電圧、(オ)0.4が正解です。[cite: 2481, 2633]"},{"id":"R06-H1-Q09","year":"R06-1","subject":"法規","category":"電気設備技術基準の解釈","tags":["配線器具","施工方法","防護装置"],"question":"「電気設備技術基準の解釈」における低圧用の配線器具の施設に関する記述。空欄(ア)～(ウ)に当てはまる組合せとして，正しいものはどれか。\na) (ア) ように施設すること。ただし取扱者以外が触れない場所は除く。\nb) 接続点に (イ) が加わらないようにすること。\nc) 屋外施設で (ウ) おそれがある場合には堅ろうな防護装置を施すこと。","options":["(1) (ア)充電部分が露出しない (イ)張力 (ウ)感電の","(2) (ア)容易に開けることができない (イ)異常電圧 (ウ)損傷を受ける","(3) (ア)容易に開けることができない (イ)張力 (ウ)感電の","(4) (ア)充電部分が露出しない (イ)張力 (ウ)損傷を受ける","(5) (ア)容易に開けることができない (イ)異常電圧 (ウ)感電の"],"answer":4,"explanation":"解釈第150条に基づき、充電部露出防止、張力緩和、損傷防止措置が必要です。[cite: 2481, 2634]"},{"id":"R06-H1-Q10","year":"R06-1","subject":"法規","category":"施設管理","tags":["短絡事故","遮断器動作","PAS"],"question":"ある配電用変電所の送り出し遮断器 A から需要家構内の主遮断器までの電路において，需要家構内で短絡事故が発生した場合の遮断器 A と，区分開閉器 B(SOG 機能付 PAS)の動作として，正しいものを次の(1)～(5)のうちから一つ選べ。","options":["(1) A が開路したのち，B が開路し，その後 A が閉路する。","(2) B が開路したのち，A が開路し，その後 A が閉路する。","(3) A と B が同時に開路し，その後 A が閉路する。","(4) A が開路する。(B は開路しない。)","(5) B が開路する。(A は開路しない。)"],"answer":1,"explanation":"短絡事故時、過電流ロック機能により変電所遮断器Aが先に開き、無電圧後にBが蓄勢トリップし、Aが再閉路して他への停電を復旧させます。[cite: 2481, 2637]"},{"id":"R06-H1-Q11-a","year":"R06-1","subject":"法規","category":"施設管理","tags":["B問題","電圧降下","計算"],"question":"【B問題】専用配電線（抵抗 3 Ω，リアクタンス 5 Ω）で受電する需要家（使用電力 8 000 kW，力率 0.8 遅れ）がある。(a) 受電電圧が 20 kV のとき，変電所引出口の電圧 [kV] として，最も近いものを次の (1) ～ (5) のうちから一つ選べ。","options":["(1) 21.6","(2) 22.2","(3) 22.7","(4) 22.9","(5) 23.1"],"answer":3,"explanation":"電圧降下近似式 $e \\approx \\sqrt{3} I (R \\cos\theta + X \\sin\theta)$ を用いて計算すると、2.73kV。20 + 2.73 = 22.73kVとなります。[cite: 2481, 2641]"},{"id":"R06-H1-Q11-b","year":"R06-1","subject":"法規","category":"施設管理","tags":["B問題","電圧降下","力率改善","計算"],"question":"【B問題】(b) 需要家の力率を 0.95(遅れ)に改善したときの配電線の電圧降下の，改善前に対する比率 [％] として，最も近いものを次の (1) ～ (5) のうちから一つ選べ。","options":["(1) 66.6","(2) 68.8","(3) 75.5","(4) 81.7","(5) 97.0"],"answer":2,"explanation":"改善後の電流と各成分を計算し、電圧降下を求めて比率を出すと約68.8%となります。[cite: 2481, 2641]"},{"id":"R06-H1-Q12-a","year":"R06-1","subject":"法規","category":"施設管理","tags":["B問題","コンデンサ","端子電圧","計算"],"question":"【B問題】高圧電路（6 600 V）に接続された進相コンデンサ設備（直列リアクトル 6 ％付）。(a) 三相コンデンサ SC の端子電圧 [V] として，最も近いものを次の (1) ～ (5) のうちから一つ選べ。","options":["(1) 6 410","(2) 6 795","(3) 6 807","(4) 6 995","(5) 7 021"],"answer":5,"explanation":"端子電圧 $V_C = V / (1 - p) = 6600 / 0.94 \\approx 7021$ Vとなります。[cite: 2481, 2642]"},{"id":"R06-H1-Q12-b","year":"R06-1","subject":"法規","category":"施設管理","tags":["B問題","力率改善","コンデンサ容量","計算"],"question":"【B問題】(b) 300 kW の負荷の力率を 0.6 から 0.8 に改善するために必要な三相コンデンサ SC 本体の容量 [kvar] として，最も近いものを次の (1) ～ (5) のうちから一つ選べ。","options":["(1) 170","(2) 180","(3) 186","(4) 192","(5) 208"],"answer":3,"explanation":"必要容量 $Q = P(\tan\theta_1 - \tan\theta_2) = 175$ kvar。設備容量 $Q_{total} = Q_C (1-p)$ より $Q_C = 175 / 0.94 \\approx 186$ kvarとなります。[cite: 2481, 2642]"},{"id":"R06-H1-Q13-a","year":"R06-1","subject":"法規","category":"電気関係報告規則","tags":["B問題","B種接地工事","接地抵抗値","計算"],"question":"【B問題】1線地絡電流 5 A の変圧器（0.8秒で遮断装置あり）。(a) この変圧器に施された B 種接地工事の接地抵抗値が解釈上の上限の 1/3 に維持されているとき，その値 [Ω] を求めよ。","options":["(1) 10","(2) 20","(3) 30","(4) 40","(5) 50"],"answer":4,"explanation":"2秒以内に遮断する場合の上限は 600 / 5 = 120 Ω。その1/3なので 40 Ω です。[cite: 2481, 2643]"},{"id":"R06-H1-Q13-b","year":"R06-1","subject":"法規","category":"施設管理","tags":["B問題","D種接地工事","人体通過電流","計算"],"question":"【B問題】(b) 地絡事故時，金属製外箱に触れた人体に流れる電流を 10 mA 以下にするための D 種接地抵抗 [Ω] の上限値を求めよ（人体抵抗 6 000 Ω，B種抵抗は(a)の値を使用）。","options":["(1) 10","(2) 15","(3) 20","(4) 30","(5) 60"],"answer":5,"explanation":"対地電圧100Vの分圧回路として計算し，人体に流れる電流を制限する接地抵抗値を求めると 60 Ω となります。[cite: 2481, 2643]"},{"id":"R07-H1-Q01","year":"R07-1","subject":"法規","category":"電気事業法","tags":["需給調整","使用制限","条文"],"question":"次の文章は，「電気事業法」における，電気の使用制限等に関する記述の一部である。空欄(ア)～(オ)に当てはまる組合せとして，正しいものはどれか。\n(ア) は，電気の需給の調整を行わなければ電気の供給の不足が国民経済及び国民生活に悪影響を及ぼし，公共の利益を阻害するおそれがあると認められるときは，その事態を克服するため必要な限度において，政令で定めるところにより， (イ) の限度， (ウ) の限度，用途若しくは使用を停止すべき (エ) を定めて，電気事業者の供給する電気の使用を制限し，又は (オ) 電力の容量の限度を定めて，電気事業者からの (オ) を制限することができる。","options":["(1) (ア)経済産業大臣 (イ)使用電力量 (ウ)使用最大電力 (エ)区域 (オ)受電","(2) (ア)内閣総理大臣 (イ)供給電力量 (ウ)供給最大電力 (エ)区域 (オ)送電","(3) (ア)経済産業大臣 (イ)供給電力量 (ウ)供給最大電力 (エ)区域 (オ)送電","(4) (ア)内閣総理大臣 (イ)使用電力量 (ウ)使用最大電力 (エ)日時 (オ)受電","(5) (ア)経済産業大臣 (イ)使用電力量 (ウ)使用最大電力 (エ)日時 (オ)受電"],"answer":5,"explanation":"電気事業法第34条の2（旧第27条相当）の規定に基づきます。経済産業大臣が、日時や電力量を定めて使用制限を行うことができます。[cite: 2654, 2727, 2734]"},{"id":"R07-H1-Q02","year":"R07-1","subject":"法規","category":"電気関係報告規則","tags":["事故報告","自家用電気工作物","該当しない事例"],"question":"受電電圧 6.6 kV の自家用電気工作物を設置する事業場における次の事例のうち， 「電気関係報告規則」に基づいて，設置者が所轄産業保安監督部長に対し報告すべき事故に該当しないものを次の (1) ～ (5) のうちから一つ選べ。","options":["(1) 電圧 100 V の屋内配線が過負荷により高熱となり，電気火災が発生して建物が半焼した。","(2) 落雷により高圧負荷開閉器が焼損し，一般送配電事業者に供給支障事故を発生させた。","(3) 高圧の断路器を誤って操作した電気工事作業者が，発生したアーク熱により火傷を負い，病院に入院した。","(4) 高圧の受電用真空遮断器が誤操作により損傷し，操作不能になった。","(5) 構内第 1 号柱が折損して構外に隣接する需要家の建物を損傷させた。"],"answer":4,"explanation":"報告規則第3条に基づき、単なる機器の損傷（(4)）は、他への供給支障や社会的影響、人的被害がない限り報告義務はありません。[cite: 2654, 2737, 2741]"},{"id":"R07-H1-Q03","year":"R07-1","subject":"法規","category":"電気設備技術基準","tags":["低圧電線路","絶縁性能","漏えい電流"],"question":"「電気設備技術基準」では，電気の供給のための低圧電線路の絶縁性能について，次のように規定している。空欄 (ア) ～ (ウ) に当てはまる組合せとして，正しいものはどれか。\n低圧電線路中絶縁部分の電線と大地との間及び電線の線心相互間の絶縁抵抗は， (ア) に対する漏えい電流が (イ) の (ウ) 分の 1 を超えないようにしなければならない。","options":["(1) (ア)使用電圧 (イ)最大供給電流 (ウ)2000","(2) (ア)最大使用電圧 (イ)供給電流 (ウ)2000","(3) (ア)使用電圧 (イ)使用電流 (ウ)1000","(4) (ア)対地電圧 (イ)最大供給電流 (ウ)1000","(5) (ア)対地電圧 (イ)使用電流 (ウ)2000"],"answer":1,"explanation":"電気設備技術基準第22条の規定通り、使用電圧に対する漏えい電流が最大供給電流の2000分の1以下である必要があります。[cite: 2654, 2747, 2749]"},{"id":"R07-H1-Q04","year":"R07-1","subject":"法規","category":"電気設備技術基準の解釈","tags":["アークを生じる器具","離隔距離","耐火性"],"question":"次の文章は， 「電気設備技術基準の解釈」における，アークを生じる器具の施設に関する記述である。空欄 (ア) ～ (ウ) に当てはまる組合せとして，正しいものはどれか。\n高圧用又は特別高圧用の開閉器，遮断器又は避雷器その他これらに類する器具であって，動作時にアークを生じるものは，次のいずれかにより施設すること。\na) 耐火性のものでアークを生じる部分を囲むことにより，木製の壁又は天井その他の (ア) から隔離すること。\nb) 木製の壁又は天井その他の (ア) との離隔距離を，下表に規定する値以上とすること。\n・高圧： (イ) m以上\n・特別高圧(35kV以下)： (ウ) m以上(火災のおそれがないよう制限した場合は (イ) m)\n・特別高圧(35kV超)： (ウ) m以上","options":["(1) (ア)可燃性のもの (イ)0.5 (ウ)1","(2) (ア)造営物 (イ)0.5 (ウ)1","(3) (ア)可燃性のもの (イ)1 (ウ)2","(4) (ア)造営物 (イ)1 (ウ)2","(5) (ア)造営物 (イ)2 (ウ)3"],"answer":3,"explanation":"解釈第22条に基づき、可燃性のものから高圧は1m以上、特別高圧は2m以上の離隔が必要です。[cite: 2654, 2756, 2757, 2762]"},{"id":"R07-H1-Q05","year":"R07-1","subject":"法規","category":"発電用風力設備技術基準","tags":["風車支持工作物","安全確保","接近防止"],"question":"次の文章は， 「発電用風力設備に関する技術基準を定める省令」における，風車を支持する工作物に関する記述である。空欄 (ア) ～ (ウ) に当てはまる組合せとして，正しいものはどれか。\na) 風車を支持する工作物は，自重，積載荷重， (ア) 及び風圧並びに地震その他の振動及び (イ) に対して構造上安全でなければならない。\nb) 発電用風力設備が小規模発電設備である場合には，風車を支持する工作物に取扱者以外の者が容易に (ウ) ことができないように適切な措置を講じること。","options":["(1) (ア)衝撃 (イ)飛来物 (ウ)登る","(2) (ア)腐食 (イ)積雪 (ウ)接近する","(3) (ア)飛来物 (イ)衝撃 (ウ)接近する","(4) (ア)積雪 (イ)衝撃 (ウ)登る","(5) (ア)腐食 (イ)飛来物 (ウ)接近する"],"answer":4,"explanation":"発電用風力設備技術基準第7条に基づきます。(ア)積雪、(イ)衝撃、(ウ)登る（昇塔防止）が正解です。[cite: 2654, 2767, 2770]"},{"id":"R07-H1-Q06","year":"R07-1","subject":"法規","category":"電気設備技術基準の解釈","tags":["低圧架空引込線","引張強さ","径間"],"question":"次の文章は， 「電気設備技術基準の解釈」に基づく低圧架空引込線等の施設に関する記述である。空欄 (ア) ～ (ウ) に記入する数値として，正しいものを組み合わせたのは次のうちどれか。\n低圧架空引込線は，電線にケーブルを使用する場合を除き，引張強さ 2.30 kN 以上のもの又は直径 (ア) mm 以上の硬銅線を使用すること。ただし，径間が (イ) m 以下の場合に限り，引張強さ 1.38 kN 以上のもの又は直径 (ウ) mm 以上の硬銅線を使用することができる。","options":["(1) (ア)2.6 (イ)15 (ウ)1.6","(2) (ア)2.6 (イ)15 (ウ)2.0","(3) (ア)3.2 (イ)20 (ウ)2.6","(4) (ア)4.0 (イ)50 (ウ)3.2","(5) (ア)5.0 (イ)50 (ウ)4.0"],"answer":2,"explanation":"解釈第116条に基づきます。通常は2.6mm以上、径間15m以下の場合は2.0mm以上（引張強さ1.38kN以上）が適用できます。[cite: 2654, 2775, 2778]"},{"id":"R07-H1-Q07","year":"R07-1","subject":"法規","category":"電気設備技術基準の解釈","tags":["分散型電源","高圧連系","再閉路"],"question":"次の文章は， 「電気設備技術基準の解釈」における分散型電源の高圧連系時の系統連系用保護装置に関する記述の一部である。空欄 (ア) ～ (ウ) に当てはまる組合せとして，正しいものはどれか。\na) 次に掲げる異常を保護リレー等により検出し，分散型電源を自動的に解列すること。\n ① 分散型電源の異常又は故障\n ② 連系している電力系統の短絡事故又は地絡事故\n ③ 分散型電源の (ア) \nb) 一般送配電事業者又は配電事業者が運用する電力系統において (イ) が行われる場合は，当該 (イ) 時に，分散型電源が当該電力系統から解列されていること。\nc) 分散型電源の解列は，次のいずれかで解列すること。受電用遮断器，分散型電源の出力端に設置する遮断器，又は分散型電源の (ウ) 用遮断器など。","options":["(1) (ア)単独運転 (イ)系統切り替え (ウ)連絡","(2) (ア)過出力 (イ)再閉路 (ウ)保護","(3) (ア)単独運転 (イ)系統切り替え (ウ)保護","(4) (ア)過出力 (イ)系統切り替え (ウ)連絡","(5) (ア)単独運転 (イ)再閉路 (ウ)連絡"],"answer":5,"explanation":"解釈第228条に基づきます。単独運転の検出、電力系統の再閉路時の解列、連絡用遮断器の使用が規定されています。[cite: 2654, 2781, 2782]"},{"id":"R07-H1-Q08","year":"R07-1","subject":"法規","category":"電気設備技術基準の解釈","tags":["低圧配線","高圧屋内配線","ケーブル工事"],"question":"次の文章は， 「電気設備技術基準の解釈」に基づく低圧配線及び高圧配線の施設に関する記述である。空欄 (ア) ～ (ウ) に当てはまる組合せとして，正しいものはどれか。\na) ケーブル工事により施設する低圧配線が，弱電流電線又は水管，ガス管若しくはこれらに類するもの(以下， 「水管等」という。)と接近し又は交差する場合は，低圧配線が弱電流電線又は水管等と (ア) 施設すること。\nb) 高圧屋内配線工事は，がいし引き工事(乾燥した場所であって (イ) した場所に限る。)又は (ウ) により施設すること。","options":["(1) (ア)接触しないように (イ)隠ぺい (ウ)ケーブル工事","(2) (ア)の離隔距離を 10 cm 以上となるように (イ)展開 (ウ)金属管工事","(3) (ア)の離隔距離を 10 cm 以上となるように (イ)隠ぺい (ウ)ケーブル工事","(4) (ア)接触しないように (イ)展開 (ウ)ケーブル工事","(5) (ア)接触しないように (イ)隠ぺい (ウ)金属管工事"],"answer":4,"explanation":"解釈第167条及び第168条に基づき、低圧配線は接触しないように施設し、高圧屋内配線は「展開した場所」でのがいし引き又はケーブル工事とします。[cite: 2654, 2783]"},{"id":"R07-H1-Q09","year":"R07-1","subject":"法規","category":"電気設備技術基準の解釈","tags":["金属ダクト工事","絶縁電線断面積","接地"],"question":"「電気設備技術基準の解釈」に基づく低圧屋内配線の金属ダクト工事に関する記述について，空欄 (ア) ～ (オ) に当てはまる組合せとして，正しいものはどれか。\na) ダクトに収める絶縁電線の断面積の総和は，ダクトの内部断面積の (ア) ％以下であること。ただし，制御回路等の配線のみを収める場合は， (イ) ％以下とすることができる。\nb) ダクト相互は，堅ろうに，かつ， (ウ) に完全に接続すること。\nd) 低圧屋内配線の (エ) 電圧が 300 V 以下の場合は D 種， 300 V を超える場合は C 種接地工事を施すこと。ただし， (オ) 防護措置を施す場合は， D 種によることができる。","options":["(1) (ア)20 (イ)50 (ウ)電気的 (エ)使用 (オ)接触","(2) (ア)32 (イ)48 (ウ)電気的 (エ)対地 (オ)簡易接触","(3) (ア)32 (イ)48 (ウ)機械的 (エ)使用 (オ)接触","(4) (ア)32 (イ)48 (ウ)機械的 (エ)使用 (オ)簡易接触","(5) (ア)20 (イ)50 (ウ)電気力学的 (エ)対地 (オ)簡易接触"],"answer":1,"explanation":"解釈第162条に基づきます。通常20％（制御回路50％）、電気的接続、使用電圧に応じた接地、接触防護措置による緩和が規定されています。[cite: 2654, 2784]"},{"id":"R07-H1-Q10","year":"R07-1","subject":"法規","category":"施設管理","tags":["GR付PAS","SO動作","波及事故防止"],"question":"次の文章は，地絡継電装置付き高圧交流負荷開閉器(区分開閉器)の SOG 機能のうち SO 動作に関する記述である。空欄 (ア) ～ (エ) に当てはまる組合せとして，正しいものはどれか。\nGR 付 PAS は負荷電流を遮断することができるが， (ア) 電流のような大きな電流は遮断できないため，GR 付 PAS の (イ) 側から受電用遮断器の間で (ア) 事故が起きた場合は，PAS の (ウ) 命令を一時的に保存して待機状態となる。\n一般送配電事業者の配電用変電所の遮断器が動作することによって，配電線の停電を検出し，無電圧になった状態を確認してから (ウ) 動作を行う。したがって，配電用変電所の遮断器が再投入された場合でも，既に PAS が (ウ) されているため，配電線の再閉路が成功することとなり， (エ) 事故として取り扱われない。","options":["(1) (ア)短絡 (イ)負荷 (ウ)開放 (イ)配電線","(2) (ア)短絡 (イ)電源 (ウ)遮断 (エ)波及","(3) (ア)地絡 (イ)電源 (ウ)遮断 (エ)波及","(4) (ア)地絡 (イ)電源 (ウ)遮断 (エ)配電線","(5) (ア)短絡 (イ)負荷 (ウ)開放 (エ)波及"],"answer":5,"explanation":"PASの短絡ロック（SO動作）機能についての記述です。負荷側の短絡を検出し、無電圧後に開放することで波及事故を防ぎます。[cite: 2654, 2787, 2790]"},{"id":"R07-H1-Q11-a","year":"R07-1","subject":"法規","category":"施設管理","tags":["B問題","流込式水力","発電電力量","計算"],"question":"【B問題】有効落差 90 m，最大使用水量が渇水量(1 年のうち 355 日は確保できる水量)の 2 倍，水車及び発電機の総合効率 80 ％の流込式水力発電所がある。河川流量 Q [m³/s] の年間流量曲線(日数 d が 90 日以上の部分は，Q = -0.05 d + 25.5 で表される)に基づき，(a) この発電所の年間可能発電電力量の値 [GW・h] として，最も近いものを次の (1) ～ (5) のうちから一つ選べ。","options":["(1) 47.9","(2) 72.8","(3) 84.3","(4) 94.5","(5) 97.4"],"answer":3,"explanation":"年間流量曲線から期間ごとの使用水量を積分し、P = 9.8QHη を用いて電力量を算出すると約84.3GW・hとなります。[cite: 2654, 2788, 2791]"},{"id":"R07-H1-Q11-b","year":"R07-1","subject":"法規","category":"施設管理","tags":["B問題","設備利用率","計算"],"question":"【B問題】(b) この発電所の設備利用率 [％] として，最も近いものを次の (1) ～ (5) のうちから一つ選べ。","options":["(1) 50.0","(2) 63.0","(3) 69.5","(4) 75.9","(5) 88.0"],"answer":5,"explanation":"設備利用率 ＝ (年間発電電力量 / (最大出力 × 8760時間)) × 100 より、約88.0％と算出されます。[cite: 2654, 2788, 2791]"},{"id":"R07-H1-Q12-a","year":"R07-1","subject":"法規","category":"施設管理","tags":["B問題","第5次高調波","等価回路","計算"],"question":"【B問題】三相 3 線式配電線路（6 600 V）から受電している定格容量 500 kV・A の三相負荷設備（6％直列リアクトル付コンデンサ有）がある。(a) 高調波発生機器から発生する第 5 次高調波電流の受電点電圧に換算した電流 [A] の値として，最も近いのは次のうちどれか。なお，発生電流は定格電流の 15 ％とする。","options":["(1) 1.3","(2) 6.6","(3) 11.4","(4) 32.8","(5) 43.7"],"answer":2,"explanation":"定格電流 In = 500k / (√3 × 6600) ≒ 43.74 A。その15％は 43.74 × 0.15 ≒ 6.56 A。最も近い(2)となります。[cite: 2654, 2793, 2795]"},{"id":"R07-H1-Q12-b","year":"R07-1","subject":"法規","category":"施設管理","tags":["B問題","高調波流出電流","計算"],"question":"【B問題】(b) 受電点から配電系統に流出する第 5 次高調波電流 [A] の値として，最も近いのは次のうちどれか。系統側のインピーダンスを j6n ％，コンデンサ設備側を (100/n - j50.6n) ％として計算せよ。","options":["(1) 1.2","(2) 6.2","(3) 10.8","(4) 30.9","(5) 41.2"],"answer":2,"explanation":"分流の法則に基づき、系統側とコンデンサ側のインピーダンス比から流出電流を算出すると、約6.2 Aとなります。[cite: 2654, 2793, 2795]"},{"id":"R07-H1-Q13-a","year":"R07-1","subject":"法規","category":"施設管理","tags":["B問題","太陽電池","送電電力量","計算"],"question":"【B問題】出力 600 kW の太陽電池発電所を有する需要家において，図のような負荷・発電曲線が得られた。(a) この日，太陽電池発電所から電力系統に送電した電力量の値 [kW・h] として，最も近いものを次の (1) ～ (5) のうちから一つ選べ。","options":["(1) 900","(2) 1 300","(3) 1 500","(4) 2 200","(5) 3 600"],"answer":2,"explanation":"発電電力が消費電力を上回っている時間帯（概ね8時～16時）の面積（余剰分）を計算すると、約1300 kW・hとなります。[cite: 2654, 2797, 2798]"},{"id":"R07-H1-Q13-b","year":"R07-1","subject":"法規","category":"施設管理","tags":["B問題","エネルギー自給率","計算"],"question":"【B問題】(b) この日，ショッピングセンターで消費した電力量に対して太陽電池発電所が発電した電力量により自給した比率 [％] として，最も近いものを次の (1) ～ (5) のうちから一つ選べ。","options":["(1) 35","(2) 38","(3) 46","(4) 52","(5) 58"],"answer":3,"explanation":"1日の総消費電力量に対する、太陽電池による自家消費分（発電量から送電量を引いたもの）の割合を算出すると、約46％となります。[cite: 2654, 2797, 2798]"},{"id":"R07-H2-Q01","year":"R07-2","subject":"法規","category":"電気事業法","tags":["電気の使用制限","経済産業大臣","条文"],"question":"次の文章は，「電気事業法」における，電気の使用制限等に関する記述である。空欄(ア)～(オ)に当てはまる組合せとして，正しいものはどれか。\n(ア) は，電気の需給の調整を行わなければ電気の供給の不足が国民経済及び国民生活に悪影響を及ぼし，公共の利益を阻害するおそれがあると認められるときは，その事態を克服するため必要な限度において，政令で定めるところにより， (イ) の限度， (ウ) の限度，用途若しくは使用を停止すべき (エ) を定めて，小売電気事業者等から電気の供給を受ける者に対し，電気の使用を制限すべきこと，又は (オ) 電力の容量の限度を定めて，供給を受ける者に対し，電気事業者からの (オ) を制限すべきことを命じ，又は勧告することができる。","options":["(1) (ア)経済産業大臣 (イ)使用電力量 (ウ)使用最大電力 (エ)区域 (オ)受電","(2) (ア)内閣総理大臣 (イ)供給電力量 (ウ)供給最大電力 (エ)区域 (オ)送電","(3) (ア)経済産業大臣 (イ)供給電力量 (ウ)供給最大電力 (エ)区域 (オ)送電","(4) (ア)内閣総理大臣 (イ)使用電力量 (ウ)使用最大電力 (エ)日時 (オ)受電","(5) (ア)経済産業大臣 (イ)使用電力量 (ウ)使用最大電力 (エ)日時 (オ)受電"],"answer":5,"explanation":"電気事業法第34条の2の規定に基づきます。(ア)経済産業大臣、(イ)使用電力量、(ウ)使用最大電力、(エ)日時、(オ)受電が正解です。[cite: 2352, 2356, 2278]"},{"id":"R07-H2-Q02","year":"R07-2","subject":"法規","category":"電気関係報告規則","tags":["感電死傷事故","報告期限","詳報"],"question":"自家用電気工作物を (ア) する者は，自家用電気工作物において感電死傷事故が発生したときは，「電気関係報告規則」に基づき，事故の発生を知った時から (イ) 時間以内可能な限り速やかに事故の発生の日時及び場所，事故が発生した電気工作物並びに事故の (ウ) について(速報)，電話等の方法により行うとともに，事故の発生を知った日から起算して (エ) 日以内に報告書(詳報)を所轄産業保安監督部長へ提出して行わなければならない。","options":["(1) (ア)管理 (イ)12 (ウ)概要 (エ)7","(2) (ア)設置 (イ)24 (ウ)原因 (エ)7","(3) (ア)設置 (イ)24 (ウ)概要 (エ)30","(4) (ア)設置 (イ)48 (ウ)概要 (エ)30","(5) (ア)管理 (イ)48 (ウ)原因 (エ)60"],"answer":3,"explanation":"電気関係報告規則第3条（事故報告）の規定に基づき、(ア)設置する者、(イ)24時間以内（速報）、(ウ)概要、(エ)30日以内（詳報）となります。[cite: 2359, 2361, 2278]"},{"id":"R07-H2-Q03","year":"R07-2","subject":"法規","category":"電気設備技術基準","tags":["保安原則","電位上昇","接地"],"question":"次の文章は，「電気設備技術基準」における，電気設備の保安原則に関する記述の一部である。空欄(ア)～(ウ)に当てはまる組合せとして，正しいものはどれか。\na) 電気設備の必要な箇所には，異常時の (ア) ，高電圧の侵入等による感電，火災その他人体に危害を及ぼし，又は物件への損傷を与えるおそれがないよう， (イ) その他の適切な措置を講じなければならない。\nb) 電気設備に (イ) を施す場合は，電流が安全かつ確実に (ウ) ことができるようにしなければならない。","options":["(1) (ア)電位上昇 (イ)絶縁 (ウ)遮断される","(2) (ア)過熱 (イ)接地 (ウ)大地に通ずる","(3) (ア)過電流 (イ)絶縁 (ウ)遮断される","(4) (ア)電位上昇 (イ)接地 (ウ)大地に通ずる","(5) (ア)過電流 (イ)接地 (ウ)大地に通ずる"],"answer":4,"explanation":"電気設備技術基準第10条（接地）及び第11条の規定に基づき、(ア)電位上昇、(イ)接地、(ウ)大地に通ずるとなります。[cite: 2366, 2368, 2370, 2278]"},{"id":"R07-H2-Q04","year":"R07-2","subject":"法規","category":"電気設備技術基準の解釈","tags":["接地工事","不適切な事例","漏電遮断器"],"question":"次の文章は，電気設備の接地に関する記述であるが，「電気設備技術基準の解釈」から判断して不適切なものを次の(1)～(5)のうちから一つ選べ。","options":["(1) 使用電圧 200 V の機械器具の鉄台に施す接地工事の接地抵抗値を 90 Ω とした。","(2) 使用電圧 100 V の機械器具を屋内の乾燥した場所で使用するので，その機械器具の鉄台の接地工事を省略した。","(3) 使用電圧 440 V の機械器具に電気を供給する電路に動作時間が 0.1 秒の漏電遮断器が施設されているので，その機械器具の鉄台の接地工事の接地抵抗値を 300 Ω とした。","(4) 水気のある場所で使用する使用電圧 100 V の機械器具に電気を供給する電路に動作時間が 0.1 秒の漏電遮断器が施設されているので，その機械器具の鉄台の接地工事を省略した。","(5) 使用電圧 3 300 V の機械器具の鉄台に施す接地工事の接地線に，直径 2.6 mm の軟銅線を使用した。"],"answer":4,"explanation":"解釈第29条に基づき、水気のある場所では150V以下の機械器具であっても漏電遮断器の施設のみで接地を省略することはできません。[cite: 2378, 2278]"},{"id":"R07-H2-Q05","year":"R07-2","subject":"法規","category":"電気設備技術基準","tags":["低圧電線路","絶縁性能","漏えい電流"],"question":"「電気設備技術基準」では，低圧電線路の絶縁性能として，「低圧電線路中絶縁部分の電線と大地との間及び電線の線心相互間の絶縁抵抗は，使用電圧に対する漏えい電流が最大供給電流の (ア) を超えないようにしなければならない。」と規定している。\n今，定格容量 75 kVA，一次電圧 6 600 V，二次電圧 105 V の単相変圧器に接続された単相 2 線式 105 V 1 回線の低圧架空配電線路について，この配電線路の電線 1 線当たりの漏えい電流 [A] の許容最大値との組合せとして，正しいものはどれか。","options":["(1) (ア)1000分の1、許容最大値：0.714","(2) (ア)1000分の1、許容最大値：1.429","(3) (ア)1500分の1、許容最大値：0.476","(4) (ア)2000分の1、許容最大値：0.357","(5) (ア)2000分の1、許容最大値：0.179"],"answer":4,"explanation":"技術基準第22条により(ア)は2000分の1。最大供給電流 $I = 75000 / 105 \\approx 714.3$ A。漏えい電流上限は $714.3 / 2000 \\approx 0.357$ A。[cite: 2382, 2387, 2278]"},{"id":"R07-H2-Q06","year":"R07-2","subject":"法規","category":"電気設備技術基準の解釈","tags":["高圧屋側電線路","ケーブル工事","支持点間距離"],"question":"次の文章は，「電気設備技術基準の解釈」における，高圧屋側電線路を施設する場合の記述の一部である。空欄(ア)～(エ)に当てはまる組合せとして，正しいものはどれか。\nａ) (ア) 場所に施設すること。\nｂ) 電線は， (イ) であること。\nｃ) (イ) には，接触防護措置を施すこと。\nｄ) (イ) を造営材の側面又は下面に沿って取り付ける場合は， (イ) の支持点間の距離を (ウ) m(垂直に取り付ける場合は， (エ) m)以下とし，かつ，その被覆を損傷しないように取り付けること。","options":["(1) (ア)点検できる隠蔽 (イ)ケーブル (ウ)1.5 (エ)5","(2) (ア)展開した (イ)ケーブル (ウ)2 (エ)6","(3) (ア)展開した (イ)絶縁電線 (ウ)2.5 (エ)6","(4) (ア)点検できる隠蔽 (イ)絶縁電線 (ウ)1.5 (エ)4","(5) (ア)展開した (イ)ケーブル (ウ)2 (エ)10"],"answer":2,"explanation":"解釈第110条に基づき、(ア)展開した、(イ)ケーブル、(ウ)2m、(エ)6mとなります。[cite: 2406, 2278]"},{"id":"R07-H2-Q07","year":"R07-2","subject":"法規","category":"電気設備技術基準の解釈","tags":["国際規格","IEC 60364","接地抵抗値"],"question":"次の文章は，電気設備の技術基準の解釈に基づく国際規格(IEC 60364)の取り入れに関する記述の一部である。空欄(ア)～(ウ)に当てはまる組合せとして，正しいものはどれか。\nａ) IEC 関連規定により施設する場合において，一般送配電事業者等の電気設備と直接に接続する場合は，これらの事業者の低圧の電気の供給に係る設備の (ア) の施設と整合がとれていること。\nｂ) 同一の電気使用場所においては，IEC 関連規定と従来方式とを混用しないこと。ただし，次のいずれかに該当する場合はこの限りでない。\n ① 変圧器が (イ) 高圧電路に接続されている場合において，当該変圧器の低圧回路に施す接地抵抗値が (ウ) Ω 以下であるとき","options":["(1) (ア)接地工事 (イ)接地式 (ウ)0.2","(2) (ア)地絡保護 (イ)接地式 (ウ)10","(3) (ア)接地工事 (イ)非接地式 (ウ)0.2","(4) (ア)地絡保護 (イ)非接地式 (ウ)2","(5) (ア)接地工事 (イ)非接地式 (ウ)2"],"answer":5,"explanation":"解釈第218条に基づき、(ア)接地工事、(イ)非接地式、(ウ)2Ω以下となります。[cite: 2407, 2278]"},{"id":"R07-H2-Q08","year":"R07-2","subject":"法規","category":"電気設備技術基準","tags":["感電火災防止","移動電線","非常用予備電源"],"question":"次の文章は，「電気設備技術基準」に基づく感電，火災等の防止に関する記述である。空欄(ア)～(エ)に当てはまる組合せとして，正しいものはどれか。\nａ) 低圧又は高圧の架空電線には， (ア) のおそれがないよう，絶縁電線又はケーブルを使用しなければならない。\nｂ) 移動電線を電気機械器具と接続する場合は，接続不良による (イ) のおそれがないように施設しなければならない。\nｃ) 燃料電池発電設備が (ウ) である場合には，運転状態を表示する装置を施設しなければならない。\nｄ) 非常用予備電源は， (エ) に施設する電路であって常用電源側のものと電気的に接続しないように施設しなければならない。","options":["(1) (ア)感電 (イ)感電又は火災 (ウ)一般用電気工作物 (エ)需要場所以外の場所","(2) (ア)感電又は火災 (イ)感電又は火災 (ウ)自家用電気工作物 (エ)需要場所","(3) (ア)感電 (イ)火災 (ウ)自家用電気工作物 (エ)需要場所以外の場所","(4) (ア)感電又は火災 (イ)火災 (ウ)自家用電気工作物 (エ)需要場所以外の場所","(5) (ア)感電 (イ)火災 (ウ)一般用電気工作物 (エ)需要場所"],"answer":1,"explanation":"技術基準第25条、第57条、第45条等の規定に基づき、(ア)感電、(イ)感電又は火災、(ウ)一般用電気工作物、(エ)需要場所以外の場所となります。[cite: 2411, 2278]"},{"id":"R07-H2-Q09","year":"R07-2","subject":"法規","category":"電気設備技術基準の解釈","tags":["電気自動車","V2H","電力変換装置"],"question":"次の文章は，「電気設備技術基準の解釈」に基づく，電気自動車等から一般用電気工作物に電気を供給するための設備等の施設に関する記述である。空欄(ア)～(エ)に当てはまる組合せとして，正しいものはどれか。\n電気自動車等と供給設備とを接続する電路の対地電圧は，150 V 以下であること。ただし，次により施設する場合はこの限りでない。\nａ) 対地電圧が，直流 (ア) V 以下であること。\nｃ) 直流電路が， (イ) こと。\nd) 直流電路に接続する電力変換装置の交流側に (ウ) を施設すること。\nｅ) 接続する電路に (エ) を生じたときに自動的に電路を遮断する装置を施設すること。","options":["(1) (ア)750 (イ)非接地である (ウ)絶縁変圧器 (エ)短絡","(2) (ア)450 (イ)非接地である (ウ)絶縁変圧器 (エ)地絡","(3) (ア)300 (イ)接地されている (ウ)開閉器 (エ)地絡","(4) (ア)450 (イ)非接地である (ウ)開閉器 (エ)短絡","(5) (ア)300 (イ)接地されている (ウ)絶縁変圧器 (エ)短絡"],"answer":2,"explanation":"解釈第195条の2に基づき、(ア)450V、(イ)非接地、(ウ)絶縁変圧器、(エ)地絡となります。[cite: 2409, 2412, 2278]"},{"id":"R07-H2-Q10","year":"R07-2","subject":"法規","category":"施設管理","tags":["単線結線図","計器・継電器配置"],"question":"図は，高圧受電設備の単線結線図の一部である。図の空白箇所(ア)～(ウ)に設置する機器又は計器として，正しい組合せはどれか。","options":["(1) (ア)地絡継電器 (イ)過電圧継電器 (ウ)周波数計","(2) (ア)過電圧継電器 (イ)過電流継電器 (ウ)周波数計","(3) (ア)過電流継電器 (イ)地絡継電器 (ウ)周波数計","(4) (ア)過電流継電器 (イ)地絡継電器 (ウ)力率計","(5) (ア)地絡継
