<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <title>冷凍三種 法規 過去問演習</title>
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: -apple-system, "Helvetica Neue", sans-serif;
      background: #f0f2f5;
      margin: 0;
      padding: 12px;
      color: #222;
      font-size: 15px;
    }
    h1 { margin: 0 0 12px; font-size: 17px; font-weight: bold; }
    h2 { margin: 0 0 10px; font-size: 15px; }

    .panel {
      background: #fff;
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 12px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.1);
    }

    /* フィルター */
    .filter-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 8px; }
    .filter-row label { font-size: 13px; color: #555; white-space: nowrap; }
    select {
      font-size: 14px;
      padding: 6px 8px;
      border: 1px solid #ccc;
      border-radius: 8px;
      background: #fff;
      -webkit-appearance: none;
      appearance: none;
      flex: 1;
      min-width: 120px;
    }

    /* スタートボタン */
    .btn-start {
      display: block;
      width: 100%;
      padding: 13px;
      font-size: 16px;
      font-weight: bold;
      background: #0071e3;
      color: #fff;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      margin-top: 8px;
      -webkit-appearance: none;
    }
    .btn-start:active { background: #0059b3; }

    /* 統計グリッド */
    .stats { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
    .stat-box {
      background: #f7f8fa;
      border: 1px solid #e0e0e0;
      border-radius: 10px;
      padding: 10px 12px;
    }
    .stat-box b { font-size: 12px; color: #666; display: block; margin-bottom: 4px; }
    .stat-box .val { font-size: 20px; font-weight: bold; color: #111; }

    /* ローディング */
    #loadingMsg {
      text-align: center;
      padding: 16px 0;
      color: #555;
      font-size: 14px;
    }
    #progressBar {
      width: 100%;
      height: 6px;
      background: #e0e0e0;
      border-radius: 3px;
      margin-top: 8px;
      overflow: hidden;
      display: none;
    }
    #progressFill {
      height: 100%;
      background: #0071e3;
      border-radius: 3px;
      width: 0%;
      transition: width 0.2s;
    }

    /* 問題メタ情報 */
    .question-meta {
      font-size: 12px;
      color: #888;
      margin-bottom: 8px;
    }

    /* 問題文 */
    .question-text {
      white-space: pre-wrap;
      line-height: 1.7;
      margin-bottom: 14px;
      font-size: 15px;
    }

    /* 選択肢ボタン */
    .option-btn {
      display: block;
      width: 100%;
      text-align: left;
      padding: 12px 14px;
      margin-bottom: 9px;
      border: 1.5px solid #d0d0d0;
      border-radius: 10px;
      background: #fff;
      cursor: pointer;
      font-size: 14px;
      line-height: 1.5;
      -webkit-appearance: none;
      appearance: none;
      color: #111;
      /* iOSタップ遅延を排除 */
      touch-action: manipulation;
    }
    .option-btn:active { background: #f0f0f0; }
    .option-btn.correct { background: #d4f7d4 !important; border-color: #28a745 !important; }
    .option-btn.wrong   { background: #ffd6d6 !important; border-color: #dc3545 !important; }
    .option-btn:disabled { cursor: default; opacity: 0.85; }

    /* 解説 */
    .answer-info {
      margin-top: 12px;
      padding: 12px;
      border-radius: 10px;
      background: #f7f9fc;
      border: 1px solid #d8e3ef;
      font-size: 14px;
      line-height: 1.6;
    }

    /* 次へボタン */
    .btn-next {
      display: block;
      width: 100%;
      padding: 13px;
      font-size: 15px;
      font-weight: bold;
      background: #34c759;
      color: #fff;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      margin-top: 12px;
      -webkit-appearance: none;
      touch-action: manipulation;
    }
    .btn-next:active { background: #28a745; }

    /* 分野別成績テーブル */
    .history-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }
    .history-table th,
    .history-table td {
      border: 1px solid #ddd;
      padding: 7px 8px;
      text-align: left;
    }
    .history-table th { background: #f0f2f5; font-weight: bold; }
    .history-table tr:nth-child(even) td { background: #fafafa; }

    /* localStorage警告バナー */
    #storageBanner {
      display: none;
      background: #fff3cd;
      border: 1px solid #ffc107;
      border-radius: 8px;
      padding: 10px 12px;
      margin-bottom: 10px;
      font-size: 13px;
      color: #856404;
    }
  </style>
</head>
<body>

<div id="storageBanner">
  ⚠️ プライベートブラウズ（またはストレージ制限）のため、回答結果の保存ができません。通常ブラウズでお使いください。
</div>

<h1>⚡ 冷凍三種 法令 過去問演習</h1>

<!-- 設定パネル -->
<div class="panel">
  <h2>問題設定</h2>
  <div class="filter-row">
    <label>年度</label>
    <select id="yearFilter"><option value="all">すべて</option></select>
  </div>
  <div class="filter-row">
    <label>分野</label>
    <select id="categoryFilter"><option value="all">すべて</option></select>
  </div>
  <div class="filter-row">
    <label>方式</label>
    <select id="modeFilter">
      <option value="sequential">順番通り</option>
      <option value="wrongOnly">間違えた問題のみ</option>
      <option value="unanswered">未回答のみ</option>
    </select>
  </div>
  <button class="btn-start" id="startBtn" onclick="startQuiz()">問題開始</button>
</div>

<!-- 統計パネル -->
<div class="panel stats">
  <div class="stat-box"><b>総問題数</b><div class="val" id="totalQuestions">-</div></div>
  <div class="stat-box"><b>正答率</b><div class="val" id="correctRate">-%</div></div>
  <div class="stat-box"><b>回答数</b><div class="val" id="answerCount">0</div></div>
  <div class="stat-box"><b>現在の位置</b><div class="val" id="currentQuestionIndex">-</div></div>
</div>

<!-- 問題パネル -->
<div class="panel" id="quizPanel">
  <div id="loadingMsg">データを読み込み中...</div>
  <div id="progressBar"><div id="progressFill"></div></div>

  <div id="quizContent" style="display:none;">
    <div class="question-meta" id="questionMeta"></div>
    <div class="question-text" id="questionText"></div>
    <div id="optionsContainer"></div>
    <div class="answer-info" id="answerInfo" style="display:none;"></div>
    <button class="btn-next" id="nextBtn" onclick="nextQuestion()" style="display:none;">次の問題へ →</button>
  </div>
</div>

<!-- 分野別成績 -->
<div class="panel">
  <h2>📊 分野別成績</h2>
  <table class="history-table">
    <thead>
      <tr><th>分野</th><th>回答</th><th>正解</th><th>正答率</th></tr>
    </thead>
    <tbody id="categoryStatsBody"></tbody>
  </table>
</div>

<script>
// ========================================================
// 問題データ（チャンク分割済み・遅延ロード対応）
// ========================================================
var CHUNKS = [];
var NUM_CHUNKS = 7;

// チャンクを非同期的に順番に読み込む
function loadChunksAsync(callback) {
  var loaded = 0;
  document.getElementById('progressBar').style.display = 'block';

  function loadNext(idx) {
    if (idx >= NUM_CHUNKS) {
      document.getElementById('progressBar').style.display = 'none';
      callback();
      return;
    }
    // setTimeoutでUIをブロックせずに各チャンクをロード
    setTimeout(function() {
      // チャンクはすでにメモリ上にあるが、処理を分割してiOSのウォッチドッグをかわす
      var pct = Math.round((idx + 1) / NUM_CHUNKS * 100);
      document.getElementById('progressFill').style.width = pct + '%';
      document.getElementById('loadingMsg').textContent = 'データ準備中... ' + pct + '%';
      loaded++;
      loadNext(idx + 1);
    }, 20);
  }
  loadNext(0);
}

{"id":"R01-Horitsu-Q01","year":"R01","subject":"法令","category":"高圧ガスの定義等","tags":[],"question":"次のイ、ロ、ハの記述のうち、正しいものはどれか。\nイ．高圧ガス保安法は、高圧ガスによる災害を防止して公共の安全を確保する目的のために、高圧ガスの製造、貯蔵、販売、移動その他の取扱及び消費並びに容器の製造及び取扱について規制するとともに、民間事業者及び高圧ガス保安協会による高圧ガスの保安に関する自主的な活動を促進することを定めている。\nロ．温度35度において圧力が1メガパスカル以上となる圧縮ガス（圧縮アセチレンガスを除く。）は、常用の温度における圧力が1メガパスカル未満であっても高圧ガスである。\nハ．圧力が0.2メガパスカルとなる場合の温度が30度である液化ガスであって、常用の温度において圧力が0.1メガパスカルであるものは、高圧ガスではない。","options":["(1) イ","(2) ロ","(3) イ、ロ","(4) イ、ハ","(5) イ、ロ、ハ"],"answer":3,"explanation":"・高圧ガス保安法は、高圧ガスによる災害を防止して公共の安全を確保する目的のために、高圧ガスの製造、貯蔵、販売、移動その他の取扱及び消費並びに容器の製造及び取扱について規制するとともに、民間事業者及び高圧ガス保安協会による高圧ガスの保安に関する自主的な活動を促進することを定めている。\n・温度35度において圧力が1メガパスカル以上となる圧縮ガス（圧縮アセチレンガスを除く。）は、常用の温度における圧力が1メガパスカル未満であっても高圧ガスである。\n・圧力が0.2メガパスカルとなる場合の温度が35度以下である液化ガスは、高圧ガスである。","has_image":false,"image_path":null},{"id":"R01-Horitsu-Q02","year":"R01","subject":"法令","category":"適用除外・事業(製造・販売・廃棄等)","tags":[],"question":"次のイ、ロ、ハの記述のうち、正しいものはどれか。\nイ．アンモニアを冷媒ガスとする1日の冷凍能力が50トンの一つの設備を使用して冷凍のため高圧ガスの製造をしようとする者は、都道府県知事等の許可を受けなければならない。\nロ．1日の冷凍能力が5トン未満の冷凍設備内におけるフルオロカーボン（不活性のものに限る。）は、高圧ガス保安法の適用を受けない。\nハ．専ら冷凍設備に用いる機器の製造の事業を行う者（機器製造業者）が所定の技術上の基準に従って製造しなければならない機器は、冷媒ガスの種類にかかわらず、1日の冷凍能力が20トン以上の冷凍機に用いられるものに限られている。","options":["(1) イ","(2) イ、ロ","(3) イ、ハ","(4) ロ、ハ","(5) イ、ロ、ハ"],"answer":2,"explanation":"・アンモニアを冷媒ガスとする1日の冷凍能力が50トン以上の設備を使用して冷凍のため高圧ガスの製造をしようとする者は、都道府県知事等の許可を受けなければならない。\n・1日の冷凍能力が5トン未満の冷凍設備内におけるフルオロカーボン（不活性のものに限る。）は、高圧ガス保安法の適用を受けない。\n・専ら冷凍設備に用いる機器の製造の事業を行う者（機器製造業者）が所定の技術上の基準に従って製造しなければならない機器は、1日の冷凍能力が3トン以上（不活性のフルオロカーボンにあっては5トン以上。）の冷凍機と定められている。","has_image":false,"image_path":null},{"id":"R01-Horitsu-Q03","year":"R01","subject":"法令","category":"適用除外・事業(製造・販売・廃棄等)","tags":[],"question":"次のイ、ロ、ハの記述のうち、正しいものはどれか。\nイ．第一種製造者は、その製造をする高圧ガスの種類を変更したときは、遅滞なく、その旨を都道府県知事等に届け出なければならない。\nロ．冷凍のための製造施設の冷媒設備内の高圧ガスであるアンモニアを廃棄するときには、冷凍保安規則で定める高圧ガスの廃棄に係る技術上の基準は適用されない。\nハ．第一種製造者の合併によりその地位を承継した者は、遅滞なく、その事実を証する書面を添えて、その旨を都道府県知事等に届け出なければならない。","options":["(1) イ","(2) ロ","(3) ハ","(4) イ、ハ","(5) イ、ロ、ハ"],"answer":3,"explanation":"・第一種製造者は、その製造をする高圧ガスの種類を変更しようとするときは、都道府県知事の許可を受けなければならない。\n・可燃性ガス及び毒性ガスであるアンモニアを廃棄するときには、冷凍保安規則で定める高圧ガスの廃棄に係る技術上の基準に従ってしなければならない。\n・第一種製造者の合併によりその地位を承継した者は、遅滞なく、その事実を証する書面を添えて、その旨を都道府県知事等に届け出なければならない。","has_image":false,"image_path":null},{"id":"R01-Horitsu-Q04","year":"R01","subject":"法令","category":"高圧ガスの貯蔵","tags":[],"question":"次のイ、ロ、ハの記述のうち、冷凍に係る製造事業所における冷媒ガスの補充用としての容器による高圧ガス（質量が1.5キログラムを超えるもの）の貯蔵の方法に係る技術上の基準について一般高圧ガス保安規則上正しいものはどれか。\nイ．高圧ガスを充填した容器は、不活性ガスのものであっても、充填容器及び残ガス容器にそれぞれ区分して容器置場に置かなければならない。\nロ．アンモニアの充填容器を車両に積載して貯蔵することは、特に定められた場合を除き禁じられているが、不活性ガスのフルオロカーボンの充填容器を車両に積載し貯蔵することは、いかなる場合であっても禁じられていない。\nハ．液化アンモニアの充填容器については、その温度を常に40度以下に保つべき定めがあるが、残ガス容器についてはその定めはない。","options":["(1) イ","(2) イ、ロ","(3) イ、ハ","(4) ロ、ハ","(5) イ、ロ、ハ"],"answer":1,"explanation":"・高圧ガスを充填した容器は、不活性ガスのものであっても、充填容器及び残ガス容器にそれぞれ区分して容器置場に置かなければならない。\n・高圧ガスの貯蔵は、特に定められた場合を除き、車両等に固定し、又は積載した容器によりしてはなならない。不活性ガスのフルオロカーボンの充填容器であっても同様である。\n・充填容器等（容器置場並びに充填容器及び残ガス容器）は、その温度を常に温度40度以下に保たなければならない。","has_image":false,"image_path":null},{"id":"R01-Horitsu-Q05","year":"R01","subject":"法令","category":"高圧ガスの移動","tags":[],"question":"次のイ、ロ、ハの記述のうち、車両に積載した容器（内容積が48リットルのもの）による冷凍設備の冷媒ガスの補充用の高圧ガスの移動に係る技術上の基準等について一般高圧ガス保安規則上正しいものはどれか。\nイ．フルオロカーボン134aを移動するときは、アンモニアを移動するときと同様に、その車両の見やすい箇所に警戒標を掲げなければならない。\nロ．アンモニアの充填容器及び残ガス容器には、木枠又はパッキンを施さなければならない。\nハ．アンモニアを移動するときは、ガスの名称、性状及び移動中の災害防止のために必要な注意事項を記載した書面を運転者に交付し、移動中携帯させ、これを遵守させなければならない。","options":["(1) イ","(2) イ、ロ","(3) イ、ハ","(4) ロ、ハ","(5) イ、ロ、ハ"],"answer":5,"explanation":"・充てん容器等を車両に積載して移動するとき（容器の内容積が20リットル以下である充てん容器等（毒性ガスに係るものを除く。）のみを積載した車両であって、当該積載容器の内容積の合計が40リットル以下である場合を除く。）は、当該車両の見やすい箇所に警戒標を掲げなければならない。※法改正『容器の内容積が25リットル以下』『内容積の合計が50リットル以下』\n・毒性ガスの充填容器等には、木枠又はパッキンを施さなければならない。アンモニアは毒性ガスである。\n・可燃性ガス、毒性ガス又は酸素の高圧ガスを移動するときは、そのガスの名称、性状及び移動中の災害防止のために必要な注意事項を記載した書面を運転者に交付し、移動中携帯させ、これを遵守させなければならない。アンモニアは可燃性ガス・毒性ガスである。※法改正『可燃性ガス、毒性ガス、特定不活性ガス又は酸素の高圧ガス』","has_image":false,"image_path":null},{"id":"R01-Horitsu-Q06","year":"R01","subject":"法令","category":"高圧ガスの充填容器","tags":[],"question":"次のイ、ロ、ハの記述のうち、冷凍設備の冷媒ガスの補充用の高圧ガスを充填するための容器（再充填禁止容器を除く。）について正しいものはどれか。\nイ．容器検査に合格した容器には、特に定めるものを除き、充填すべき高圧ガスの種類として、高圧ガスの名称、略称又は分子式が刻印等されている。\nロ．容器の外面の塗色は高圧ガスの種類に応じて定められており、液化アンモニアの容器の場合は、白色である。\nハ．容器又は附属品の廃棄をする者は、その容器又は附属品をくず化し、その他容器又は附属品として使用することができないように処分しなければならない。","options":["(1) イ","(2) ハ","(3) イ、ロ","(4) ロ、ハ","(5) イ、ロ、ハ"],"answer":5,"explanation":"・容器検査に合格した容器には、特に定めるものを除き、充填すべき高圧ガスの種類として、高圧ガスの名称、略称又は分子式が刻印等されている。\n・容器の外面の塗色は高圧ガスの種類に応じて定められており、液化アンモニアの容器の場合は、白色である。\n・容器又は附属品の廃棄をする者は、その容器又は附属品をくず化し、その他容器又は附属品として使用することができないように処分しなければならない。","has_image":false,"image_path":null},{"id":"R01-Horitsu-Q07","year":"R01","subject":"法令","category":"冷凍能力の算定基準","tags":[],"question":"次のイ、ロ、ハの記述のうち、冷凍能力の算定基準について冷凍保安規則上正しいものはどれか。\nイ．冷媒ガスの種類に応じて定められた数値（C）は、冷媒ガスの圧縮機（遠心式圧縮機以外のもの）を使用する製造設備の1日の冷凍能力の算定に必要な数値の一つである。\nロ．圧縮機の原動機の定格出力の数値は、遠心式圧縮機を使用する製造設備の1日の冷凍能力の算定に必要な数値の一つである。\nハ．発生器を加熱する1時間の入熱量の数値は、吸収式冷凍設備の1日の冷凍能力の算定に必要な数値の一つである。","options":["(1) イ","(2) ロ","(3) イ、ハ","(4) ロ、ハ","(5) イ、ロ、ハ"],"answer":5,"explanation":"・冷凍則第5条第一号から三号に掲げる製造設備（遠心式圧縮機を使用する製造設備、吸収式冷凍設備、自然環流式冷凍設備及び自然循環式冷凍設備）以外の製造設備にあっては、次の算式によるものをもって1日の冷凍能力とする。\nR＝V÷C\n　　R 1日の冷凍能力（単位　トン）の数値\n　　V　圧縮機の標準回転速度における1時間のピストン押しのけ量（単位立方メートル）の数値\n　　C　冷媒ガスの種類に応じて定められた数値\nよって、冷媒ガスの種類に応じて定められた数値（C）は、冷媒ガスの圧縮機（遠心式圧縮機以外のもの）を使用する製造設備の1日の冷凍能力の算定に必要な数値の一つである。\n・遠心式圧縮機を使用する製造設備にあっては、当該圧縮機の原動機の定格出力1.2キロワットをもって1日の冷凍能力1トンとする。よって、圧縮機の原動機の定格出力の数値は、遠心式圧縮機を使用する製造設備の1日の冷凍能力の算定に必要な数値の一つである。\n・吸収式冷凍設備にあっては、発生器を加熱する1時間の入熱量27,800kJをもって1日の冷凍能力1トンとする。よって、発生器を加熱する時間の入熱量の数値は、吸収式冷凍設備の1日の冷凍能力の算定に必要な数値の一つである。","has_image":false,"image_path":null},{"id":"R01-Horitsu-Q08","year":"R01","subject":"法令","category":"第二種製造者(全般)","tags":[],"question":"次のイ、ロ、ハの記述のうち、冷凍のため高圧ガスの製造をする第二種製造者について正しいものはどれか。\nイ．第二種製造者とは、その製造をする高圧ガスの種類に関係なく、1日の冷凍能力が3トン以上50トン未満である冷凍設備を使用して高圧ガスの製造をする者である。\nロ．不活性ガスのフルオロカーボンを冷媒ガスとする製造設備の設置又は変更の工事が完成したとき、酸素以外のガスを使用する試運転又は許容圧力以上の圧力で行う気密試験を行った後でなければ、高圧ガスの製造をしてはならない。\nハ．冷凍のため高圧ガスの製造をする全ての第二種製造者は、冷凍保安責任者を選任しなくてもよい。","options":["(1) イ","(2) ロ","(3) ハ","(4) イ、ロ","(5) ロ、ハ"],"answer":2,"explanation":"・第二種製造者とは、1日の冷凍能力が3トン以上20トン未満（不活性のフルオロカーボンの場合は20トン以上50トン未満、不活性以外のフルオロカーボン及びアンモニアの場合は5トン以上50トン未満）のものを使用して高圧ガスの製造をしようとする者である。\n・第二種製造者は、製造設備の設置又は変更の工事が完成したとき、酸素以外のガスを使用する試運転又は許容圧力以上の圧力で行う気密試験を行った後でなければ、製造をしてはならない。\n・第二種製造者のうちには、冷凍保安責任者を選任しなければならないものがある。","has_image":false,"image_path":null},{"id":"R01-Horitsu-Q09","year":"R01","subject":"法令","category":"冷凍保安責任者・代理者","tags":[],"question":"次のイ、ロ、ハの記述のうち、冷凍保安責任者を選任しなければならない事業所における冷凍保安責任者及びその代理者について正しいものはどれか。\nイ．1日の冷凍能力が100トンである製造施設の冷凍保安責任者には、第三種冷凍機械責任者免状の交付を受け、かつ、高圧ガスの製造に関する所定の経験を有する者を選任することができる。\nロ．高圧ガスの製造に従事する者は、冷凍保安責任者が高圧ガス保安法若しくは高圧ガス保安法に基づく命令又は危害予防規程の実施を確保するためにする指示に従わなければならない。\nハ．冷凍保安責任者が旅行などのためその職務を行うことができない場合、あらかじめ選任した冷凍保安責任者の代理者にその職務を代行させなければならない。","options":["(1) イ","(2) ハ","(3) イ、ロ","(4) ロ、ハ","(5) イ、ロ、ハ"],"answer":4,"explanation":"・1日の冷凍能力が100トン以上である製造施設の冷凍保安責任者には、第三種冷凍機械責任者を選任することができない。\n・高圧ガスの製造に従事する者は、冷凍保安責任者が高圧ガス保安法若しくは高圧ガス保安法に基づく命令又は危害予防規程の実施を確保するためにする指示に従わなければならない。\n・冷凍保安責任者が旅行などのためその職務を行うことができない場合、あらかじめ選任した冷凍保安責任者の代理者にその職務を代行させなければならない。","has_image":false,"image_path":null},{"id":"R01-Horitsu-Q10","year":"R01","subject":"法令","category":"保安検査","tags":[],"question":"次のイ、ロ、ハの記述のうち、冷凍のため高圧ガスの製造をする第一種製造者（認定保安検査実施者である者を除く。）が受ける保安検査について正しいものはどれか。\nイ．保安検査は、3年以内に少なくとも1回以上行われる。\nロ．特定施設について、高圧ガス保安協会が行う保安検査を受けた場合、高圧ガス保安協会が遅滞なくその結果を都道府県知事等に報告することとなっているので、第一種製造者がその保安検査を受けた旨を都道府県知事等に届け出るべき定めはない。\nハ．保安検査は、特定施設の位置、構造及び設備並びに高圧ガスの製造の方法が所定の技術上の基準に適合しているかどうかについて行われる。","options":["(1) イ","(2) ロ","(3) イ、ハ","(4) ロ、ハ","(5) イ、ロ、ハ"],"answer":1,"explanation":"・保安検査は、3年以内に少なくとも1回以上行われる。\n※法改正『3年に1回受け、又は自ら行わなければならない。』\n・特定施設について、高圧ガス保安協会が行う保安検査を受け、その旨を都道府県知事に届け出た場合は、都道府県知事が行う保安検査を受けなくてよい。この届出を行うのは第一種製造者である。\n・保安検査は、製造のための施設の位置、構造及び設備が所定の技術上の基準に適合しているかどうかについて行われる。","has_image":false,"image_path":null},{"id":"R01-Horitsu-Q11","year":"R01","subject":"法令","category":"定期自主検査","tags":[],"question":"次のイ、ロ、ハの記述のうち、冷凍のため高圧ガスの製造をする第一種製造者（冷凍保安責任者を選任しなければならない者に限る。）が行う定期自主検査について正しいものはどれか。\nイ．定期自主検査を行ったとき、その検査記録に記載すべき事項の一つに\u0004検査の実施について監督を行った者の氏名\u0005がある。\nロ．定期自主検査は、冷媒ガスが毒性ガス又は可燃性ガスである製造施設の場合は1年に1回以上、冷媒ガスが不活性ガスである製造施設の場合は3年に1回以上行うことと定められている。\nハ．定期自主検査を行ったときは、その検査記録を作成し、これを保存しなければならないが、これを都道府県知事等に届け出るべき定めはない。","options":["(1) イ","(2) ロ","(3) イ、ハ","(4) ロ、ハ","(5) イ、ロ、ハ"],"answer":3,"explanation":"・定期自主検査を行ったとき、その検査記録に記載すべき事項の一つに「検査の実施について監督を行った者の氏名」がある。\n・定期自主検査は、1年に1回以上行うことと定められている。\n・定期自主検査を行ったときは、その検査記録を作成し、これを保存しなければならないが、これを都道府県知事等に届け出るべき定めはない。","has_image":false,"image_path":null},{"id":"R01-Horitsu-Q12","year":"R01","subject":"法令","category":"危害予防規程・保安教育計画","tags":[],"question":"次のイ、ロ、ハの記述のうち、冷凍のため高圧ガスの製造をする第一種製造者が定めるべき危害予防規程及び保安教育計画について正しいものはどれか。\nイ．危害予防規程を定め、災害の発生防止に努めなければならないが、その規程を都道府県知事等に届け出る必要はない。\nロ．危害予防規程には、協力会社の作業の管理に関することについても定めなければならない。\nハ．従業者に対する保安教育計画を定め、これを忠実に実行しなければならないが、その計画を都道府県知事等に届け出る必要はない。","options":["(1) イ","(2) ロ","(3) イ、ハ","(4) ロ、ハ","(5) イ、ロ、ハ"],"answer":4,"explanation":"・危害予防規程を定めたときは、都道府県知事に届け出なければならない。\n・危害予防規程には、協力会社の作業の管理に関することについても定めなければならない。\n・従業者に対する保安教育計画を定め、これを忠実に実行しなければならないが、その計画を都道府県知事等に届け出る必要はない。","has_image":false,"image_path":null},{"id":"R01-Horitsu-Q13","year":"R01","subject":"法令","category":"危険時の措置等","tags":[],"question":"次のイ、ロ、ハの記述のうち、冷凍のため高圧ガスの製造をする第一種製造者について正しいものはどれか。\nイ．高圧ガスの製造のための施設が危険な状態となっている事態を発見したときは、直ちに、その旨を都道府県知事等又は警察官、消防吏員若しくは消防団員若しくは海上保安官に届け出なければならない。\nロ．事業所ごとに、製造施設に異常があった場合、その年月日及びそれに対してとった措置を記載した帳簿を備え、記載の日から10年間保存しなければならない。\nハ．その所有し、又は占有する容器を喪失し、又は盗まれたときは、遅滞なく、その旨を都道府県知事等又は警察官に届け出なければならない。","options":["(1) イ","(2) ハ","(3) イ、ロ","(4) ロ、ハ","(5) イ、ロ、ハ"],"answer":5,"explanation":"・高圧ガスの製造のための施設が危険な状態となっている事態を発見したときは、直ちに、その旨を都道府県知事等又は警察官、消防吏員若しくは消防団員若しくは海上保安官に届け出なければならない。\n・事業所ごとに、製造施設に異常があった場合、その年月日及びそれに対してとった措置を記載した帳簿を備え、記載の日から10年間保存しなければならない。\n・その所有し、又は占有する容器を喪失し、又は盗まれたときは、遅滞なく、その旨を都道府県知事等又は警察官に届け出なければならない。","has_image":false,"image_path":null},{"id":"R01-Horitsu-Q14","year":"R01","subject":"法令","category":"製造施設の変更・完成検査","tags":[],"question":"次のイ、ロ、ハの記述のうち、冷凍のため高圧ガスの製造をする第一種製造者（認定完成検査実施者である者を除く。）が行う製造施設の変更の工事について正しいものはどれか。\nイ．アンモニアを冷媒ガスとする圧縮機の取替えの工事は、冷媒設備に係る切断、溶接を伴わない工事であって、その設備の冷凍能力の変更を伴わないものであっても、定められた軽微な変更の工事には該当しない。\nロ．製造施設の特定変更工事の完成後、高圧ガス保安協会が行う完成検査を受け所定の技術上の基準に適合していると認められた場合は、完成検査を受けた旨を都道府県知事等に届け出ることなく、かつ、都道府県知事等が行う完成検査を受けることなく、その施設を使用することができる。\nハ．製造施設の位置、構造又は設備の変更の工事について、都道府県知事等の許可を受けた場合であっても、完成検査を受けることなく、その製造施設を使用することができる変更の工事があるが、アンモニアを冷媒ガスとする製造施設には適用されない。","options":["(1) イ","(2) ロ","(3) イ、ハ","(4) ロ、ハ","(5) イ、ロ、ハ"],"answer":3,"explanation":"・アンモニアを冷媒ガスとする圧縮機の取替えの工事は、冷媒設備に係る切断、溶接を伴わない工事であって、その設備の冷凍能力の変更を伴わないものであっても、定められた軽微な変更の工事には該当しない。\n・製造施設の特定変更工事の完成後、協会又は指定完成検査機関が行う完成検査を受け所定の技術上の基準に適合していると認められた場合、完成検査を受けた旨を都道府県知事に届け出ることで、その施設を使用することができる。\n・製造施設の位置、構造又は設備の変更の工事について、都道府県知事等の許可を受けた場合であっても、完成検査を受けることなく、その製造施設を使用することができる変更の工事があるが、アンモニアを冷媒ガスとする製造施設には適用されない。","has_image":false,"image_path":null},{"id":"R01-Horitsu-Q15","year":"R01","subject":"法令","category":"定置式製造設備(アンモニア)","tags":[],"question":"次のイ、ロ、ハの記述のうち、製造設備がアンモニアを冷媒ガスとする定置式製造設備（吸収式アンモニア冷凍機であるものを除く。）である第一種製造者の製造施設に係る技術上の基準について冷凍保安規則上正しいものはどれか。\nイ．製造施設は、消火設備を設けなければならない施設に該当しない。\nロ．製造設備には、冷媒ガスが漏えいしたときに安全に、かつ、速やかに除害するための措置を講じなければならない。\nハ．冷媒設備に設けた安全弁（大気に冷媒ガスを放出することのないものを除く。）には、放出管を設けなければならない。","options":["(1) イ","(2) ロ","(3) イ、ロ","(4) ロ、ハ","(5) イ、ロ、ハ"],"answer":4,"explanation":"・可燃性ガスの製造施設には、その規模に応じて、適切な消火設備を適切な箇所に設けなければならない。\n・毒性ガスの製造設備には、冷媒ガスが漏えいしたときに安全に、かつ、速やかに除害するための措置を講じなければならない。ただし、吸収式アンモニア冷凍機については、この限りでない。\n・冷媒設備に設ける安全装置のうち、安全弁又は破裂板には、放出管を設けなければならない（当該冷媒設備から大気に冷媒ガスを放出することのないもの及び不活性ガスを冷媒ガスとする冷媒設備に設けたもの並びに吸収式アンモニア冷凍機に設けたものを除く。）","has_image":false,"image_path":null},{"id":"R01-Horitsu-Q16","year":"R01","subject":"法令","category":"定置式製造設備(アンモニア)","tags":[],"question":"次のイ、ロ、ハの記述のうち、製造設備がアンモニアを冷媒ガスとする定置式製造設備（吸収式アンモニア冷凍機であるものを除く。）である第一種製造者の製造施設に係る技術上の基準について冷凍保安規則上正しいものはどれか。\nイ．製造施設には、その施設から漏えいするガスが滞留するおそれのある場所に、そのガスの漏えいを検知し、かつ、警報するための設備を設けなければならない。\nロ．受液器に設ける液面計には、丸形ガラス管液面計を使用してはならない。\nハ．受液器には、その周囲に、冷媒ガスである液状のアンモニアが漏えいした場合にその流出を防止するための措置を講じなければならないものがあるが、その受液器の内容積が1万リットルであるものは、それに該当しない。","options":["(1) イ","(2) ロ","(3) イ、ロ","(4) イ、ハ","(5) イ、ロ、ハ"],"answer":3,"explanation":"・可燃性ガス、毒性ガス又は特定不活性ガスの製造施設には、当該施設から漏えいするガスが滞留するおそれのある場所に、当該ガスの漏えいを検知し、かつ、警報するための設備を設けなければならない。ただし、吸収式アンモニア冷凍機に係る施設については、この限りでない。\n・受液器に設ける液面計には、丸形ガラス管液面計を使用してはならない。\n・ハ。誤り。毒性ガスを冷媒ガスとする冷媒設備に係る受液器であって、その内容積が1万リットル以上のものの周囲には、液状の当該ガスが漏えいした場合にその流出を防止するための措置を講しなければならない。","has_image":false,"image_path":null},{"id":"R01-Horitsu-Q17","year":"R01","subject":"法令","category":"定置式製造設備(全般)","tags":[],"question":"次のイ、ロ、ハの記述のうち、製造設備が定置式製造設備である第一種製造者の製造施設に係る技術上の基準について冷凍保安規則上正しいものはどれか。\nイ．冷媒設備に設けなければならない安全装置は、冷媒ガスの圧力が耐圧試験圧力を超えた場合に直ちに、その設備の運転を停止するものでなければならない。\nロ．冷媒設備の圧縮機は火気（その製造設備内のものを除く。）の付近に設置してはならないが、その火気に対して安全な措置を講じた場合はこの限りでない。\nハ．冷媒設備の配管の変更の工事の完成検査における気密試験は、安全装置が作動しないように許容圧力未満の圧力で行うことができる。","options":["(1) イ","(2) ロ","(3) イ、ハ","(4) ロ、ハ","(5) イ、ロ、ハ"],"answer":2,"explanation":"・冷媒設備には、冷媒ガスの圧力が許容圧力を超えた場合に直ちに許容圧力以下に戻すことができる安全装置を設けなければならない。\n・冷媒設備の圧縮機、油分離器、凝縮器及び受液器並びにこれらの間の配管は火気（その製造設備内のものを除く。）の付近に設置してはならないが、その火気に対して安全な措置を講じた場合はこの限りでない。\n・気密試験は、許容圧以上の圧力で行わなければならない。","has_image":false,"image_path":null},{"id":"R01-Horitsu-Q18","year":"R01","subject":"法令","category":"定置式製造設備(全般)","tags":[],"question":"次のイ、ロ、ハの記述のうち、製造設備が定置式製造設備である第一種製造者の製造施設に係る技術上の基準について冷凍保安規則上正しいものはどれか。\nイ．冷媒設備の圧縮機が強制潤滑方式であって、潤滑油圧力に対する保護装置を有している場合であっても、その圧縮機の油圧系統を除く冷媒設備には圧力計を設けなければならない。\nロ．配管以外の冷媒設備について行う耐圧試験は、「水その他の安全な液体を使用することが困難であると認められるときは、空気、窒素等の気体を使用して許容圧力以上の圧力で行うことができる。」と定められている。\nハ．凝縮器には所定の耐震に関する性能を有しなければならないものがあるが、縦置円筒形であって、かつ、胴部の長さが5メートルの凝縮器は、その必要はない。","options":["(1) イ","(2) ハ","(3) イ、ロ","(4) ロ、ハ","(5) イ、ロ、ハ"],"answer":1,"explanation":"・冷媒設備の圧縮機が強制潤滑方式であって、潤滑油圧力に対する保護装置を有している場合であっても、その圧縮機の油圧系統を除く冷媒設備には圧力計を設けなければならない。\n・配管以外の冷媒設備について行う耐圧試験は、許容圧力の1.5倍以上の圧力で水その他の安全な液体を使用して行うものであるが、「水その他の安全な液体を使用することが困難であると認められるときは、空気、窒素等の気体を使用して許容圧力の1.25倍以上の圧力で行うことができる。」と定められている。\n・凝縮器（縦置円筒形で胴部の長さが5メートル以上のものに限る。）、受液器（内容積が5千リットル以上のものに限る。）及び配管（冷媒設備に係る地盤面上の配管（外径45ミリメートル以上のものに限る。）であって、内容積が3立方メートル以上のもの又は凝縮器及び受液器に接続されているもの）並びにこれらの支持構造物及び基礎は、経済産業大臣が定める耐震に関する性能を有するものでなければならない。","has_image":false,"image_path":null},{"id":"R01-Horitsu-Q19","year":"R01","subject":"法令","category":"製造の方法","tags":[],"question":"次のイ、ロ、ハの記述のうち、冷凍保安規則で定める第一種製造者の製造の方法に係る技術上の基準に適合しているものはどれか。\nイ．冷媒設備に設けた安全弁の修理及び清掃が終了した後、製造設備の運転を数日間停止するので、その間安全弁に付帯して設けた止め弁を閉止することとした。\nロ．冷媒設備の修理は、あらかじめ定めた修理の作業計画に従って行ったが、あらかじめ定めた作業の責任者の監視の下で行うことができなかったので、異常があったときに直ちにその旨をその責任者に通報するための措置を講じて行った。\nハ．高圧ガスの製造は、1日に1回以上その製造設備が属する製造施設の異常の有無を点検して行い、異常のあるときはその設備の補修その他の危険を防止する措置を講じて行っている。","options":["(1) イ","(2) ハ","(3) イ、ロ","(4) ロ、ハ","(5) イ、ロ、ハ"],"answer":4,"explanation":"・冷媒設備の安全弁に付帯して設けた止め弁は、その安全弁の修理又は清掃のため特に必要な場合を除き、常に全開しておかなければならない。\n・冷媒設備の修理をするときは、あらかじめ、修理の作業計画及びその作業の責任者を定め、修理は、その作業計画に従い、かつ、その責任者の監視の下で行うか、又は異常があったときに直ちにその旨をその責任者に通報するための措置を講じて行わなければならない。\n・高圧ガスの製造は、製造する高圧ガスの種類及び製造設備の態様に応じ、1日に1回以上その製造設備が属する製造施設の異常の有無を点検し、異常のあるときは、その設備の補修その他の危険を防止する措置を講じて行わなければならない。","has_image":false,"image_path":null},{"id":"R01-Horitsu-Q20","year":"R01","subject":"法令","category":"認定指定設備","tags":[],"question":"次のイ、ロ、ハの記述のうち、認定指定設備について冷凍保安規則上正しいものはどれか。\nイ．認定指定設備である条件の一つに、自動制御装置が設けられていなければならないことがある。\nロ．認定指定設備である条件の一つに、日常の運転操作に必要となる冷媒ガスの止め弁には手動式のものを使用しないことがある。\nハ．認定指定設備に変更の工事を施すと、指定設備認定証が無効になる場合がある。","options":["(1) イ","(2) ハ","(3) イ、ロ","(4) ロ、ハ","(5) イ、ロ、ハ"],"answer":5,"explanation":"・認定指定設備である条件の一つに、自動制御装置が設けられていなければならないことがある。\n・認定指定設備である条件の一つに、日常の運転操作に必要となる冷媒ガスの止め弁には手動式のものを使用しないことがある。\n・認定指定設備に変更の工事を施すと、指定設備認定証が無効になる場合がある。","has_image":false,"image_path":null},{"id":"R02-Horitsu-Q01","year":"R02","subject":"法令","category":"高圧ガスの定義等","tags":[],"question":"次のイ、ロ、ハの記述のうち、正しいものはどれか。\nイ．常用の温度において圧力が1メガパスカル以上となる圧縮ガス（圧縮アセチレンガスを除く。）であって、現にその圧力が1メガパスカル以上であるものは高圧ガスである｡\nロ．温度35度以下で圧力が0.2メガパスカルとなる液化ガスは、高圧ガスである。\nハ．高圧ガス保安法は、高圧ガスによる災害を防止して公共の安全を確保する目的のために、民間事業者による高圧ガスの保安に関する自主的な活動を促進することを定めているが、高圧ガス保安協会による高圧ガスの保安に関する自主的な活動を促進することは定めていない。","options":["(1) イ","(2) ロ","(3) イ、ロ","(4) イ、ハ","(5) イ、ロ、ハ"],"answer":3,"explanation":"・常用の温度において圧力が1メガパスカル以上となる圧縮ガス（圧縮アセチレンガスを除く。）であって、現にその圧力が1メガパスカル以上であるものは高圧ガスである。\n・温度35度以下で圧力が0.2メガパスカルとなる液化ガスは、高圧ガスである。\n・高圧ガス保安法は、高圧ガスによる災害を防止して公共の安全を確保する目的のために、民間事業者及び高圧ガス保安協会による高圧ガスの保安に関する自主的な活動を促進することを定めている。","has_image":false,"image_path":null},{"id":"R02-Horitsu-Q02","year":"R02","subject":"法令","category":"適用除外・事業(製造・販売・廃棄等)","tags":[],"question":"次のイ、ロ、ハの記述のうち、正しいものはどれか。\nイ．冷凍のための設備を使用して高圧ガスの製造をしようとする者が、都道府県知事等の許可を受けなければならない場合の1日の冷凍能力の最小の値は、冷媒ガスである高圧ガスの種類に関係なく同じである。\nロ．1日の冷凍能力が3トン未満の冷凍設備内における高圧ガスは、そのガスの種類にかかわらず、高圧ガス保安法の適用を受けない。\nハ．専ら冷凍設備に用いる機器の製造の事業を行う者（機器製造業者）が、1日の冷凍能力が10トンの冷凍機を製造するときは、所定の技術上の基準に従ってその機器の製造をしなければならない。","options":["(1) ロ","(2) ハ","(3) イ、ハ","(4) ロ、ハ","(5) イ、ロ、ハ"],"answer":4,"explanation":"・冷凍のための設備を使用して高圧ガスの製造をしようとする者が、都道府県知事等の許可を受けなければならない場合の1日の冷凍能力の最小の値は、冷媒ガスである高圧ガスの種類によって異なる。\n・1日の冷凍能力が3トン未満の冷凍設備内における高圧ガスは、そのガスの種類にかかわらず、高圧ガス保安法の適用を受けない。\n・専ら冷凍設備に用いる機器の製造の事業を行う者（機器製造業者）が、1日の冷凍能力が10トンの冷凍機を製造するときは、所定の技術上の基準に従ってその機器の製造をしなければならない。","has_image":false,"image_path":null},{"id":"R02-Horitsu-Q03","year":"R02","subject":"法令","category":"適用除外・事業(製造・販売・廃棄等)","tags":[],"question":"次のイ、ロ、ハの記述のうち、正しいものはどれか。\nイ．第一種製造者は、高圧ガスの製造施設の位置、構造又は設備の変更の工事をしようとするときは、その工事が定められた軽微なものである場合を除き、都道府県知事等の許可を受けなければならない。\nロ．冷凍のための製造施設の冷媒設備内の高圧ガスであるアンモニアは、冷凍保安規則で定める高圧ガスの廃棄に係る技術上の基準に従って廃棄しなければならないものに該当する。\nハ．冷媒ガスの補充用の高圧ガスの販売の事業を営もうとする者は、特に定められた場合を除き、販売所ごとに、事業開始の日の20日前までに、その旨を都道府県知事等に届け出なければならない。","options":["(1) イ","(2) ロ","(3) イ、ハ","(4) ロ、ハ","(5) イ、ロ、ハ"],"answer":5,"explanation":"・第一種製造者は、高圧ガスの製造施設の位置、構造又は設備の変更の工事をしようとするときは、その工事が定められた軽微なものである場合を除き、都道府県知事等の許可を受けなければならない。\n・アンモニアは、可燃性ガス及び毒性ガスに分類されており、冷凍保安規則で定める高圧ガスの廃棄に係る技術上の基準に従って廃棄しなければならないものに該当する。\n・冷媒ガスの補充用の高圧ガスの販売の事業を営もうとする者は、特に定められた場合を除き、販売所ごとに、事業開始の日の20日前までに、その旨を都道府県知事等に届け出なければならない。","has_image":false,"image_path":null},{"id":"R02-Horitsu-Q04","year":"R02","subject":"法令","category":"高圧ガスの貯蔵","tags":[],"question":"次のイ、ロ、ハの記述のうち、冷凍に係る製造事業所における冷媒ガスの補充用としての容器による高圧ガス（質量が1.5キログラムを超えるもの）の貯蔵の方法に係る技術上の基準について一般高圧ガス保安規則上正しいものはどれか。\nイ．アンモニアの充填容器及び残ガス容器を貯蔵する場合は、通風の良い場所で行わなければならないが、不活性ガスのフルオロカーボンについては、その定めはない。\nロ．充填容器を車両に積載した状態で貯蔵することは、特に定められた場合を除き、禁じられている。\nハ．液化アンモニアを充填した容器を貯蔵する場合は、その容器を常に温度40度以下に保たなければならないが、液化フルオロカーボン134aを充填した容器については、いかなる場合であっても、その定めはない。","options":["(1) ロ","(2) イ、ロ","(3) イ、ハ","(4) ロ、ハ","(5) イ、ロ、ハ"],"answer":2,"explanation":"・アンモニアは、可燃性ガス及び毒性ガスに分類されており、充填容器及び残ガス容器を貯蔵する場合は、通風の良い場所で行わなければならないが、不活性ガスのフルオロカーボンについては、その定めはない。\n・充填容器を車両に積載した状態で貯蔵することは、特に定められた場合を除き、禁じられている。\n・充填容器等は、常に温度40度以下に保たなければならないと定められており、液化フルオロカーボン134aを充填した容器も例外ではない。","has_image":false,"image_path":null},{"id":"R02-Horitsu-Q05","year":"R02","subject":"法令","category":"高圧ガスの移動","tags":[],"question":"次のイ、ロ、ハの記述のうち、車両に積載した容器（内容積が48 リットルのもの）による冷凍設備の冷媒ガスの補充用の高圧ガスの移動に係る技術上の基準等について一般高圧ガス保安規則上正しいものはどれか。\nイ．液化フルオロカーボン134aを移動するときは、液化アンモニアを移動するときと同様に、その車両の見やすい箇所に警戒標を掲げなければならない。\nロ．液化アンモニアを移動するときは、その容器に転倒等による衝撃を防止する措置を講じなければならない。\nハ．液化アンモニアを移動するときは、消火設備のほか防毒マスク、手袋その他の保護具並びに災害発生防止のための応急措置に必要な資材、薬剤及び工具等も携行しなければならない。","options":["(1) イ","(2) ロ","(3) イ、ハ","(4) ロ、ハ","(5) イ、ロ、ハ"],"answer":5,"explanation":"・充てん容器等を車両に積載して移動するとき（容器の内容積が20リットル以下である充てん容器等（毒性ガスに係るものを除く。）のみを積載した車両であって、当該積載容器の内容積の合計が40リットル以下である場合を除く。）は、当該車両の見やすい箇所に警戒標を掲げなければならない。\n※法改正『容器の内容積が25リットル以下』『内容積の合計が50リットル以下』\n・液化アンモニアを移動するときは、その容器に転倒等による衝撃を防止する措置を講じなければならない。\n・可燃性ガス、酸素又は三フッ化窒素の充てん容器等を車両に積載して移動するときは、消火設備並びに災害発生防止のための応急措置に必要な資材及び工具等を携行しなければならない。毒性ガスの充てん容器等を車両に積載して移動するときは、当該毒性ガスの種類に応じた防毒マスク、手袋その他の保護具並びに災害発生防止のための応急措置に必要な資材、薬剤及び工具等を携行しなければならない。\n※法改正『可燃性ガス、特定不活性ガス、酸素又は三フッ化窒素』","has_image":false,"image_path":null},{"id":"R02-Horitsu-Q06","year":"R02","subject":"法令","category":"高圧ガスの充填容器","tags":[],"question":"次のイ、ロ、ハの記述のうち、冷凍設備の冷媒ガスの補充用の高圧ガスを充填するための容器（再充填禁止容器を除く。）及びその附属品について正しいものはどれか。\nイ．液化アンモニアを充填する容器に表示をすべき事項の一つに、「その高圧ガスの性質を示す文字を明示すること。」がある。\nロ．液化フルオロカーボンを充填する容器に表示をすべき事項の一つに、その容器の外面の見やすい箇所に、「その表面積の2分の1以上について白色の塗色をすること。」がある。\nハ．容器の廃棄をする者は、その容器をくず化し、その他容器として使用することができないように処分しなければならないが、容器の附属品の廃棄については、その定めはない。","options":["(1) イ","(2) ロ","(3) ハ","(4) イ、ロ","(5) イ、ハ"],"answer":1,"explanation":"・液化アンモニアを充填する容器に表示をすべき事項の一つに、「その高圧ガスの性質を示す文字を明示すること。」がある。\n・液化フルオロカーボンを充填する容器に表示をすべき事項の一つに、その容器の外面の見やすい箇所に、「その表面積の2分の1以上についてねずみ色の塗色をすること。」がある。白色の塗色は、液化アンモニアを充填する容器に行う。\n・容器又は附属品の廃棄をする者は、くず化し、その他容器又は附属品として使用することができないように処分しなければならない。","has_image":false,"image_path":null},{"id":"R02-Horitsu-Q07","year":"R02","subject":"法令","category":"冷凍能力の算定基準","tags":[],"question":"次のイ、ロ、ハの記述のうち、冷凍能力の算定基準について冷凍保安規則上正しいものはどれか。\nイ．冷媒ガスの種類に応じて定められた数値又は所定の算式で得られた数値（C）は、回転ピストン型圧縮機を使用する製造設備の1日の冷凍能力の算定に必要な数値の一つである。\nロ．圧縮機の標準回転速度における1時間のピストン押しのけ量の数値（V）は、遠心式圧縮機を使用する製造設備の1日の冷凍能力の算定に必要な数値の一つである。\nハ．冷媒設備内の冷媒ガスの充填量の数値（W）は、往復動式圧縮機を使用する製造設備の1日の冷凍能力の算定に必要な数値の一つである。","options":["(1) イ","(2) イ、ロ","(3) イ、ハ","(4) ロ、ハ","(5) イ、ロ、ハ"],"answer":1,"explanation":"・回転ピストン型圧縮機を使用する製造設備にあっては、次の算式によるものをもって1日の冷凍能力とする。\nR＝V÷C\n　　R 1日の冷凍能力（単位　トン）の数値\n　　V　回転ピストンのガス圧縮部分の厚さ、回転ピストンの一分間の標準回転数、気筒の内径、ピストンの外径から所定の算式で得られた数値\n　　C　冷媒ガスの種類に応じて定められた数値又は所定の算式で得られた数値\nよって、冷媒ガスの種類に応じて定められた数値又は所定の算式で得られた数値（C）は、回転ピストン型圧縮機を使用する製造設備の1日の冷凍能力の算定に必要な数値の一つである。\n・遠心式圧縮機を使用する製造設備にあっては、当該圧縮機の原動機の定格出力1.2キロワットをもって1日の冷凍能力1トンとする。\n・往復動式圧縮機を使用する製造設備にあっては、次の算式によるものをもって1日の冷凍能力とする。\nR＝V÷C\n　　R 1日の冷凍能力（単位　トン）の数値\n　　V　圧縮機の標準回転速度における1時間のピストン押しのけ量（単位立方メートル）の数値\n　　C　冷媒ガスの種類に応じて定められた数値又は所定の算式で得られた数値\nよって、冷媒設備内の冷媒ガスの充填量の数値（W）は、往復動式圧縮機を使用する製造設備の1日の冷凍能力の算定に必要な数値ではない。","has_image":false,"image_path":null},{"id":"R02-Horitsu-Q08","year":"R02","subject":"法令","category":"第二種製造者(全般)","tags":[],"question":"次のイ、ロ、ハの記述のうち、冷凍のため高圧ガスの製造をする第二種製造者について正しいものはどれか。\nイ．全ての第二種製造者は、製造施設について定期自主検査を行う必要はない。\nロ．第二種製造者は、製造のための施設を、その位置、構造及び設備が所定の技術上の基準に適合するように維持しなければならない。\nハ．第二種製造者は、事業所ごとに、高圧ガスの製造開始の日の20日前までに、その旨を都道府県知事等に届け出なければならない。","options":["(1) イ","(2) ロ","(3) イ、ロ","(4) ロ、ハ","(5) イ、ロ、ハ"],"answer":4,"explanation":"・第二種製造者のうち、認定指定設備を使用する者等の省令で定める者は、製造施設について定期自主検査を行わなければならない。\n・第二種製造者は、製造のための施設を、その位置、構造及び設備が所定の技術上の基準に適合するように維持しなければならない。\n・第二種製造者は、事業所ごとに、高圧ガスの製造開始の日の20日前までに、その旨を都道府県知事等に届け出なければならない。","has_image":false,"image_path":null},{"id":"R02-Horitsu-Q09","year":"R02","subject":"法令","category":"冷凍保安責任者・代理者","tags":[],"question":"次のイ、ロ、ハの記述のうち、冷凍保安責任者を選任しなければならない事業所における冷凍保安責任者及びその代理者について正しいものはどれか。\nイ．1日の冷凍能力が90トンである製造施設の冷凍保安責任者には、第三種冷凍機械責任者免状の交付を受け、かつ、高圧ガスの製造に関する所定の経験を有する者を選任することができる。\nロ．冷凍保安責任者の代理者は、冷凍保安責任者の職務を代行する場合は、高圧ガス保安法の規定の適用については、冷凍保安責任者とみなされる。\nハ．選任している冷凍保安責任者を解任し、新たな者を選任したときは、遅滞なく、その旨を都道府県知事等に届け出なければならないが、冷凍保安責任者の代理者を解任及び選任したときには届け出る必要はない。","options":["(1) ロ","(2) ハ","(3) イ、ロ","(4) イ、ハ","(5) イ、ロ、ハ"],"answer":3,"explanation":"・1日の冷凍能力が90トンである製造施設の冷凍保安責任者には、第三種冷凍機械責任者免状の交付を受け、かつ、高圧ガスの製造に関する所定の経験を有する者を選任することができる。\n・冷凍保安責任者の代理者は、冷凍保安責任者の職務を代行する場合は、高圧ガス保安法の規定の適用については、冷凍保安責任者とみなされる。\n・冷凍保安責任者の代理者を解任及び選任したときにも、遅滞なく、その旨を都道府県知事等に届け出なければならない。冷凍保安責任者の解任及び選任の規定は、冷凍保安責任者の代理者の解任及び選任に準用されている。","has_image":false,"image_path":null},{"id":"R02-Horitsu-Q10","year":"R02","subject":"法令","category":"保安検査","tags":[],"question":"次のイ、ロ、ハの記述のうち、冷凍のため高圧ガスの製造をする第一種製造者（認定保安検査実施者である者を除く。）が受ける保安検査について正しいものはどれか。\nイ．保安検査を冷凍保安責任者に行わせなければならない。\nロ．保安検査は、特定施設についてその位置、構造及び設備が所定の技術上の基準に適合しているかどうかについて行われる。\nハ．特定施設について、高圧ガス保安協会が行う保安検査を受け、その旨を都道府県知事等に届け出た場合は、都道府県知事等が行う保安検査を受けなくてよい｡","options":["(1) イ","(2) ロ","(3) イ、ハ","(4) ロ、ハ","(5) イ、ロ、ハ"],"answer":4,"explanation":"・保安検査は、都道府県知事又は高圧ガス保安協会若しくは指定保安検査機関が行う。\n・保安検査は、特定施設についてその位置、構造及び設備が所定の技術上の基準に適合しているかどうかについて行われる。\n・特定施設について、高圧ガス保安協会が行う保安検査を受け、その旨を都道府県知事等に届け出た場合は、都道府県知事等が行う保安検査を受けなくてよい。","has_image":false,"image_path":null},{"id":"R02-Horitsu-Q11","year":"R02","subject":"法令","category":"定期自主検査","tags":[],"question":"次のイ、ロ、ハの記述のうち、冷凍のため高圧ガスの製造をする第一種製造者が行う定期自主検査について正しいものはどれか。\nイ．定期自主検査は、冷媒ガスが不活性ガスである製造施設の場合は行わなくてよいと定められている。\nロ．定期自主検査は、製造施設の位置、構造及び設備が所定の技術上の基準に適合しているかどうかについて行わなければならないが、その技術上の基準のうち耐圧試験に係るものについては行わなくてよい。\nハ．定期自主検査を実施したときは、所定の検査記録を作成し、これを保存しなければならない。","options":["(1) イ","(2) ハ","(3) イ、ロ","(4) ロ、ハ","(5) イ、ロ、ハ"],"answer":4,"explanation":"・第一種製造者は、冷媒ガスの種類にかかわらず、定期自主検査を行わなくてはならない。\n・定期自主検査は、製造施設の位置、構造及び設備が所定の技術上の基準に適合しているかどうかについて行わなければならないが、その技術上の基準のうち耐圧試験に係るものについては行わなくてよい。\n・定期自主検査を実施したときは、所定の検査記録を作成し、これを保存しなければならない。","has_image":false,"image_path":null},{"id":"R02-Horitsu-Q12","year":"R02","subject":"法令","category":"危害予防規程・保安教育計画","tags":[],"question":"次のイ、ロ、ハの記述のうち、冷凍のため高圧ガスの製造をする第一種製造者が定めるべき危害予防規程及び保安教育計画について正しいものはどれか。\nイ．危害予防規程を守るべき者は、その第一種製造者及びその従業者である。\nロ．危害予防規程には、製造設備の安全な運転及び操作に関することを定めなければならないが、危害予防規程の変更の手続に関することは定める必要がない。\nハ．従業者に対する保安教育計画を定め、その計画を都道府県知事等に届け出なければならない。","options":["(1) イ","(2) ロ","(3) イ、ハ","(4) ロ、ハ","(5) イ、ロ、ハ"],"answer":1,"explanation":"・危害予防規程を守るべき者は、その第一種製造者及びその従業者である。\n・危害予防規程には、危害予防規程の変更の手続に関することを定めなければならない。\n・第一種製造者は、その従業者に対する保安教育計画を定めなければならないが、その計画を都道府県知事等に届ける義務はない。","has_image":false,"image_path":null},{"id":"R02-Horitsu-Q13","year":"R02","subject":"法令","category":"危険時の措置等","tags":[],"question":"次のイ、ロ、ハの記述のうち、冷凍のため高圧ガスの製造をする第一種製造者について正しいものはどれか。\nイ．高圧ガスの製造施設が危険な状態となったときは、直ちに、応急の措置を講じなければならない。また、この第一種製造者に限らずこの事態を発見した者は、直ちに、その旨を都道府県知事等又は警察官、消防吏員若しくは消防団員若しくは海上保安官に届け出なければならない。\nロ．事業所ごとに帳簿を備え、その製造施設に異常があった場合、異常があった年月日及びそれに対してとった措置をその帳簿に記載し、製造開始の日から10年間保存しなければならない。\nハ．その占有する液化アンモニアの充填容器を盗まれたときは、遅滞なく、その旨を都道府県知事等又は警察官に届け出なければならないが、残ガス容器を喪失したときは、その必要はない。","options":["(1) イ","(2) ロ","(3) イ、ロ","(4) ロ、ハ","(5) イ、ロ、ハ"],"answer":1,"explanation":"・高圧ガスの製造施設が危険な状態となったときは、直ちに、応急の措置を講じなければならない。また、この第一種製造者に限らずこの事態を発見した者は、直ちに、その旨を都道府県知事等又は警察官、消防吏員若しくは消防団員若しくは海上保安官に届け出なければならない。\n・事業所ごとに帳簿を備え、その製造施設に異常があった場合、異常があった年月日及びそれに対してとった措置をその帳簿に記載し、記載の日から10年間保存しなければならない。\n・残ガス容器を喪失したときにも、遅滞なく、その旨を都道府県知事等又は警察官に届け出なければならない。","has_image":false,"image_path":null},{"id":"R02-Horitsu-Q14","year":"R02","subject":"法令","category":"製造施設の変更・完成検査","tags":[],"question":"次のイ、ロ、ハの記述のうち、冷凍のため高圧ガスの製造をする第一種製造者（認定完成検査実施者である者を除く。）が行う製造施設の変更の工事について正しいものはどれか。\nイ．不活性ガスを冷媒ガスとする製造設備の圧縮機の取替えの工事を行う場合、切断、溶接を伴わない工事であって、冷凍能力の変更を伴わないものであれば、その完成後遅滞なく、都道府県知事等にその旨を届け出ればよい。\nロ．製造施設の特定変更工事を完成したときに受ける完成検査は、都道府県知事等又は高圧ガス保安協会若しくは指定完成検査機関のいずれかが行うものでなければならない。\nハ．製造施設の変更の工事について都道府県知事等の許可を受けた場合であっても、完成検査を受けることなくその施設を使用することができる変更の工事がある。","options":["(1) ロ","(2) イ、ロ","(3) イ、ハ","(4) ロ、ハ","(5) イ、ロ、ハ"],"answer":5,"explanation":"・不活性ガスを冷媒ガスとする製造設備の圧縮機の取替えの工事を行う場合、切断、溶接を伴わない工事であって、冷凍能力の変更を伴わないものであれば、その完成後遅滞なく、都道府県知事等にその旨を届け出ればよい。\n・製造施設の特定変更工事を完成したときに受ける完成検査は、都道府県知事等又は高圧ガス保安協会若しくは指定完成検査機関のいずれかが行うものでなければならない。\n・製造施設の変更の工事について都道府県知事等の許可を受けた場合であっても、完成検査を受けることなくその施設を使用することができる変更の工事がある。","has_image":false,"image_path":null},{"id":"R02-Horitsu-Q15","year":"R02","subject":"法令","category":"定置式製造設備(アンモニア)","tags":[],"question":"次のイ、ロ、ハの記述のうち、製造設備がアンモニアを冷媒ガスとする定置式製造設備（吸収式アンモニア冷凍機であるものを除く。）である第一種製造者の製造施設に係る技術上の基準について冷凍保安規則上正しいものはどれか。\nイ．圧縮機、油分離器、受液器又はこれらの間の配管を設置する室は、冷媒ガスであるアンモニアが漏えいしたとき滞留しないような構造としなければならないが、凝縮器を設置する室については定められていない。\nロ．製造設備が専用機械室に設置され、かつ、その室に運転中常時強制換気できる装置を設けている場合であっても、製造施設から漏えいしたガスが滞留するおそれのある場所には、そのガスの漏えいを検知し、かつ、警報するための設備を設けなければならない。\nハ．受液器にガラス管液面計を設ける場合には、丸形ガラス管液面計以外のものとし、その液面計に破損を防止するための措置か、受液器とその液面計とを接続する配管にその液面計の破損による漏えいを防止するための措置のいずれか一方の措置を講じることと定められている。","options":["(1) イ","(2) ロ","(3) ハ","(4) イ、ロ","(5) イ、ロ、ハ"],"answer":2,"explanation":"・圧縮機、油分離器、凝縮器若しくは受液器又はこれらの間の配管（可燃性ガス、毒性ガス又は特定不活性ガスの製造設備のものに限る。）を設置する室は、冷媒ガスが漏えいしたとき滞留しないような構造としなければならない。\n・製造設備が専用機械室に設置され、かつ、その室に運転中常時強制換気できる装置を設けている場合であっても、製造施設から漏えいしたガスが滞留するおそれのある場所には、そのガスの漏えいを検知し、かつ、警報するための設備を設けなければならない。\n・受液器にガラス管液面計を設ける場合には、丸形ガラス管液面計以外のものとし、その液面計に破損を防止するための措置と、受液器とその液面計とを接続する配管にその液面計の破損による漏えいを防止するための措置の両方を講じなければならない。","has_image":false,"image_path":null},{"id":"R02-Horitsu-Q16","year":"R02","subject":"法令","category":"定置式製造設備(アンモニア)","tags":[],"question":"次のイ、ロ、ハの記述のうち、製造設備がアンモニアを冷媒ガスとする定置式製造設備（吸収式アンモニア冷凍機であるものを除く。）である第一種製造者の製造施設に係る技術上の基準について冷凍保安規則上正しいものはどれか。\nイ．受液器には、その周囲に、冷媒ガスである液状のアンモニアが漏えいした場合にその流出を防止するための措置を講じなければならないものがあるが、その受液器の内容積が5000リットルであるものは、それに該当しない。\nロ．この製造施設は、消火設備を設けなければならない施設に該当しない。\nハ．この製造設備は、冷媒ガスが漏えいしたときに安全に、かつ、速やかに除害するための措置を講じるべき設備に該当する。","options":["(1) イ","(2) ハ","(3) イ、ロ","(4) イ、ハ","(5) イ、ロ、ハ"],"answer":4,"explanation":"・受液器の周囲に、冷媒ガスである液状のアンモニアが漏えいした場合にその流出を防止するための措置を講じなければならないものは、その受液器の内容積が1万リットル以上と定められている。\n・アンモニアは可燃性ガスに分類されており、この製造施設は、消火設備を設けなければならない。\n・アンモニアは毒性ガスに分類されており、この製造設備は、冷媒ガスが漏えいしたときに安全に、かつ、速やかに除害するための措置を講じるべき設備に該当する。","has_image":false,"image_path":null},{"id":"R02-Horitsu-Q17","year":"R02","subject":"法令","category":"定置式製造設備(全般)","tags":[],"question":"次のイ、ロ、ハの記述のうち、製造設備が定置式製造設備である第一種製造者の製造施設に係る技術上の基準について冷凍保安規則上正しいものはどれか。\nイ．製造設備に設けたバルブ（特に定められたバルブを除く。）には、作業員が適切に操作することができるような措置を講じなければならない。\nロ．圧縮機、凝縮器等が引火性又は発火性の物（作業に必要なものを除く。）をたい積した場所の付近にあってはならない旨の定めは、不活性ガスを冷媒ガスとする製造施設には適用されない。\nハ．冷媒設備の配管の変更の工事後の完成検査における気密試験は、許容圧力以上の圧力で行えばよい。","options":["(1) イ","(2) ロ","(3) イ、ハ","(4) ロ、ハ","(5) イ、ロ、ハ"],"answer":3,"explanation":"・製造設備に設けたバルブ（特に定められたバルブを除く。）には、作業員が適切に操作することができるような措置を講じなければならない。\n・圧縮機、凝縮器等が引火性又は発火性の物（作業に必要なものを除く。）をたい積した場所の付近にあってはならない旨の定めは、冷媒ガスの種類にかかわらず適用される。\n・冷媒設備の配管の変更の工事後の完成検査における気密試験は、許容圧力以上の圧力で行えばよい。","has_image":false,"image_path":null},{"id":"R02-Horitsu-Q18","year":"R02","subject":"法令","category":"定置式製造設備(全般)","tags":[],"question":"次のイ、ロ、ハの記述のうち、製造設備が定置式製造設備である第一種製造者の製造施設に係る技術上の基準について冷凍保安規則上正しいものはどれか。\nイ．冷媒設備の圧縮機が強制潤滑方式であり、かつ、潤滑油圧力に対する保護装置を有しているものである場合は、その冷媒設備には、圧力計を設けなくてよい。\nロ．配管以外の冷媒設備について行う耐圧試験は、水その他の安全な液体を使用することが困難であると認められるときは、空気、窒素等の気体を使用して許容圧力の1.25 倍以上の圧力で行うことができる。\nハ．内容積が5000リットル以上の受液器並びにその支持構造物及び基礎は、所定の耐震に関する性能を有するものとしなければならない。","options":["(1) イ","(2) ハ","(3) イ、ロ","(4) ロ、ハ","(5) イ、ロ、ハ"],"answer":4,"explanation":"・冷媒設備の圧縮機が強制潤滑方式であって、潤滑油圧力に対する保護装置を有している場合であっても、その圧縮機の油圧系統を除く冷媒設備には圧力計を設けなければならない。\n・管以外の冷媒設備について行う耐圧試験は、水その他の安全な液体を使用することが困難であると認められるときは、空気、窒素等の気体を使用して許容圧力の1.25 倍以上の圧力で行うことができる。\n・内容積が5000リットル以上の受液器並びにその支持構造物及び基礎は、所定の耐震に関する性能を有するものとしなければならない。","has_image":false,"image_path":null},{"id":"R02-Horitsu-Q19","year":"R02","subject":"法令","category":"製造の方法","tags":[],"question":"次のイ、ロ、ハの記述のうち、冷凍保安規則に定める第一種製造者の製造の方法に係る技術上の基準に適合しているものはどれか。\nイ．製造設備の運転を長期に停止したが、その間も冷媒設備の安全弁に付帯して設けた止め弁は、全開しておいた。\nロ．冷媒設備の修理を行うときは、あらかじめ、その作業計画及び作業の責任者を定めることとしているが、冷媒設備を開放して清掃のみを行うときは、その作業計画及び作業の責任者を定めないこととしている。\nハ．製造設備とブラインを共通にする認定指定設備による高圧ガスの製造は、認定指定設備に自動制御装置が設けられているため、その認定指定設備の部分については1か月に1回、異常の有無を点検して行っている。","options":["(1) イ","(2) ロ","(3) イ、ハ","(4) ロ、ハ","(5) イ、ロ、ハ"],"answer":1,"explanation":"・冷媒設備の安全弁に付帯して設けた止め弁は、その安全弁の修理又は清掃のため特に必要な場合を除き、常に全開しておかなければならない。\n・修理又は清掃（修理等）を行うときは、あらかじめ、修理等の作業計画及び当該作業の責任者を定め、修理等は、当該作業計画に従い、かつ、当該責任者の監視の下に行うこと又は異常があったときに直ちにその旨を当該責任者に通報するための措置を講じて行わなければならない。\n・高庄ガスの製造は、1日に1回以上当該製造設備の属する製造施設の異常の有無を点検して行わなければならない。この定めは、認定指定設備である製造設備についても適用される。","has_image":false,"image_path":null},{"id":"R02-Horitsu-Q20","year":"R02","subject":"法令","category":"認定指定設備","tags":[],"question":"次のイ、ロ、ハの記述のうち、認定指定設備について冷凍保安規則上正しいものはどれか。\nイ．認定指定設備の日常の運転操作に必要となる冷媒ガスの止め弁には、手動式のものを使用しなければならない。\nロ．認定指定設備の冷媒設備は、その認定指定設備の製造業者の事業所において試運転を行い、使用場所に分割して搬入されるものでなければならない。\nハ．認定指定設備に変更の工事を施したとき又は認定指定設備を移設したときは、指定設備認定証を返納しなければならない場合がある。","options":["(1) イ","(2) ハ","(3) イ、ロ","(4) ロ、ハ","(5) イ、ロ、ハ"],"answer":2,"explanation":"・認定指定設備の日常の運転操作に必要となる冷媒ガスの止め弁には、手動式のものを使用してはならない。\n・認定指定設備の冷媒設備は、その認定指定設備の製造業者の事業所において試運転を行い、使用場所に分割されずに搬入されるものでなければならない。\n・認定指定設備に変更の工事を施したとき又は認定指定設備を移設したときは、指定設備認定証を返納しなければならない場合がある。","has_image":false,"image_path":null},{"id":"R03-Horitsu-Q01","year":"R03","subject":"法令","category":"高圧ガスの定義等","tags":[],"question":"次のイ、ロ、ハの記述のうち、正しいものはどれか。\nイ．高圧ガス保安法は、高圧ガスによる災害を防止して公共の安全を確保する目的のため、民間事業者及び高圧ガス保安協会による高圧ガスの保安に関する自主的な活動を促進することも定めている。\nロ．常用の温度において圧力が0.9メガパスカルの圧縮ガス（圧縮アセチレンガスを除く。）であっても、温度35度において圧力が1メガパスカル以上となるものは高圧ガスである。\nハ．圧力が0.2メガパスカルとなる場合の温度が32度である液化ガスは、現在の圧力が0.1メガパスカルであっても高圧ガスである。","options":["(1) イ","(2) ハ","(3) イ、ロ","(4) イ、ハ","(5) イ、ロ、ハ"],"answer":5,"explanation":"・高圧ガス保安法は、高圧ガスによる災害を防止して公共の安全を確保する目的のため、民間事業者及び高圧ガス保安協会による高圧ガスの保安に関する自主的な活動を促進することも定めている。\n・常用の温度において圧力が0.9メガパスカルの圧縮ガス（圧縮アセチレンガスを除く。）であっても、温度35度において圧力が1メガパスカル以上となるものは高圧ガスである\n・圧力が0.2メガパスカルとなる場合の温度が32度である液化ガスは、現在の圧力が0.1メガパスカルであっても高圧ガスである。","has_image":false,"image_path":null},{"id":"R03-Horitsu-Q02","year":"R03","subject":"法令","category":"適用除外・事業(製造・販売・廃棄等)","tags":[],"question":"次のイ、ロ、ハの記述のうち、正しいものはどれか。\nイ．冷凍のための設備を使用して高圧ガスの製造をしようとする者が、都道府県知事等の許可を受けなければならない場合の1日の冷凍能力の最小の値は、冷媒ガスである高圧ガスの種類に関係なく同じである。\nロ．1日の冷凍能力が5トン未満の冷凍設備内におけるフルオロカーボン（不活性のものに限る。）は、高圧ガス保安法の適用を受けない。\nハ．専ら冷凍設備に用いる機器の製造の事業を行う者（機器製造業者）が所定の技術上の基準に従って製造しなければならない機器は、冷媒ガスの種類にかかわらず、1日の冷凍能力が20トン以上の冷凍機に用いられるものに限られている。","options":["(1) イ","(2) ロ","(3) イ、ロ","(4) イ、ハ","(5) ロ、ハ"],"answer":2,"explanation":"・冷凍のための設備を使用して高圧ガスの製造をしようとする者が、都道府県知事等の許可を受けなければならない場合の1日の冷凍能力の最小の値は、冷媒ガスである高圧ガスの種類によって異なる。\n・1日の冷凍能力が5トン未満の冷凍設備内におけるフルオロカーボン（不活性のものに限る。）は、高圧ガス保安法の適用を受けない。\n・専ら冷凍設備に用いる機器の製造の事業を行う者（機器製造業者）が所定\nの技術上の基準に従って製造しなければならない機器は、1日の冷凍能力が3トン以上（ヘリウム、ネオン、アルゴン、クリプトン、キセノン、ラドン、窒素、二酸化炭素、フルオロカーボン（可燃性ガスを除く。）又は空気にあっては、5トン以上。）の冷凍機と定められている。","has_image":false,"image_path":null},{"id":"R03-Horitsu-Q03","year":"R03","subject":"法令","category":"適用除外・事業(製造・販売・廃棄等)","tags":[],"question":"次のイ、ロ、ハの記述のうち、正しいものはどれか。\nイ．第一種製造者は、製造設備の冷媒ガスの種類を変更しようとするときは、その製造設備の変更の工事を伴わない場合であっても、都道府県知事等の許可を受けなければならない。\nロ．第一種製造者は、高圧ガスの製造を開始したときは、遅滞なく、その旨を都道府県知事等に届け出なければならないが、高圧ガスの製造を廃止したときは、その旨を届け出る必要はない。\nハ．冷媒ガスの補充用の高圧ガスの販売の事業を営もうとする者は、特に定められた場合を除き、販売所ごとに、事業の開始後遅滞なく、その旨を都道府県知事等に届け出なければならない。","options":["(1) イ","(2) ロ","(3) ハ","(4) イ、ロ","(5) イ、ハ"],"answer":1,"explanation":"・第一種製造者は、製造設備の冷媒ガスの種類を変更しようとするときは、その製造設備の変更の工事を伴わない場合であっても、都道府県知事等の許可を受けなければならない。\n・第一種製造者は、高圧ガスの製造を開始し、又は廃止したときは、遅滞なく、その旨を都道府県知事に届け出なければならない。\n・冷媒ガスの補充用の高圧ガスの販売の事業を営もうとする者は、特に定められた場合を除き、販売所ごとに、事業開始の日の20日前までに、その旨を都道府県知事等に届け出なければならない。","has_image":false,"image_path":null},{"id":"R03-Horitsu-Q04","year":"R03","subject":"法令","category":"高圧ガスの貯蔵","tags":[],"question":"次のイ、ロ、ハの記述のうち、冷凍に係る製造事業所における冷媒ガスの補充用としての容器による高圧ガス（質量が1.5キログラムを超えるもの）の貯蔵の方法に係る技術上の基準について一般高圧ガス保安規則上正しいものはどれか。\nイ．一般高圧ガス保安規則に定められている高圧ガスの貯蔵の方法に係る技術上の基準に従うべき高圧ガスは、可燃性ガス及び毒性ガスの種類に限られている。\nロ．液化アンモニアの充填容器及び残ガス容器の貯蔵は、通風の良い場所で行わなければならない。\nハ．内容積が5リットルを超える充填容器及び残ガス容器には、転落、転倒等による衝撃及びバルブの損傷を防止する措置を講じ、かつ、粗暴な取扱いをしてはならない。","options":["(1) イ","(2) ハ","(3) イ、ロ","(4) ロ、ハ","(5) イ、ロ、ハ"],"answer":4,"explanation":"・一般高圧ガス保安規則に定められている高圧ガスの貯蔵の方法に係る技術上の基準に従うべき高圧ガスは、可燃性ガス及び毒性ガスに限られていない。\n・液化アンモニアの充填容器及び残ガス容器の貯蔵は、通風の良い場所で行わなければならない。\n・内容積が5リットルを超える充填容器及び残ガス容器には、転落、転倒等による衝撃及びバルブの損傷を防止する措置を講じ、かつ、粗暴な取扱いをしてはならない。","has_image":false,"image_path":null},{"id":"R03-Horitsu-Q05","year":"R03","subject":"法令","category":"高圧ガスの移動","tags":[],"question":"次のイ、ロ、ハの記述のうち、車両に積載した容器（内容積が48リットルのもの）による冷凍設備の冷媒ガスの補充用の高圧ガスの移動に係る技術上の基準等について一般高圧ガス保安規則上正しいものはどれか。\nイ．不活性ガスである液化フルオロカーボンを移動するときは、移動に係る技術上の基準等の適用を受けない。\nロ．液化アンモニアを移動するときは、そのガスの名称、性状及び移動中の災害防止のために必要な注意事項を記載した書面を運転者に交付し、移動中携帯させ、これを遵守させなければならない。\nハ．液化アンモニアを移動するときは、充填容器及び残ガス容器には、転落、転倒等による衝撃及びバルブの損傷を防止する措置を講じ、かつ、粗暴な取扱いをしてはならない。","options":["(1) ロ","(2) ハ","(3) イ、ハ","(4) ロ、ハ","(5) イ、ロ、ハ"],"answer":4,"explanation":"・充填容器等（内容積が5リットル以下のものを除く。）には、転落、転倒等による衝撃及びバルブの損傷を防止する措置を講じ、かつ、粗暴な取扱いをしないことと定められている。よって、不活性ガスである液化フルオロカーボンを移動するときは、移動に係る技術上の基準等の適用を受ける。\n・可燃性ガス、毒性ガス、特定不活性ガス又は酸素の高圧ガスを移動するときは、当該高圧ガスの名称、性状及び移動中の災害防止のために必要な注意事項を記載した書面を運転者に交付し、移動中携帯させ、これを遵守させなければならない。\n・充填容器等（内容積が5リットル以下のものを除く。）には、転落、転倒等による衝撃及びバルブの損傷を防止する措置を講じ、かつ、粗暴な取扱いをしてはならない。","has_image":false,"image_path":null},{"id":"R03-Horitsu-Q06","year":"R03","subject":"法令","category":"高圧ガスの充填容器","tags":[],"question":"次のイ、ロ、ハの記述のうち、冷凍設備の冷媒ガスの補充用の高圧ガスを充填するための容器（再充填禁止容器を除く。）について正しいものはどれか。\nイ．容器検査に合格した容器に刻印等すべき事項の一つに、充填すべき高圧ガスの種類がある。\nロ．容器の外面の塗色は高圧ガスの種類に応じて定められており、液化アンモニアの容器の場合は、ねずみ色である。\nハ．液化アンモニアを充填する容器にすべき表示の一つに、その容器の外面にそのガスの性質を示す文字の明示があるが、その文字として「毒」のみの明示が定められている。","options":["(1) イ","(2) ロ","(3) ハ","(4) イ、ロ","(5) イ、ハ"],"answer":1,"explanation":"・容器検査に合格した容器に刻印等すべき事項の一つに、充填すべき高圧ガスの種類がある。\n・容器の外面の塗色は高圧ガスの種類に応じて定められており、液化アンモニアの容器の場合は、白色である。\n・圧ガスを充てんする容器の外面には、そのガスの性質を示す文字（可燃性ガスにあっては「燃」、毒性ガスにあっては「毒」）を明示しなければならない。液化アンモニアの場合、「燃」と「毒」の文字を明示する必要がある。","has_image":false,"image_path":null},{"id":"R03-Horitsu-Q07","year":"R03","subject":"法令","category":"冷凍能力の算定基準","tags":[],"question":"次のイ、ロ、ハの記述のうち、冷凍能力の算定基準について冷凍保安規則上正しいものはどれか。\nイ．吸収式冷凍設備の1日の冷凍能力は、発生器を加熱する1時間の入熱量をもって算定する。\nロ．圧縮機の原動機の定格出力の数値は、冷媒設備の往復動式圧縮機を使用する製造設備の1日の冷凍能力の算定に必要な数値の一つである。\nハ．蒸発器の冷媒ガスに接する側の表面積の数値は、回転ピストン型圧縮機を使用する製造設備の1日の冷凍能力の算定に必要な数値の一つである。","options":["(1) イ","(2) ロ","(3) イ、ロ","(4) イ、ハ","(5) ロ、ハ"],"answer":1,"explanation":"・吸収式冷凍設備にあっては、発生器を加熱する1時間の入熱量27,800kJをもって1日の冷凍能力1トンとする。\n・圧縮機の原動機の定格出力の数値は、冷媒設備の遠心式圧縮機を使用する製造設備の1日の冷凍能力の算定に必要な数値の一つである。\n・蒸発器の冷媒ガスに接する側の表面積の数値は、自然環流式冷凍設備及び自然循環式冷凍設備を使用する製造設備の1日の冷凍能力の算定に必要な数値の一つである。","has_image":false,"image_path":null},{"id":"R03-Horitsu-Q08","year":"R03","subject":"法令","category":"第二種製造者(全般)","tags":[],"question":"次のイ、ロ、ハの記述のうち、冷凍のため高圧ガスの製造をする第二種製造者について正しいものはどれか。\nイ．第二種製造者は、事業所ごとに、高圧ガスの製造開始の日の20日前までに、その旨を都道府県知事等に届け出なければならない。\nロ．第二種製造者は、製造設備の変更の工事を完成したとき、許容圧力以上の圧力で行う所定の気密試験を行った後に高圧ガスの製造をすることができる。\nハ．全ての第二種製造者は、冷凍保安責任者を選任しなくてよい。","options":["(1) イ","(2) ロ","(3) イ、ロ","(4) ロ、ハ","(5) イ、ロ、ハ"],"answer":3,"explanation":"・第二種製造者は、事業所ごとに、高圧ガスの製造開始の日の20日前までに、その旨を都道府県知事等に届け出なければならない。\n・第二種製造者は、製造設備の変更の工事を完成したとき、許容圧力以上の圧力で行う所定の気密試験を行った後に高圧ガスの製造をすることができる。\n・第二種製造者のうちには、冷凍保安責任者を選任しなければならないものがある。","has_image":false,"image_path":null},{"id":"R03-Horitsu-Q09","year":"R03","subject":"法令","category":"冷凍保安責任者・代理者","tags":[],"question":"次のイ、ロ、ハの記述のうち、第一種製造者が冷凍保安責任者を選任しなければならない事業所における冷凍保安責任者及びその代理者について正しいものはどれか。\nイ．1日の冷凍能力が90トンの製造施設を有する事業所には、第三種冷凍機械責任者免状の交付を受けている者であって、かつ、所定の経験を有する者のうちから冷凍保安責任者を選任することができる。\nロ．定期自主検査において、冷凍保安責任者が旅行、疾病その他の事故によってその検査の実施について監督を行うことができない場合、あらかじめ選任したその代理者にその職務を行わせなければならない。\nハ．選任している冷凍保安責任者及びその代理者を解任し、新たな者を選任したときは、遅滞なく、その冷凍保安責任者の解任及び選任について都道府県知事等に届け出なければならないが、冷凍保安責任者の代理者の解任及び選任については届け出なくてよい。","options":["(1) イ","(2) ロ","(3) イ、ロ","(4) ロ、ハ","(5) イ、ロ、ハ"],"answer":3,"explanation":"・1日の冷凍能力が90トンの製造施設を有する事業所には、第三種冷凍機械責任者免状の交付を受けている者であって、かつ、所定の経験を有する者のうちから冷凍保安責任者を選任することができる。\n・定期自主検査において、冷凍保安責任者が旅行、疾病その他の事故によってその検査の実施について監督を行うことができない場合、あらかじめ選任したその代理者にその職務を行わせなければならない。\n・選任している冷凍保安責任者を解任し、新たな者を選任したときは、遅滞なく、その冷凍保安責任者の解任及び選任について都道府県知事に届け出なければならず、冷凍保安責任者の代理者の解任及び選任についても同様に届け出なければならない。","has_image":false,"image_path":null},{"id":"R03-Horitsu-Q10","year":"R03","subject":"法令","category":"保安検査","tags":[],"question":"次のイ、ロ、ハの記述のうち、冷凍のため高圧ガスの製造をする第一種製造者（認定保安検査実施者である者を除く。）が受ける保安検査について正しいものはどれか。\nイ．保安検査の実施を監督することは、冷凍保安責任者の職務の一つとして定められている。\nロ．製造施設のうち認定指定設備である部分は、保安検査を受けなくてよい。\nハ．特定施設について、定期に、都道府県知事等、高圧ガス保安協会又は指定保安検査機関が行う保安検査を受けなければならない。","options":["(1) ハ","(2) イ、ロ","(3) イ、ハ","(4) ロ、ハ","(5) イ、ロ、ハ"],"answer":4,"explanation":"・保安検査は、都道府県知事又は高圧ガス保安協会若しくは指定保安検査機関が行うもので、冷凍保安責任者の職務ではない。\n・製造施設のうち認定指定設備である部分は、保安検査を受けなくてよい。\n・特定施設について、定期に、都道府県知事等、高圧ガス保安協会又は指定保安検査機関が行う保安検査を受けなければならない。","has_image":false,"image_path":null},{"id":"R03-Horitsu-Q11","year":"R03","subject":"法令","category":"定期自主検査","tags":[],"question":"次のイ、ロ、ハの記述のうち、冷凍のため高圧ガスの製造をする第一種製造者が行う定期自主検査について正しいものはどれか。\nイ．定期自主検査を行ったときは、所定の検査記録を作成し、遅滞なく、これを都道府県知事等に届け出なければならない。\nロ．定期自主検査は、3年以内に少なくとも1回以上行うことと定められている。\nハ．定期自主検査は、製造施設の位置、構造及び設備が所定の技術上の基準に適合しているかどうかについて行わなければならないが、その技術上の基準のうち耐圧試験に係るものは除かれている。","options":["(1) イ","(2) ハ","(3) イ、ロ","(4) イ、ハ","(5) ロ、ハ"],"answer":2,"explanation":"・定期自主検査を行ったときは、所定の検査記録を作成しなければならないが、これを都道府県知事に届け出なければならないという定めはない。\n・定期自主検査は、1年に1回以上行うことと定められている。\n・定期自主検査は、製造施設の位置、構造及び設備が所定の技術上の基準に適合しているかどうかについて行わなければならないが、その技術上の基準のうち耐圧試験に係るものは除かれている。","has_image":false,"image_path":null},{"id":"R03-Horitsu-Q12","year":"R03","subject":"法令","category":"危害予防規程・保安教育計画","tags":[],"question":"次のイ、ロ、ハの記述のうち、冷凍のため高圧ガスの製造をする第一種製造者が定めるべき危害予防規程及び保安教育計画について正しいものはどれか。\nイ．危害予防規程に記載しなければならない事項の一つに、製造施設の保安に係る巡視及び点検に関することがある。\nロ．保安教育計画は、その計画及びその実行の結果を都道府県知事等に届け出なければならない。\nハ．危害予防規程は、公共の安全の維持又は災害の発生の防止のため必要があると認められるときは、都道府県知事等からその規程の変更を命じられることがある。","options":["(1) イ","(2) ロ","(3) イ、ハ","(4) ロ、ハ","(5) イ、ロ、ハ"],"answer":3,"explanation":"・危害予防規程に記載しなければならない事項の一つに、製造施設の保安に係る巡視及び点検に関することがある。\n・第一種製造者は、その従業者に対する保安教育計画を定めなければならないが、その計画及びその実行の結果を都道府県知事等に届け出なければならないという定めはない。\n・危害予防規程は、公共の安全の維持又は災害の発生の防止のため必要があると認められるときは、都道府県知事等からその規程の変更を命じられることがある。","has_image":false,"image_path":null},{"id":"R03-Horitsu-Q13","year":"R03","subject":"法令","category":"危険時の措置等","tags":[],"question":"次のイ、ロ、ハの記述のうち、冷凍のため高圧ガスの製造をする第一種製造者について正しいものはどれか。\nイ．その所有し、又は占有する高圧ガス又は容器を喪失し、又は盗まれたときは、遅滞なく、その旨を都道府県知事等又は警察官に届け出なければならない。\nロ．事業所ごとに帳簿を備え、製造施設に異常があった場合、異常があった年月日及びそれに対してとった措置をその帳簿に記載しなければならない。また、その帳簿は製造開始の日から10年間保存しなければならない。\nハ．高圧ガスの製造のための施設が危険な状態となっている事態を発見したときは、直ちに、応急の措置を講じれば、その旨を都道府県知事等又は警察官、消防吏員若しくは消防団員若しくは海上保安官に届け出る必要はない。","options":["(1) イ","(2) ロ","(3) イ、ロ","(4) イ、ハ","(5) ロ、ハ"],"answer":1,"explanation":"・その所有し、又は占有する高圧ガス又は容器を喪失し、又は盗まれたときは、遅滞なく、その旨を都道府県知事等又は警察官に届け出なければならない。\n・事業所ごとに帳簿を備え、製造施設に異常があった場合、異常があった年月日及びそれに対してとった措置をその帳簿に記載しなければならないが、その帳簿は記載の日から10年間保存しなければならない。\n・高圧ガスの製造のための施設が危険な状態となっている事態を発見したときは、直ちに、その旨を都道府県知事又は警察官、消防吏員若しくは消防団員若しくは海上保安管に届け出なければならない。","has_image":false,"image_path":null},{"id":"R03-Horitsu-Q14","year":"R03","subject":"法令","category":"製造施設の変更・完成検査","tags":[],"question":"次のイ、ロ、ハの記述のうち、冷凍のため高圧ガスの製造をする第一種製造者（認定完成検査実施者である者を除く。）が行う製造施設の変更の工事について正しいものはどれか。\nイ．特定不活性ガスであるフルオロカーボン32を冷媒ガスとする冷媒設備の圧縮機の取替えの工事は、冷媒設備に係る切断、溶接を伴わない工事であって、その設備の冷凍能力の変更を伴わないものであっても、定められた軽微な変更の工事には該当しない。\nロ．製造施設の特定変更工事が完成した後、高圧ガス保安協会が行う完成検査を受け、これが所定の技術上の基準に適合していると認められ、その旨を都道府県知事等に届け出た場合は、都道府県知事等が行う完成検査を受けなくてよい。\nハ．冷媒設備に係る切断、溶接を伴う凝縮器の取替えの工事を行うときは、あらかじめ、都道府県知事等の許可を受け、その完成後は、所定の完成検査を受け、これが技術上の基準に適合していると認められた後でなければその施設を使用してはならない。","options":["(1) ハ","(2) イ、ロ","(3) イ、ハ","(4) ロ、ハ","(5) イ、ロ、ハ"],"answer":4,"explanation":"・可燃性ガス及び毒性ガスを冷媒ガスとしていないので、定められた軽微な変更の工事に該当する。\n・製造施設の特定変更工事が完成した後、高圧ガス保安協会が行う完成検査を受け、これが所定の技術上の基準に適合していると認められ、その旨を都道府県知事等に届け出た場合は、都道府県知事等が行う完成検査を受けなくてよい。\n・冷媒設備に係る切断、溶接を伴う凝縮器の取替えの工事を行うときは、あらかじめ、都道府県知事等の許可を受け、その完成後は、所定の完成検査を受け、これが技術上の基準に適合していると認められた後でなければその施設を使用してはならない。","has_image":false,"image_path":null},{"id":"R03-Horitsu-Q15","year":"R03","subject":"法令","category":"定置式製造設備(アンモニア)","tags":[],"question":"次のイ、ロ、ハの記述のうち、製造設備がアンモニアを冷媒ガスとする定置式製造設備（吸収式アンモニア冷凍機であるものを除く。）である第一種製造者の製造施設に係る技術上の基準について冷凍保安規則上正しいものはどれか。\nイ．製造施設の冷媒設備に設けた安全弁の放出管の開口部の位置は、冷媒ガスであるアンモニアの性質に応じた適切な位置でなければならない。\nロ．製造施設には、その施設の規模に応じて、適切な消火設備を適切な箇所に設けなければならない。\nハ．製造設備が専用機械室に設置されている場合は、冷媒ガスであるアンモニアが漏えいしたときに安全に、かつ、速やかに除害するための措置を講じなくてよい。","options":["(1) イ","(2) ハ","(3) イ、ロ","(4) ロ、ハ","(5) イ、ロ、ハ"],"answer":3,"explanation":"・製造施設の冷媒設備に設けた安全弁の放出管の開口部の位置は、冷媒ガスであるアンモニアの性質に応じた適切な位置でなければならない。\n・製造施設には、その施設の規模に応じて、適切な消火設備を適切な箇所に設けなければならない。\n・吸収式アンモニア冷凍機を除く毒性ガスの製造設備には、当該ガスが漏えいしたときに安全に、かつ、速やかに除害するための措置を講じなければならない。製造設備が専用機械室に設置されている場合でも同様である。","has_image":false,"image_path":null},{"id":"R03-Horitsu-Q16","year":"R03","subject":"法令","category":"定置式製造設備(アンモニア)","tags":[],"question":"次のイ、ロ、ハの記述のうち、製造設備がアンモニアを冷媒ガスとする定置式製造設備（吸収式アンモニア冷凍機であるものを除く。）である第一種製造者の製造施設に係る技術上の基準について冷凍保安規則上正しいものはどれか。\nイ．冷媒設備の受液器には、その周囲に、冷媒ガスである液状のアンモニアが漏えいした場合にその流出を防止するための措置を講じなければならないものがあるが、その受液器の内容積が1万リットルであるものは、それに該当する。\nロ．冷媒設備の圧縮機を設置する室は、冷媒設備から冷媒ガスであるアンモニアが漏えいしたときに、滞留しないような構造としなければならない。\nハ．冷媒設備の受液器にガラス管液面計を設ける場合には、丸形ガラス管液面計以外のものとし、その液面計の破損を防止するための措置のほか、受液器とその液面計とを接続する配管にその液面計の破損による漏えいを防止するための措置を講じなければならない。","options":["(1) イ","(2) ハ","(3) イ、ロ","(4) ロ、ハ","(5) イ、ロ、ハ"],"answer":5,"explanation":"・冷媒設備の受液器には、その周囲に、冷媒ガスである液状のアンモニアが漏えいした場合にその流出を防止するための措置を講じなければならないものがあるが、その受液器の内容積が1万リットルであるものは、それに該当する。\n・冷媒設備の圧縮機を設置する室は、冷媒設備から冷媒ガスであるアンモニアが漏えいしたときに、滞留しないような構造としなければならない。\n・冷媒設備の受液器にガラス管液面計を設ける場合には、丸形ガラス管液面計以外のものとし、その液面計の破損を防止するための措置のほか、受液器とその液面計とを接続する配管にその液面計の破損による漏えいを防止するための措置を講じなければならない。","has_image":false,"image_path":null},{"id":"R03-Horitsu-Q17","year":"R03","subject":"法令","category":"定置式製造設備(全般)","tags":[],"question":"次のイ、ロ、ハの記述のうち、冷凍保安規則に定める第一種製造者の定置式製造設備である製造施設に係る技術上の基準に適合しているものはどれか。\nイ．冷媒設備の配管の完成検査における気密試験を、許容圧力の1.1倍の圧力で行った。\nロ．製造設備に設けたバルブ又はコックが操作ボタン等により開閉されるものであっても、作業員がその操作ボタン等を適切に操作することができるような措置を講じなかった。\nハ．配管以外の冷媒設備の完成検査において行う耐圧試験を、水その他の安全な液体を使用することが困難であると認められたので、窒素ガスを使用して許容圧力の1.25倍の圧力で行うこととした。","options":["(1) イ","(2) ロ","(3) イ、ハ","(4) ロ、ハ","(5) イ、ロ、ハ"],"answer":3,"explanation":"・気密試験は、許容圧力以上の圧力で行わなければならない。\n・製造設備に設けたバルブ又はコックを操作ボタン等により開閉する場合にあっては、作業員がその操作ボタン等を適切に操作することができるような措置を講じなければならない。\n・配管以外の冷媒設備の完成検査において行う耐圧試験を、水その他の安全な液体を使用することが困難であると認められた場合は、空気、窒素等の気体を使用して許容圧力の1.25倍の圧力で行うことができる。","has_image":false,"image_path":null},{"id":"R03-Horitsu-Q18","year":"R03","subject":"法令","category":"定置式製造設備(全般)","tags":[],"question":"次のイ、ロ、ハの記述のうち、製造設備が定置式製造設備である第一種製造者の製造施設に係る技術上の基準について冷凍保安規則上正しいものはどれか。\nイ．冷媒設備には、その冷媒ガスの圧力が許容圧力の1.5倍を超えた場合に直ちにその圧力を許容圧力以下に戻すことができる安全装置を設けなければならない｡\nロ．冷媒設備の圧縮機が強制潤滑方式であり、かつ、潤滑油圧力に対する保護装置を有している場合であっても、その圧縮機の油圧系統を除く冷媒設備には圧力計を設けなければならない。\nハ．凝縮器には、その構造、形状等により耐震に関する性能を有しなければならないものがあるが、横置円筒形の凝縮器は、その胴部の長さにかかわらず、耐震に関する性能を有すべき定めはない。","options":["(1) イ","(2) ロ","(3) イ、ハ","(4) ロ、ハ","(5) イ、ロ、ハ"],"answer":4,"explanation":"・冷媒設備には、その冷媒ガスの圧力が許容圧力を超えた場合に直ちにその圧力を許容圧力以下に戻すことができる安全装置を設けなければならない\n・冷媒設備の圧縮機が強制潤滑方式であり、かつ、潤滑油圧力に対する保護装置を有している場合であっても、その圧縮機の油圧系統を除く冷媒設備には圧力計を設けなければならない。\n・凝縮器には、その構造、形状等により耐震に関する性能を有しなければならないものがあるが、横置円筒形の凝縮器は、その胴部の長さにかかわらず、耐震に関する性能を有すべき定めはない。","has_image":false,"image_path":null},{"id":"R03-Horitsu-Q19","year":"R03","subject":"法令","category":"製造の方法","tags":[],"question":"次のイ、ロ、ハの記述のうち、第一種製造者の製造の方法に係る技術上の基準について冷凍保安規則上正しいものはどれか。\nイ．冷媒設備の安全弁に付帯して設けた止め弁は、その安全弁の修理又は清掃のため特に必要な場合を除き、常に全開しておかなければならない。\nロ．冷媒設備の修理又は清掃を行うときは、あらかじめ、その作業計画及びその作業の責任者を定め、修理又は清掃はその作業計画に従うとともに、その作業の責任者の監視の下で行うか、又は異常があったときに直ちにその旨をその責任者に通報するための措置を講じて行わなければならない。\nハ．高圧ガスの製造は、製造する高圧ガスの種類及び製造設備の態様に応じ、1日に1回以上その製造設備の属する製造施設の異常の有無を点検し、異常のあるときは、その設備の補修その他の危険を防止する措置を講じて行わなければならない。","options":["(1) イ","(2) ロ","(3) イ、ハ","(4) ロ、ハ","(5) イ、ロ、ハ"],"answer":5,"explanation":"・冷媒設備の安全弁に付帯して設けた止め弁は、その安全弁の修理又は清掃のため特に必要な場合を除き、常に全開しておかなければならない。\n・冷媒設備の修理又は清掃を行うときは、あらかじめ、その作業計画及びその作業の責任者を定め、修理又は清掃はその作業計画に従うとともに、その作業の責任者の監視の下で行うか、又は異常があったときに直ちにその旨をその責任者に通報するための措置を講じて行わなければならない。\n・高圧ガスの製造は、製造する高圧ガスの種類及び製造設備の態様に応じ、1日に1回以上その製造設備の属する製造施設の異常の有無を点検し、異常のあるときは、その設備の補修その他の危険を防止する措置を講じて行わなければならない。","has_image":false,"image_path":null},{"id":"R03-Horitsu-Q20","year":"R03","subject":"法令","category":"認定指定設備","tags":[],"question":"次のイ、ロ、ハの記述のうち、指定設備の認定に係る技術上の基準について冷凍保安規則上正しいものはどれか。\nイ．製造設備の日常の運転操作に必要となる冷媒ガスの止め弁には、手動式のものを使用しなければならない。\nロ．製造設備の冷媒設備は、この設備の製造業者の事業所で行う所定の気密試験及び配管以外の部分について所定の耐圧試験に合格するものでなければならない。\nハ．製造設備の冷媒設備は、この設備の製造業者の事業所において、脚上又は一つの架台上に組み立てられていなければならない。","options":["(1) イ","(2) ハ","(3) イ、ロ","(4) ロ、ハ","(5) イ、ロ、ハ"],"answer":4,"explanation":"・造設備の日常の運転操作に必要となる冷媒ガスの止め弁には、手動式のものを使用してはならない。\n・製造設備の冷媒設備は、この設備の製造業者の事業所で行う所定の気密試験及び配管以外の部分について所定の耐圧試験に合格するものでなければならない。\n・製造設備の冷媒設備は、この設備の製造業者の事業所において、脚上又は一つの架台上に組み立てられていなければならない。","has_image":false,"image_path":null},{"id":"R04-Horitsu-Q01","year":"R04","subject":"法令","category":"高圧ガスの定義等","tags":[],"question":"次のイ、ロ、ハの記述のうち、正しいものはどれか。\nイ．高圧ガス保安法は、高圧ガスによる災害を防止して公共の安全を確保する目的のために、高圧ガスの製造、貯蔵、販売、移動その他の取扱及び消費並びに容器の製造及び取扱について規制するとともに、民間事業者及び高圧ガス保安協会による高圧ガスの保安に関する自主的な活動を促進することを定めている。\nロ．温度35 度において圧力が1メガパスカルとなる圧縮ガス（圧縮アセチレンガスを除く。）であって、現にその圧力が0.9メガパスカルのものは高圧ガスではない。\nハ．温度35 度以下で圧力が0.2メガパスカルとなる液化ガスは、高圧ガスである。","options":["(1) イ","(2) ロ","(3) イ、ロ","(4) イ、ハ","(5) ロ、ハ"],"answer":4,"explanation":"・高圧ガス保安法は、高圧ガスによる災害を防止して公共の安全を確保する目的のために、高圧ガスの製造、貯蔵、販売、移動その他の取扱及び消費並びに容器の製造及び取扱について規制するとともに、民間事業者及び高圧ガス保安協会による高圧ガスの保安に関する自主的な活動を促進することを定めている。\n・現にその圧力が0.9メガパスカルであっても、温度35度において圧力が1メガパスカルとなる圧縮ガスは高圧ガスである（圧縮アセチレンガスを除く）。\n・温度35度以下で圧力が0.2メガパスカルとなる液化ガスは、高圧ガスである。","has_image":false,"image_path":null},{"id":"R04-Horitsu-Q02","year":"R04","subject":"法令","category":"適用除外・事業(製造・販売・廃棄等)","tags":[],"question":"次のイ、ロ、ハの記述のうち、正しいものはどれか。\nイ．アンモニアを冷媒ガスとする1日の冷凍能力が100トンである製造設備のみを使用して高圧ガスの製造を行う者は、事業所ごとに、都道府県知事等の許可を受けなければならない者に該当する。\nロ．冷凍のため高圧ガスの製造をする第一種製造者の合併によりその地位を承継した者は、遅滞なく、その事実を証する書面を添えて、その旨を都道府県知事等に届け出なければならない。\nハ．冷凍のための製造施設の冷媒設備内の高圧ガスであるアンモニアは、冷凍保安規則で定める高圧ガスの廃棄に係る技術上の基準に従って廃棄しなければならないものに該当する。","options":["(1) イ","(2) イ、ロ","(3) イ、ハ","(4) ロ、ハ","(5) イ、ロ、ハ"],"answer":5,"explanation":"・アンモニアを冷媒ガスとする1日の冷凍能力が50トン以上である製造設備のみを使用して高圧ガスの製造を行う者は、事業所ごとに、都道府県知事等の許可を受けなければならない者に該当する。\n・冷凍のため高圧ガスの製造をする第一種製造者の合併によりその地位を承継した者は、遅滞なく、その事実を証する書面を添えて、その旨を都道府県知事等に届け出なければならない。\n・アンモニアは、可燃性ガス及び毒性ガスに分類されており、冷凍保安規則で定める高圧ガスの廃棄に係る技術上の基準に従って廃棄しなければならないものに該当する。","has_image":false,"image_path":null},{"id":"R04-Horitsu-Q03","year":"R04","subject":"法令","category":"適用除外・事業(製造・販売・廃棄等)","tags":[],"question":"次のイ、ロ、ハの記述のうち、正しいものはどれか。\nイ．容器に充填された冷媒ガス用の高圧ガスの販売の事業を営もうとする者（特に定められたものを除く。）は、販売所ごとに、事業開始の日の20日前までに、その旨を都道府県知事等に届け出なければならない。\nロ．冷凍のため高圧ガスの製造をする第一種製造者は、冷媒設備である圧縮機の取替えの工事であって、その工事を行うことにより冷凍能力が増加するときは、その冷凍能力の変更の範囲にかかわらず、都道府県知事等の許可を受けなければならない。\nハ．1日の冷凍能力が5トンの専ら冷凍設備に用いる機器の製造の事業を行う者（機器製造業者）は、所定の技術上の基準に従ってその機器の製造をしなければならない。","options":["(1) イ","(2) イ、ロ","(3) イ、ハ","(4) ロ、ハ","(5) イ、ロ、ハ"],"answer":5,"explanation":"・高圧ガスの販売の事業を営もうとする者（特に定められたものを除く。）は、販売所ごとに、事業開始の日の20日前までに、その旨を都道府県知事等に届け出なければならない。\n・第一種製造者は、製造設備の取替えの工事であって、当該設備の冷凍能力の変更を伴うときは、その冷凍能力の変更の範囲にかかわらず、都道府県知事の許可を受けなければならない。\n・1日の冷凍能力が3トン以上（ヘリウム、ネオン、アルゴン、クリプトン、キセノン、ラドン、窒素、二酸化炭素、フルオロカーボン（可燃性ガスを除く。）又は空気にあっては、5トン以上。）の専ら冷凍設備に用いる機器の製造の事業を行う者（機器製造業者）は、所定の技術上の基準に従ってその機器の製造をしなければならない。","has_image":false,"image_path":null},{"id":"R04-Horitsu-Q04","year":"R04","subject":"法令","category":"高圧ガスの貯蔵","tags":[],"question":"次のイ、ロ、ハの記述のうち、冷凍に係る製造事業所における冷媒ガスの補充用としての容器による高圧ガス（質量が20キログラムのもの）の貯蔵の方法に係る技術上の基準について一般高圧ガス保安規則上正しいものはどれか。\nイ．液化ガスを貯蔵するとき、貯蔵の方法に係る技術上の基準に従って貯蔵しなければならないのは、その質量が1.5キログラムを超えるものである。\nロ．アンモニアの充填容器及び残ガス容器を貯蔵する場合は、通風の良い場所で行わなければならないが、不活性ガスのフルオロカーボンについては、その定めはない。\nハ．アンモニアの充填容器を車両に積載して貯蔵することは、特に定められた場合を除き禁じられているが、不活性ガスのフルオロカーボンの充填容器を車両に積載して貯蔵することは、いかなる場合であっても禁じられていない。","options":["(1) イ","(2) ロ","(3) イ、ロ","(4) イ、ハ","(5) ロ、ハ"],"answer":3,"explanation":"・液化ガスを貯蔵するとき、貯蔵の方法に係る技術上の基準に従って貯蔵しなければならないのは、その質量が1.5キログラムを超えるものである。\n・アンモニアは、可燃性ガス及び毒性ガスに分類されており、充填容器及び残ガス容器を貯蔵する場合は、通風の良い場所で行わなければならないが、不活性ガスのフルオロカーボンについては、その定めはない。\n・高圧ガスの貯蔵は、特に定められた場合を除き、車両等に固定し、又は積載した容器によりしてはなならない。不活性ガスのフルオロカーボンの充填容器であっても同様である。","has_image":false,"image_path":null},{"id":"R04-Horitsu-Q05","year":"R04","subject":"法令","category":"高圧ガスの移動","tags":[],"question":"次のイ、ロ、ハの記述のうち、車両に積載した容器（内容積が48 リットルのもの）による冷凍設備の冷媒ガスの補充用の高圧ガスの移動に係る技術上の基準等について一般高圧ガス保安規則上正しいものはどれか。\nイ．高圧ガスを移動するとき、車両の見やすい箇所に警戒標を掲げなければならない高圧ガスは、可燃性ガス及び毒性ガスの種類に限られている。\nロ．アンモニアを移動するときは、転落、転倒等による衝撃及びバルブの損傷を防止する措置を講じ、かつ、粗暴な取扱いをしてはならないが、フルオロカーボン（不活性ガスであるものに限る。）を移動するときはその定めはない。\nハ．アンモニアを移動するときは、その充填容器及び残ガス容器には、木枠又はパッキンを施さなければならない。","options":["(1) イ","(2) ロ","(3) ハ","(4) イ、ハ","(5) イ、ロ、ハ"],"answer":3,"explanation":"・充填容器等を車両に積載して移動するとき（容器の内容積が25リットル以下である充填容器等（毒性ガスに係るものを除く。）のみを積載した車両であって、当該積載容器の内容積の合計が50リットル以下である場合を除く。）は、当該車両の見やすい箇所に警戒標を掲げなければならない。内容積が25リットルを超えているため、ガスの種類にかかわらず適用される。\n・内容積が5リットルを超える充填容器等には、転落、転倒等による衝撃及びバルブの損傷を防止する措置を講じ、かつ粗暴な取扱いをしてはならない。不活性のフルオロカーボンを移動するときについても同様である。\n・毒性ガスの充填容器等には、木枠又はパッキンを施さなければならない。アンモニアは毒性ガスである。","has_image":false,"image_path":null},{"id":"R04-Horitsu-Q06","year":"R04","subject":"法令","category":"高圧ガスの充填容器","tags":[],"question":"次のイ、ロ、ハの記述のうち、冷凍設備の冷媒ガスの補充用の高圧ガスを充填するための容器（再充填禁止容器を除く。）について正しいものはどれか。\nイ．高圧ガスである冷媒ガスを容器に充填するとき、その充填する液化ガスは、刻印等又は自主検査刻印等で示された容器の内容積に応じて計算した質量以下のものでなければならない。\nロ．容器検査に合格した容器には、特に定めるものを除き、充填すべき高圧ガスの種類として、高圧ガスの名称、略称又は分子式が刻印等されている。\nハ．液化アンモニアを充填する容器に表示をすべき事項の一つに、「その高圧ガスの性質を示す文字を明示すること。」がある。","options":["(1) イ","(2) イ、ロ","(3) イ、ハ","(4) ロ、ハ","(5) イ、ロ、ハ"],"answer":5,"explanation":"・高圧ガスである冷媒ガスを容器に充填するとき、その充填する液化ガスは、刻印等又は自主検査刻印等で示された容器の内容積に応じて計算した質量以下のものでなければならない。\n・容器検査に合格した容器には、特に定めるものを除き、充填すべき高圧ガスの種類として、高圧ガスの名称、略称又は分子式が刻印等されている。\n・可燃性ガス及び毒性ガスを充填する容器に表示をすべき事項の一つに、「そのガスの性質を示す文字（可燃性ガスにあっては「燃」、毒性ガスにあっては「毒」）を明示すること」がある。","has_image":false,"image_path":null},{"id":"R04-Horitsu-Q07","year":"R04","subject":"法令","category":"冷凍能力の算定基準","tags":[],"question":"次のイ、ロ、ハの記述のうち、冷凍能力の算定基準について冷凍保安規則上正しいものはどれか。\nイ．冷媒ガスの種類に応じて定められた数値又は所定の算式により得られた数値（C）は、容積圧縮式（往復動式）圧縮機を使用する製造設備の日の冷凍能力の算定に必要な数値の一つである。\nロ．蒸発器の1時間当たりの入熱量の値は、遠心式圧縮機を使用する冷凍設備1日の冷凍能力の算定に必要な数値である。\nハ．容積圧縮式（往復動式）圧縮機を使用する製造設備の1日の冷凍能力の算定に必要な数値の一つに、冷媒設備内の冷媒ガスの充填量の数値がある。","options":["(1) イ","(2) ハ","(3) イ、ロ","(4) イ、ハ","(5) ロ、ハ"],"answer":1,"explanation":"・冷凍則第5条第一号から三号に掲げる製造設備（遠心式圧縮機を使用する製造設備、吸収式冷凍設備、自然環流式冷凍設備及び自然循環式冷凍設備）以外の製造設備にあっては、次の算式によるものをもって1日の冷凍能力とする。\nR＝V÷C\n　　R 1日の冷凍能力（単位　トン）の数値\n　　V　圧縮機の標準回転速度における1時間のピストン押しのけ量（単位立方メートル）の数値\n　　C　冷媒ガスの種類に応じて定められた数値又は所定の算式により得られた数値\nよって、冷媒ガスの種類に応じて定められた数値又は所定の算式により得られた数値（C）は、容積圧縮式（往復動式）圧縮機を使用する製造設備の1日の冷凍能力の算定に必要な数値の一つである。\n・遠心式圧縮機を使用する製造設備にあっては、当該圧縮機の原動機の定格出力1.2キロワットをもって1日の冷凍能力1トンとする。\n・冷凍則第5条第一号から三号に掲げる製造設備（遠心式圧縮機を使用する製造設備、吸収式冷凍設備、自然環流式冷凍設備及び自然循環式冷凍設備）以外の製造設備にあっては、次の算式によるものをもって1日の冷凍能力とする。\nR＝V÷C\n　　R 1日の冷凍能力（単位　トン）の数値\n　　V　圧縮機の標準回転速度における1時間のピストン押しのけ量（単位立方メートル）の数値\n　　C　冷媒ガスの種類に応じて定められた数値又は所定の算式により得られた数値\nよって、冷媒設備内の冷媒ガスの充填量の数値は冷凍能力の算定に必要な数値ではない。","has_image":false,"image_path":null},{"id":"R04-Horitsu-Q08","year":"R04","subject":"法令","category":"第二種製造者(全般)","tags":[],"question":"次のイ、ロ、ハの記述のうち、冷凍のため高圧ガスの製造をする第二種製造者について正しいものはどれか。\nイ．第二種製造者のうちには、冷凍保安責任者を選任しなければならない者がある。\nロ．第二種製造者のうちには、製造施設について定期自主検査を行わなければならない者がある。\nハ．第二種製造者が製造をする高圧ガスの種類又は製造の方法を変更しようとするとき、その旨を都道府県知事等に届け出るべき定めはない。","options":["(1) イ","(2) イ、ロ","(3) イ、ハ","(4) ロ、ハ","(5) イ、ロ、ハ"],"answer":2,"explanation":"・第二種製造者のうちには、冷凍保安責任者を選任しなければならない者がある。\n・第二種製造者のうちには、製造施設について定期自主検査を行わなければならない者がある。\n・第二種製造者は、製造のための施設の位置、構造若しくは設備の変更の工事をし、又は製造をする高圧ガスの種類若しくは製造の方法を変更しようとするときは、あらかじめ、都道府県知事に届け出なければならない。ただし、製造のための施設の位置、構造又は設備について経済産業省令で定める軽微な変更の工事をしようとするときは、この限りでない。","has_image":false,"image_path":null},{"id":"R04-Horitsu-Q09","year":"R04","subject":"法令","category":"冷凍保安責任者・代理者","tags":[],"question":"次のイ、ロ、ハの記述のうち、冷凍保安責任者を選任しなければならない事業所における冷凍保安責任者及びその代理者について正しいものはどれか。\nイ．1日の冷凍能力が80トンの製造施設に冷凍保安責任者を選任するとき、その選任される者が交付を受けている製造保安責任者免状の種類は、第三種冷凍機械責任者免状でよい。\nロ．冷凍保安責任者が旅行、疾病その他の事故によってその職務を行うことができないときは、直ちに、高圧ガスに関する知識を有する者のうちから代理者を選任しなければならない。\nハ．冷凍保安責任者及びその代理者の選任又は解任をしたとき、冷凍保安責任者については、遅滞なく、その旨を都道府県知事等に届け出なければならないが、冷凍保安責任者の代理者については、その届出は不要である。","options":["(1) イ","(2) イ、ロ","(3) イ、ハ","(4) ロ、ハ","(5) イ、ロ、ハ"],"answer":1,"explanation":"・1日の冷凍能力が100トン未満の製造施設に冷凍保安責任者を選任するとき、その選任される者が交付を受けている製造保安責任者免状の種類は、第三種冷凍機械責任者免状でよい。\n・冷凍保安責任者が旅行、疾病その他の事故によってその職務を行うことができないときは、あらかじめ選任した冷凍保安責任者の代理者にその職務を代行させなければならない。\n・冷凍保安責任者及びその代理者の選任又は解任をしたときは、遅滞なく、その旨を都道府県知事等に届け出なければならない。","has_image":false,"image_path":null},{"id":"R04-Horitsu-Q10","year":"R04","subject":"法令","category":"保安検査","tags":[],"question":"次のイ、ロ、ハの記述のうち、冷凍のため高圧ガスの製造をする第一種製造者（認定保安検査実施者である者を除く。）が受ける保安検査について正しいものはどれか。\nイ．特定施設について、高圧ガス保安協会が行う保安検査を受け、その旨を都道府県知事等に届け出た場合は、都道府県知事等が行う保安検査を受けなくてよい｡\nロ．保安検査は、特定施設が製造施設の位置、構造及び設備に係る所定の技術上の基準に適合しているかどうかについて行われる。\nハ．保安検査は、選任している冷凍保安責任者に行わせなければならない。","options":["(1) イ","(2) イ、ロ","(3) イ、ハ","(4) ロ、ハ","(5) イ、ロ、ハ"],"answer":2,"explanation":"・特定施設について、高圧ガス保安協会が行う保安検査を受け、その旨を都道府県知事等に届け出た場合は、都道府県知事等が行う保安検査を受けなくてよい｡\n・保安検査は、特定施設が製造施設の位置、構造及び設備に係る所定の技術上の基準に適合しているかどうかについて行われる。\n・保安検査は、都道府県知事又は高圧ガス保安協会若しくは指定保安検査機関が行う。","has_image":false,"image_path":null},{"id":"R04-Horitsu-Q11","year":"R04","subject":"法令","category":"定期自主検査","tags":[],"question":"次のイ、ロ、ハの記述のうち、冷凍のため高圧ガスの製造をする第一種製造者（冷凍保安責任者を選任しなければならない者に限る。）が行う定期自主検査について正しいものはどれか。\nイ．定期自主検査を行うときは、選任している冷凍保安責任者にその定期自主検査の実施について監督を行わせなければならない。\nロ．定期自主検査は、認定指定設備に係る部分についても実施しなければならない。\nハ．定期自主検査は、製造施設の位置、構造及び設備が所定の技術上の基準（耐圧試験に係るものを除く。）に適合しているかどうかについて行わなければならない。","options":["(1) イ","(2) イ、ロ","(3) イ、ハ","(4) ロ、ハ","(5) イ、ロ、ハ"],"answer":5,"explanation":"・定期自主検査を行うときは、選任している冷凍保安責任者にその定期自主検査の実施について監督を行わせなければならない。\n・定期自主検査は、認定指定設備に係る部分についても実施しなければならない。\n・定期自主検査は、製造施設の位置、構造及び設備が所定の技術上の基準（耐圧試験に係るものを除く。）に適合しているかどうかについて行わなければならない。","has_image":false,"image_path":null},{"id":"R04-Horitsu-Q12","year":"R04","subject":"法令","category":"危害予防規程・保安教育計画","tags":[],"question":"次のイ、ロ、ハの記述のうち、冷凍のため高圧ガスの製造をする第一種製造者が定めるべき危害予防規程及び保安教育計画について正しいものはどれか。\nイ．危害予防規程を定め、その従業者とともに、これを忠実に守らなければならないが、その危害予防規程を都道府県知事等に届け出るべき定めはない。\nロ．大規模な地震に係る防災及び減災対策に関することは、危害予防規程に定めるべき事項の一つである。\nハ．その従業者に対する保安教育計画を定め、これを忠実に実行しなければならないが、その保安教育計画を都道府県知事等に届け出る必要はない。","options":["(1) ロ","(2) イ、ロ","(3) イ、ハ","(4) ロ、ハ","(5) イ、ロ、ハ"],"answer":4,"explanation":"・第一種製造者は、危害予防規程を定め、都道府県知事に届け出なければならない。\n・大規模な地震に係る防災及び減災対策に関することは、危害予防規程に定めるべき事項の一つである。\n・第一種製造者は、その従業者に対する保安教育計画を定め、これを忠実に実行しなければならないが、その保安教育計画を都道府県知事等に届け出る必要はない。","has_image":false,"image_path":null},{"id":"R04-Horitsu-Q13","year":"R04","subject":"法令","category":"危険時の措置等","tags":[],"question":"次のイ、ロ、ハの記述のうち、冷凍のため高圧ガスの製造をする第一種製造者について正しいものはどれか。\nイ．高圧ガスの製造施設が危険な状態になったときは、直ちに、特に定める災害の発生の防止のための応急の措置を講じなければならない。また、この事業者に限らずこの事態を発見した者は、直ちに、その旨を都道府県知事等又は警察官、消防吏員若しくは消防団員若しくは海上保安官に届け出なければならない。\nロ．事業所ごとに、製造施設に異常があった場合、その年月日及びそれに対してとった措置を記載した帳簿を備え、記載の日から10年間保存しなければならない。\nハ．その所有し、又は占有する高圧ガスについて災害が発生したときは、遅滞なく、その旨を都道府県知事等又は警察官に届け出なければならない。","options":["(1) ハ","(2) イ、ロ","(3) イ、ハ","(4) ロ、ハ","(5) イ、ロ、ハ"],"answer":5,"explanation":"・高圧ガスの製造施設が危険な状態になったときは、直ちに、特に定める災害の発生の防止のための応急の措置を講じなければならない。また、この事業者に限らずこの事態を発見した者は、直ちに、その旨を都道府県知事等又は警察官、消防吏員若しくは消防団員若しくは海上保安官に届け出なければならない。\n・事業所ごとに、製造施設に異常があった場合、その年月日及びそれに対してとった措置を記載した帳簿を備え、記載の日から10年間保存しなければならない。\n・所有し、又は占有する高圧ガスについて災害が発生したときは、遅滞なく、その旨を都道府県知事等又は警察官に届け出なければならない。","has_image":false,"image_path":null},{"id":"R04-Horitsu-Q14","year":"R04","subject":"法令","category":"製造施設の変更・完成検査","tags":[],"question":"次のイ、ロ、ハの記述のうち、冷凍のため高圧ガスの製造をする第一種製造者（認定完成検査実施者である者を除く。）が行う製造施設の変更の工事について正しいものはどれか。\nイ．不活性ガスを冷媒ガスとする製造設備の凝縮器（耐震設計構造物であるものを除く。）の取替えの工事を行う場合、切断、溶接を伴わない工事であれば、その完成後遅滞なく、都道府県知事等にその旨を届け出ればよい。\nロ．特定変更工事が完成した後、高圧ガス保安協会が行う完成検査を受けた場合、これが技術上の基準に適合していると認められたときは、高圧ガス保安協会がその結果を都道府県知事等に報告するので、この事業者は、完成検査を受けた旨を都道府県知事等に届け出る必要はない。\nハ．冷媒設備に係る切断、溶接を伴う凝縮器の取替えの工事を行うときは、あらかじめ、都道府県知事等の許可を受け、その工事が完成し、高圧ガスの製造を再開した後遅滞なく、所定の完成検査を受けなければならない。","options":["(1) イ","(2) ロ","(3) イ、ハ","(4) ロ、ハ","(5) イ、ロ、ハ"],"answer":1,"explanation":"・不活性ガスを冷媒ガスとする製造設備の凝縮器（耐震設計構造物であるものを除く。）の取替えの工事を行う場合、切断、溶接を伴わない工事であれば、その完成後遅滞なく、都道府県知事等にその旨を届け出ればよい。\n・特定変更工事が完成した後、高圧ガス保安協会が行う完成検査を受けた場合、これが技術上の基準に適合していると認められたときは、この事業者は、完成検査を受けた旨を都道府県知事に届け出ることで、その施設を使用することができる。\n・冷媒設備に係る切断、溶接を伴う凝縮器の取替えの工事を行うときは、あらかじめ、都道府県知事等の許可を受け、その完成後は、所定の完成検査を受け、これが技術上の基準に適合していると認められた後でなければその施設を使用してはならない。","has_image":false,"image_path":null},{"id":"R04-Horitsu-Q15","year":"R04","subject":"法令","category":"定置式製造設備(アンモニア)","tags":[],"question":"次のイ、ロ、ハの記述のうち、製造設備がアンモニアを冷媒ガスとする定置式製造設備（吸収式アンモニア冷凍機であるものを除く。）である第一種製造者の製造施設に係る技術上の基準について冷凍保安規則上正しいものはどれか。\nイ．内容積が1万リットル以上の受液器の周囲には、液状の冷媒ガスが漏えいした場合にその流出を防止するための措置を講じなければならない。\nロ．製造設備が専用機械室に設置され、かつ、その室を運転中強制換気できる構造とした場合、冷媒設備に設けた安全弁の放出管の開口部の位置については、特に定められていない。\nハ．製造設備を設置する室のうち、冷媒ガスであるアンモニアが漏えいしたとき滞留しないような構造としなければならない室は、圧縮機と油分離器を設置する室に限られている。","options":["(1) イ","(2) ロ","(3) ハ","(4) イ、ロ","(5) イ、ハ"],"answer":1,"explanation":"・毒性ガスを冷媒ガスとする冷媒設備に係る受液器であって、その内容積が1万リットル以上の受液器の周囲には、液状の冷媒ガスが漏えいした場合にその流出を防止するための措置を講じなければならない。\n・冷媒設備に設けた安全弁の放出管の開口部の位置は、放出する冷媒ガスの性質に応じた適切な位置としなければならない。\n・圧縮機、油分離器、凝縮器若しくは受液器又はこれらの間の配管（可燃性ガス、毒性ガス又は特定不活性ガスの製造設備のものに限る。）を設置する室は、冷媒ガスが漏えいしたとき滞留しないような構造としなければならない。","has_image":false,"image_path":null},{"id":"R04-Horitsu-Q16","year":"R04","subject":"法令","category":"定置式製造設備(アンモニア)","tags":[],"question":"次のイ、ロ、ハの記述のうち、製造設備がアンモニアを冷媒ガスとする定置式製造設備（吸収式アンモニア冷凍機であるものを除く。）である第一種製造者の製造施設に係る技術上の基準について冷凍保安規則上正しいものはどれか。\nイ．受液器にガラス管液面計を設ける場合には、その液面計の破損を防止するための措置を講じるか、又は受液器とガラス管液面計とを接続する配管にその液面計の破損による漏えいを防止するための措置のいずれかの措置を講じることと定められている。\nロ．製造設備が専用機械室に設置されている場合は、製造施設から漏えいしたガスが滞留するおそれのある場所であっても、そのガスの漏えいを検知し、かつ、警報するための設備を設ける必要はない。\nハ．製造設備が専用機械室に設置されている場合であっても、冷媒ガスであるアンモニアが漏えいしたときに安全に、かつ、速やかに除害するための措置を講じなければならない。","options":["(1) イ","(2) ロ","(3) ハ","(4) イ、ハ","(5) ロ、ハ"],"answer":3,"explanation":"・液器にガラス管液面計を設ける場合には、その液面計の破損を防止するための措置を講じ、受液器とガラス管液面計とを接続する配管にその液面計の破損による漏えいを防止するための措置を講じることと定められている。\n・毒性ガスの製造施設には、当該施設から漏えいするガスが滞留するおそれのある場所に、当該ガスの漏えいを検知し、かつ、警報するための設備を設けなければならない。\n・製造設備が専用機械室に設置されている場合であっても、冷媒ガスであるアンモニアが漏えいしたときに安全に、かつ、速やかに除害するための措置を講じなければならない。","has_image":false,"image_path":null},{"id":"R04-Horitsu-Q17","year":"R04","subject":"法令","category":"定置式製造設備(全般)","tags":[],"question":"次のイ、ロ、ハの記述のうち、製造設備が定置式製造設備である第一種製造者の製造施設に係る技術上の基準について冷凍保安規則上正しいものはどれか。\nイ．製造設備に設けたバルブ又はコックを操作ボタン等により開閉する場合には、作業員がその操作ボタン等を適切に操作することができるような措置を講じることと定められている。\nロ．配管以外の冷媒設備について耐圧試験を行うときは、水その他の安全な液体を使用する場合、許容圧力の1.25倍の圧力で行わなければならない。\nハ．圧縮機、油分離器、凝縮器及び受液器並びにこれらの間の配管は、火気に対して安全な措置を講じた場合を除き、引火性又は発火性の物（作業に必要なものを除く。）をたい積した場所及び火気（その製造設備内のものを除く。）の付近にあってはならない。","options":["(1) ハ","(2) イ、ロ","(3) イ、ハ","(4) ロ、ハ","(5) イ、ロ、ハ"],"answer":3,"explanation":"・製造設備に設けたバルブ又はコックを操作ボタン等により開閉する場合には、作業員がその操作ボタン等を適切に操作することができるような措置を講じることと定められている\n・配管以外の冷媒設備について耐圧試験を行うときは、水その他の安全な液体を使用する場合、許容圧力の1.5倍以上の圧力で行わなければならない。\n・圧縮機、油分離器、凝縮器及び受液器並びにこれらの間の配管は、火気に対して安全な措置を講じた場合を除き、引火性又は発火性の物（作業に必要なものを除く。）をたい積した場所及び火気（その製造設備内のものを除く。）の付近にあってはならない。","has_image":false,"image_path":null},{"id":"R04-Horitsu-Q18","year":"R04","subject":"法令","category":"定置式製造設備(全般)","tags":[],"question":"次のイ、ロ、ハの記述のうち、製造設備が定置式製造設備である第一種製造者の製造施設に係る技術上の基準について冷凍保安規則上正しいものはどれか。\nイ．製造設備の冷媒設備に冷媒ガスの圧力に対する安全装置を設けた場合、その冷媒設備には、圧力計を設ける必要はない。\nロ．冷媒設備に自動制御装置を設ければ、その冷媒設備にはその設備内の冷媒ガスの圧力が許容圧力を超えた場合に直ちに許容圧力以下に戻すことができる安全装置を設ける必要はない。\nハ．凝縮器には所定の耐震に関する性能を有するものとしなければならないものがあるが、縦置円筒形であって、かつ、胴部の長さが4メートルの凝縮器は、その性能を有するものとしなくてよい。","options":["(1) イ","(2) ロ","(3) ハ","(4) イ、ハ","(5) ロ、ハ"],"answer":3,"explanation":"・冷媒設備には、圧力計を設けなければならない。\n・冷媒設備には、その設備内の冷媒ガスの圧力が許容圧力を超えた場合に直ちに許容圧力以下に戻すことができる安全装置を設けなければならない。自動制御装置を設けた場合であっても同様である。\n・凝縮器には所定の耐震に関する性能を有するものとしなければならないものがあるが、縦置円筒形であって、かつ、胴部の長さが5メートル未満の凝縮器は、その性能を有するものとしなくてよい。","has_image":false,"image_path":null},{"id":"R04-Horitsu-Q19","year":"R04","subject":"法令","category":"製造の方法","tags":[],"question":"次のイ、ロ、ハの記述のうち、冷凍保安規則に定める第一種製造者の製造の方法に係る技術上の基準に適合しているものはどれか。\nイ．高圧ガスの製造は、製造設備に自動制御装置を設けて自動連続運転を行っているので、2日に1回その製造設備の属する製造施設の異常の有無を点検して行っている。\nロ．冷媒設備を開放して修理をするとき、あらかじめ定めたその修理の作業計画に従い、かつ、あらかじめ定めたその作業の責任者の監視の下に行っている。\nハ．冷媒設備に設けた安全弁に付帯して設けた止め弁は、その冷凍設備の運転停止中は常に閉止している｡","options":["(1) イ","(2) ロ","(3) ハ","(4) イ、ロ","(5) ロ、ハ"],"answer":2,"explanation":"・高圧ガスの製造は、製造する高圧ガスの種類及び製造設備の態様に応じ、1日に1回以上その製造設備が属する製造施設の異常の有無を点検し、異常のあるときは、当該設備の補修その他の危険を防止する措置を講じて行わなければならない。自動制御装置を設けて自動連続運転を行っている設備も同様である。\n※令和7年4月18日施行：1日1回以上とする時点・回数の限定は削除\n・冷媒設備を開放して修理をするとき、あらかじめ定めたその修理の作業計画に従い、かつ、あらかじめ定めたその作業の責任者の監視の下に行っていることは、技術上の基準に適合している。\n・冷媒設備に設けた安全弁に付帯して設けた止め弁は、安全弁の修理又は清掃のため特に必要な場合を除き、常に全開にしておかなければならない。","has_image":false,"image_path":null},{"id":"R04-Horitsu-Q20","year":"R04","subject":"法令","category":"認定指定設備","tags":[],"question":"次のイ、ロ、ハの記述のうち、認定指定設備について冷凍保安規則上正しいものはどれか。\nイ．製造設備に変更の工事を施したとき、又は製造設備を移設したときは、指定設備認定証を返納しなければならない場合がある。\nロ．製造設備には、自動制御装置を設けなければならない。\nハ．製造設備の冷媒設備は、使用場所である事業所において、一つの架台上に組み立てられたものでなければならない。","options":["(1) イ","(2) ハ","(3) イ、ロ","(4) ロ、ハ","(5) イ、ロ、ハ"],"answer":3,"explanation":"・製造設備に変更の工事を施したとき、又は製造設備を移設したときは、指定設備認定証を返納しなければならない場合がある。\n・製造設備には、自動制御装置を設けなければならない\n・製造設備の冷媒設備は、その設備の製造業者の事業所において脚上又は一つの架台上に組み立てられ、使用場所に分割されずに搬入されるものでなければならない。","has_image":false,"image_path":null},{"id":"R05-Horitsu-Q01","year":"R05","subject":"法令","category":"高圧ガスの定義等","tags":[],"question":"次のイ、ロ、ハの記述のうち、正しいものはどれか。\nイ．高圧ガス保安法は、高圧ガスによる災害を防止して公共の安全を確保する目的のために、高圧ガスの製造、貯蔵、販売、移動その他の取扱及び消費の規制をすることのみを定めている。\nロ．圧力が0.2メガパスカルとなる場合の温度が30度である液化ガスであって、常用の温度において圧力が0.1メガパスカルであるものは、高圧ガスではない。\nハ．温度35度において圧力が1メガパスカル以上となる圧縮ガス（圧縮アセチレンガスを除く。）は、常用の温度における圧力が1メガパスカル未満であっても高圧ガスである。","options":["(1) イ","(2) ハ","(3) イ、ロ","(4) ロ、ハ","(5) イ、ロ、ハ"],"answer":2,"explanation":"・圧ガス保安法は、高圧ガスによる災害を防止して公共の安全を確保する目的のために、高圧ガスの製造、貯蔵、販売、移動その他の取扱及び消費並びに容器の製造及び取扱について規制するとともに、民間事業者及び高圧ガス保安協会による高圧ガスの保安に関する自主的な活動を促進することを定めている。\n・圧力が0.2メガパスカルとなる場合の温度が35度以下である液化ガスは、高圧ガスである。\n・温度35度において圧力が1メガパスカル以上となる圧縮ガス（圧縮アセチレンガスを除く。）は、常用の温度における圧力が1メガパスカル未満であっても高圧ガスである。","has_image":false,"image_path":null},{"id":"R05-Horitsu-Q02","year":"R05","subject":"法令","category":"適用除外・事業(製造・販売・廃棄等)","tags":[],"question":"次のイ、ロ、ハの記述のうち、正しいものはどれか。\nイ．冷凍のため高圧ガスの製造をする第一種製造者は、高圧ガスの製造を開始し、又は廃止したときは、遅滞なく、その旨を都道府県知事等に届け出なければならない。\nロ．冷媒ガスの補充用の高圧ガスの販売の事業を営もうとする者は、特に定められた場合を除き、販売所ごとに、事業の開始後遅滞なく、その旨を都道府県知事等に届け出なければならない。\nハ．冷凍保安規則に定められている高圧ガスの廃棄に係る技術上の基準に従うべき高圧ガスは、可燃性ガス、毒性ガス及び特定不活性ガスに限られる。","options":["(1) イ","(2) イ、ロ","(3) イ、ハ","(4) ロ、ハ","(5) イ、ロ、ハ"],"answer":3,"explanation":"・冷凍のため高圧ガスの製造をする第一種製造者は、高圧ガスの製造を開始し、又は廃止したときは、遅滞なく、その旨を都道府県知事等に届け出なければならない。\n・冷媒ガスの補充用の高圧ガスの販売の事業を営もうとする者は、特に定められた場合を除き、販売所ごとに、事業開始の日の20日前までに、その旨を都道府県知事等に届け出なければならない。\n・冷凍保安規則に定められている高圧ガスの廃棄に係る技術上の基準に従うべき高圧ガスは、可燃性ガス、毒性ガス及び特定不活性ガスに限られる。","has_image":false,"image_path":null},{"id":"R05-Horitsu-Q03","year":"R05","subject":"法令","category":"適用除外・事業(製造・販売・廃棄等)","tags":[],"question":"次のイ、ロ、ハの記述のうち、正しいものはどれか。\nイ．1日の冷凍能力が3トン未満の冷凍設備内における高圧ガスは、そのガスの種類にかかわらず、高圧ガス保安法の適用を受けない。\nロ．冷凍のため高圧ガスの製造をする第一種製造者がその高圧ガスの製造の事業の全部を譲り渡したときは、その事業の全部を譲り受けた者はその第一種製造者の地位を承継する。\nハ．機器製造業者が所定の技術上の基準に従って製造すべき機器は、冷媒ガスの種類にかかわらず、1日の冷凍能力が20トン以上の冷凍機に用いられるものに限られる。","options":["(1) イ","(2) イ、ロ","(3) イ、ハ","(4) ロ、ハ","(5) イ、ロ、ハ"],"answer":1,"explanation":"・1日の冷凍能力が3トン未満の冷凍設備内における高圧ガスは、そのガスの種類にかかわらず、高圧ガス保安法の適用を受けない。\n・第一種製造者について相続、合併又は分割があった場合において、相続人、合併後存続する法人若しくは合併により設立した法人又は分割によりその事業所を承継した法人は、第一種製造者の地位を承継する。\n※第一種製造者では、事業の全部を譲り受けた者に地位の承継がありま\nせん。\n・機器製造業者が所定の技術上の基準に従って製造しなければならない機器は、1日の冷凍能力が3トン以上（ヘリウム、ネオン、アルゴン、クリプトン、キセノン、ラドン、窒素、二酸化炭素、フルオロカーボン（可燃性ガスを除く。）又は空気にあっては、5トン以上。）の冷凍機である。","has_image":false,"image_path":null},{"id":"R05-Horitsu-Q04","year":"R05","subject":"法令","category":"高圧ガスの貯蔵","tags":[],"question":"次のイ、ロ、ハの記述のうち、冷凍に係る製造事業所における冷媒ガスの補充用としての容器による高圧ガス（質量が1.5 キログラムを超えるもの）の貯蔵の方法に係る技術上の基準等について一般高圧ガス保安規則上正しいものはどれか。\nイ．液化フルオロカーボン134 aの充填容器を貯蔵するとき、そのガスの質量が5キログラム以下の場合は、貯蔵の方法に係る技術上の基準に従って貯蔵する必要はない。\nロ．液化アンモニアを車両に積載した容器により貯蔵することは、特に定められている場合を除き、禁じられている。\nハ．液化アンモニアの貯蔵は、充填容器及び残ガス容器にそれぞれ区分して容器置場に置かなければならないが、液化フルオロカーボン 134 a の場合は、充?容器及び残ガス容器に区分する必要はない。","options":["(1) イ","(2) ロ","(3) ハ","(4) イ、ロ","(5) ロ、ハ"],"answer":2,"explanation":"・液化ガスを貯蔵するとき、その質量が1.5キログラムを超えるものについては、貯蔵の方法に係る技術上の基準に従って貯蔵しなければならない。\n・高圧ガスの貯蔵は、特に定められている場合を除き、車両等に固定し、又は積載した容器によりしてはなならない。\n・充填容器等は、充填容器及び残ガス容器にそれぞれ区分して容器置場に置かなければならない。液化フルオロカーボン134aについても同様である。","has_image":false,"image_path":null},{"id":"R05-Horitsu-Q05","year":"R05","subject":"法令","category":"高圧ガスの移動","tags":[],"question":"次のイ、ロ、ハの記述のうち、車両に積載した容器（内容積が48リットルのもの）による冷凍設備の冷媒ガスの補充用の高圧ガスの移動に係る技術上の基準等について一般高圧ガス保安規則上正しいものはどれか。\nイ．液化アンモニアを移動するときは、その車両の見やすい箇所に警戒標を掲げなければならない。\nロ．液化アンモニアを移動するときは、消火設備並びに災害発生防止のための応急の措置に必要な資材及び工具等を携行するほかに、防毒マスク、手袋その他の保護具並びに災害発生防止のための応急措置に必要な資材、薬剤及び工具等も携行しなければならない。\nハ．液化アンモニアを移動するときは、そのガスの名称、性状及び移動中の災害防止のために必要な注意事項を記載した書面を運転者に交付し、移動中携帯させ、これを遵守させなければならない。","options":["(1) イ","(2) イ、ロ","(3) イ、ハ","(4) ロ、ハ","(5) イ、ロ、ハ"],"answer":5,"explanation":"・充填容器等を車両に積載して移動するとき（容器の内容積が25リットル以下である充填容器等（毒性ガスに係るものを除く。）のみを積載した車両であって、当該積載容器の内容積の合計が50リットル以下である場合を除く。）は、当該車両の見やすい箇所に警戒標を掲げなければならない。\n・可燃性ガス、酸素又は三フッ化窒素の充てん容器等を車両に積載して移動するときは、消火設備並びに災害発生防止のための応急措置に必要な資材及び工具等を携行しなければならない。また、毒性ガスの充てん容器等を車両に積載して移動するときは、当該毒性ガスの種類に応じた防毒マスク、手袋その他の保護具並びに災害発生防止のための応急措置に必要な資材、薬剤及び工具等を携行しなければならない。\n・可燃性ガス、毒性ガス、特定不活性ガス又は酸素の高圧ガスを移動するときは、当該高圧ガスの名称、性状及び移動中の災害防止のために必要な注意事項を記載した書面を運転者に交付し、移動中携帯させ、これを遵守させなければならない","has_image":false,"image_path":null},{"id":"R05-Horitsu-Q06","year":"R05","subject":"法令","category":"高圧ガスの充填容器","tags":[],"question":"次のイ、ロ、ハの記述のうち、冷凍設備の冷媒ガスの補充用の高圧ガスを充?するための容器（再充填禁止容器を除く。）について正しいものはどれか。\nイ．容器に充填する高圧ガスの種類に応じた塗色を行わなければならない場合、その容器の外面の見やすい箇所に、その表面積の2分の1以上について行わなければならない。\nロ．容器に高圧ガスを充填することができる条件の一つに、「その容器が容器検査又は容器再検査に合格し、所定の刻印がされた後、所定の期間を経過していないこと。」があるが、その期間は溶接容器にあっては製造後の経過年数に応じて定められている。\nハ．容器の所有者は、容器再検査に合格しなかった容器について、所定の期間内に所定の刻印等がされなかったときは、遅滞なく、この容器を容器として使用することができないように処分すること又はその外面に「使用禁止」である旨の表示をすることと定められている。","options":["(1) イ","(2) イ、ロ","(3) イ、ハ","(4) ロ、ハ","(5) イ、ロ、ハ"],"answer":2,"explanation":"・容器に充填する高圧ガスの種類に応じた塗色を行わなければならない場合、その容器の外面の見やすい箇所に、その表面積の2分の1以上について行わなければならない。\n・容器に高圧ガスを充填することができる条件の一つに、「その容器が容器検査又は容器再検査に合格し、所定の刻印がされた後、所定の期間を経過していないこと。」があるが、その期間は溶接容器にあっては製造後の経過年数に応じて定められている。\n・容器の所有者は、容器再検査に合格しなかった容器について、所定の期間内に所定の刻印等がされなかったときは、これをくず化し、その他容器として使用することができないように処分しなければならない。","has_image":false,"image_path":null},{"id":"R05-Horitsu-Q07","year":"R05","subject":"法令","category":"冷凍能力の算定基準","tags":[],"question":"次のイ、ロ、ハの記述のうち、冷凍能力の算定基準について冷凍保安規則上正しいものはどれか。\nイ．遠心式圧縮機を使用する製造設備の1日の冷凍能力の算定に必要な数値の一つに、その圧縮機の原動機の定格出力の数値がある。\nロ．吸収式冷凍設備の1日の冷凍能力の算定に必要な数値の一つに、蒸発器の冷媒ガスに接する側の表面積の数値がある。\nハ．遠心式圧縮機を使用する製造設備以外の製造設備及び吸収式冷凍設備以外の製造設備の1日の冷凍能力の算定に必要な数値の一つに、蒸発器の1時間当たりの入熱量の数値がある。","options":["(1) イ","(2) ハ","(3) イ、ロ","(4) ロ、ハ","(5) イ、ロ、ハ"],"answer":1,"explanation":"・遠心式圧縮機を使用する製造設備にあっては、当該圧縮機の原動機の定格出力1.2キロワットをもって1日の冷凍能力1トンとする。よって、圧縮機の原動機の定格出力の数値は、遠心式圧縮機を使用する冷凍設備の1日の冷凍能力の算定に必要な数値の一つである。\n・吸収式冷凍設備にあっては、発生器を加熱する1時間の入熱量27,800キロジュールをもって1日の冷凍能力1トンとする。蒸発部又は蒸発器の冷媒ガスに接する側の表面積の数値は、自然環流式冷凍設備及び自然循環式冷凍設備の1日の冷凍能力の算定に必要な数値の一つである。\n・遠心式圧縮機を使用する製造設備以外の製造設備及び吸収式冷凍設備以外の\n製造設備であるから、①自然環流式冷凍設備及び自然循環式冷凍設備（冷凍\n則第5条第3号）、②その他の製造設備（冷凍則第5条第4号）となる。\n①自然環流式冷凍設備及び自然循環式冷凍設備にあっては、次の算式によるものをもって1日の冷凍能力とする。\nR＝QA\n　　R 1日の冷凍能力（単位　トン）の数値\n　　Q　冷媒ガスの種類に応じて定められた数値\n　　A　蒸発部又は蒸発器の冷媒ガスに接する側の表面積（単位　平方メートル）の数値\n②その他の製造設備にあっては、次の算式によるものをもって1日の冷凍能\n力とする。\nR＝V÷C\n　　R 1日の冷凍能力（単位　トン）の数値\n　　V　圧縮機の標準回転速度における1時間のピストン押しのけ量（単位立方メートル）の数値\n　　C　冷媒ガスの種類に応じて定められた数値又は所定の算式により得ら\nれた数値よって、蒸発器の1時間当たりの入熱量の数値は冷凍能力の算定に必要な数\n値ではない。","has_image":false,"image_path":null},{"id":"R05-Horitsu-Q08","year":"R05","subject":"法令","category":"第二種製造者(全般)","tags":[],"question":"次のイ、ロ、ハの記述のうち、冷凍のため高圧ガスの製造をする第二種製造者について正しいものはどれか。\nイ．製造をする高圧ガスの種類に関係なく、1日の冷凍能力が3トン以上50トン未満である冷凍設備を使用して高圧ガスの製造をする者は、第二種製造者である。\nロ．冷凍のための第二種製造者には、製造のための施設を、その位置、構造及び設備が技術上の基準に適合するように維持すべき定めはない。\nハ．第二種製造者の製造施設であっても、定期に、保安のための自主検査を行うべきものがある。","options":["(1) イ","(2) ロ","(3) ハ","(4) イ、ハ","(5) ロ、ハ"],"answer":3,"explanation":"・第二種製造者であるかどうかは、製造をする高圧ガスの種類によって異なる。第二種製造者とは、1日の冷凍能力が3トン以上20トン未満（第1種ガスの場合は20トン以上50トン未満、難燃性以外のフルオロカーボン及びアンモニアの場合は5トン以上50トン未満）のものを使用して高圧ガスの製造をしようとする者である。\n※第1種ガス：ヘリウム、ネオン、アルゴン、クリプトン、キセノン、ラドン、窒素、二酸化炭素、難燃性フルオロカーボン、空気\n・第二種製造者は、製造のための施設を、その位置、構造及び設備が技術上の基準に適合するように維持しなければならない。\n・第二種製造者の製造施設であっても、定期に、保安のための自主検査を行うべきものがある。","has_image":false,"image_path":null},{"id":"R05-Horitsu-Q09","year":"R05","subject":"法令","category":"冷凍保安責任者・代理者","tags":[],"question":"次のイ、ロ、ハの記述のうち、冷凍保安責任者を選任すべき事業所における冷凍保安責任者及びその代理者について正しいものはどれか。\nイ．1日の冷凍能力が100トンである製造施設の冷凍保安責任者には、第三種冷凍機械責任者免状の交付を受け、かつ、高圧ガスの製造に関する所定の経験を有する者を選任することができる。\nロ．冷凍保安責任者の代理者を選任したときは、遅滞なく、その旨を都道府県知事等に届け出なければならないが、これを解任したときは、その旨を都道府県知事等に届け出る必要はない。\nハ．冷凍保安責任者の代理者は、冷凍保安責任者の職務を代行する場合は、高圧ガス保安法の規定の適用については、冷凍保安責任者とみなされる。","options":["(1) ハ","(2) イ、ロ","(3) イ、ハ","(4) ロ、ハ","(5) イ、ロ、ハ"],"answer":1,"explanation":"・1日の冷凍能力が100トン以上である製造施設の冷凍保安責任者には、第三種冷凍機械責任者を選任することができない。\n・冷凍保安責任者の代理者を選任したときは、遅滞なく、その旨を都道府県知事等に届け出なければならない。これを解任したときも、同様である。\n・冷凍保安責任者の代理者は、冷凍保安責任者の職務を代行する場合は、高圧ガス保安法の規定の適用については、冷凍保安責任者とみなされる。","has_image":false,"image_path":null},{"id":"R05-Horitsu-Q10","year":"R05","subject":"法令","category":"保安検査","tags":[],"question":"次のイ、ロ、ハの記述のうち、冷凍のため高圧ガスの製造をする第一種製造者（認定保安検査実施者である者を除く。）の製造施設（認定指定設備を除く。）に係る保安検査について正しいものはどれか。\nイ．フルオロカーボン134 a を冷媒ガスとする製造施設は、保安検査を受ける必要はない。\nロ．保安検査は、特定施設についてその位置、構造及び設備が所定の技術上の基準に適合しているかどうかについて行われる。\nハ．保安検査は、3年に1回受けなければならない。ただし、災害その他やむを得ない事由によりその回数で保安検査を受けることが困難であるときは、その事由を勘案して経済産業大臣が定める期間に1回受けなければならない。","options":["(1) ロ","(2) イ、ロ","(3) イ、ハ","(4) ロ、ハ","(5) イ、ロ、ハ"],"answer":4,"explanation":"・フルオロカーボン134aを冷媒ガスとする製造施設は、保安検査を受けなければならない。\n・保安検査は、特定施設についてその位置、構造及び設備が所定の技術上の基準に適合しているかどうかについて行われる\n・保安検査は、3年に1回受けなければならない。ただし、災害その他やむを得ない事由によりその回数で保安検査を受けることが困難であるときは、その事由を勘案して経済産業大臣が定める期間に1回受けなければならない。","has_image":false,"image_path":null},{"id":"R05-Horitsu-Q11","year":"R05","subject":"法令","category":"定期自主検査","tags":[],"question":"次のイ、ロ、ハの記述のうち、冷凍のため高圧ガスの製造をする第一種製造者（冷凍保安責任者を選任すべき者に限る。）が行う定期自主検査について正しいものはどれか。\nイ．定期自主検査は、製造施設のうち認定指定設備に係る部分については実施する必要はない。\nロ．定期自主検査を行うときは、選任している冷凍保安責任者にその定期自主検査の実施について監督を行わせなければならない。\nハ．定期自主検査は、1年に1回以上行わなければならない。ただし、災害その他やむを得ない事由によりその回数で自主検査を行うことが困難であるときは、その事由を勘案して経済産業大臣が定める期間に1回以上行わなければならない。","options":["(1) ロ","(2) イ、ロ","(3) イ、ハ","(4) ロ、ハ","(5) イ、ロ、ハ"],"answer":4,"explanation":"・定期自主検査は、認定指定設備に係る部分についても実施しなければならない。\n・定期自主検査を行うときは、選任している冷凍保安責任者にその定期自主検査の実施について監督を行わせなければならない。\n・定期自主検査は、1年に1回以上行わなければならない。ただし、災害その他やむを得ない事由によりその回数で自主検査を行うことが困難であるときは、その事由を勘案して経済産業大臣が定める期間に1回以上行わなければならない。","has_image":false,"image_path":null},{"id":"R05-Horitsu-Q12","year":"R05","subject":"法令","category":"危害予防規程・保安教育計画","tags":[],"question":"次のイ、ロ、ハの記述のうち、冷凍のため高圧ガスの製造をする第一種製造者が定めるべき危害予防規程及び保安教育計画について正しいものはどれか。\nイ．危害予防規程を守るべき者は、その第一種製造者及びその従業者であると定められている。\nロ．従業者に対する危害予防規程の周知方法及びその危害予防規程に違反した者に対する措置に関することは、危害予防規程に定めるべき事項ではない。\nハ．第一種製造者は、従業者に対する保安教育計画を定め、これを忠実に実行しなければならない。また、その実行結果を都道府県知事等に届け出なければならない。","options":["(1) イ","(2) ロ","(3) ハ","(4) イ、ロ","(5) イ、ハ"],"answer":1,"explanation":"・危害予防規程を守るべき者は、その第一種製造者及びその従業者であると定められている。\n・従業者に対する危害予防規程の周知方法及びその危害予防規程に違反した者に対する措置に関することは、危害予防規程に定めるべき事項の一つである。\n・第一種製造者は、従業者に対する保安教育計画を定め、これを忠実に実行しなければならないが、その計画及び実行結果を都道府県知事等に届け出なければならないという定めはない。","has_image":false,"image_path":null},{"id":"R05-Horitsu-Q13","year":"R05","subject":"法令","category":"危険時の措置等","tags":[],"question":"次のイ、ロ、ハの記述のうち、冷凍のため高圧ガスの製造をする第一種製造者について正しいものはどれか。\nイ．第一種製造者は、事業所ごとに帳簿を備え、その製造施設に異常があった場合、異常があった年月日及びそれに対してとった措置をその帳簿に記載し、記
