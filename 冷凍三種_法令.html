載の日から5年間保存しなければならない。\nロ．第一種製造者は、その所有する高圧ガスについて災害が発生したときは、遅滞なく、その旨を都道府県知事等又は警察官に届け出なければならないが、占有する容器を盗まれたときは、その届出の必要はない。\nハ．第一種製造者は、その所有又は占有する製造施設が危険な状態になったときは、直ちに、応急の措置を行わなければならないが、その措置を講じることができないときは、従業者又は必要に応じ付近の住民に退避するよう警告しなければならない。","options":["(1) イ","(2) ロ","(3) ハ","(4) イ、ハ","(5) ロ、ハ"],"answer":3,"explanation":"・第一種製造者は、事業所ごとに帳簿を備え、その製造施設に異常があった場合、異常があった年月日及びそれに対してとった措置をその帳簿に記載し、記載の日から10年間保存しなければならない。\n・第一種製造者は、その所有する高圧ガスについて災害が発生したときは、遅滞なく、その旨を都道府県知事等又は警察官に届け出なければならない。占有する容器を盗まれたときも同様である。\n・第一種製造者は、その所有又は占有する製造施設が危険な状態になったときは、直ちに、応急の措置を行わなければならないが、その措置を講じることができないときは、従業者又は必要に応じ付近の住民に退避するよう警告しなければならない。","has_image":false,"image_path":null},{"id":"R05-Horitsu-Q14","year":"R05","subject":"法令","category":"製造施設の変更・完成検査","tags":[],"question":"次のイ、ロ、ハの記述のうち、冷凍のため高圧ガスの製造をする第一種製造者（認定完成検査実施者である者を除く。）の製造施設について正しいものはどれか。\nイ．アンモニアを冷媒ガスとする圧縮機の取替えの工事は、冷媒設備に係る切断、溶接を伴わない工事であって、冷凍能力の変更を伴わないものであっても、定められた軽微な変更の工事には該当しない。\nロ．第一種製造者からその高圧ガスの製造施設の全部の引渡しを受け都道府県知事等の高圧ガスの製造に係る許可を受けた者は、その第一種製造者がその施設について既に完成検査を受け、所定の技術上の基準に適合していると認められている場合にあっては、所定の完成検査を受けることなくその施設を使用することができる。\nハ．第一種製造者は、特定変更工事を完成しその工事に係る施設について都道府県知事等が行う完成検査を受けた場合は、その都道府県知事等に技術上の基準に適合していると認められた後でなければその施設を使用してはならない｡◯　　（1）イ　（2）ハ　（3）イ、ロ　（4）ロ、ハ　（5）イ、ロ、ハ","options":["(1) イ","(2) ハ","(3) イ、ロ","(4) ロ、ハ","(5) イ、ロ、ハ"],"answer":5,"explanation":"・アンモニアを冷媒ガスとする圧縮機の取替えの工事は、冷媒設備に係る切断、溶接を伴わない工事であって、冷凍能力の変更を伴わないものであっても、定められた軽微な変更の工事には該当しない。\n・第一種製造者からその高圧ガスの製造施設の全部の引渡しを受け都道府県知事等の高圧ガスの製造に係る許可を受けた者は、その第一種製造者がその施設について既に完成検査を受け、所定の技術上の基準に適合していると認められている場合にあっては、所定の完成検査を受けることなくその施設を使用することができる。\n・第一種製造者は、特定変更工事を完成しその工事に係る施設について都道府県知事等が行う完成検査を受けた場合は、その都道府県知事等に技術上の基準に適合していると認められた後でなければその施設を使用してはならない｡","has_image":false,"image_path":null},{"id":"R05-Horitsu-Q15","year":"R05","subject":"法令","category":"定置式製造設備(アンモニア)","tags":[],"question":"次のイ、ロ、ハの記述のうち、製造設備がアンモニアを冷媒ガスとする定置式製造設備（吸収式アンモニア冷凍機であるものを除く。）である第一種製造者の製造施設に係る技術上の基準について冷凍保安規則上正しいものはどれか。\nイ．圧縮機、油分離器、凝縮器若しくは受液器又はこれらの間の配管を設置する室は、冷媒ガスが漏えいしたとき滞留しないような構造としなければならない。\nロ．冷媒設備に設けた安全弁に放出管を設けた場合は、製造設備には冷媒ガスが漏えいしたときに安全に、かつ、速やかに除害するための措置を講じる必要はない。\nハ．製造施設には、その施設から漏えいする冷媒ガスが滞留するおそれのある場所に、その冷媒ガスの漏えいを検知し、かつ、警報するための設備を設けなければならない。","options":["(1) イ","(2) ロ","(3) イ、ハ","(4) ロ、ハ","(5) イ、ロ、ハ"],"answer":3,"explanation":"・圧縮機、油分離器、凝縮器若しくは受液器又はこれらの間の配管を設置する室は、冷媒ガスが漏えいしたとき滞留しないような構造としなければならない。\n・毒性ガスの製造設備には、冷媒ガスが漏えいしたときに安全に、かつ、速やかに除害するための措置を講じなければならない。ただし、吸収式アンモニア冷凍機については、この限りでない。\n※設問が吸収式アンモニア冷凍機を除いた定置式製造設備なので、除害するための措置を講じなければなりません。\n・可燃性ガス、毒性ガス又は特定不活性ガスの製造施設には、その施設から漏えいする冷媒ガスが滞留するおそれのある場所に、その冷媒ガスの漏えいを検知し、かつ、警報するための設備を設けなければならない。ただし、吸収式アンモニア冷凍機に係る施設については、この限りでない。","has_image":false,"image_path":null},{"id":"R05-Horitsu-Q16","year":"R05","subject":"法令","category":"定置式製造設備(アンモニア)","tags":[],"question":"次のイ、ロ、ハの記述のうち、製造設備がアンモニアを冷媒ガスとする定置式製造設備（吸収式アンモニア冷凍機であるものを除く。）である第一種製造者の製造施設に係る技術上の基準について冷凍保安規則上正しいものはどれか。\nイ．製造施設には、その施設の規模に応じて、適切な消火設備を適切な箇所に設けなければならない。\nロ．冷媒設備に係る電気設備は、その設置場所及び冷媒ガスの種類に応じた防爆性能を有する構造のものとすべきものに該当しない。\nハ．内容積が4000リットルの受液器は、その周囲に液状の冷媒ガスが漏えいした場合にその流出を防止するための措置を講じるべきものに該当する。","options":["(1) イ","(2) ロ","(3) イ、ロ","(4) イ、ハ","(5) イ、ロ、ハ"],"answer":3,"explanation":"・可燃性ガスの製造施設には、その施設の規模に応じて、適切な消火設備を適切な箇所に設けなければならない。\n・冷媒設備に係る電気設備が、その設置場所及び冷媒ガスの種類に応じた防爆性能を有する構造のものであるべき定めはあるが、アンモニアを冷媒ガスとする製造施設には適用されない。\n・毒性ガスを冷媒ガスとする冷媒設備に係る受液器であって、その内容積が1万リットル以上の受液器の周囲には、液状の冷媒ガスが漏えいした場合にその流出を防止するための措置を講じなければならない。","has_image":false,"image_path":null},{"id":"R05-Horitsu-Q17","year":"R05","subject":"法令","category":"定置式製造設備(全般)","tags":[],"question":"次のイ、ロ、ハの記述のうち、製造設備が定置式製造設備である第一種製造者の製造施設に係る技術上の基準について冷凍保安規則上正しいものはどれか。\nイ．圧縮機、油分離器、凝縮器及び受液器並びにこれらの間の配管は、火気に対して安全な措置を講じた場合を除き、引火性又は発火性の物（作業に必要なものを除く。）をたい積した場所及び火気（その製造設備内のものを除く。）の付近にあってはならない。\nロ．冷媒設備の配管の変更の工事の完成検査において気密試験を行うときは、許容圧力以上の圧力で行わなければならない。\nハ．製造設備に設けたバルブ又はコックを操作ボタン等により開閉する場合にあっては、その操作ボタン等には、作業員がその操作ボタン等を適切に操作することができるような措置を講じなければならない。","options":["(1) ハ","(2) イ、ロ","(3) イ、ハ","(4) ロ、ハ","(5) イ、ロ、ハ"],"answer":5,"explanation":"・圧縮機、油分離器、凝縮器及び受液器並びにこれらの間の配管は、火気に対して安全な措置を講じた場合を除き、引火性又は発火性の物（作業に必要なものを除く。）をたい積した場所及び火気（その製造設備内のものを除く。）の付近にあってはならない。\n・冷媒設備の配管の変更の工事の完成検査において気密試験を行うときは、許容圧力以上の圧力で行わなければならない。\n・製造設備に設けたバルブ又はコックを操作ボタン等により開閉する場合にあっては、その操作ボタン等には、作業員がその操作ボタン等を適切に操作することができるような措置を講じなければならない。","has_image":false,"image_path":null},{"id":"R05-Horitsu-Q18","year":"R05","subject":"法令","category":"定置式製造設備(全般)","tags":[],"question":"次のイ、ロ、ハの記述のうち、製造設備が定置式製造設備である第一種製造者の製造施設に係る技術上の基準について冷凍保安規則上正しいものはどれか。\nイ．凝縮器には、所定の耐震に関する性能を有すべきものがあるが、凝縮器が横置円筒形で胴部の長さが5メートルのものは、それに該当しない。\nロ．配管以外の冷媒設備について耐圧試験を行うときは、水その他の安全な液体を使用する場合、許容圧力の1.5倍以上の圧力で行わなければならない。\nハ．冷媒設備の圧縮機が強制潤滑方式であり、かつ、潤滑油圧力に対する保護装置を有しているものである場合は、その圧縮機の油圧系統には圧力計を設けなくてもよいが、その油圧系統を除く冷媒設備には圧力計を設けなければならない。","options":["(1) イ","(2) ロ","(3) ハ","(4) イ、ロ","(5) イ、ロ、ハ"],"answer":5,"explanation":"・凝縮器には、所定の耐震に関する性能を有すべきものがあるが、横置円筒形の凝縮器は該当しない。該当するのは縦置円筒形で胴部の長さが5メートル以上の凝縮器である。\n・配管以外の冷媒設備について耐圧試験を行うときは、水その他の安全な液体を使用する場合、許容圧力の1.5倍以上の圧力で行わなければならない。\n・冷媒設備の圧縮機が強制潤滑方式であり、かつ、潤滑油圧力に対する保護装置を有しているものである場合は、その圧縮機の油圧系統には圧力計を設けなくてもよいが、その油圧系統を除く冷媒設備には圧力計を設けなければならない。","has_image":false,"image_path":null},{"id":"R05-Horitsu-Q19","year":"R05","subject":"法令","category":"製造の方法","tags":[],"question":"次のイ、ロ、ハの記述のうち、冷凍保安規則に定める第一種製造者の製造の方法に係る技術上の基準に適合しているものはどれか。\nイ．冷媒設備の安全弁に付帯して設けた止め弁を、その製造設備の運転終了時から運転開始時までの間、閉止している。\nロ．製造設備とブラインを共通にする認定指定設備による高圧ガスの製造は、認定指定設備に自動制御装置が設けられているため、その認定指定設備の部分については1か月に1回、異常の有無を点検して行っている。\nハ．冷媒設備の修理は、あらかじめ修理の作業計画及び作業の責任者を定め、その計画に従って、異常があったときに直ちにその旨をその責任者に通報するための措置を講じて行うこととした。","options":["(1) イ","(2) ロ","(3) ハ","(4) ロ、ハ","(5) イ、ロ、ハ"],"answer":3,"explanation":"・冷媒設備の安全弁に付帯して設けた止め弁は、その安全弁の修理又は清掃のため特に必要な場合を除き、常に全開しておかなければならない。\n・高庄ガスの製造は、1日に1回以上当該製造設備の属する製造施設の異常の有無を点検して行わなければならない。この定めは、認定指定設備である製造設備についても適用される。\n※令和7年4月18日施行：1日1回以上とする時点・回数の限定は削除\n・冷媒設備の修理は、あらかじめ修理の作業計画及び作業の責任者を定め、その計画に従って、異常があったときに直ちにその旨をその責任者に通報するための措置を講じて行わなければならない。","has_image":false,"image_path":null},{"id":"R05-Horitsu-Q20","year":"R05","subject":"法令","category":"認定指定設備","tags":[],"question":"次のイ、ロ、ハの記述のうち、認定指定設備について冷凍保安規則上正しいものはどれか。\nイ．認定指定設備である条件の一つに、「冷媒設備は、その設備の製造業者の事業所において試運転を行い、使用場所に分割されずに搬入されるものであること。」がある。\nロ．製造設備の日常の運転操作に必要となる冷媒ガスの止め弁には、手動式のものを使用することができる。\nハ．製造設備に変更の工事を施したとき、その工事が同等の部品への交換のみである場合は、指定設備認定証は無効にならないと定められている。","options":["(1) イ","(2) ハ","(3) イ、ロ","(4) イ、ハ","(5) イ、ロ、ハ"],"answer":4,"explanation":"・認定指定設備である条件の一つに、「冷媒設備は、その設備の製造業者の事業所において試運転を行い、使用場所に分割されずに搬入されるものであること。」がある。\n・認定指定設備である条件の一つに、日常の運転操作に必要となる冷媒ガスの止め弁には手動式のものを使用しないことがある。\n・製造設備に変更の工事を施したとき、その工事が同等の部品への交換のみである場合は、指定設備認定証は無効にならないと定められている。","has_image":false,"image_path":null},{"id":"R06-Horitsu-Q01","year":"R06","subject":"法令","category":"高圧ガスの定義等","tags":[],"question":"次のイ、ロ、ハの記述のうち、正しいものはどれか。\nイ．高圧ガス保安法は、高圧ガスによる災害を防止して公共の安全を確保する目的のために、高圧ガスの製造及び販売のみを規制している。\nロ．温度35度以下で圧力が0.2メガパスカルとなる液化ガスは、高圧ガスである。\nハ．1日の冷凍能力が3トン以上5トン未満の冷凍設備内における高圧ガスであっても、そのガスの種類によっては、高圧ガス保安法の適用を受けないものがある。","options":["(1) イ","(2) ロ","(3) イ、ロ","(4) ロ、ハ","(5) イ、ロ、ハ"],"answer":4,"explanation":"・高圧ガス保安法は、高圧ガスによる災害を防止して公共の安全を確保する目的のために、高圧ガスの製造、貯蔵、販売、移動その他の取扱及び消費並びに容器の製造及び取扱について規制するとともに、民間事業者及び高圧ガス保安協会による高圧ガスの保安に関する自主的な活動を促進することを定めている。\n・温度35度以下で圧力が0.2メガパスカルとなる液化ガスは、高圧ガスである。\n・1日の冷凍能力が3トン以上5トン未満の冷凍設備内における高圧ガスであっても、そのガスの種類によっては、高圧ガス保安法の適用を受けないものがある。","has_image":false,"image_path":null},{"id":"R06-Horitsu-Q02","year":"R06","subject":"法令","category":"適用除外・事業(製造・販売・廃棄等)","tags":[],"question":"次のイ、ロ、ハの記述のうち、正しいものはどれか。\nイ．冷凍のため高圧ガスを製造する設備（認定指定設備を除く。）を使用して高圧ガスの製造をしようとする者が、都道府県知事等の許可を受けるべき場合の1日の冷凍能力の最小の値は、その冷媒ガスの種類がフルオロカーボンとアンモニアとでは異なる。\nロ．冷凍のため高圧ガスの製造をする第一種製造者は、高圧ガスの製造を開始したときは、遅滞なく、その旨を都道府県知事等に届け出なければならないが、高圧ガスの製造を廃止したときは、その旨を届け出る必要はない。\nハ．冷凍のため高圧ガスの製造をする第一種製造者の合併によりその地位を承継した者は、遅滞なく、その事実を証する書面を添えて、その旨を都道府県知事等に届け出なければならない。","options":["(1) イ","(2) ハ","(3) イ、ハ","(4) ロ、ハ","(5) イ、ロ、ハ"],"answer":2,"explanation":"・冷凍のため高圧ガスを製造する設備（認定指定設備を除く。）を使用して高圧ガスの製造をしようとする者が、都道府県知事等の許可を受けるべき場合の1日の冷凍能力の最小の値は、その冷媒ガスの種類がフルオロカーボンとアンモニアとでは同じく50t以上である。\n・冷凍のため高圧ガスの製造をする第一種製造者は、高圧ガスの製造を開始し、又は廃止したときは、遅滞なく、その旨を都道府県知事に届け出なければならない。\n・冷凍のため高圧ガスの製造をする第一種製造者の合併によりその地位を承継した者は、遅滞なく、その事実を証する書面を添えて、その旨を都道府県知事等に届け出なければならない。","has_image":false,"image_path":null},{"id":"R06-Horitsu-Q03","year":"R06","subject":"法令","category":"適用除外・事業(製造・販売・廃棄等)","tags":[],"question":"次のイ、ロ、ハの記述のうち、正しいものはどれか。\nイ．容器に充填された冷媒ガス用の高圧ガスの販売の事業を営もうとする者は、特に定められた場合を除き、販売所ごとに、事業開始の日の20日前までに、その旨を都道府県知事等に届け出なければならない。\nロ．「機器製造業者」とは、専ら冷凍設備に用いる機器であって、所定の機器の製造の事業を行う者である。\nハ．冷凍のための製造施設の冷媒設備内の高圧ガスであるアンモニアを廃棄するときには、高圧ガスの廃棄に係る技術上の基準は適用されない。","options":["(1) イ","(2) イ、ロ","(3) イ、ハ","(4) ロ、ハ","(5) イ、ロ、ハ"],"answer":2,"explanation":"・容器に充填された冷媒ガス用の高圧ガスの販売の事業を営もうとする者は、特に定められた場合を除き、販売所ごとに、事業開始の日の20日前までに、その旨を都道府県知事等に届け出なければならない。\n・「機器製造業者」とは、専ら冷凍設備に用いる機器であって、所定の機器の製造の事業を行う者である。\n・可燃性ガス及び毒性ガスであるアンモニアを廃棄するときには、冷凍保安規則で定める高圧ガスの廃棄に係る技術上の基準に従ってしなければならない","has_image":false,"image_path":null},{"id":"R06-Horitsu-Q04","year":"R06","subject":"法令","category":"高圧ガスの貯蔵","tags":[],"question":"次のイ、ロ、ハの記述のうち、冷凍に係る製造事業所における冷媒ガスの補充用としての容器による高圧ガス（質量が1.5 キログラムを超えるもの）の貯蔵の方法に係る技術上の基準について一般高圧ガス保安規則上正しいものはどれか。\nイ．充填容器及び残ガス容器は、それぞれ区分して容器置場に置かなければならない。\nロ．液化アンモニアは、そのガスが漏えいしたとき拡散しないように、通風の良い場所で貯蔵してはならない。\nハ．液化アンモニアの容器置場の周囲2 メートル以内においては、特に定められた場合を除き、火気の使用及び引火性又は発火性の物を置くことは禁じられている。","options":["(1) イ","(2) ロ","(3) イ、ハ","(4) ロ、ハ","(5) イ、ロ、ハ"],"answer":3,"explanation":"・充填容器及び残ガス容器は、それぞれ区分して容器置場に置かなければならない。\n・液化アンモニアを容器により貯蔵する場合は、通風の良い場所で貯蔵しなければならない。\n・液化アンモニアの容器置場の周囲2メートル以内においては、特に定められた場合を除き、火気の使用及び引火性又は発火性の物を置くことは禁じられている。","has_image":false,"image_path":null},{"id":"R06-Horitsu-Q05","year":"R06","subject":"法令","category":"高圧ガスの移動","tags":[],"question":"次のイ、ロ、ハの記述のうち、車両に積載した容器（内容積が48 リットルのもの）による冷凍設備の冷媒ガスの補充用の高圧ガスの移動に係る技術上の基準等について一般高圧ガス保安規則上正しいものはどれか。\nイ．高圧ガスを移動する車両の見やすい箇所に警戒標を掲げなければならない高圧ガスは、可燃性ガス及び毒性ガスの2 種類に限られる。\nロ．高圧ガスを移動するときは、充填容器及び残ガス容器には、転落、転倒等による衝撃及びバルブの損傷を防止する措置を講じ、かつ、粗暴な取扱いをしてはならない。\nハ．液化アンモニアを移動するときは、充填容器及び残ガス容器には、木枠又はパッキンを施さなければならない。","options":["(1) イ","(2) ロ","(3) イ、ハ","(4) ロ、ハ","(5) イ、ロ、ハ"],"answer":4,"explanation":"・充填容器等を車両に積載して移動するとき（容器の内容積が25リットル以下である充填容器等（毒性ガスに係るものを除く。）のみを積載した車両であって、当該積載容器の内容積の合計が50リットル以下である場合を除く。）は、当該車両の見やすい箇所に警戒標を掲げなければならない。内容積が25リットルを超えているため、ガスの種類にかかわらず適用される。\n・内容積が5リットルを超える充填容器等には、転落、転倒等による衝撃及びバルブの損傷を防止する措置を講じ、かつ粗暴な取扱いをしてはならない。\n・毒性ガスの充填容器等には、木枠又はパッキンを施さなければならない。アンモニアは毒性ガスである。","has_image":false,"image_path":null},{"id":"R06-Horitsu-Q06","year":"R06","subject":"法令","category":"高圧ガスの充填容器","tags":[],"question":"次のイ、ロ、ハの記述のうち、冷凍設備の冷媒ガスの補充用の高圧ガスを充填するための容器（再充填禁止容器を除く。）及びその附属品について正しいものはどれか。\nイ．容器又は附属品の廃棄をする者は、その容器又は附属品をくず化し、その他容器又は附属品として使用することができないように処分しなければならない。\nロ．液化ガスを充填する容器に表示すべき事項の一つに、その容器に充填することができる液化ガスの最大充填質量の数値の明示がある。\nハ．液化ガスを充填する容器には、その容器の質量に附属品の質量を加えた質量（記号　TW、単位　キログラム）の刻印がされている。","options":["(1) イ","(2) イ、ロ","(3) イ、ハ","(4) ロ、ハ","(5) イ、ロ、ハ"],"answer":1,"explanation":"・容器又は附属品の廃棄をする者は、その容器又は附属品をくず化し、その他容器又は附属品として使用することができないように処分しなければならない。\n・液化ガスを充填する容器に表示すべき事項として、塗色、高圧ガスの名称、高圧ガスの性質、容器の所有者の氏名等は規定されているが、最大充填質量の数値は規定されていない。\n・アセチレンガスを充填する容器には、類似の規定として、容器の質量に容器の多孔質物及び附属品の質量を加えた質量（記号　TW、単位　キログラム）の刻印がされるが、液化ガスを充填する容器に同様の規定はない。","has_image":false,"image_path":null},{"id":"R06-Horitsu-Q07","year":"R06","subject":"法令","category":"冷凍能力の算定基準","tags":[],"question":"次のイ、ロ、ハの記述のうち、冷凍能力の算定基準について冷凍保安規則上正しいものはどれか。\nイ．圧縮機の気筒の内径の数値は、回転ピストン型圧縮機を使用する製造設備の1 日の冷凍能力の算定に必要な数値の一つである。\nロ．発生器を加熱する1 時間の入熱量の数値は、吸収式冷凍設備の1 日の冷凍能力の算定に必要な数値の一つである。\nハ．冷媒ガスの種類に応じて定められた数値（C）は、回転ピストン型圧縮機を使用する製造設備の1 日の冷凍能力の算定に必要な数値の一つである。","options":["(1) ロ","(2) イ、ロ","(3) イ、ハ","(4) ロ、ハ","(5) イ、ロ、ハ"],"answer":5,"explanation":"・回転ピストン型圧縮機を使用する製造設備にあっては、次の算式によるものをもって1日の冷凍能力とする。\n　R＝V÷C\n　　R　1日の冷凍能力（単位　トン）の数値\n　　V　回転ピストンのガス圧縮部分の厚さ、回転ピストンの1分間の標準回転数、気筒の内径、ピストンの外径から所定の算式で得られた数値\n　　C　冷媒ガスの種類に応じて定められた数値又は所定の算式で得られた数値\nよって、気筒の内径の数値は、回転ピストン型圧縮機を使用する製造設備の1日の冷凍能力の算定に必要な数値の一つである。\n・吸収式冷凍設備にあっては、発生器を加熱する1時間の入熱量27,800kJをもって1日の冷凍能力1トンとする。\nよって、発生器を加熱する1時間の入熱量の数値は、吸収式冷凍設備の1日の冷凍能力の算定に必要な数値の一つである。\n・回転ピストン型圧縮機を使用する製造設備にあっては、次の算式によるものをもって1日の冷凍能力とする。\n　R＝V÷C\n　　R　1日の冷凍能力（単位　トン）の数値\n　　V　回転ピストンのガス圧縮部分の厚さ、回転ピストンの1分間の標準回転数、気筒の内径、ピストンの外径から所定の算式で得られた数値\n　　C　冷媒ガスの種類に応じて定められた数値又は所定の算式で得られた数値\nよって、冷媒ガスの種類に応じて定められた数値（C）は、回転ピストン型圧縮機を使用する製造設備の1日の冷凍能力の算定に必要な数値の一つである。","has_image":false,"image_path":null},{"id":"R06-Horitsu-Q08","year":"R06","subject":"法令","category":"第二種製造者(全般)","tags":[],"question":"次のイ、ロ、ハの記述のうち、冷凍のため高圧ガスの製造をする第二種製造者について正しいものはどれか。\nイ．第二種製造者は、事業所ごとに、高圧ガスの製造開始の日の20 日前までに、高圧ガスの製造をする旨を都道府県知事等に届け出なければならない。\nロ．第二種製造者のうちには、冷凍保安責任者及びその代理者を選任する必要がない者がある。\nハ．第二種製造者は、製造設備の設置又は変更の工事を完成したときは、酸素以外のガスを使用する試運転又は所定の気密試験を行った後でなければ、高圧ガスの製造をしてはならない。","options":["(1) イ","(2) ロ","(3) イ、ロ","(4) ロ、ハ","(5) イ、ロ、ハ"],"answer":5,"explanation":"・第二種製造者は、事業所ごとに、高圧ガスの製造開始の日の20日前までに、高圧ガスの製造をする旨を都道府県知事等に届け出なければならない。\n・第二種製造者のうちには、冷凍保安責任者及びその代理者を選任する必要がない者がある。\n・第二種製造者は、製造設備の設置又は変更の工事を完成したときは、酸素以外のガスを使用する試運転又は所定の気密試験を行った後でなければ、高圧ガスの製造をしてはならない。","has_image":false,"image_path":null},{"id":"R06-Horitsu-Q09","year":"R06","subject":"法令","category":"冷凍保安責任者・代理者","tags":[],"question":"次のイ、ロ、ハの記述のうち、冷凍保安責任者を選任すべき事業所における冷凍保安責任者及びその代理者について正しいものはどれか。\nイ． 1 日の冷凍能力が50 トンの製造施設の冷凍保安責任者には、第三種冷凍機械責任者免状の交付を受け、かつ、高圧ガスの製造に関する所定の経験を有する者を選任することができる。\nロ．第一種製造者（認定高度保安実施者である者を除く。）は、冷凍保安責任者を選任又は解任したときは、遅滞なく、その旨を都道府県知事等に届け出なければならない。また、その代理者の選任又は解任についても同様である。\nハ．冷凍保安責任者の代理者には、第一種冷凍機械責任者免状の交付を受けている者であれば、高圧ガスの製造に関する経験を有しない者を選任することができる。","options":["(1) イ","(2) ロ","(3) イ、ロ","(4) イ、ハ","(5) イ、ロ、ハ"],"answer":3,"explanation":"・1日の冷凍能力が50トンの製造施設の冷凍保安責任者には、第三種冷凍機械責任者免状の交付を受け、かつ、高圧ガスの製造に関する所定の経験を有する者を選任することができる。\n・第一種製造者（認定高度保安実施者である者を除く。）は、冷凍保安責任者を選任又は解任したときは、遅滞なく、その旨を都道府県知事等に届け出なければならない。また、その代理者の選任又は解任についても同様である。\n・冷凍保安責任者の代理者は、製造施設の区分に応じた製造保安責任者免状の交付を受けている者であって、所定の高圧ガスの製造に関する経験を有する者のうちから選任しなければならない。","has_image":false,"image_path":null},{"id":"R06-Horitsu-Q10","year":"R06","subject":"法令","category":"保安検査","tags":[],"question":"次のイ、ロ、ハの記述のうち、冷凍のため高圧ガスの製造をする第一種製造者（認定保安検査実施者又は認定高度保安実施者である者を除く。）が受ける保安検査について正しいものはどれか。\nイ．保安検査は、選任している冷凍保安責任者に行わせなければならない。\nロ．製造施設のうち認定指定設備である部分は、保安検査を受けなくてよい。\nハ．特定施設について、高圧ガス保安協会が行う保安検査を受けた場合、高圧ガス保安協会が遅滞なくその結果を都道府県知事等に報告することとなっているので、第一種製造者がその保安検査を受けた旨を都道府県知事等に届け出るべき定めはない。","options":["(1) イ","(2) ロ","(3) ハ","(4) イ、ロ","(5) ロ、ハ"],"answer":2,"explanation":"・保安検査は、都道府県知事又は高圧ガス保安協会若しくは指定保安検査機関が行う。\n・製造施設のうち認定指定設備である部分は、保安検査を受けなくてよい。\n・特定施設について、高圧ガス保安協会が行う保安検査を受け、その旨を都道府県知事に届け出た場合は、都道府県知事が行う保安検査を受けなくてよい。この届出を行うのは第一種製造者である。","has_image":false,"image_path":null},{"id":"R06-Horitsu-Q11","year":"R06","subject":"法令","category":"定期自主検査","tags":[],"question":"次のイ、ロ、ハの記述のうち、冷凍のため高圧ガスの製造をする第一種製造者（認定高度保安実施者である者を除く。）が行う定期自主検査について正しいものはどれか。\nイ．定期自主検査は、製造施設の位置、構造及び設備が所定の技術上の基準（耐圧試験に係るものを除く。）に適合しているかどうかについて行わなければならない。\nロ．定期自主検査を行ったときは、その検査記録を作成し、これを保存しなければならない。\nハ．定期自主検査は、特に定める場合を除き、冷媒ガスが毒性ガス又は可燃性ガスである製造施設の場合は1 年に1 回以上、冷媒ガスが不活性ガスである製造施設の場合は3 年に1 回以上行うことと定められている。","options":["(1) イ","(2) ロ","(3) イ、ロ","(4) ロ、ハ","(5) イ、ロ、ハ"],"answer":3,"explanation":"・定期自主検査は、製造施設の位置、構造及び設備が所定の技術上の基準（耐圧試験に係るものを除く。）に適合しているかどうかについて行わなければならない。\n・定期自主検査を行ったときは、その検査記録を作成し、これを保存しなければならない。\n・定期自主検査は、1年に1回以上行うことと定められている。","has_image":false,"image_path":null},{"id":"R06-Horitsu-Q12","year":"R06","subject":"法令","category":"危害予防規程・保安教育計画","tags":[],"question":"次のイ、ロ、ハの記述のうち、冷凍のため高圧ガスの製造をする第一種製造者が定めるべき危害予防規程及び保安教育計画について正しいものはどれか。\nイ．「協力会社の作業の管理に関すること。」は、危害予防規程に定めるべき事項の一つである。\nロ．「従業者に対する危害予防規程の周知方法及びその危害予防規程に違反した者に対する措置に関すること。」は、危害予防規程に定めるべき事項ではない。\nハ．従業者に対する保安教育計画を定め、その計画を都道府県知事等に届け出なければならない。","options":["(1) イ","(2) ロ","(3) ハ","(4) イ、ハ","(5) ロ、ハ"],"answer":1,"explanation":"・「協力会社の作業の管理に関すること。」は、危害予防規程に定めるべき事項の一つである。\n・「従業者に対する危害予防規程の周知方法及びその危害予防規程に違反した者に対する措置に関すること。」は、危害予防規程に定めるべき事項の一つである。\n・第一種製造者は、従業者に対する保安教育計画を定め、これを忠実に実行しなければならないが、その計画及び実行結果を都道府県知事等に届け出なければならないという定めはない。","has_image":false,"image_path":null},{"id":"R06-Horitsu-Q13","year":"R06","subject":"法令","category":"危険時の措置等","tags":[],"question":"次のイ、ロ、ハの記述のうち、冷凍のため高圧ガスの製造をする第一種製造者について正しいものはどれか。\nイ．製造施設に異常があった場合、異常があった年月日及びそれに対してとった措置を記載した帳簿を事業所ごとに備え、これを記載の日から次回の保安検査の実施日まで保存しなければならない。\nロ．その所有し、又は占有する高圧ガスの容器が盗まれたときは、遅滞なく、その旨を都道府県知事等又は警察官に届け出なければならないが、その容器を喪失した場合は、その旨を届け出る必要はない。\nハ．高圧ガスの製造施設が危険な状態になったときは、直ちに、所定の災害の発生の防止のための応急の措置を講じなければならない。また、この事業者に限らずこの事態を発見した者は、直ちに、その旨を都道府県知事等又は警察官、消防吏員若しくは消防団員若しくは海上保安官に届け出なければならない。","options":["(1) イ","(2) ロ","(3) ハ","(4) イ、ハ","(5) イ、ロ、ハ"],"answer":3,"explanation":"・製造施設に異常があった年月日及びそれに対してとった措置を記載した帳簿を事業所ごとに備え、記載の日から10年間保存しなければならない。\n・その所有し、又は占有する高圧ガス又は容器を喪失し、又は盗まれたときは、遅滞なく、その旨を都道府県知事等又は警察官に届け出なければならない。\n・高圧ガスの製造施設が危険な状態になったときは、直ちに、所定の災害の発生の防止のための応急の措置を講じなければならない。また、この事業者に限らずこの事態を発見した者は、直ちに、その旨を都道府県知事等又は警察官、消防吏員若しくは消防団員若しくは海上保安官に届け出なければならない。","has_image":false,"image_path":null},{"id":"R06-Horitsu-Q14","year":"R06","subject":"法令","category":"製造施設の変更・完成検査","tags":[],"question":"次のイ、ロ、ハの記述のうち、冷凍のため高圧ガスの製造をする第一種製造者（認定完成検査実施者又は認定高度保安実施者である者を除く。）が行う製造施設の変更の工事について正しいものはどれか。\nイ．独立した製造設備の撤去の工事は、定められた軽微な変更の工事として、その完成後遅滞なく、その旨を都道府県知事等に届け出ればよい。\nロ．特定不活性ガスを冷媒ガスとする冷媒設備の圧縮機の取替えの工事は、冷媒設備に係る切断、溶接を伴わない工事であって、その設備の冷凍能力の変更を伴わないものであれば、定められた軽微な変更の工事に該当する。\nハ．製造施設の変更の工事について都道府県知事等の許可を受けた場合であっても、完成検査を受けることなくその施設を使用することができる変更の工事がある。","options":["(1) イ","(2) イ、ロ","(3) イ、ハ","(4) ロ、ハ","(5) イ、ロ、ハ"],"answer":5,"explanation":"・独立した製造設備の撤去の工事は、定められた軽微な変更の工事として、その完成後遅滞なく、その旨を都道府県知事等に届け出ればよい。\n・特定不活性ガスを冷媒ガスとする冷媒設備の圧縮機の取替えの工事は、冷媒設備に係る切断、溶接を伴わない工事であって、その設備の冷凍能力の変更を伴わないものであれば、定められた軽微な変更の工事に該当する。\n・製造施設の変更の工事について都道府県知事等の許可を受けた場合であっても、完成検査を受けることなくその施設を使用することができる変更の工事がある。","has_image":false,"image_path":null},{"id":"R06-Horitsu-Q15","year":"R06","subject":"法令","category":"定置式製造設備(アンモニア)","tags":[],"question":"次のイ、ロ、ハの記述のうち、製造設備がアンモニアを冷媒ガスとする定置式製造設備（吸収式アンモニア冷凍機であるものを除く。）である第一種製造者の製造施設に係る技術上の基準について冷凍保安規則上正しいものはどれか。\nイ．製造施設の冷媒設備に設けた安全弁の放出管の開口部の位置は、放出する冷媒ガスの性質に応じた適切な位置でなければならない。\nロ．圧縮機、油分離器、受液器又はこれらの間の配管を設置する室は、冷媒ガスが漏えいしたとき滞留しないような構造としなければならないが、凝縮器を設置する室についてはその定めはない。\nハ．受液器にガラス管液面計を設ける場合には、丸形ガラス管液面計以外のものとし、その液面計の破損を防止するための措置のほか、受液器とその液面計とを接続する配管にその液面計の破損による漏えいを防止するための措置を講じなければならない。","options":["(1) イ","(2) ハ","(3) イ、ロ","(4) イ、ハ","(5) イ、ロ、ハ"],"answer":4,"explanation":"・冷媒設備に設けた安全弁の放出管の開口部の位置は、放出する冷媒ガスの性質に応じた適切な位置としなければならない。\n・圧縮機、油分離器、凝縮器若しくは受液器又はこれらの間の配管を設置する室は、冷媒ガスが漏えいしたとき滞留しないような構造としなければならない。\n・受液器にガラス管液面計を設ける場合には、丸形ガラス管液面計以外のものとし、その液面計の破損を防止するための措置のほか、受液器とその液面計とを接続する配管にその液面計の破損による漏えいを防止するための措置を講じなければならない。","has_image":false,"image_path":null},{"id":"R06-Horitsu-Q16","year":"R06","subject":"法令","category":"定置式製造設備(アンモニア)","tags":[],"question":"次のイ、ロ、ハの記述のうち、製造設備がアンモニアを冷媒ガスとする定置式製造設備（吸収式アンモニア冷凍機であるものを除く。）である第一種製造者の製造施設に係る技術上の基準について冷凍保安規則上正しいものはどれか。\nイ．製造施設から漏えいする冷媒ガスが滞留するおそれのある場所に、その冷媒ガスの漏えいを検知し、かつ、警報するための設備を設けた場合であっても、その製造施設にはその規模に応じて、適切な消火設備を適切な箇所に設けなければならない。\nロ．この冷媒ガスは、冷媒設備に係る電気設備をその設置場所及び冷媒ガスの種類に応じた防爆性能を有する構造のものとしなければならない冷媒ガスである。\nハ．製造設備が専用機械室に設置されている場合であっても、その製造設備には冷媒ガスが漏えいしたときに安全に、かつ、速やかに除害するための措置を講じなければならない。","options":["(1) イ","(2) イ、ロ","(3) イ、ハ","(4) ロ、ハ","(5) イ、ロ、ハ"],"answer":3,"explanation":"・製造施設から漏えいする冷媒ガスが滞留するおそれのある場所に、その冷媒ガスの漏えいを検知し、かつ、警報するための設備を設けた場合であっても、その製造施設にはその規模に応じて、適切な消火設備を適切な箇所に設けなければならない。\n・冷媒設備に係る電気設備が、その設置場所及び冷媒ガスの種類に応じた防爆性能を有する構造のものであるべき定めはあるが、アンモニアを冷媒ガスとする製造施設には適用されない。\n・製造設備が専用機械室に設置されている場合であっても、その製造設備には冷媒ガスが漏えいしたときに安全に、かつ、速やかに除害するための措置を講じなければならない。","has_image":false,"image_path":null},{"id":"R06-Horitsu-Q17","year":"R06","subject":"法令","category":"定置式製造設備(全般)","tags":[],"question":"次のイ、ロ、ハの記述のうち、製造設備が定置式製造設備である第一種製造者の製造施設に係る技術上の基準について冷凍保安規則上正しいものはどれか。\nイ．内容積が5000 リットル以上である受液器並びにその支持構造物及び基礎を所定の耐震に関する性能を有するものとすべき定めは、不活性ガスを冷媒ガスとする製造施設にも適用される。\nロ．冷媒設備の配管の変更の工事の完成検査における気密試験は、安全装置が作動しないように許容圧力未満の圧力で行うことができる。\nハ．圧縮機、油分離器、凝縮器及び受液器並びにこれらの間の配管が火気（その製造設備内のものを除く。）の付近にあってはならない旨の定めは、不活性ガスを冷媒ガスとする製造施設には適用されない。","options":["(1) イ","(2) ロ","(3) ハ","(4) イ、ロ","(5) ロ、ハ"],"answer":1,"explanation":"・内容積が5000リットル以上である受液器並びにその支持構造物及び基礎を所定の耐震に関する性能を有するものとすべき定めは、不活性ガスを冷媒ガスとする製造施設にも適用される\n・気密試験は、許容圧力以上の圧力で行わなければならない。\n・圧縮機、油分離器、凝縮器及び受液器並びにこれらの間の配管が火気（その製造設備内のものを除く。）の付近にあってはならない旨の定めは、不活性ガスを冷媒ガスとする製造施設にも適用される。","has_image":false,"image_path":null},{"id":"R06-Horitsu-Q18","year":"R06","subject":"法令","category":"定置式製造設備(全般)","tags":[],"question":"次のイ、ロ、ハの記述のうち、製造設備が定置式製造設備である第一種製造者の製造施設に係る技術上の基準について冷凍保安規則上正しいものはどれか。\nイ．製造設備に設けたバルブ（自動制御で開閉されるものを除く。）には、作業員が適切に操作できるような措置を講じなければならないが、不活性ガスを冷媒ガスとする製造設備にはその措置を講じなくてよい。\nロ．冷媒設備に圧力計を設け、かつ、その圧力を常時監視することとすれば、その冷媒設備には、圧縮機内の圧力が許容圧力を超えた場合に直ちに許容圧力以下に戻すことができる安全装置を設けなくてよい。\nハ．変更の工事における完成検査において冷媒設備の配管以外の部分について耐圧試験を行う場合、特に認められた者が行う場合を除き、水その他の安全な液体を使用して許容圧力の1.5 倍（液体を使用することが困難であると認められるときは、空気、窒素等の気体を使用して許容圧力の1.25 倍）以上の圧力で行わなければならない。","options":["(1) イ","(2) ロ","(3) ハ","(4) イ、ハ","(5) ロ、ハ"],"answer":3,"explanation":"・製造設備に設けたバルブ（自動制御で開閉されるものを除く。）には、作業員が適切に操作できるような措置を講じなければならないが、製造設備に設けたバルブが操作ボタン等により開閉される場合にあっては、その操作ボタン等についても同様の措置を講じなければならない。\n・冷媒設備に圧力計を設け、かつ、その圧力を常時監視することとしても、その冷媒設備には、圧縮機内の圧力が許容圧力を超えた場合に直ちに許容圧力以下に戻すことができる安全装置を設けなければならない。\n・変更の工事における完成検査において冷媒設備の配管以外の部分について耐圧試験を行う場合、特に認められた者が行う場合を除き、水その他の安全な液体を使用して許容圧力の1.5倍（液体を使用することが困難であると認められるときは、空気、窒素等の気体を使用して許容圧力の1.25倍）以上の圧力で行わなければならない。","has_image":false,"image_path":null},{"id":"R06-Horitsu-Q19","year":"R06","subject":"法令","category":"製造の方法","tags":[],"question":"次のイ、ロ、ハの記述のうち、第一種製造者の製造の方法に係る技術上の基準について冷凍保安規則上正しいものはどれか。\nイ．冷媒設備の安全弁の修理又は清掃のため特に必要な場合を除き、その安全弁に付帯して設けた止め弁は、常に全開しておかなければならない。\nロ．冷媒設備を開放して修理又は清掃をするとき、その冷媒ガスが不活性ガスである場合は、その開放する部分に他の部分からガスが漏えいすることを防止するための措置を講じないで行うことができる。\nハ．高圧ガスの製造は、製造する高圧ガスの種類及び製造設備の態様に応じ、1 日に1 回以上その製造設備の属する製造施設の異常の有無を点検し、異常のあるときは、その設備の補修その他の危険を防止する措置を講じて行わなければならない。","options":["(1) イ","(2) イ、ロ","(3) イ、ハ","(4) ロ、ハ","(5) イ、ロ、ハ"],"answer":3,"explanation":"・冷媒設備の安全弁の修理又は清掃のため特に必要な場合を除き、その安全弁に付帯して設けた止め弁は、常に全開しておかなければならない。\n・冷媒設備を開放して修理又は清掃をするときは、その開放する部分に他の部分からガスが漏えいすることを防止するための措置を講じなければならない。冷媒ガスが不活性ガスである場合も同様である。\n・高圧ガスの製造は、製造する高圧ガスの種類及び製造設備の態様に応じ、1日に1回以上その製造設備の属する製造施設の異常の有無を点検し、異常のあるときは、その設備の補修その他の危険を防止する措置を講じて行わなければならない。","has_image":false,"image_path":null},{"id":"R06-Horitsu-Q20","year":"R06","subject":"法令","category":"認定指定設備","tags":[],"question":"次のイ、ロ、ハの記述のうち、認定指定設備である製造設備について冷凍保安規則上正しいものはどれか。\nイ．冷媒設備は、その設備の製造業者の事業所において脚上又は一つの架台上に組み立てられたものでなければならない。\nロ．製造設備には、自動制御装置を設けなければならない。\nハ．認定指定設備に変更の工事を施すと、指定設備認定証が無効になる場合がある。","options":["(1) イ","(2) ロ","(3) イ、ロ","(4) ロ、ハ","(5) イ、ロ、ハ"],"answer":5,"explanation":"・冷媒設備は、その設備の製造業者の事業所において脚上又は一つの架台上に組み立てられたものでなければならない。\n・製造設備には、自動制御装置を設けなければならない。\n・認定指定設備に変更の工事を施すと、指定設備認定証が無効になる場合がある。","has_image":false,"image_path":null},{"id":"R07-Horitsu-Q01","year":"R07","subject":"法令","category":"高圧ガスの定義等","tags":[],"question":"次のイ、ロ、ハの記述のうち、正しいものはどれか。\nイ．高圧ガス保安法は、高圧ガスによる災害を防止して公共の安全を確保する目的のため、民間事業者及び高圧ガス保安協会による高圧ガスの保安に関する自主的な活動を促進することも定めている。\nロ．常用の温度35度において圧力が1メガパスカルとなる圧縮ガス（圧縮アセチレンガスを除く。）であって、現在の圧力が0.9メガパスカルのものは高圧ガスではない。\nハ．圧力が0.2メガパスカルとなる場合の温度が32度である液化ガスは、現在の圧力が0.1メガパスカルであっても高圧ガスである。","options":["(1) イ","(2) イ、ロ","(3) イ、ハ","(4) ロ、ハ","(5) イ、ロ、ハ"],"answer":3,"explanation":"・高圧ガス保安法は、高圧ガスによる災害を防止して公共の安全を確保する目的のため、民間事業者及び高圧ガス保安協会による高圧ガスの保安に関する自主的な活動を促進することも定めている。\n・現在の圧力が0.9メガパスカルであっても、温度35度において圧力が1メガパスカルとなる圧縮ガスは高圧ガスである（圧縮アセチレンガスを除く）。\n・圧力が0.2メガパスカルとなる場合の温度が32度である液化ガスは、現在の圧力が0.1メガパスカルであっても高圧ガスである。","has_image":false,"image_path":null},{"id":"R07-Horitsu-Q02","year":"R07","subject":"法令","category":"適用除外・事業(製造・販売・廃棄等)","tags":[],"question":"次のイ、ロ、ハのうち、高圧ガス保安法の適用が除外される高圧ガスはどれか。\nイ．1日の冷凍能力が3トン未満の冷凍設備内における高圧ガス\nロ．1日の冷凍能力が3トン以上5トン未満の冷凍設備内におけるフルオロカーボン（難燃性を有するものとして所定の燃焼性の基準に適合するものに限る。）\nハ．フルオロカーボン回収装置内におけるフルオロカーボン（特に定めるものに限る。）","options":["(1) イ","(2) イ、ロ","(3) イ、ハ","(4) ロ、ハ","(5) イ、ロ、ハ"],"answer":5,"explanation":"・1日の冷凍能力が3トン未満の冷凍設備内における高圧ガスは、高圧ガス保安法の適用が除外される。\n・1日の冷凍能力が3トン以上5トン未満の冷凍設備内におけるフルオロカーボン（難燃性を有するものとして所定の燃焼性の基準に適合するものに限る。）は、高圧ガス保安法の適用が除外される。\n・フルオロカーボン回収装置内におけるフルオロカーボン（特に定めるものに限る。）は、高圧ガス保安法の適用が除外される。","has_image":false,"image_path":null},{"id":"R07-Horitsu-Q03","year":"R07","subject":"法令","category":"適用除外・事業(製造・販売・廃棄等)","tags":[],"question":"次のイ、ロ、ハのうち、高圧ガスの製造について都道府県知事等の許可を受けなければならない者はどれか。\nイ．1日の冷凍能力が300トンである認定指定設備のみを使用して、冷凍のため高圧ガスの製造をしようとする者\nロ．アンモニアを冷媒ガスとする1日の冷凍能力が50トンである製造設備のみを使用して、冷凍のため高圧ガスの製造をしようとする者\nハ．フルオロカーボンを冷媒ガスとする1日の冷凍能力が40トンである製造設備（認定指定設備を除く。）のみを使用して、冷凍のため高圧ガスの製造をしようとする者","options":["(1) イ","(2) ロ","(3) ハ","(4) イ、ロ","(5) イ、ロ、ハ"],"answer":2,"explanation":"・認定指定設備のみを使用して、冷凍のため高圧ガスの製造をしようとする者は、都道府県知事等の許可を受ける必要がない\n・アンモニアを冷媒ガスとする1日の冷凍能力が50トン以上である製造設備のみを使用して、冷凍のため高圧ガスの製造をしようとする者は、都道府県知事等の許可を受けなければならない\n・フルオロカーボンを冷媒ガスとする1日の冷凍能力が50トン未満である製造設備（認定指定設備を除く。）のみを使用して、冷凍のため高圧ガスの製造をしようとする者は、都道府県知事等の許可を受ける必要がない。","has_image":false,"image_path":null},{"id":"R07-Horitsu-Q04","year":"R07","subject":"法令","category":"高圧ガスの貯蔵","tags":[],"question":"次のイ、ロ、ハの記述のうち、冷凍のため高圧ガスの製造をする事業所における冷媒ガスの補充用としての容器による高圧ガス（質量が1.5キログラムを超えるもの）の貯蔵の方法に係る技術上の基準について一般高圧ガス保安規則上正しいものはどれか。\nイ．車両に固定した容器により高圧ガスを貯蔵することは禁じられているが、車両に積載した容器により高圧ガスを貯蔵することはいかなる場合でも禁じられていない\nロ．液化アンモニアを充填容器及び残ガス容器により貯蔵する場合は、通風の良い場所で行わなければならないが、特定不活性ガスである液化フルオロカーボンについては、その定めはない\nハ．液化アンモニアを充填容器及び残ガス容器により貯蔵する場合は、その容器を常に所定の温度以下に保たなければならないが、不活性ガスである液化フルオロカーボンについては、いかなる場合であっても、その定めはない","options":["(1) ロ","(2) イ、ロ","(3) イ、ハ","(4) ロ、ハ","(5) イ、ロ、ハ"],"answer":1,"explanation":"・高圧ガスの貯蔵は、特に定められている場合を除き、車両等に固定し、又は積載した容器によりしてはならない\n・アンモニアは、可燃性ガス及び毒性ガスに分類されており、充填容器及び残ガス容器により貯蔵する場合は、通風の良い場所で行わなければならないが、特定不活性ガスである液化フルオロカーボンについては、その定めはない\n・充填容器等は、常に温度40度以下に保たなければならない。不活性ガスである液化フルオロカーボンについても同様である","has_image":false,"image_path":null},{"id":"R07-Horitsu-Q05","year":"R07","subject":"法令","category":"高圧ガスの移動","tags":[],"question":"次のイ、ロ、ハの記述のうち、車両に積載した容器（内容積が48リットルのもの）による冷凍設備の冷媒ガスの補充用の高圧ガスの移動に係る技術上の基準等について一般高圧ガス保安規則上正しいものはどれか\nイ．不活性ガスである液化フルオロカーボンを移動するときは、その車両の見やすい箇所に警戒標を掲げる必要がある。\nロ．可燃性ガス、毒性ガス又は特定不活性ガスを移動するときは、その高圧ガスの名称、性状及び移動中の災害防止のために必要な注意事項を記載した書面を運転者に交付し、移動中携帯させ、これを遵守させなければならない\nハ．液化アンモニアを移動するときは、その充填容器に転落、転倒等による衝撃及びバルブの損傷を防止する措置を講じ、かつ、粗暴な取扱いをしてはならないが、不活性ガスである液化フルオロカーボンを移動するときは、その定めはない","options":["(1) イ","(2) ロ","(3) イ、ロ","(4) ロ、ハ","(5) イ、ロ、ハ"],"answer":3,"explanation":"・充填容器等を車両に積載して移動するとき（容器の内容積が25リットル以下である充填容器等（毒性ガスに係るものを除く。）のみを積載した車両であって、当該積載容器の内容積の合計が50リットル以下である場合を除く。）は、当該車両の見やすい箇所に警戒標を掲げなければならない。\n・可燃性ガス、毒性ガス、特定不活性ガス又は酸素の高圧ガスを移動するときは、当該高圧ガスの名称、性状及び移動中の災害防止のために必要な注意事項を記載した書面を運転者に交付し、移動中携帯させ、これを遵守させなければならない。\n・内容積が5リットルを超える充填容器等には、転落、転倒等による衝撃及びバルブの損傷を防止する措置を講じ、かつ粗暴な取扱いをしてはならない。不活性ガスである液化フルオロカーボンについても同様である。","has_image":false,"image_path":null},{"id":"R07-Horitsu-Q06","year":"R07","subject":"法令","category":"高圧ガスの充填容器","tags":[],"question":"次のイ、ロ、ハの記述のうち、冷凍設備の冷媒ガスの補充用の高圧ガスを充填するための容器（再充填禁止容器を除く。）について容器保安規則上正しいものはどれか\nイ．容器に充填することができる液化フルオロカーボン32の質量は、次の算式で表される。\nG＝V/C\nG：液化フルオロカーボン32の質量（単位　キログラム）の数値\nV：容器の内容積（単位　リットル）の数値\nC：容器保安規則で定める定数又は数値\nロ．容器の外面の塗色は高圧ガスの種類に応じて定められており、液化アンモニアの容器の場合は、ねずみ色である。\nハ．容器検査に合格した容器に刻印をすべき事項の一つに、その容器が受けるべき次回の容器再検査の年月がある。","options":["(1) イ","(2) ハ","(3) イ、ロ","(4) ロ、ハ","(5) イ、ロ、ハ"],"answer":1,"explanation":"・イはその通り\n・容器の外面の塗色は高圧ガスの種類に応じて定められており、液化アンモニアの容器の場合は、白色である。\n（酸素：黒、水素：赤、液化炭酸：緑、アンモニア：白、塩素：黄色、アセチレン：褐色、その他：ねずみ色）\n・容器検査に合格した容器に刻印をすべき事項の一つに、容器検査に合格した年月は定められているが、次回の容器再検査の年月については定められていない。","has_image":false,"image_path":null},{"id":"R07-Horitsu-Q07","year":"R07","subject":"法令","category":"冷凍能力の算定基準","tags":[],"question":"次のイ、ロ、ハの記述のうち、冷凍能力の算定基準について冷凍保安規則上正しいものはどれか\nイ．圧縮機の原動機の定格出力の数値は、遠心式圧縮機を使用する製造設備の1日の冷凍能力の算定に必要な数値の一つである。\nロ．蒸発器の冷媒ガスに接する側の表面積の数値は、吸収式冷凍設備の1日の冷凍能力の算定に必要な数値の一つである。\nハ．冷媒ガスの種類に応じて定められた数値又は所定の算式により得られた数値（C）は、容積圧縮式（往復動式）圧縮機を使用する製造設備の1日の冷凍能力の算定に必要な数値の一つである。","options":["(1) ハ","(2) イ、ロ","(3) イ、ハ","(4) ロ、ハ","(5) イ、ロ、ハ"],"answer":3,"explanation":"・遠心式圧縮機を使用する製造設備にあっては、当該圧縮機の原動機の定格出力1.2キロワットをもって1日の冷凍能力1トンとする。よって、圧縮機の原動機の定格出力の数値は、遠心式圧縮機を使用する冷凍設備の1日の冷凍能力の算定に必要な数値の一つである。\n・蒸発部又は蒸発器の冷媒ガスに接する側の表面積の数値は、自然環流式冷凍設備及び自然循環式冷凍設備の1日の冷凍能力の算定に必要な数値の一つである。吸収式冷凍設備にあっては、発生器を加熱する1時間の入熱量27,800キロジュールをもって1日の冷凍能力1トンとする。\n・冷凍則第5条第一号から三号に掲げる製造設備（遠心式圧縮機を使用する製造設備、吸収式冷凍設備、自然環流式冷凍設備及び自然循環式冷凍設備）以外の製造設備にあっては、次の算式によるものをもって1日の冷凍能力とする。\n　R＝V÷C\n　　R　1日の冷凍能力（単位　トン）の数値\n　　V　圧縮機の標準回転速度における1時間のピストン押しのけ量（単位　立方メートル）の数値\n　　C　冷媒ガスの種類に応じて定められた数値又は所定の算式により得られた数値\nよって、冷媒ガスの種類に応じて定められた数値又は所定の算式により得られた数値（C）は、容積圧縮式（往復動式）圧縮機を使用する製造設備の1日の冷凍能力の算定に必要な数値の一つである。","has_image":false,"image_path":null},{"id":"R07-Horitsu-Q08","year":"R07","subject":"法令","category":"第二種製造者(全般)","tags":[],"question":"次のイ、ロ、ハの記述のうち、冷凍のため高圧ガスの製造をする第二種製造者について正しいものはどれか。\nイ．「第二種製造者」とは、その製造をする高圧ガスの種類に関係なく、1日の冷凍能力が3トン以上50トン未満である製造設備を使用して高圧ガスの製造をする者である。\nロ．第二種製造者は、製造設備の変更の工事が完成したとき、許容圧力以上の圧力で行う所定の気密試験を行った後に高圧ガスの製造をすることができる。\nハ．第二種製造者のうちには、製造施設について定期自主検査を行わなければならない者がある。","options":["(1) イ","(2) ロ","(3) ハ","(4) ロ、ハ","(5) イ、ロ、ハ"],"answer":4,"explanation":"・第二種製造者であるかどうかは、製造をする高圧ガスの種類によって異なる。第二種製造者とは、1日の冷凍能力が3トン以上20トン未満（第1種ガスの場合は20トン以上50トン未満、難燃性以外のフルオロカーボン及びアンモニアの場合は5トン以上50トン未満）のものを使用して高圧ガスの製造をしようとする者である。\n※第1種ガス：ヘリウム、ネオン、アルゴン、クリプトン、キセノン、ラドン、窒素、二酸化炭素、難燃性フルオロカーボン、空気\n・第二種製造者は、製造設備の変更の工事が完成したとき、許容圧力以上の圧力で行う所定の気密試験を行った後に高圧ガスの製造をすることができる。\n・第二種製造者のうちには、製造施設について定期自主検査を行わなければならない者がある。","has_image":false,"image_path":null},{"id":"R07-Horitsu-Q09","year":"R07","subject":"法令","category":"冷凍保安責任者・代理者","tags":[],"question":"次のイ、ロ、ハの記述のうち、冷凍保安責任者を選任すべき事業所（認定高度保安実施者に係る事業所を除く。）における冷凍保安責任者及びその代理者について正しいものはどれか。\nイ．1日の冷凍能力が100トンである製造施設の冷凍保安責任者には、第三種冷凍機械責任者免状の交付を受け、かつ、高圧ガスの製造に関する所定の経験を有する者を選任することができる。\nロ．冷凍保安責任者が旅行、疾病その他の事故によってその職務を行うことができない場合は、直ちに、所定の高圧ガスに関する知識を有する者のうちから代理者を選任し、都道府県知事等に届け出なければならない。\nハ．選任していた冷凍保安責任者を解任し、新たに選任したときは、遅滞なく、その解任及び選任の旨を都道府県知事等に届け出なければならない。","options":["(1) イ","(2) ロ","(3) ハ","(4) ロ、ハ","(5) イ、ロ、ハ"],"answer":3,"explanation":"・1日の冷凍能力が100トン以上である製造施設の冷凍保安責任者には、第三種冷凍機械責任者を選任することができない\n・冷凍保安責任者が旅行、疾病その他の事故によってその職務を行うことができない場合は、あらかじめ選任した冷凍保安責任者の代理者にその職務を代行させなければならない\n・選任していた冷凍保安責任者を解任し、新たに選任したときは、遅滞なく、その解任及び選任の旨を都道府県知事等に届け出なければならない。","has_image":false,"image_path":null},{"id":"R07-Horitsu-Q10","year":"R07","subject":"法令","category":"保安検査","tags":[],"question":"次のイ、ロ、ハの記述のうち、冷凍のため高圧ガスの製造をする第一種製造者（認定保安検査実施者又は認定高度保安実施者である者を除く。）が受ける保安検査について正しいものはどれか\nイ．特定施設について、定期に、都道府県知事等、高圧ガス保安協会又は指定保安検査機関が行う保安検査を受けなければならない。\nロ．高圧ガス保安協会又は指定保安検査機関が行う保安検査を受け、その旨を都道府県知事等に届け出た場合は、都道府県知事等が行う保安検査を受けなくてよい。\nハ．保安検査は、特定施設についてその位置、構造及び設備が所定の技術上の基準に適合しているかどうかについて行われる","options":["(1) イ","(2) イ、ロ","(3) イ、ハ","(4) ロ、ハ","(5) イ、ロ、ハ"],"answer":5,"explanation":"・特定施設について、定期に、都道府県知事等、高圧ガス保安協会又は指定保安検査機関が行う保安検査を受けなければならない。\n・高圧ガス保安協会又は指定保安検査機関が行う保安検査を受け、その旨を都道府県知事等に届け出た場合は、都道府県知事等が行う保安検査を受けなくてよい\n・保安検査は、特定施設についてその位置、構造及び設備が所定の技術上の基準に適合しているかどうかについて行われる。","has_image":false,"image_path":null},{"id":"R07-Horitsu-Q11","year":"R07","subject":"法令","category":"定期自主検査","tags":[],"question":"次のイ、ロ、ハの記述のうち、冷凍のため高圧ガスの製造をする第一種製造者（認定高度保安実施者である者を除き、冷凍保安責任者を選任すべき者に限る。）が行う定期自主検査について正しいものはどれか。\nイ．定期自主検査は、製造施設の位置、構造及び設備が所定の技術上の基準（耐圧試験に係るものを除く。）に適合しているかどうかについて、特に定める場合を除き、1年に1回以上行わなければならない。\nロ．定期自主検査を行うときは、選任している冷凍保安責任者にその定期自主検査の実施について監督を行わせなければならない\nハ．定期自主検査を行ったときは、その検査記録を作成し、保存しなければならないが、これを都道府県知事等に届け出るべき定めはない","options":["(1) ロ","(2) イ、ロ","(3) イ、ハ","(4) ロ、ハ","(5) イ、ロ、ハ"],"answer":5,"explanation":"・定期自主検査は、製造施設の位置、構造及び設備が所定の技術上の基準（耐圧試験に係るものを除く。）に適合しているかどうかについて、特に定める場合を除き、1年に1回以上行わなければならない。\n・定期自主検査を行うときは、選任している冷凍保安責任者にその定期自主検査の実施について監督を行わせなければならない。\n・定期自主検査を行ったときは、その検査記録を作成し、保存しなければならないが、これを都道府県知事等に届け出るべき定めはない","has_image":false,"image_path":null},{"id":"R07-Horitsu-Q12","year":"R07","subject":"法令","category":"危害予防規程・保安教育計画","tags":[],"question":"次のイ、ロ、ハの記述のうち、冷凍のため高圧ガスの製造をする第一種製造者（認定高度保安実施者である者を除く。）が定めるべき危害予防規程及び保安教育計画について正しいものはどれか。\nイ．第一種製造者は、危害予防規程を定め、災害の発生の防止に努めなければならないが、その規程を都道府県知事等に届け出るべき定めはない\nロ．大規模な地震に係る防災及び減災対策に関することは、危害予防規程に定めるべき事項の一つである\nハ．第一種製造者は、従業者に対する保安教育計画を定め、これを忠実に実行しなければならないが、その保安教育計画を都道府県知事等に届け出るべき定めはない","options":["(1) ロ","(2) イ、ロ","(3) イ、ハ","(4) ロ、ハ","(5) イ、ロ、ハ"],"answer":4,"explanation":"・第一種製造者は、危害予防規程を定め、都道府県知事に届け出なければならない\n・大規模な地震に係る防災及び減災対策に関することは、危害予防規程に定めるべき事項の一つである。\n・第一種製造者は、従業者に対する保安教育計画を定め、これを忠実に実行しなければならないが、その保安教育計画を都道府県知事等に届け出るべき定めはない。","has_image":false,"image_path":null},{"id":"R07-Horitsu-Q13","year":"R07","subject":"法令","category":"危険時の措置等","tags":[],"question":"次のイ、ロ、ハの記述のうち、冷凍のため高圧ガスの製造をする第一種製造者について正しいものはどれか。\nイ．高圧ガスの製造のための施設が危険な状態となっている事態を発見したときは、直ちに、その旨を都道府県知事等又は警察官、消防吏員若しくは消防団員若しくは海上保安官に届け出なければならない\nロ．その所有する高圧ガスについて災害が発生したときは、遅滞なく、その旨を都道府県知事等又は警察官に届け出なければならないが、占有する容器を盗まれたときは、その届出の必要はない\nハ．令和2年（2020年）11月1日に製造施設に異常があったので、その年月日及びそれに対してとった措置を帳簿に記載し、これを保存していたが、その後その製造施設に異常がなかったので、令和7年（2025年）11月1日にその帳簿を廃棄した。","options":["(1) イ","(2) ロ","(3) ハ","(4) イ、ロ","(5) イ、ハ"],"answer":2,"explanation":"・高圧ガスの製造のための施設が危険な状態となっている事態を発見したときは、直ちに、その旨を都道府県知事等又は警察官、消防吏員若しくは消防団員若しくは海上保安官に届け出なければならない。\n・その所有する高圧ガスについて災害が発生したときは、遅滞なく、その旨を都道府県知事等又は警察官に届け出なければならない。占有する容器を盗まれたときも同様である。\n・製造施設に異常があった年月日及びそれに対してとった措置を記載した帳簿は、記載の日から10年間保存しなければならない。","has_image":false,"image_path":null},{"id":"R07-Horitsu-Q14","year":"R07","subject":"法令","category":"製造施設の変更・完成検査","tags":[],"question":"次のイ、ロ、ハの記述のうち、冷凍のため高圧ガスの製造をする第一種製造者（認定完成検査実施者及び認定高度保安実施者である者を除く。）が行う製造施設の変更の工事について正しいものはどれか。\nイ．高圧ガスの製造施設の特定変更工事を完成し、都道府県知事等が行う完成検査を受けた場合、これが技術上の基準に適合していると認められた後に、その施設を使用することができる。\nロ．製造施設の位置、構造又は設備の変更の工事について、都道府県知事等の許可を受けた場合であっても、完成検査を受けることなく、その製造施設を使用することができる変更の工事の定めがあるが、その定めはアンモニアを冷媒ガスとする冷媒設備には適用されない。\nハ．特定不活性ガスであるフルオロカーボンを冷媒ガスとする冷媒設備の圧縮機の取替えの工事は、冷媒設備に係る切断、溶接を伴わない工事であって、その設備の冷凍能力の変更を伴わないものであっても、定められた軽微な変更の工事には該当しない。","options":["(1) イ","(2) イ、ロ","(3) イ、ハ","(4) ロ、ハ","(5) イ、ロ、ハ"],"answer":1,"explanation":"・高圧ガスの製造施設の特定変更工事を完成し、都道府県知事等が行う完成検査を受けた場合、これが技術上の基準に適合していると認められた後に、その施設を使用することができる。\n・製造施設の位置、構造又は設備の変更の工事について、都道府県知事等の許可を受けた場合であっても、完成検査を受けることなく、その製造施設を使用することができる変更の工事の定めがあるが、その定めは可燃性ガス及び毒性ガスを冷媒ガスとする冷媒設備には適用されない。\n・特定不活性ガスを冷媒ガスとする冷媒設備の圧縮機の取替えの工事は、冷媒設備に係る切断、溶接を伴わない工事であって、その設備の冷凍能力の変更を伴わないものであれば、定められた軽微な変更の工事に該当する。","has_image":false,"image_path":null},{"id":"R07-Horitsu-Q15","year":"R07","subject":"法令","category":"定置式製造設備(アンモニア)","tags":[],"question":"次のイ、ロ、ハの記述のうち、製造設備がアンモニアを冷媒ガスとする定置式製造設備（吸収式アンモニア冷凍機であるものを除く。）である第一種製造者の製造施設に係る技術上の基準について冷凍保安規則上正しいものはどれか。\nイ．製造設備が専用機械室に設置され、かつ、その室を常時強制換気している場合、冷媒設備に設けた安全弁の放出管の開口部の位置については、特に定められていない。\nロ．製造設備が専用機械室に設置される場合は、アンモニアが漏えいしたときに安全に、かつ、速やかに除害するための措置を講じなくてよい。\nハ．圧縮機、油分離器、凝縮器若しくは受液器又はこれらの間の配管を設置する室は、冷媒ガスが漏えいしたとき滞留しないような構造としなければならない。","options":["(1) イ","(2) ロ","(3) ハ","(4) イ、ハ","(5) ロ、ハ"],"answer":3,"explanation":"・冷媒設備に設けた安全弁の放出管の開口部の位置は、放出する冷媒ガスの性質に応じた適切な位置としなければならない。\n・製造設備が専用機械室に設置されている場合であっても、その製造設備には冷媒ガスが漏えいしたときに安全に、かつ、速やかに除害するための措置を講じなければならない。\n・圧縮機、油分離器、凝縮器若しくは受液器又はこれらの間の配管を設置する室は、冷媒ガスが漏えいしたとき滞留しないような構造としなければならない。","has_image":false,"image_path":null},{"id":"R07-Horitsu-Q16","year":"R07","subject":"法令","category":"定置式製造設備(アンモニア)","tags":[],"question":"次のイ、ロ、ハの記述のうち、製造設備がアンモニアを冷媒ガスとする定置式製造設備（吸収式アンモニア冷凍機であるものを除く。）である第一種製造者の製造施設に係る技術上の基準について冷凍保安規則上正しいものはどれか。\nイ．受液器には、その周囲に、冷媒ガスである液状のアンモニアが漏えいした場合にその流出を防止するための措置を講じなければならないものがあるが、その受液器の内容積が1万リットルであるものは、それに該当しない\nロ．受液器の液面計に丸形ガラス管液面計以外のガラス管液面計を使用する場合は、そのガラス管液面計には、その破損を防止するための措置を講じなくてよい。\nハ．製造設備が専用機械室に設置され、かつ、その室を常時強制換気している場合であっても、製造施設から漏えいしたガスが滞留するおそれのある場所には、そのガスの漏えいを検知し、かつ、警報するための設備を設けなければならない。","options":["(1) ロ","(2) ハ","(3) イ、ハ","(4) ロ、ハ","(5) イ、ロ、ハ"],"answer":2,"explanation":"・毒性ガスを冷媒ガスとする冷媒設備に係る受液器であって、その内容積が1万リットル以上の受液器の周囲には、液状の冷媒ガスが漏えいした場合にその流出を防止するための措置を講じなければならない。\n・受液器にガラス管液面計を設ける場合には、丸形ガラス管液面計以外のものとし、その液面計の破損を防止するための措置のほか、受液器とその液面計とを接続する配管にその液面計の破損による漏えいを防止するための措置を講じなければならない。\n・製造設備が専用機械室に設置され、かつ、その室を常時強制換気している場合であっても、製造施設から漏えいしたガスが滞留するおそれのある場所には、そのガスの漏えいを検知し、かつ、警報するための設備を設けなければならない。","has_image":false,"image_path":null},{"id":"R07-Horitsu-Q17","year":"R07","subject":"法令","category":"定置式製造設備(全般)","tags":[],"question":"次のイ、ロ、ハの記述のうち、製造設備が定置式製造設備である第一種製造者の製造施設に係る技術上の基準について冷凍保安規則上正しいものはどれか。\nイ．製造設備に設けたバルブ（自動制御で開閉されるものを除く。）には、作業員が適切に操作できるような措置を講じなければならないが、製造設備に設けたバルブが操作ボタン等により開閉される場合にあっては、その操作ボタン等についても同様の措置を講じなければならない。\nロ．凝縮器には所定の耐震に関する性能を有しなければならないものがあるが、縦置円筒形であって、かつ、胴部の長さが5メートルの凝縮器は、その必要はない。\nハ．完成検査において配管以外の冷媒設備について耐圧試験を行うときは、水その他の安全な液体を使用する場合、許容圧力の1.25倍の圧力で行わなければならない。","options":["(1) イ","(2) ロ","(3) イ、ハ","(4) ロ、ハ","(5) イ、ロ、ハ"],"answer":1,"explanation":"・製造設備に設けたバルブ（自動制御で開閉されるものを除く。）には、作業員が適切に操作できるような措置を講じなければならないが、製造設備に設けたバルブが操作ボタン等により開閉される場合にあっては、その操作ボタン等についても同様の措置を講じなければならない。\n・縦置円筒形であって、かつ、胴部の長さが5メートル以上の凝縮器は、所定の耐震に関する性能を有しなければならない。\n・完成検査において配管以外の冷媒設備について耐圧試験を行うときは、水その他の安全な液体を使用する場合、許容圧力の1.5倍以上の圧力で行わなければならない。","has_image":false,"image_path":null},{"id":"R07-Horitsu-Q18","year":"R07","subject":"法令","category":"定置式製造設備(全般)","tags":[],"question":"次のイ、ロ、ハの記述のうち、製造設備が定置式製造設備である第一種製造者の製造施設に係る冷凍保安規則に定める技術上の基準に適合しているものはどれか。\nイ．製造設備を設置した室に外部から容易に立ち入ることができないよう厳重な措置を講じたので、製造施設に警戒標を掲げていない。\nロ．完成検査において、冷媒設備の配管の気密試験を、許容圧力の1.1倍の圧力で行った。\nハ．製造設備の圧縮機と凝縮器との間の配管の付近に、製造設備外の火気を設置せざるを得なくなったので、その火気に対して安全な措置を講じた。","options":["(1) イ","(2) ロ","(3) ハ","(4) イ、ハ","(5) ロ、ハ"],"answer":5,"explanation":"・製造施設には、当該施設の外部から見やすいように警戒標を掲げなければならない。\n・完成検査において、冷媒設備の配管の気密試験は、許容圧力以上の圧力で行う。\n・圧縮機、油分離器、凝縮器及び受液器並びにこれらの間の配管は、引火性又は発火性の物をたい積した場所及び火気の付近にあってはならないが、当該火気に対して安全な措置を講じた場合は、この限りでない。","has_image":false,"image_path":null},{"id":"R07-Horitsu-Q19","year":"R07","subject":"法令","category":"製造の方法","tags":[],"question":"次のイ、ロ、ハの記述のうち、第一種製造者の製造の方法に係る冷凍保安規則に定める技術上の基準に適合しているものはどれか。\nイ．冷媒設備に設けた安全弁の修理及び清掃が終了した後、製造設備の運転を数日間停止するので、その間、安全弁に付帯して設けた止め弁を閉止することとした。\nロ．冷媒設備の修理が終了したので、その冷媒設備が正常に作動することを確認し、高圧ガスの製造をした。\nハ．冷媒設備の修理をするとき、あらかじめ、修理の作業計画及び作業の責任者を定めたが、その修理の際、その作業の責任者の監視の下で行うことができなくなったので、異常があったときに直ちにその旨をその責任者に通報するための措置を講じ、かつ、その修理の作業計画に従って行った。","options":["(1) イ","(2) ハ","(3) イ、ロ","(4) ロ、ハ","(5) イ、ロ、ハ"],"answer":4,"explanation":"・冷媒設備の安全弁の修理又は清掃のため特に必要な場合を除き、その安全弁に付帯して設けた止め弁は、常に全開しておかなければならない。\n・冷媒設備の修理が終了したときは、その冷媒設備が正常に作動することを確認した後でなければ高圧ガスの製造をしてはならない。\n・冷媒設備の修理又は清掃を行うときは、あらかじめ、その作業計画及びその作業の責任者を定め、修理又は清掃はその作業計画に従うとともに、その作業の責任者の監視の下で行うか、又は異常があったときに直ちにその旨をその責任者に通報するための措置を講じて行わなければならない。","has_image":false,"image_path":null},{"id":"R07-Horitsu-Q20","year":"R07","subject":"法令","category":"認定指定設備","tags":[],"question":"次のイ、ロ、ハの記述のうち、認定指定設備である製造設備について冷凍保安規則上正しいものはどれか。\nイ．製造設備が認定指定設備である条件の一つには、「日常の運転操作に必要となる冷媒ガスの止め弁には、手動式のものを使用しないこと。」がある。\nロ．製造設備が認定指定設備である条件の一つには、「冷媒設備は、その認定指定設備の製造業者の事業所において試運転を行い、使用場所に分割して搬入されたものでなければならないこと。」がある。\nハ．認定指定設備である製造設備に変更の工事（特に定められたものを除く。）を施したときは、指定設備認定証が無効となり、これを返納しなければならない。","options":["(1) イ","(2) ロ","(3) イ、ロ","(4) イ、ハ","(5) ロ、ハ"],"answer":4,"explanation":"・製造設備が認定指定設備である条件の一つには、「日常の運転操作に必要となる冷媒ガスの止め弁には、手動式のものを使用しないこと。」がある。\n・製造設備が認定指定設備である条件の一つには、「冷媒設備は、その認定指定設備の製造業者の事業所において試運転を行い、使用場所に分割されずに搬入されるものであること。」がある。\n・認定指定設備である製造設備に変更の工事（特に定められたものを除く。）を施したときは、指定設備認定証が無効となり、これを返納しなければならない。","has_image":false,"image_path":null}

// ========================================================
// アプリケーションロジック
// ========================================================
var allQuestions = [];
var currentQuestions = [];
var currentQuestion = null;
var currentIndex = 0;
var storageAvailable = false;

var STORAGE_KEY = 'reitou3_hourei_v2';

// localStorage の可用性チェック（プライベートブラウズ対策）
function checkStorage() {
  try {
    var test = '__storage_test__';
    localStorage.setItem(test, '1');
    localStorage.removeItem(test);
    storageAvailable = true;
  } catch(e) {
    storageAvailable = false;
    document.getElementById('storageBanner').style.display = 'block';
  }
}

function loadResults() {
  if (!storageAvailable) return {};
  try {
    return JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
  } catch(e) {
    return {};
  }
}

function saveResult(id, isCorrect, category) {
  if (!storageAvailable) return;
  var data = loadResults();
  if (!data[id]) {
    data[id] = { correct: 0, wrong: 0, category: category };
  }
  if (isCorrect) { data[id].correct++; } else { data[id].wrong++; }
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
  } catch(e) {
    // クォータ超過時: 古いデータを削除して再試行
    try {
      localStorage.removeItem(STORAGE_KEY);
      localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
    } catch(e2) {
      storageAvailable = false;
      document.getElementById('storageBanner').style.display = 'block';
    }
  }
}

function getStats() {
  var data = loadResults();
  var total = 0, correct = 0;
  for (var key in data) {
    if (Object.prototype.hasOwnProperty.call(data, key)) {
      correct += data[key].correct;
      total += data[key].correct + data[key].wrong;
    }
  }
  return {
    total: total,
    correct: correct,
    rate: total === 0 ? 0 : Math.round(correct / total * 100)
  };
}

function updateStats() {
  var stats = getStats();
  document.getElementById('totalQuestions').textContent = allQuestions.length;
  document.getElementById('correctRate').textContent = stats.rate + '%';
  document.getElementById('answerCount').textContent = stats.total;
  if (currentQuestions.length > 0) {
    document.getElementById('currentQuestionIndex').textContent = (currentIndex + 1) + ' / ' + currentQuestions.length;
  } else {
    document.getElementById('currentQuestionIndex').textContent = '-';
  }
  updateCategoryStats();
}

function updateCategoryStats() {
  var data = loadResults();
  var map = {};
  for (var key in data) {
    if (Object.prototype.hasOwnProperty.call(data, key)) {
      var item = data[key];
      if (!map[item.category]) {
        map[item.category] = { total: 0, correct: 0 };
      }
      map[item.category].correct += item.correct;
      map[item.category].total += item.correct + item.wrong;
    }
  }
  var body = document.getElementById('categoryStatsBody');
  body.innerHTML = '';
  var categories = Object.keys(map).sort();
  for (var i = 0; i < categories.length; i++) {
    var cat = categories[i];
    var row = document.createElement('tr');
    var rate = map[cat].total === 0 ? 0 : Math.round(map[cat].correct / map[cat].total * 100);
    row.innerHTML =
      '<td>' + cat + '</td>' +
      '<td>' + map[cat].total + '</td>' +
      '<td>' + map[cat].correct + '</td>' +
      '<td>' + rate + '%</td>';
    body.appendChild(row);
  }
}

function populateFilters() {
  var yearSet = {}, categorySet = {};
  for (var i = 0; i < allQuestions.length; i++) {
    yearSet[allQuestions[i].year] = true;
    categorySet[allQuestions[i].category] = true;
  }
  var yearFilter = document.getElementById('yearFilter');
  var categoryFilter = document.getElementById('categoryFilter');

  var years = Object.keys(yearSet).sort();
  for (var i = 0; i < years.length; i++) {
    var opt = document.createElement('option');
    opt.value = years[i];
    opt.textContent = years[i] + '年';
    yearFilter.appendChild(opt);
  }

  var categories = Object.keys(categorySet).sort();
  for (var i = 0; i < categories.length; i++) {
    var opt = document.createElement('option');
    opt.value = categories[i];
    opt.textContent = categories[i];
    categoryFilter.appendChild(opt);
  }
}

function startQuiz() {
  if (allQuestions.length === 0) {
    alert('データ準備中です。しばらくお待ちください。');
    return;
  }
  var year = document.getElementById('yearFilter').value;
  var category = document.getElementById('categoryFilter').value;
  var mode = document.getElementById('modeFilter').value;
  var results = loadResults();

  currentQuestions = [];
  for (var i = 0; i < allQuestions.length; i++) {
    var q = allQuestions[i];
    if (year !== 'all' && q.year !== year) continue;
    if (category !== 'all' && q.category !== category) continue;
    if (mode === 'wrongOnly' && (!results[q.id] || results[q.id].wrong === 0)) continue;
    if (mode === 'unanswered' && results[q.id]) continue;
    currentQuestions.push(q);
  }

  currentIndex = 0;
  if (currentQuestions.length === 0) {
    alert('該当する問題がありません。条件を変えてください。');
    return;
  }
  showQuestion();
}

function showQuestion() {
  currentQuestion = currentQuestions[currentIndex];
  document.getElementById('quizContent').style.display = 'block';
  document.getElementById('loadingMsg').style.display = 'none';
  document.getElementById('progressBar').style.display = 'none';
  document.getElementById('answerInfo').style.display = 'none';
  document.getElementById('nextBtn').style.display = 'none';

  document.getElementById('questionMeta').textContent =
    currentQuestion.year + '年 ／ ' + currentQuestion.category + ' ／ ' + currentQuestion.id;
  document.getElementById('questionText').textContent = currentQuestion.question;

  var container = document.getElementById('optionsContainer');
  container.innerHTML = '';

  for (var i = 0; i < currentQuestion.options.length; i++) {
    (function(idx, optText) {
      var btn = document.createElement('button');
      btn.className = 'option-btn';
      btn.textContent = optText;
      btn.setAttribute('type', 'button');
      btn.onclick = function() { answerQuestion(idx, btn); };
      container.appendChild(btn);
    })(i + 1, currentQuestion.options[i]);
  }

  updateStats();
  // ページトップへスクロール（モバイルで問題が見えないのを防ぐ）
  window.scrollTo(0, 0);
}

function answerQuestion(choice, buttonElement) {
  var buttons = document.getElementsByClassName('option-btn');
  for (var i = 0; i < buttons.length; i++) {
    buttons[i].disabled = true;
  }

  var correct = currentQuestion.answer;
  var isCorrect = choice === correct;

  if (isCorrect) {
    buttonElement.classList.add('correct');
  } else {
    buttonElement.classList.add('wrong');
    if (buttons[correct - 1]) {
      buttons[correct - 1].classList.add('correct');
    }
  }

  saveResult(currentQuestion.id, isCorrect, currentQuestion.category);

  var info = document.getElementById('answerInfo');
  info.style.display = 'block';
  info.innerHTML =
    '<b>' + (isCorrect ? '✅ 正解！' : '❌ 不正解') + '</b><br><br>' +
    '正解：(' + correct + ')<br><br>' +
    (currentQuestion.explanation || '解説なし');

  document.getElementById('nextBtn').style.display = 'block';
  updateStats();
}

function nextQuestion() {
  currentIndex++;
  if (currentIndex >= currentQuestions.length) {
    alert('選択された範囲の問題を一通り確認しました。最初の問題に戻ります。');
    currentIndex = 0;
  }
  showQuestion();
}

// ========================================================
// 初期化：チャンクを非同期でロードしてからUIを構築
// ========================================================
function initApp() {
  checkStorage();

  // 全チャンクを結合
  var combined = [];
  for (var i = 0; i < NUM_CHUNKS; i++) {
    if (CHUNKS[i]) {
      combined = combined.concat(CHUNKS[i]);
    }
  }

  // チャンクを非同期で処理してメインスレッドをブロックしない
  loadChunksAsync(function() {
    allQuestions = combined;
    populateFilters();
    updateStats();
    document.getElementById('loadingMsg').textContent =
      '✅ 準備完了（' + allQuestions.length + '問）。「問題開始」を押してください。';
  });
}

// DOMContentLoaded後に初期化
if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', initApp);
} else {
  setTimeout(initApp, 0);
}
</script>
</body>
</html>
